QUESTIONS.push({"c": 6, "q": "物体検出モデルの発展の順序として最も適切なものはどれか。", "o": ["R-CNN → Fast R-CNN → Faster R-CNN → Mask R-CNN", "Fast R-CNN → R-CNN → Mask R-CNN → Faster R-CNN", "R-CNN → Faster R-CNN → Mask R-CNN → Fast R-CNN", "Mask R-CNN → R-CNN → Fast R-CNN → Faster R-CNN"], "e": "R-CNN（2013年にarXiv公開、2014年のCVPRで発表）の候補領域ごとのCNN計算をFast R-CNN（2015年）が1回にまとめ、Faster R-CNN（2015年）が候補領域の生成もRPNでネットワーク化した。Mask R-CNN（2017年）はFaster R-CNNにマスク予測を加えたもの。"},
{"c": 6, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「Mask R-CNNは、Faster R-CNNに物体ごとの（ア）を予測する分岐を加え、さらにRoI Poolingで生じる位置のずれを抑える（イ）を導入した。」", "o": ["（ア）画素単位のマスク （イ）RoIAlign", "（ア）関節点の位置 （イ）RoIAlign", "（ア）画素単位のマスク （イ）アンカーボックス", "（ア）関節点の位置 （イ）アンカーボックス"], "e": "Mask R-CNNは検出した各物体の領域に画素単位のマスクを出力する分岐を追加し、座標の丸めを行わずに補間で特徴を取り出すRoIAlignで位置精度を高めた。アンカーボックスはFaster R-CNNのRPNですでに使われている基準枠。"},
{"c": 6, "q": "ある工場で、ベルトコンベア上を流れる部品の位置と種類を、毎秒30フレームの映像からその場で判定したい。候補領域の生成と分類を分けずに1回の推論で行う方式を選ぶとき、最も適切なモデルはどれか。", "o": ["YOLO", "R-CNN", "U-Net", "OpenPose"], "e": "YOLOは画像全体から位置とクラスを1段階で同時に予測するため高速で、リアルタイム処理に向く。R-CNNは候補領域ごとにCNNを計算する2段階方式で遅く、U-Netはセグメンテーション、OpenPoseは姿勢推定のモデル。"},
{"c": 6, "q": "物体検出の「2段階（two-stage）方式」と「1段階（one-stage）方式」の比較として最も適切なものはどれか。", "o": ["2段階方式は候補領域を出してから分類と位置補正を行い、1段階方式は両者を一度に行う", "2段階方式は画像を2倍に拡大して検出し、1段階方式は元の大きさのまま検出する", "2段階方式は学習と推論を別々のモデルで行い、1段階方式は同じモデルで行う", "2段階方式は物体を2クラスだけに分け、1段階方式は多数のクラスに分ける"], "e": "Faster R-CNNなどの2段階方式は候補領域の提案と、その領域の分類・位置補正を分けて行う。YOLOやSSDなどの1段階方式は特徴マップから位置とクラスを直接予測するため高速になりやすい。"},
{"c": 6, "q": "正解のバウンディングボックスと予測のボックスは、どちらも面積が120である。両者のIoUがちょうど0.5のとき、2つのボックスが重なっている部分の面積はいくらか。", "o": ["80", "60", "120", "40"], "e": "重なりの面積をSとすると、和集合は120＋120−S＝240−Sなので、S÷(240−S)＝0.5よりS＝80。60は片方の面積の半分、120は和集合から重なりを引き忘れて240の半分とした値。"},
{"c": 6, "q": "ある画像に検出対象の物体が4個ある。モデルの検出結果をスコアの高い順に並べると、正解（TP）・誤り（FP）・TP・TP・FPであった。APを「TPが現れた各順位での適合率の合計 ÷ 正解の物体数」で求めるとき、APはいくらか（小数第3位を四捨五入）。", "o": ["0.60", "0.81", "0.75", "0.70"], "e": "TPの順位は1位・3位・4位で、そのときの適合率は1/1、2/3、3/4。合計約2.417を正解数4で割ると約0.60。0.81はTPの数3で割った値、0.75は5件目までの再現率、0.70は全5順位の適合率の単純平均。"},
{"c": 6, "q": "2クラスのセマンティックセグメンテーションの結果を画素数で数えた。クラスAはTP 80・FP 20・FN 20、クラスBはTP 45・FP 5・FN 15であった。mIoU（クラスごとのIoUの平均）はいくらか（小数第3位を四捨五入）。", "o": ["0.68", "0.78", "0.85", "0.81"], "e": "IoU＝TP÷(TP＋FP＋FN)で、クラスAは80÷120≒0.667、クラスBは45÷65≒0.692、平均は約0.68。0.78は再現率TP÷(TP＋FN)、0.85は適合率TP÷(TP＋FP)をクラス平均した値。"},
{"c": 6, "q": "Faster R-CNNのRPNで、縦40×横60の特徴マップの各位置に、大きさと縦横比の異なる9種類のアンカーボックスを置いた。アンカーボックスは全部でいくつになるか。", "o": ["21,600", "2,400", "21,000", "216,000"], "e": "位置の数は40×60＝2,400で、各位置に9個置くので2,400×9＝21,600個。RPNはこれらのアンカーごとに物体らしさと位置のずれを予測する。"},
{"c": 6, "q": "224×224画素の画像を、16×16画素のパッチに重ならないように分割してVision Transformerに入力する。分類用トークンを除いたパッチの数はいくつか。", "o": ["196", "14", "256", "3,136"], "e": "縦横それぞれ224÷16＝14個に分かれるので14×14＝196個。14は1辺の個数、3,136はパッチサイズを4×4とした場合の数。"},
{"c": 6, "q": "自動運転の研究で、車載カメラ画像の全画素を「道路」「歩道」「車」「人」「空」のいずれかに分類したい。ただし、同じ「人」の中で一人ひとりを区別する必要はない。このタスクとして最も適切なものはどれか。", "o": ["セマンティックセグメンテーション", "インスタンスセグメンテーション", "画像分類", "姿勢推定"], "e": "全画素にクラスを割り当て、同じクラスの個体を区別しないのはセマンティックセグメンテーション。インスタンスセグメンテーションは物体を個体ごとに区別し、画像分類は画像全体に1つのラベルを付ける。"},
{"c": 6, "q": "SegNetとU-Netはどちらもエンコーダ・デコーダ型のセグメンテーションモデルである。両者の違いとして最も適切なものはどれか。", "o": ["SegNetはプーリング時の最大値の位置を、U-Netは特徴マップそのものをデコーダに渡す", "SegNetは特徴マップそのものを、U-Netはプーリング時の最大値の位置をデコーダに渡す", "SegNetは全結合層で画素を分類し、U-Netは決定木で画素を分類する", "SegNetは画像全体に1つのラベルを、U-Netは画素ごとにラベルを出力する"], "e": "SegNetはエンコーダの最大値プーリングで選ばれた位置（インデックス）を記録し、デコーダのアップサンプリングに使う。U-Netはエンコーダの特徴マップをスキップ結合でデコーダに連結する。"},
{"c": 6, "q": "ある牧場で、牛舎のカメラ画像から牛を1頭ずつ区別し、それぞれの輪郭どおりの領域を切り出して体格を推定したい。このタスクとして最も適切なものはどれか。", "o": ["インスタンスセグメンテーション", "セマンティックセグメンテーション", "画像分類", "画像キャプション生成"], "e": "同じクラスの物体を個体ごとに区別して画素単位の領域を得るのはインスタンスセグメンテーション（例：Mask R-CNN）。セマンティックセグメンテーションでは隣り合う牛が1つの「牛」領域にまとまってしまう。"},
{"c": 6, "q": "PSPNetで用いられるピラミッドプーリングモジュール（Pyramid Pooling Module）の説明として最も適切なものはどれか。", "o": ["特徴マップを1×1や2×2、6×6などの格子に分けてプーリングし、拡大して元の特徴と連結する", "特徴マップの要素の間隔を広げた畳み込みを重ね、パラメータを増やさずに受容野を広げる", "画像を大きさの異なる複数の縮尺で入力し、各縮尺の予測結果の多数決で画素を分類する", "エンコーダで最大値を選んだ位置を記録し、デコーダでその位置に値を戻して拡大する"], "e": "PSPNetは大きさの異なる格子でプーリングした特徴を拡大・連結し、画像全体の文脈を画素分類に取り込む。要素の間隔を広げる畳み込みはDilated（Atrous）畳み込み、最大値の位置を使うのはSegNetの方法。"},
{"c": 6, "q": "ILSVRCで優勝したモデルを、優勝した年の古い順に並べたものとして最も適切なものはどれか。", "o": ["AlexNet → GoogLeNet → ResNet → SENet", "AlexNet → ResNet → GoogLeNet → SENet", "GoogLeNet → AlexNet → SENet → ResNet", "AlexNet → SENet → GoogLeNet → ResNet"], "e": "AlexNetが2012年、GoogLeNetが2014年、ResNetが2015年、SENetが2017年（最後の開催）に優勝した。"},
{"c": 6, "q": "2015年のILSVRCで、152層という非常に深いネットワークにより優勝したResNetを発表した組織はどれか。", "o": ["Microsoft Research", "Google", "オックスフォード大学", "トロント大学"], "e": "ResNetはMicrosoft Researchのカイミング・ヒー（何愷明）らが発表した。GoogleはGoogLeNet、オックスフォード大学のVisual Geometry GroupはVGG、トロント大学はAlexNetを発表した。"},
{"c": 6, "q": "ドローンで撮影した高解像度の画像から、大きな建物と小さな人物を同時に検出したい。現在の検出器は、小さな人物の検出漏れが特に多い。検出器の構造の改善として最も適切なものはどれか。", "o": ["深い層の特徴を拡大して浅い層の特徴と組み合わせるFPNを加え、複数の解像度で検出する", "最後の特徴マップにGlobal Average Poolingをかけ、位置の情報を1つの値にまとめて検出する", "入力画像を縮小してから検出にかけ、1枚あたりの処理を軽くして検出の回数を増やす", "最も深い層の特徴マップ1枚だけを使い、すべての大きさの物体をそこから検出する"], "e": "小さな物体は深い層の低解像度の特徴マップでは消えやすいため、FPNで深い層の意味的な特徴と浅い層の高解像度の特徴を組み合わせ、複数のスケールで検出する。位置の情報をまとめてしまうGlobal Average Poolingや画像の縮小、最も深い層だけの利用は、小さな物体の検出をさらに難しくする。"},
{"c": 6, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「ILSVRC2014の画像分類部門では、Inceptionモジュールを持つ（ア）が優勝し、3×3の畳み込みを積み重ねた（イ）が2位となった。」", "o": ["（ア）GoogLeNet （イ）VGG", "（ア）VGG （イ）GoogLeNet", "（ア）GoogLeNet （イ）AlexNet", "（ア）ResNet （イ）VGG"], "e": "2014年の分類部門はGoogLeNetが優勝し、オックスフォード大学のVGGが2位だった。AlexNetは2012年、ResNetは2015年の優勝モデル。"},
{"c": 6, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「EfficientNetでは、（ア）で見つけた基本モデルB0を、深さ・幅・解像度を一定の比率で同時に大きくする（イ）によって拡大し、B1〜B7を作った。」", "o": ["（ア）ニューラルアーキテクチャ探索 （イ）複合スケーリング", "（ア）ニューラルアーキテクチャ探索 （イ）知識蒸留", "（ア）グリッドサーチ （イ）複合スケーリング", "（ア）グリッドサーチ （イ）知識蒸留"], "e": "EfficientNetはNAS（ニューラルアーキテクチャ探索）で基本構造B0を設計し、複合スケーリングで大きなモデルを作った。深さ・幅・解像度の拡大比率の係数は小さなグリッドサーチで決めたが、B0の構造そのものはNASによる。知識蒸留は大きなモデルの出力を使って小さなモデルを学習させる手法。"},
{"c": 6, "q": "画像認識モデルの説明として、適切でないものはどれか。", "o": ["Vision Transformerは、畳み込み層を多段に重ねて局所的な特徴を段階的に抽出する", "SENetは、チャネルごとの重要度を求めて各チャネルの出力に重みを掛ける", "DenseNetは、前にある全ての層の出力をチャネル方向に連結して次の層に入力する", "MobileNetは、畳み込みを空間方向とチャネル方向に分けて計算量を減らす"], "e": "Vision Transformerは画像をパッチに分けてトークンとし、Self-Attentionで処理するため、畳み込みを積み重ねる構造ではない。SENet、DenseNet、MobileNetの記述はいずれも正しい。"},
{"c": 6, "q": "あるスポーツ指導サービスで、選手の投球動画から肩・肘・手首などの位置を毎フレーム求め、フォームを分析したい。このタスクとして最も適切なものはどれか。", "o": ["姿勢推定", "セマンティックセグメンテーション", "画像分類", "画像キャプション生成"], "e": "人物の関節点の位置を推定して骨格としてつなぐタスクは姿勢推定（例：OpenPose）。セマンティックセグメンテーションは画素ごとのクラス分類で、関節の位置は直接得られない。"},
{"c": 6, "q": "複数人の姿勢推定における「トップダウン型」の手法の説明として最も適切なものはどれか。", "o": ["先に人物を1人ずつ検出し、切り出した人物ごとに関節点を推定するため、人数が増えると計算量も増えやすい", "先に画像中の関節点をすべて検出し、後から人物ごとにつなぐため、人数が増えても計算量が増えにくい", "先に人物の輪郭を画素単位で求め、その輪郭の形から人物の数を数えるため、関節点は推定しない", "先に動画の全フレームを平均した画像を作り、その画像から関節点を1回だけ推定するため高速になる"], "e": "トップダウン型は人物検出→人物ごとの関節推定の順に処理する。全員分の関節点を先に検出してから人物ごとにつなぐのはボトムアップ型で、OpenPoseはこちらに当たる。"},
{"c": 6, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「OpenPoseは、各関節点がどこにありそうかを表す（ア）と、関節点どうしのつながりの位置と向きを表す（イ）を同時に推定し、関節点を人物ごとに組み立てる。」", "o": ["（ア）ヒートマップ（信頼度マップ） （イ）Part Affinity Fields", "（ア）Part Affinity Fields （イ）ヒートマップ（信頼度マップ）", "（ア）ヒートマップ（信頼度マップ） （イ）アンカーボックス", "（ア）アンカーボックス （イ）Part Affinity Fields"], "e": "OpenPoseは関節点の存在確率を表すヒートマップと、肢（関節間のつながり）の向きを2次元ベクトル場で表すPart Affinity Fieldsを出力する。アンカーボックスは物体検出で用いる基準枠。"},
{"c": 6, "q": "物体検出モデルを動かしたところ、1匹の犬に対して少しずつ位置のずれた枠が5つ重なって出力された。この重複を取り除くために行う後処理として最も適切なものはどれか。", "o": ["NMS（Non-Maximum Suppression）", "RoI Pooling", "アンカーボックスの追加", "データ拡張"], "e": "NMSはスコアの高い枠を残し、それと重なり（IoU）の大きい枠を削除して重複を除く。RoI Poolingは候補領域から固定サイズの特徴を取り出す処理で、データ拡張は学習データを増やす手法。"},
{"c": 6, "q": "物体検出で、あらかじめ決めた大きさと縦横比の基準枠を特徴マップの各位置に置き、そこからのずれを予測して最終的な枠を求める。この基準枠を何と呼ぶか。", "o": ["アンカーボックス", "受容野", "特徴ピラミッド", "スキップ結合"], "e": "アンカーボックスはFaster R-CNNやSSD（デフォルトボックス）で用いられ、基準枠からの位置と大きさのずれを回帰で予測する。受容野は出力の1画素が入力上で見ている範囲。"},
{"c": 6, "q": "画像分類・物体検出・セマンティックセグメンテーションの出力の違いとして最も適切なものはどれか。", "o": ["分類は画像ごとにラベル、検出は物体ごとに枠とラベル、セマンティックセグメンテーションは画素ごとにラベルを出す", "分類は画素ごとにラベル、検出は画像ごとにラベル、セマンティックセグメンテーションは物体ごとに枠とラベルを出す", "分類は物体ごとに枠とラベル、検出は画素ごとにラベル、セマンティックセグメンテーションは画像ごとにラベルを出す", "分類は画像ごとにラベル、検出は画素ごとにラベル、セマンティックセグメンテーションは物体ごとに枠とラベルを出す"], "e": "画像分類は画像全体に1つ（またはいくつか）のラベル、物体検出は物体ごとのバウンディングボックスとクラス、セマンティックセグメンテーションは全画素のクラスを出力する。"},
{"c": 6, "q": "自然言語処理の技術を、発表された年の古い順に並べたものとして最も適切なものはどれか。", "o": ["word2vec → Transformer → BERT → GPT-3", "Transformer → word2vec → GPT-3 → BERT", "word2vec → BERT → Transformer → GPT-3", "BERT → word2vec → Transformer → GPT-3"], "e": "word2vecは2013年、Transformerは2017年、BERTは2018年、GPT-3は2020年に発表された。BERTとGPT-3はどちらもTransformerを土台にしている。"},
{"c": 6, "q": "次の文の（ア）（イ）（ウ）に入る語の組み合わせとして最も適切なものはどれか。「BERTはTransformerの（ア）だけを、GPTは（イ）だけを用いるのに対し、T5は（ウ）を用いる。」", "o": ["（ア）エンコーダ （イ）デコーダ （ウ）エンコーダとデコーダの両方", "（ア）デコーダ （イ）エンコーダ （ウ）エンコーダとデコーダの両方", "（ア）エンコーダ （イ）デコーダ （ウ）エンコーダだけ", "（ア）デコーダ （イ）エンコーダ （ウ）デコーダだけ"], "e": "BERTは双方向の文脈を見るエンコーダ、GPTは次の語を予測するデコーダだけからなる。T5は元のTransformerと同じエンコーダ・デコーダ構成で、全タスクをテキスト→テキストとして扱う。"},
{"c": 6, "q": "ある通販会社で、問い合わせメールを「配送」「返品」「商品の不具合」「その他」に自動で振り分けたい。過去のメール数千件に担当者が付けた分類ラベルがある。最も適切な方法はどれか。", "o": ["事前学習済みのBERTに分類用の出力層を付けてファインチューニングする", "word2vecで単語どうしの類似度を求め、似た単語の一覧を担当者に見せる", "GANでメールの文面を生成し、生成された文面の数で分類を決める", "seq2seqでメールを英語に翻訳し、翻訳文の長さで分類を決める"], "e": "ラベル付きデータがある文書分類では、事前学習済みBERTのファインチューニングが代表的な方法。単語の類似度一覧や文章の生成・翻訳だけでは、メールを4つの分類に振り分けられない。"},
{"c": 6, "q": "語彙数10,000語、埋め込みの次元を300としてword2vecを学習した。単語の埋め込み行列（入力側）のパラメータ数はいくつか。", "o": ["3,000,000", "10,300", "30,000", "300,000,000"], "e": "埋め込み行列は語彙数×次元数なので10,000×300＝3,000,000。one-hot表現なら1語が10,000次元になるところを、300次元の密なベクトルで表せる。"},
{"c": 6, "q": "参照訳が「the cat sat on the mat」、機械翻訳の出力が「the the the cat」のとき、BLEUで用いる「出現回数を参照訳の回数で頭打ちにした」1-gramの適合率はいくらか。", "o": ["0.75", "1.00", "0.50", "0.67"], "e": "「the」は出力に3回あるが参照訳には2回しかないので2回まで、「cat」は1回数え、合計3を出力の語数4で割って0.75。頭打ちをしないと4÷4＝1.00になり、同じ語の繰り返しを高く評価してしまう。"},
{"c": 6, "q": "BLEUでは、出力が参照訳より短いときにブレビティペナルティ exp(1 − r/c)（rは参照訳の長さ、cは出力の長さ）を掛ける。r＝10語、c＝8語のとき、この値はいくらか（小数第3位を四捨五入）。", "o": ["0.78", "0.80", "0.61", "1.25"], "e": "exp(1−10/8)＝exp(−0.25)≒0.78。0.80は長さの比8/10そのもの、1.25は10/8で、ペナルティは1を超えない。短い訳で適合率だけを稼ぐことを防ぐための係数。"},
{"c": 6, "q": "文章の自動要約の評価によく使われるROUGEと、機械翻訳の評価によく使われるBLEUの比較として最も適切なものはどれか。", "o": ["ROUGEは参照側のn-gramがどれだけ出力に含まれるかという再現率を重視し、BLEUは適合率を重視する", "ROUGEは出力の文法的な正しさを構文解析で測り、BLEUは出力の意味を人手で5段階評価する", "ROUGEは画像と説明文の一致度を測り、BLEUは音声と書き起こし文の一致度を測る", "ROUGEは出力の単語数だけで評価し、BLEUは出力に含まれる固有名詞の数だけで評価する"], "e": "ROUGE（Recall-Oriented Understudy for Gisting Evaluation）は参照要約の内容をどれだけ拾えたかという再現率寄りの指標。BLEUは出力のn-gramのうち参照訳にもあるものの割合（適合率）とブレビティペナルティで評価する。"},
{"c": 6, "q": "ある会社で、毎月改定される社内規程に基づいて社員の質問にLLMで回答させたい。改定のたびに学習し直す費用はかけられず、回答の根拠となった条文も示したい。最も適切な方法はどれか。", "o": ["規程を検索できるようにしておき、質問に関連する条文を取り出してプロンプトに入れて回答させる（RAG）", "改定のたびに規程全文を加えてLLMを事前学習からやり直し、最新の規程を覚えさせる", "規程は与えずに、LLMが事前学習で得た一般的な知識だけで回答させる", "出力の温度を高く設定して、多様な言い回しの回答を複数生成させる"], "e": "RAGなら規程の更新は検索対象の文書を差し替えるだけで済み、取り出した条文を根拠として示せる。事前学習のやり直しは費用が大きく、一般知識だけでは社内規程に答えられない。"},
{"c": 6, "q": "RAG（検索拡張生成）の一般的な処理の順序として最も適切なものはどれか。", "o": ["文書を分割して埋め込みを保存 → 質問を埋め込みに変換 → 類似した文書片を検索 → 文書片を含むプロンプトで回答を生成", "質問を埋め込みに変換 → 回答を生成 → 文書を分割して埋め込みを保存 → 類似した文書片を検索", "文書片を含むプロンプトで回答を生成 → 類似した文書片を検索 → 質問を埋め込みに変換 → 文書を分割して埋め込みを保存", "類似した文書片を検索 → 文書を分割して埋め込みを保存 → 回答を生成 → 質問を埋め込みに変換"], "e": "RAGでは事前に文書をチャンクに分けてベクトル化・保存しておき、質問が来たらベクトル化して類似チャンクを検索し、それをプロンプトに加えてLLMに回答を生成させる。"},
{"c": 6, "q": "InstructGPTで用いられたRLHFの手順を順番に並べたものとして最も適切なものはどれか。", "o": ["人が書いた模範回答で教師ありファインチューニング → 出力の順位付けから報酬モデルを学習 → 報酬モデルを使って強化学習（PPO）", "報酬モデルを使って強化学習（PPO） → 人が書いた模範回答で教師ありファインチューニング → 出力の順位付けから報酬モデルを学習", "出力の順位付けから報酬モデルを学習 → 報酬モデルを使って強化学習（PPO） → 人が書いた模範回答で教師ありファインチューニング", "人が書いた模範回答で教師ありファインチューニング → 報酬モデルを使って強化学習（PPO） → 出力の順位付けから報酬モデルを学習"], "e": "InstructGPT（2022年）はまず模範回答で教師ありファインチューニングし、次に人が出力を順位付けしたデータで報酬モデルを作り、最後にその報酬を最大化するようPPOで方策を調整した。報酬モデルがなければ強化学習の段階は行えない。"},
{"c": 6, "q": "LLMを特定のタスクに使うときの方法のうち、モデルのパラメータを更新するものはどれか。", "o": ["ファインチューニング", "Zero-shotプロンプティング", "Few-shotプロンプティング", "Chain-of-Thoughtプロンプティング"], "e": "ファインチューニングは追加のデータで重みを学習し直す。Zero-shot・Few-shot・Chain-of-Thoughtはプロンプトの工夫で、重みは変えずにIn-context Learningとして働く。"},
{"c": 6, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「多くの言語モデルは、語彙に無い単語にも対応できるよう、単語をさらに細かい（ア）に分割して扱う。その代表的な方法として、よく一緒に現れる文字の組を順に結合して語彙を作る（イ）がある。」", "o": ["（ア）サブワード （イ）Byte Pair Encoding", "（ア）サブワード （イ）TF-IDF", "（ア）形態素 （イ）TF-IDF", "（ア）文 （イ）Byte Pair Encoding"], "e": "Byte Pair Encoding（BPE）は出現頻度の高い文字の組を繰り返し結合してサブワードの語彙を作り、未知語も既知のサブワードの並びで表せるようにする。TF-IDFは単語の重要度を測る重み付けの方法。"},
{"c": 6, "q": "文書を単語の出現回数だけで表すBag-of-Wordsと比べた、TF-IDFの利点として最も適切なものはどれか。", "o": ["多くの文書に共通して現れる語の重みを下げ、その文書に特徴的な語を強調できる", "単語の並び順を保持するため、語順が違う文を区別できる", "単語の意味の近さを反映した密なベクトルで文書を表せる", "文脈によって同じ単語に異なるベクトルを割り当てられる"], "e": "TF-IDFは出現頻度（TF）に、その語を含む文書が少ないほど大きくなるIDFを掛けるため、「です」「する」のようにどの文書にも出る語の重みが小さくなる。語順や意味の近さ、文脈の違いは表せない。"},
{"c": 6, "q": "与えられた説明文と質問を入力し、説明文の中から答えとなる部分の開始位置と終了位置を予測して抜き出すタスクはどれか。", "o": ["抽出型質問応答", "抽出型要約", "機械翻訳", "感情分析"], "e": "SQuADのように、文章中の答えの範囲を抜き出す形式を抽出型質問応答と呼び、BERTなどで開始・終了位置を予測する。抽出型要約は文章から重要な文を選び出すタスクで、質問は使わない。"},
{"c": 6, "q": "ある会社で、LLMに社内FAQの回答文を作らせているが、同じ質問に対して毎回言い回しや内容が大きく変わってしまう。回答をできるだけ一定にしたいとき、生成時の設定として最も適切なものはどれか。", "o": ["温度（temperature）を低くする", "温度（temperature）を高くする", "最大出力トークン数を増やす", "プロンプトから指示文を削除する"], "e": "温度を低くすると確率の高いトークンが選ばれやすくなり、出力が安定する。温度を高くすると低確率のトークンも選ばれて多様になる。出力トークン数や指示の有無は出力のばらつきを抑える設定ではない。"},
{"c": 6, "q": "次の文の（ア）（イ）に入る数値の組み合わせとして最も適切なものはどれか。「OpenAIが2019年に発表したGPT-2の最大のモデルは約（ア）個、2020年に発表したGPT-3は約（イ）個のパラメータを持つ。」", "o": ["（ア）15億 （イ）1750億", "（ア）1750億 （イ）15億", "（ア）1億 （イ）15億", "（ア）15億 （イ）1兆7500億"], "e": "GPT-2の最大モデルは約15億パラメータ、GPT-3は約1750億パラメータで、約100倍に大きくなった。GPT-2は悪用の懸念から段階的に公開された。"},
{"c": 6, "q": "生成AIのハルシネーションを減らす、または見つけやすくする対策として、適切でないものはどれか。", "o": ["不明な点があっても推測で補い、断定的な口調で回答するよう指示する", "信頼できる文書を検索して回答の根拠として与える", "回答に出典を示させ、人が元の資料と照合する", "同じ質問で複数回生成させ、回答どうしが一致するかを確かめる"], "e": "推測で補って断定させると、根拠のない内容がもっともらしく出力されやすくなり、誤りにも気づきにくくなる。根拠文書の提供（RAG）、出典の明示と照合、複数回生成して食い違う箇所を探す方法は、ハルシネーションを減らす・見つけるための一般的な対策。"},
{"c": 6, "q": "大規模言語モデルが、事実と異なる内容をもっともらしい文章で回答してしまう（ハルシネーション）主な原因として最も適切なものはどれか。", "o": ["学習した文章の傾向から尤もらしい語を確率的に生成し、真偽を確かめる仕組みを持たないため", "回答を生成するたびにインターネットを検索し、見つかった誤った記事をそのまま引用してしまうため", "学習データの事実をすべて正確に記憶しているが、回答の文字数の上限を超えると内容を省略するため", "入力された質問文を文字単位ではなく単語単位で処理しており、固有名詞を正しく読み取れないため"], "e": "LLMは次に来る語の確率に基づいて文章を生成するため、学習データに無い事柄や記憶があいまいな事柄でも、流暢で自信ありげな文章を作ってしまう。一般的なLLMは回答のたびに検索するわけではなく、学習データを正確に丸ごと記憶しているわけでもない。"},
{"c": 6, "q": "ある食品工場で、CNNによる外観検査モデルが「不良」と判定した画像について、モデルが画像のどの部分を根拠にしたのかを、画像に重ねたヒートマップで担当者が確認したい。最も適切な手法はどれか。", "o": ["Grad-CAM", "Permutation Importance", "知識蒸留", "NMS（Non-Maximum Suppression）"], "e": "Grad-CAMは最後の畳み込み層の特徴マップを判定クラスに対する勾配で重み付けし、判断に効いた画像領域をヒートマップで示す。Permutation Importanceはモデル全体での特徴量の重要度、知識蒸留はモデルの軽量化、NMSは重複した検出枠を除く後処理。"},
{"c": 6, "q": "次の文の（ア）（イ）に入る数値の組み合わせとして最も適切なものはどれか。「BERTのMasked Language Modelでは、入力トークンの（ア）%を予測対象に選び、そのうち80%を[MASK]に、10%をランダムな別のトークンに置き換え、残りの（イ）%はそのままにする。」", "o": ["（ア）15 （イ）10", "（ア）50 （イ）10", "（ア）15 （イ）20", "（ア）50 （イ）20"], "e": "BERTは全トークンの15%を予測対象とし、その80%を[MASK]、10%をランダムなトークンに置換、10%を元のままにする。ファインチューニング時には[MASK]が現れないため、事前学習との食い違いを和らげる工夫。"},
{"c": 6, "q": "ある法律事務所で、数百ページの契約書をまとめてLLMに入力したところ、文書の一部しか読み込まれずに回答された。この原因として最も関係の深いものはどれか。", "o": ["一度に扱えるトークン数の上限（コンテキスト長）", "学習時に設定した学習率の大きさ", "学習時に設定したドロップアウト率", "生成時に設定した出力の温度"], "e": "LLMが一度に入力・参照できるトークン数にはコンテキスト長（コンテキストウィンドウ）の上限があり、超える部分は切り捨てられる。学習率やドロップアウト率は学習時の設定で、温度は出力のばらつきの設定。"},
{"c": 6, "q": "LLMの「指示チューニング」と「RLHF」の違いとして最も適切なものはどれか。", "o": ["指示チューニングは指示と応答の組で教師あり学習し、RLHFは人の好みを学んだ報酬モデルで強化学習する", "指示チューニングは人の好みを学んだ報酬モデルで強化学習し、RLHFは指示と応答の組で教師あり学習する", "指示チューニングはラベルのない文章で次の単語を予測し、RLHFは画像とテキストの組で対照学習する", "指示チューニングはモデルの重みを変えずにプロンプトだけを工夫し、RLHFはモデルを蒸留して小さくする"], "e": "指示チューニングは多様なタスクの「指示→応答」データでの教師ありファインチューニング。RLHFは人の比較評価から作った報酬モデルを使い、強化学習で出力を人の好みに近づける。"},
{"c": 6, "q": "単語の3-gram（trigram）言語モデルで、文中の次の単語の出現確率を求めるときに条件として用いるものはどれか。", "o": ["直前の2単語", "直前の3単語", "直前の1単語", "文頭からのすべての単語"], "e": "n-gram言語モデルは直前のn−1個の単語だけから次の単語の確率を求める。3-gramなら直前の2単語。文頭からのすべての単語を条件にするのはRNNやTransformerの言語モデル。"},
{"c": 6, "q": "2013年にGoogleで単語の分散表現を効率よく学習するword2vecを発表した中心人物は誰か。", "o": ["トマス・ミコロフ", "アシシュ・ヴァスワニ", "ジェイコブ・デブリン", "イアン・グッドフェロー"], "e": "word2vecはトマス・ミコロフらが2013年に発表した。ヴァスワニはTransformerの論文、デブリンはBERTの論文の筆頭著者、グッドフェローはGANの提案者。"},
{"c": 6, "q": "あるコールセンターで、通話を書き起こしたテキストから、顧客が不満を持っているかどうかを自動で判定したい。このタスクとして最も適切なものはどれか。", "o": ["感情分析", "機械翻訳", "構文解析", "抽出型要約"], "e": "文章に表れた肯定・否定などの感情や評価を判定するのは感情分析。構文解析は係り受けなど文の構造を求める処理で、不満の有無は判定しない。"},
{"c": 6, "q": "標本化周波数16kHzの音声を、512点のFFTで周波数分析する。得られる周波数成分の間隔（周波数分解能）はいくらか。", "o": ["31.25Hz", "32Hz", "15.625Hz", "8kHz"], "e": "周波数分解能は標本化周波数÷FFT点数で、16,000÷512＝31.25Hz。8kHzは表せる最高周波数（ナイキスト周波数）で、分解能ではない。"},
{"c": 6, "q": "長さ1秒の音声を、フレーム長25ms、フレームのずらし幅（シフト）10msで区切って特徴量を計算する。末尾で25msに満たない部分は使わないとき、フレームの数はいくつか。", "o": ["98", "100", "40", "97"], "e": "最後のフレームの開始位置は1000−25＝975msまでなので、0,10,…,970msの(1000−25)÷10を切り捨てた97に1を足して98フレーム。40はずらし幅を25msとした場合の数。"},
{"c": 6, "q": "音声からMFCCを求める処理の順序として最も適切なものはどれか。", "o": ["フレーム分割と窓掛け → FFT → メルフィルタバンク → 対数 → 離散コサイン変換", "FFT → 離散コサイン変換 → 対数 → フレーム分割と窓掛け → メルフィルタバンク", "メルフィルタバンク → フレーム分割と窓掛け → 離散コサイン変換 → FFT → 対数", "対数 → フレーム分割と窓掛け → FFT → 離散コサイン変換 → メルフィルタバンク"], "e": "短いフレームに区切って窓関数を掛け、FFTでスペクトルを求め、メル尺度のフィルタバンクで帯域ごとにまとめて対数を取り、最後に離散コサイン変換してケプストラムの低次の係数を取り出す。"},
{"c": 6, "q": "ある会社で、会議の録音から「どの発言を誰がしたか」を自動で判別し、議事録に発言者名を付けたい。このために主に必要な技術はどれか。", "o": ["話者識別", "音声合成", "機械翻訳", "感情分析"], "e": "声の特徴から話している人物を判定するのは話者識別。音声合成はテキストから音声を作る技術で、発言者の判別には使わない。発言内容の文字起こしには別に音声認識を用いる。"},
{"c": 6, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「Googleが2017年に発表したTacotron 2は、文字の並びから（ア）を予測し、それを（イ）をもとにしたボコーダで音声波形に変換する。」", "o": ["（ア）メルスペクトログラム （イ）WaveNet", "（ア）メルスペクトログラム （イ）隠れマルコフモデル", "（ア）単語の分散表現 （イ）WaveNet", "（ア）単語の分散表現 （イ）隠れマルコフモデル"], "e": "Tacotron 2はseq2seqのネットワークで文字列からメルスペクトログラムを予測し、改良したWaveNetをボコーダとして波形を生成する。人の録音に近い自然さの評価を得た。"},
{"c": 6, "q": "2022年にOpenAIが公開し、Webから集めた約68万時間の多言語の音声と書き起こしの組で学習した音声認識モデルはどれか。", "o": ["Whisper", "WaveNet", "Tacotron 2", "CLIP"], "e": "Whisperは品質にばらつきのある大量の音声・テキストの組で学習し、雑音や訛りに強い多言語の音声認識と英語への翻訳ができる。WaveNetとTacotron 2は音声合成、CLIPは画像とテキストのモデル。"},
{"c": 6, "q": "音声をデジタル化するときの標本化周波数と量子化ビット数の比較として最も適切なものはどれか。", "o": ["標本化周波数を上げると高い周波数まで表せ、量子化ビット数を上げると振幅を細かい段階で表せる", "標本化周波数を上げると振幅を細かい段階で表せ、量子化ビット数を上げると高い周波数まで表せる", "標本化周波数を上げると録音時間が短くなり、量子化ビット数を上げると音量が大きくなる", "標本化周波数を上げるとチャンネル数が増え、量子化ビット数を上げると雑音が必ずなくなる"], "e": "標本化周波数は1秒あたりの測定回数で、その半分までの周波数を表せる。量子化ビット数は1回の測定値を何段階で表すかで、16ビットなら65,536段階になる。"},
{"c": 6, "q": "標本化周波数8kHzで、5kHzの純音を低域通過フィルタを通さずに標本化した。再生したときに現れる音について最も適切なものはどれか。", "o": ["折り返し（エイリアシング）により3kHzの音として現れる", "5kHzの音がそのまま正しく再現される", "2倍の10kHzの音として現れる", "標本化周波数と同じ8kHzの音として現れる"], "e": "8kHzで標本化すると表せるのは4kHzまでで、それを超える5kHzの成分は8−5＝3kHzに折り返して現れる。これを防ぐため、標本化の前に帯域を制限するフィルタを通す。"},
{"c": 6, "q": "DeepMindの囲碁・ボードゲームAIを、発表の古い順に並べたものとして最も適切なものはどれか。", "o": ["AlphaGo → AlphaGo Zero → AlphaZero → MuZero", "AlphaGo Zero → AlphaGo → MuZero → AlphaZero", "AlphaGo → AlphaZero → MuZero → AlphaGo Zero", "AlphaZero → AlphaGo → AlphaGo Zero → MuZero"], "e": "AlphaGoは2016年に李世乭に4勝1敗で勝ち、AlphaGo Zero（2017年）は人の棋譜なしで学習した。AlphaZero（2017年発表）はチェス・将棋にも対応し、MuZero（2019年発表）はルールを与えずに環境のモデルを学習した。"},
{"c": 6, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「AlphaGoは、次に打つ手の候補を絞り込む（ア）と、局面の勝ちやすさを評価する（イ）を、モンテカルロ木探索と組み合わせて打つ手を決める。」", "o": ["（ア）方策ネットワーク （イ）価値ネットワーク", "（ア）価値ネットワーク （イ）方策ネットワーク", "（ア）方策ネットワーク （イ）報酬モデル", "（ア）識別器 （イ）価値ネットワーク"], "e": "AlphaGoは方策ネットワークで有望な手を選び、価値ネットワークで局面の勝率を見積もって探索を効率化した。報酬モデルはRLHFなどで人の評価を予測するモデル、識別器はGANの構成要素。"},
{"c": 6, "q": "ある物流会社で、熟練オペレーターがフォークリフトを操作した記録（各時点の状況と操作）が大量にある。報酬を定義せずに、この操作をまねる方策を学習させたい。最も適切な手法はどれか。", "o": ["模倣学習", "ドメインランダマイゼーション", "経験再生", "ε-greedy法"], "e": "熟練者の状態と行動の組を手本として方策を学習するのは模倣学習（行動クローニングなど）。ドメインランダマイゼーションはシミュレータの条件をばらつかせる手法、経験再生はDQNの学習安定化の手法、ε-greedy法は探索の方法。"},
{"c": 6, "q": "ロボットの歩行をシミュレータ上の強化学習で習得させたところ、シミュレータでは安定して歩けたが、実機では床の摩擦やモーターの特性の違いから転倒した。この問題を何と呼ぶか。", "o": ["リアリティギャップ", "勾配消失", "破滅的忘却", "モード崩壊"], "e": "シミュレータと現実の違いのために、シミュレータで学んだ方策が実機で性能を発揮できない問題をリアリティギャップ（sim2realギャップ）と呼ぶ。破滅的忘却は新しい学習で以前の知識を失う現象、モード崩壊はGANの問題。"},
{"c": 6, "q": "ボートレースのゲームで、コース上のアイテムを取ると得点が入る報酬を与えて強化学習させたところ、エージェントはゴールを目指さず、同じ場所を回り続けてアイテムを取り続けた。この原因として最も適切なものはどれか。", "o": ["報酬の設計が、設計者が本当に達成してほしい目的とずれていた", "経験再生で保存する経験の数が多すぎた", "ニューラルネットワークの層が深すぎた", "学習に用いた画面の解像度が高すぎた"], "e": "エージェントは与えられた報酬を最大化するため、報酬と真の目的がずれていると意図しない抜け道を学習する（報酬ハッキング）。報酬設計では、目的の達成そのものが最も得をするようにする必要がある。"},
{"c": 6, "q": "ロボット制御における「残差強化学習（Residual Reinforcement Learning）」の説明として最も適切なものはどれか。", "o": ["既存の制御器の出力に、強化学習で学んだ補正分を足し合わせて行動を決める", "ResNetのスキップ結合を使った方策ネットワークを、教師あり学習で学習する", "報酬の実測値と予測値の差だけを保存し、その差が大きい経験から学習する", "熟練者の操作記録を手本として、その操作をそのまま再現する方策を学習する"], "e": "残差強化学習は、従来の制御器では対応しにくい部分だけを強化学習で補うため、ゼロから学ぶより少ない試行で学習できる。熟練者の操作を再現するのは模倣学習。"},
{"c": 6, "q": "深層強化学習の「ノイジーネットワーク（Noisy Network）」の説明として最も適切なものはどれか。", "o": ["ネットワークの重みに学習可能なノイズを加え、ε-greedy法の代わりに探索を行わせる", "入力画像にノイズを加えたデータで学習し、画面の汚れに強い方策を得る", "報酬にノイズを加えて与え、報酬の大きさに依存しない方策を得る", "経験再生のバッファからノイズの多い経験を除き、学習を安定させる"], "e": "ノイジーネットワークは全結合層の重みにノイズを加え、その大きさも学習させることで、状態に応じた探索を行う。Rainbowを構成する改良の1つでもある。"},
{"c": 6, "q": "2015年にNatureで発表されたDQNが、Atari 2600のゲームを学習するときに入力として用いたものとして最も適切なものはどれか。", "o": ["ゲーム画面の画素（直近の数フレーム）", "ゲーム内部のプログラム変数の値", "人間の熟練者のプレイ記録", "ゲームごとに人が作った特徴量"], "e": "DQNは直近4フレームの画面の画素とスコア（報酬）だけから、全ゲーム共通の構造と設定で学習し、49種のゲームで人間のプロのテスターに匹敵する水準に達した。ゲーム内部の変数や人手の特徴量、熟練者の記録は使っていない。"},
{"c": 6, "q": "2020年にDeepMindが発表し、Atari 2600の57種類のゲームすべてで人間の基準スコアを初めて上回った深層強化学習のエージェントはどれか。", "o": ["Agent57", "AlphaStar", "OpenAI Five", "MuZero"], "e": "Agent57は効率的な探索の仕組みと、探索の度合いや長期・短期の重視を調整するメタコントローラーを組み合わせた。AlphaStarはStarCraft II、OpenAI FiveはDota 2のAIで、MuZeroは57種すべてでは人間の基準を上回らなかった。"},
{"c": 6, "q": "A3Cが、DQNで用いられる経験再生を使わなくても学習を安定させられる主な理由として最も適切なものはどれか。", "o": ["並列に動く複数のエージェントの経験は互いの相関が小さく、それらで共有のネットワークを更新するから", "1つのエージェントが同じ経験を何度も繰り返し学習し、経験の偏りを平均して打ち消すから", "行動価値ではなく受け取った報酬そのものを、ネットワークに直接記憶させて参照するから", "学習の途中ではネットワークの重みを更新せず、最後にまとめて1回だけ更新するから"], "e": "A3Cでは別々の環境で動く複数のエージェントが非同期に更新するため、連続した経験どうしの強い相関が薄まる。DQNは同じ目的のために過去の経験を保存してランダムに取り出す経験再生を用いる。"},
{"c": 6, "q": "画像生成モデルを、発表された年の古い順に並べたものとして最も適切なものはどれか。", "o": ["GAN → DCGAN → StyleGAN → Stable Diffusion", "DCGAN → GAN → Stable Diffusion → StyleGAN", "GAN → StyleGAN → DCGAN → Stable Diffusion", "Stable Diffusion → GAN → DCGAN → StyleGAN"], "e": "GANは2014年、DCGANは2015年、StyleGANは2018年、Stable Diffusionは2022年に発表された。"},
{"c": 6, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「GANでは、（ア）が本物らしいデータを作り、（イ）が本物のデータか作られたデータかを見分ける。両者を競わせるように交互に学習する。」", "o": ["（ア）生成器 （イ）識別器", "（ア）識別器 （イ）生成器", "（ア）エンコーダ （イ）デコーダ", "（ア）デコーダ （イ）エンコーダ"], "e": "生成器（Generator）はノイズから偽のデータを作り、識別器（Discriminator）は入力が本物か偽物かを判定する。エンコーダとデコーダはオートエンコーダやseq2seqの構成要素。"},
{"c": 6, "q": "画像変換モデルPix2PixとCycleGANの違いとして最も適切なものはどれか。", "o": ["Pix2Pixは変換前後の対応が取れたペア画像が必要で、CycleGANはペアでない2つの画像集合から学習できる", "Pix2Pixはペアでない2つの画像集合から学習でき、CycleGANは変換前後の対応が取れたペア画像が必要である", "Pix2Pixは画像からテキストを生成し、CycleGANはテキストから画像を生成する", "Pix2Pixは識別器を使わずに学習し、CycleGANは識別器だけを学習する"], "e": "Pix2Pixは入力画像と正解画像のペアを使う条件付きGAN。CycleGANは2つのドメインの画像集合があればよく、変換して戻した画像が元に近くなるサイクル一貫性損失でペアのない学習を可能にした。"},
{"c": 6, "q": "ある食品工場の外観検査で、良品の画像は大量にあるが不良品の画像は数十枚しかない。不良品の学習データを増やす方法として最も適切なものはどれか。", "o": ["画像生成モデルで、傷や異物のある疑似的な不良品画像を作って学習に加える", "Grad-CAMで良品画像の注目領域を表示し、その画像を学習から除く", "知識蒸留で分類モデルを小さくし、不良品の枚数に合わせる", "NMSで重なった枠を削除し、不良品の検出数を減らす"], "e": "GANや拡散モデルで不良品らしい画像を生成し、少ないクラスのデータを補う方法がある。Grad-CAMは判断根拠の可視化、知識蒸留はモデルの軽量化、NMSは重複した検出枠の除去で、データを増やす手法ではない。"},
{"c": 6, "q": "GANと拡散モデルの比較として最も適切なものはどれか。", "o": ["GANは1回の計算で画像を生成できるが学習が不安定になりやすく、拡散モデルは学習が安定しやすいが生成に多くの段階を要する", "GANは生成に多くの段階を要するが学習が安定しやすく、拡散モデルは1回の計算で画像を生成できるが学習が不安定になりやすい", "GANはテキストしか生成できず、拡散モデルは画像しか生成できない", "GANは学習にラベル付きデータを必ず使い、拡散モデルは学習データを使わない"], "e": "GANは生成器を1回通すだけで生成できる一方、生成器と識別器の競争でモード崩壊などが起きやすい。拡散モデルはノイズ除去を多数の段階で繰り返すため生成に時間がかかるが、学習は安定しやすい。"},
{"c": 6, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「Stable Diffusionでは、入力した文章を（ア）で埋め込みに変換し、それを条件として（イ）が潜在空間上のノイズを段階的に予測・除去する。」", "o": ["（ア）CLIPのテキストエンコーダ （イ）U-Net", "（ア）CLIPのテキストエンコーダ （イ）YOLO", "（ア）word2vec （イ）YOLO", "（ア）Part Affinity Fields （イ）U-Net"], "e": "Stable Diffusion（v1）はCLIPのテキストエンコーダで文章を埋め込み、Cross-Attentionで条件付けたU-Netがノイズを予測する。最後にオートエンコーダのデコーダで潜在表現を画像に戻す。"},
{"c": 6, "q": "画像生成モデルに写真とマスクを与え、写真の中の電線が写った部分だけを、周囲に自然になじむように描き直させる処理を何と呼ぶか。", "o": ["インペインティング", "スタイル変換", "超解像", "画像キャプション生成"], "e": "画像の欠けた部分や指定した部分を周囲に合わせて補完・生成するのがインペインティング。スタイル変換は画風の変換、超解像は解像度を高める処理、画像キャプション生成は画像の説明文を作るタスク。"},
{"c": 6, "q": "2022年に公開され、学習済みの重みが一般に配布されたことで、誰でも手元のGPUで動かしたり追加学習したりできるようになったテキストからの画像生成モデルはどれか。", "o": ["Stable Diffusion", "DALL-E 2", "DCGAN", "CycleGAN"], "e": "Stable DiffusionはStability AI、ミュンヘン大学（LMU）のCompVis、Runwayにより2022年8月に重みとともに公開された。DALL-E 2はOpenAIがサービスとして提供し重みは非公開、DCGANとCycleGANはテキストから画像を作るモデルではない。"},
{"c": 6, "q": "ある工場で、自社部品の良品・不良品の画像が各200枚しかない。ImageNetで学習済みのCNNを利用し、出力層だけを2クラス用に置き換えてその層だけを学習させた。この方法として最も適切なものはどれか。", "o": ["転移学習", "強化学習", "知識蒸留", "データ拡張"], "e": "別の大規模データで学習したモデルの特徴抽出部分をそのまま使い、新しい出力層だけを学習させるのは転移学習の典型例。少ないデータでも高い精度を得やすい。"},
{"c": 6, "q": "事前学習済みモデルを新しいタスクに使うとき、「転移学習（特徴抽出として使う方法）」と「ファインチューニング」の違いとして最も適切なものはどれか。", "o": ["転移学習は学習済みの層を固定して追加した層だけを学習し、ファインチューニングは学習済みの層の重みも更新する", "転移学習は学習済みの層の重みも更新し、ファインチューニングは学習済みの層を固定して追加した層だけを学習する", "転移学習はラベルのないデータだけを使い、ファインチューニングは強化学習の報酬だけを使う", "転移学習は学習済みモデルの構造を自動探索し、ファインチューニングは学習済みモデルを小さく圧縮する"], "e": "特徴抽出としての転移学習では学習済みの層を凍結し、追加した出力層などだけを学習する。ファインチューニングでは学習済みの重みを初期値として、一部または全体の層も追加で学習する。"},
{"c": 6, "q": "LLMの4096×4096の重み行列1つにランク8のLoRAを適用する。LoRAで学習するパラメータ数（4096×8と8×4096の2つの行列の合計）はいくつか。", "o": ["65,536", "32,768", "16,777,216", "131,072"], "e": "4096×8＋8×4096＝65,536で、元の行列の4096×4096＝16,777,216の約0.4%。32,768は片方の行列だけ、131,072はランクを16とした場合の数。"},
{"c": 6, "q": "ある工場の部品識別システムで、新しく扱う部品の画像を1枚だけ登録すれば、その部品を見分けられるようにしたい。このように1つの例だけから新しいクラスを認識する学習の枠組みはどれか。", "o": ["One-shot学習", "Zero-shot学習", "強化学習", "半教師あり学習"], "e": "1つの例からそのクラスを認識するのはOne-shot学習で、学習済みの埋め込み空間で登録画像との距離を比べる方法がよく使われる。Zero-shot学習は例を1つも与えずに、クラスの説明などから認識する枠組みである。"},
{"c": 6, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「DeepMindが2022年に発表したFlamingoは、学習済みの（ア）と（イ）の重みを固定したまま、両者をつなぐ層だけを学習し、画像と文章が混在した入力に対して数例を示すだけで様々なタスクをこなした。」", "o": ["（ア）画像エンコーダ （イ）大規模言語モデル", "（ア）音声認識モデル （イ）大規模言語モデル", "（ア）画像エンコーダ （イ）物体検出モデル", "（ア）音声認識モデル （イ）物体検出モデル"], "e": "Flamingoは学習済みの画像エンコーダと言語モデル（Chinchilla）を固定し、Perceiver Resamplerとゲート付きのCross-Attention層を追加して学習した。Few-shotで画像キャプション生成やVQAを行える。"},
{"c": 6, "q": "あるECサイトで、出品された商品写真から「白い陶器のマグカップが木のテーブルに置かれている」のような説明文を自動で作りたい。このタスクとして最も適切なものはどれか。", "o": ["画像キャプション生成", "視覚的質問応答（VQA）", "物体検出", "テキストからの画像生成"], "e": "画像を入力して、その内容を説明する文章を出力するのは画像キャプション生成。VQAは画像と質問文から答えを出すタスク、テキストからの画像生成は逆に文章から画像を作るタスク。"},
{"c": 6, "q": "「半教師あり学習」と「自己教師あり学習」の違いとして最も適切なものはどれか。", "o": ["半教師あり学習は少量のラベル付きデータと大量のラベルなしデータを併用し、自己教師あり学習はデータ自身から作った課題で学習する", "半教師あり学習はデータ自身から作った課題で学習し、自己教師あり学習は少量のラベル付きデータと大量のラベルなしデータを併用する", "半教師あり学習は報酬を使って学習し、自己教師あり学習は人が付けたラベルだけで学習する", "半教師あり学習はモデルを半分の大きさにして学習し、自己教師あり学習はモデルを自動設計する"], "e": "半教師あり学習は一部にしかラベルがないデータを活用する枠組み。自己教師あり学習は、隠した単語や画像の一部を予測するなど、ラベルのないデータから自動で作った課題で事前学習する。"},
{"c": 6, "q": "ある銀行で、ローン審査モデルの判定について、申込者ごとに「年収」「勤続年数」などの各特徴量が判定をどれだけ押し上げたか・押し下げたかを示したい。最も適切な手法はどれか。", "o": ["SHAP", "Grad-CAM", "NMS", "Permutation Importance"], "e": "SHAPはシャープレイ値に基づき、個々の予測に対する各特徴量の寄与を正負の向きとともに示せる。Grad-CAMは画像のCNN向けの可視化、Permutation Importanceはモデル全体での特徴量の重要度を測る手法で、申込者ごとの説明にはならない。"},
{"c": 6, "q": "モデルの説明手法を「大域的な説明（モデル全体の傾向）」と「局所的な説明（個々の予測の理由）」に分けたとき、組み合わせとして最も適切なものはどれか。", "o": ["Permutation Importanceは大域的、LIMEは局所的", "Permutation Importanceは局所的、LIMEは大域的", "Permutation ImportanceもLIMEも大域的", "Permutation ImportanceもLIMEも局所的"], "e": "Permutation Importanceはデータ全体で特徴量を並べ替えたときの精度低下からモデル全体での重要度を測る。LIMEは説明したい1件の近くを単純なモデルで近似し、その予測の理由を示す。"},
{"c": 6, "q": "知識蒸留で、教師モデルの出力ロジットが(4, 2, 0)であった。温度T＝2のソフトマックス、すなわち各ロジットをTで割ってからソフトマックスを取ったとき、最も大きいクラスの確率はいくらか（小数第3位を四捨五入）。", "o": ["0.67", "0.87", "0.50", "0.33"], "e": "ロジットを2で割ると(2,1,0)で、e^2÷(e^2＋e^1＋e^0)＝7.389÷11.107≒0.67。T＝1なら約0.87で、温度を上げると分布がなだらかになり、正解以外のクラスの確率の情報も生徒モデルに伝わる。"},
{"c": 6, "q": "70億個のパラメータを持つLLMを、メモリ6GBのGPUで動かしたい。重みだけを載せると考えたとき、GPUに収まる最も大きいビット数の量子化はどれか（1GB＝10^9バイトとする）。", "o": ["4ビット", "8ビット", "16ビット", "32ビット"], "e": "1パラメータあたり4ビット（0.5バイト）なら3.5GBで収まる。8ビットでは7GB、16ビットでは14GB、32ビットでは28GBとなり、6GBを超える。"},
{"c": 6, "q": "モデル圧縮手法Deep Compressionで行われる処理の順序として最も適切なものはどれか。", "o": ["枝刈り → 量子化 → ハフマン符号化", "量子化 → ハフマン符号化 → 枝刈り", "ハフマン符号化 → 枝刈り → 量子化", "枝刈り → ハフマン符号化 → 量子化"], "e": "Deep Compressionは、まず不要な重みを枝刈りし、残った重みを少数の代表値に量子化（重みの共有）し、最後にハフマン符号化で保存サイズを縮める。ハフマン符号化は値の出現頻度の偏りを利用するため最後に行う。"},
{"c": 6, "q": "枝刈りの「非構造化枝刈り」と「構造化枝刈り」の比較として最も適切なものはどれか。", "o": ["非構造化は個々の重みを0にするため一般的なハードウェアでは速くなりにくく、構造化はチャネルなどを丸ごと削るため速くなりやすい", "非構造化はチャネルなどを丸ごと削るため速くなりやすく、構造化は個々の重みを0にするため一般的なハードウェアでは速くなりにくい", "非構造化は学習前にだけ行い、構造化は推論のたびに毎回行う", "非構造化は重みのビット数を減らし、構造化は教師モデルの出力を真似させる"], "e": "非構造化枝刈りは疎な重み行列になり、疎行列に対応した専用の仕組みがないと計算時間は減りにくい。構造化枝刈りはフィルタやチャネル単位で削除するため、行列が小さくなり一般的なハードウェアでも高速化しやすい。"},
{"c": 6, "q": "2019年にHugging Faceが発表した、知識蒸留によってBERTのサイズを約40%小さくし、約60%高速化しながら言語理解の性能の約97%を保ったモデルはどれか。", "o": ["DistilBERT", "RoBERTa", "T5", "GPT-2"], "e": "DistilBERTはBERTを教師モデルとして蒸留した生徒モデル。RoBERTaはBERTの事前学習方法を見直して性能を高めたモデルで、小型化を目的としたものではない。"});

QUESTIONS.push({"c": 7, "q": "CRISP-DMの6つのフェーズを、基本となる順序で並べたものとして最も適切なものはどれか。", "o": ["ビジネスの理解 → データの理解 → データの準備 → モデリング → 評価 → 展開", "データの理解 → ビジネスの理解 → モデリング → データの準備 → 評価 → 展開", "ビジネスの理解 → データの準備 → データの理解 → 評価 → モデリング → 展開", "データの準備 → データの理解 → ビジネスの理解 → モデリング → 展開 → 評価"], "e": "CRISP-DMは、ビジネスの理解から始まり、データの理解・準備、モデリング、評価を経て展開に至る。各フェーズは一方通行ではなく、必要に応じて前のフェーズに戻りながら繰り返す。"},
{"c": 7, "q": "ある物流会社が、AIで配送の遅延を減らすプロジェクトを始める。進め方の順序として最も適切なものはどれか。", "o": ["解決したい課題と目標値を決める → 使えるデータを確かめる → PoCで効果を検証する → 本開発 → 運用と監視", "PoCで効果を検証する → 使えるデータを確かめる → 解決したい課題と目標値を決める → 本開発 → 運用と監視", "本開発 → 解決したい課題と目標値を決める → 使えるデータを確かめる → PoCで効果を検証する → 運用と監視", "使えるデータを確かめる → 本開発 → PoCで効果を検証する → 運用と監視 → 解決したい課題と目標値を決める"], "e": "まず業務上の課題と達成したい目標値を決め、それに必要なデータがあるかを確かめてから、PoCで小さく検証し、見込みが立てば本開発と運用に進む。目標が決まっていないとPoCの成否を判断できない。"},
{"c": 7, "q": "次の文の（ア）に入る語として最も適切なものはどれか。「機械学習システムの運用では、ソフトウェア開発の継続的インテグレーション（CI）や継続的デリバリー（CD）に加えて、新しいデータでモデルを自動的に学習し直す（ア）の仕組みが求められる。」", "o": ["継続的トレーニング（CT）", "ウォーターフォール開発", "ビジネスプロセス・リエンジニアリング（BPR）", "概念実証（PoC）"], "e": "MLOpsでは、コードの変更だけでなくデータの変化にも追従するため、新しいデータでの再学習と評価を自動化する継続的トレーニング（CT）を組み込む。ウォーターフォールは開発手法、BPRは業務の再設計、PoCは導入前の検証を指す。"},
{"c": 7, "q": "自動車部品の外観検査AIで、不良品を見逃すと重大なリコールにつながる一方、良品を不良と判定しても人が再確認すれば済む。判定のしきい値の決め方として最も適切なものはどれか。", "o": ["不良と判定するしきい値を下げて見逃しを減らし、不良判定されたものは人が再確認する", "良品を不良と誤判定しないよう、しきい値を上げて、確実な不良だけを不良として判定する", "見逃しと誤判定が同じ件数になるように、しきい値を固定してそのまま運用する", "しきい値は変えずに、不良と判定された品もすべてそのまま出荷する運用にする"], "e": "誤りの種類によって業務上のコストが違うときは、コストの大きい誤り（ここでは見逃し）を減らす方向にしきい値を調整する。増える誤判定は人の再確認で吸収する、という運用とセットで設計する。"},
{"c": 7, "q": "工場の設備の振動データと過去の故障記録から、故障の兆候を事前に知らせるAIを作りたい。学習に使う目的変数（ラベル）の設計として最も適切なものはどれか。", "o": ["各時点から一定期間内（例えば7日以内）に故障が起きたかどうかをラベルにする", "各時点で設備がすでに故障して止まっているかどうかをラベルにする", "設備を導入してからの経過日数を、そのままラベルとして予測させる", "振動の大きさを、翌日の同じ時刻に測った振動の大きさでラベルとして付けていく"], "e": "事前に知らせるには、「この先の一定期間に故障が起きるか」を予測する形にする。すでに故障しているかを当てても予防にはならない。期間の長さは、保全の手配に必要な日数などから業務側と決める。"},
{"c": 7, "q": "外観検査AIを運用している工場で、カメラのレンズを別の型番に交換したところ、誤判定が急に増えた。最初に取る対応として最も適切なものはどれか。", "o": ["交換後に撮影した画像でモデルの性能を確かめ、必要なら新しい画像を加えて再学習する", "誤判定が増えたのはモデルの設計の誤りなので、別の手法で一から作り直す", "誤判定の件数が落ち着くまで数か月待ち、自然に元の精度に戻るのを確かめる", "誤判定が増えた期間だけ、しきい値を0にしてすべての製品を良品と判定するようにする"], "e": "撮影条件が変わると入力画像の分布が変わり（データドリフト）、学習時の性能が出なくなる。まず新しい条件の画像で性能を測り、必要なら追加学習する。カメラなどの変更をAI側に知らせる変更管理の手順も必要。"},
{"c": 7, "q": "ある病院のCT画像だけで学習した病変検出AIを、別の病院に導入したところ、性能が大きく下がった。原因と対策の組み合わせとして最も適切なものはどれか。", "o": ["撮影装置や撮影条件・患者層の違い：複数施設のデータで学習し、導入先のデータでも評価する", "学習データの枚数が多すぎた：学習に使う画像の枚数を減らしてから学習をやり直す", "画像の解像度が高すぎた：導入先の画像を縮小してから、そのまま判定に使う", "モデルの層の数が足りなかった：同じ病院のデータのままで、層の数を増やして学習し直す"], "e": "施設が変わると、装置のメーカーや撮影条件、患者の構成が変わり、入力の分布がずれる。複数施設のデータで学習し、導入先のデータで外部検証してから使うことが重要。同じ病院のデータだけで層を増やしても、この違いは学べない。"},
{"c": 7, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「画像診断を支援するAIのプログラムのうち医療機器に当たるものは、日本では（ア）の規制を受け、承認を受ける場合は（イ）による審査を経て厚生労働大臣が承認する。」", "o": ["（ア）医薬品医療機器等法 （イ）医薬品医療機器総合機構（PMDA）", "（ア）個人情報保護法 （イ）医薬品医療機器総合機構（PMDA）", "（ア）医薬品医療機器等法 （イ）個人情報保護委員会", "（ア）医療法 （イ）特許庁"], "e": "診断などに使うプログラムは医療機器プログラムとして医薬品医療機器等法（薬機法）の対象となり、承認のための審査はPMDAが行う。個人情報保護委員会は個人情報の取扱いを監督する機関で、医療法は病院などの医療提供体制を定める法律、特許庁は特許などの審査を行う機関である。"},
{"c": 7, "q": "日本で、承認後に新しいデータで性能を改善していくことが見込まれるAIの医療機器について、あらかじめ変更の計画を確認しておき、その範囲内の変更を迅速に反映できるようにした制度はどれか。", "o": ["変更計画確認手続制度（IDATEN）", "先駆け審査指定制度", "条件付き承認制度", "特定臨床研究の実施計画"], "e": "2020年9月に施行されたIDATENは、改良が見込まれる医療機器について改良の計画ごと確認を受け、計画の範囲内の変更を届出で行えるようにした制度で、再学習で性能が変わるAIへの適用が想定されている。先駆け審査指定は画期的な製品の審査を早める制度、条件付き承認は臨床データの収集が難しい場合の早期承認の制度。"},
{"c": 7, "q": "ある農業法人が、1年分の圃場（ほじょう）の画像と気象データで収穫量を予測するAIを作った。翌年に運用したところ予測が大きく外れた。この問題への対策として最も適切なものはどれか。", "o": ["天候の異なる複数の年や地域のデータを集め、年による違いを学習と評価に含める", "1年分のデータをより細かく分割して学習回数を増やし、同じ年の精度を上げる", "予測が外れた年のデータは例外として捨て、元の1年分のデータだけで運用を続ける", "気象データを特徴量から外し、圃場の画像だけで収穫量を予測するようにする"], "e": "農業は年ごとの天候の違いが大きく、1年分のデータでは年による変動を学べない。複数年・複数地域のデータを集め、学習に使っていない年で評価して、年をまたいでも使えるかを確かめる。"},
{"c": 7, "q": "人工衛星の画像で作物の生育状況を毎週推定しているが、雲に覆われた週の画像では地表が写っていない。前処理の判断として最も適切なものはどれか。", "o": ["雲のかかった画素を欠損として扱い、除外するか前後の週の値から補間する", "雲も地表の一部とみなし、雲の写った画素もそのまま生育の推定に使う", "雲の多い週のデータがあるので、その地域の全期間の画像を学習から外す", "雲に覆われた画素の値を、画像全体で一番明るい画素の値に置き換える"], "e": "雲に覆われた画素は地表の状態を表していないので、計測できなかった値（欠損）として扱い、除外するか時間的に前後の観測から補間する。そのまま使うと雲の明るさを作物の状態と取り違える。"},
{"c": 7, "q": "スーパーマーケットで、販売実績のまだない新商品の需要を予測したい。考え方として最も適切なものはどれか。", "o": ["カテゴリや価格帯などの商品属性を特徴量にし、似た既存商品の販売実績から推定する", "販売実績がない商品は予測できないので、発売日から数年分の販売実績がたまるまで待つ", "新商品の過去の販売実績の欄を0で埋め、既存商品と同じモデルにそのまま入力する", "全商品の平均の売上を、新商品の予測値として発売後もずっと使い続ける"], "e": "実績のない新商品は、商品属性を手がかりに、似た既存商品の実績から推定する（コールドスタートへの対処）。実績を0で埋めると「売れていない商品」と誤って扱うことになる。"},
{"c": 7, "q": "全国500店舗の防犯カメラ映像を使う来店客数推定モデルを、店舗ごとの機器ではなくクラウドで推論する方式にした。クラウド推論の利点として最も適切なものはどれか。", "o": ["モデルの更新や監視を1か所で行え、計算資源も必要に応じて増やせる", "映像を外部に送らずに済むので、通信回線が止まっても推論を続けられる", "店舗の機器で処理するので、通信の遅延がなくなり瞬時に判定できる", "店舗ごとに別々のモデルを置くので、店舗ごとに異なる版を管理しやすい"], "e": "クラウド推論は、モデルの入れ替えや監視を一元化でき、負荷に応じて計算資源を増減できる。映像を外部に送らない、通信断でも動く、遅延が小さい、といった点はエッジ推論の利点。"},
{"c": 7, "q": "外出の自粛で消費者の購買行動が急に変わり、ドラッグストアの需要予測AIの誤差が急増した。この状況の説明と対応として最も適切なものはどれか。", "o": ["入力と売上の関係自体が変わったので、直近のデータで再学習し、当面は人の判断も併用する", "入力データの形式が変わっただけなので、学習済みのモデルを変更せずにそのまま使い続けてよい", "モデルの設計が誤っていたので、変化の前の期間のデータだけで学習をやり直す", "一時的な誤差なので、予測値に一律の係数を掛けて売上を多めに見積もり続ける"], "e": "同じ入力に対する売れ方そのものが変わるのはコンセプトドリフト。変化後の直近データで再学習し、データがたまるまでは担当者の判断を併用する。変化前のデータだけで学び直しても、新しい状況には合わない。"},
{"c": 7, "q": "物流倉庫で「在庫がちょうど決められた量を下回ったら、決められた量を発注する」という手順を自動化したい。手段の選び方として最も適切なものはどれか。", "o": ["判断の条件が明確なので、機械学習を使わずにルールとしてプログラムする", "AIの導入が目的なので、条件が明確でも機械学習モデルを必ず作る", "在庫の履歴を集めて、発注の条件そのものをディープラーニングで学習させる", "判断の条件が明確なので、発注の判断は担当者の勘に任せることにする"], "e": "条件が明確でルールとして書ける処理は、ルールベースで実装する方が確実で説明もしやすい。AIは、ルールで書けない判断（需要の予測など）に使う。手段の選定は、課題に合っているかで決める。"},
{"c": 7, "q": "トンネルの壁面画像からひび割れの領域を検出するAIを作るため、大量の画像に領域のアノテーションを付けたい。作業の効率を上げる方法として最も適切なものはどれか。", "o": ["少量の画像で作った仮のモデルの予測を下書きにし、それを人が確認して修正する", "アノテーションを付けずに、画像の撮影日時をそのままラベルとして使う", "ひび割れの判断基準は作業者ごとに自由に決めさせて、作業の速さを何よりも優先する", "ひび割れの写っていない画像だけを選び、領域を付ける作業そのものを減らす"], "e": "少量のデータで作ったモデルの出力を下書きとして人が修正すると、一から付けるより作業時間を減らせる。ただし下書きに引きずられないよう、判断基準をそろえ、抜き取りで品質を確かめる。"},
{"c": 7, "q": "気温などから翌日の電力需要を予測するAIに、観測史上最高の気温が予報された日のデータが入力された。この日の運用として最も適切なものはどれか。", "o": ["学習データの範囲外の入力なので予測を過信せず、担当者の確認や別の方法と併用する", "学習データの範囲外の入力でも、機械学習の予測はいつも正確なのでそのまま採用する", "入力の気温を学習データの最大値に書き換えて、予測を出させてからそのまま採用する", "予報の気温が高すぎるので、その日は需要の予測を出さずに発電計画も立てない"], "e": "学習データにない範囲の入力（外挿）では、モデルの予測は信頼しにくい。範囲外の入力を検知する仕組みを設け、そうした日は担当者の判断や物理的なモデルなど別の方法と組み合わせる。"},
{"c": 7, "q": "銀行が融資の審査にAIを使う。申込者から否決の理由を問われたときに備えた設計として最も適切なものはどれか。", "o": ["判定に効いた主な要因を示せる仕組みを用意し、人が再審査できる手順も設ける", "判定の理由はAIにも分からないので、問い合わせには応じない方針を定める", "精度を最優先して、判定の根拠を記録しない最も複雑なモデルを必ず採用する", "否決された申込者には、判定に使ったモデルの重みのファイルをそのまま渡す"], "e": "人の生活に大きく影響する判断では、説明責任を果たすため、判定に影響した要因を示せる仕組みや、人による見直しの手順を用意する。モデルの重みをそのまま渡しても、申込者が理由を理解できる説明にはならない。"},
{"c": 7, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「SAE J3016の自動運転レベル4では、あらかじめ定めた（ア）の中でシステムがすべての運転操作を行う。（イ）では、その領域の限定なく、システムがすべての運転操作を行う。」", "o": ["（ア）運行設計領域（ODD） （イ）レベル5", "（ア）運行設計領域（ODD） （イ）レベル3", "（ア）概念実証（PoC）の範囲 （イ）レベル5", "（ア）概念実証（PoC）の範囲 （イ）レベル3"], "e": "ODD（運行設計領域）は、道路・地理・天候などシステムが正常に作動する前提となる走行環境の条件。レベル4はODD内で運転者の介入を前提とせず作動し、レベル5は領域の限定がない。レベル3は作動継続が難しいとき運転者の引き継ぎが前提になる。"},
{"c": 7, "q": "先行車との車間距離を保つように加減速だけを自動で行う機能（アダプティブ・クルーズ・コントロール）を、単独で使っている状態はSAE J3016のどのレベルにあたるか。", "o": ["レベル1", "レベル2", "レベル3", "レベル0"], "e": "加減速かハンドル操作のどちらか一方をシステムが支援するのがレベル1（運転支援）。両方を同時に支援するとレベル2になる。レベル0は運転自動化なしで、警報などの支援にとどまる。"},
{"c": 7, "q": "AIプロジェクトの体制で、社内の各システムからデータを集めて加工し、学習や推論に使える形で継続的に供給するデータの流れ（パイプライン）を作る役割を主に担う職種はどれか。", "o": ["データエンジニア", "ドメインエキスパート", "プロジェクトマネージャー", "アノテーター"], "e": "データエンジニアはデータ基盤やパイプラインの構築・運用を担う。ドメインエキスパートは業務知識からデータやラベルの意味を判断し、プロジェクトマネージャーは計画と関係者の調整を、アノテーターはデータへのラベル付けを担う。"},
{"c": 7, "q": "介護施設で見守りAIを導入しようとしたところ、現場の職員から「仕事を奪われる」「使いにくそう」と不安の声が上がった。進め方として最も適切なものはどれか。", "o": ["早い段階から職員を巻き込み、目的とAIの限界を説明し、試行と評価にも参加してもらう", "導入を決めたのは経営層なので、職員には完成後にだけ使い方を説明する", "不安の声が出なくなるまでの間は、AIを使っていることを職員には一切知らせずに運用する", "職員の意見は精度と関係ないので聞かず、開発会社の判断だけで仕様を決める"], "e": "AIは現場で使われて初めて効果を出すので、利用者となる現場を早くから巻き込み、目的や限界を共有し、使い勝手の評価に参加してもらうことが重要。知らせずに運用すると信頼を損なう。"},
{"c": 7, "q": "工場の部品発注をAIで自動化するにあたり、AIが誤った発注量を出す場合に備えて事前に決めておくこととして最も適切なものはどれか。", "o": ["誤りが起きたときの業務への影響を洗い出し、上限値の確認や人の承認などの手順を決める", "AIの誤りは起きないように設計するので、誤りが起きたときの手順は決めずに運用する", "誤りが見つかったら、その都度AIの利用を完全にやめて、以前の方法には戻さないと決める", "誤りの影響を小さくするため、AIの出した発注量を常に一律で2倍にしてから発注する"], "e": "AIの予測は一定の割合で誤るので、誤ったときの影響を洗い出し、異常な値を止める上限チェックや人の承認、元の手順に戻す方法（フォールバック）を運用開始前に決めておく。"},
{"c": 7, "q": "経理部門で、紙の請求書をスキャンしてAI-OCRで読み取るシステムを検討している。その前に、取引先からの請求書を電子データで受け取れないか、承認の手順は減らせないかを含めて業務の流れを見直した。この取り組みの考え方にあたるものはどれか。", "o": ["BPR（ビジネスプロセス・リエンジニアリング）", "A/Bテスト", "アノテーション", "データ拡張"], "e": "BPRは、今の業務を前提に一部を自動化するのではなく、目的に立ち返って業務の流れを根本から見直す取り組み。AIの導入前に業務を見直すと、AIが不要になったり、より効果的な使い方が見つかったりする。"},
{"c": 7, "q": "1分ごとに記録している工場の温度センサーのデータで、通信の瞬断により数分だけ値が抜けている箇所がある。欠損の扱いとして最も適切なものはどれか。", "o": ["短い抜けなので、前後の時刻の値から直線で補間する", "抜けがある日のデータを、その日の全時刻分まとめて削除する", "抜けた箇所を、全期間の温度の平均値で埋める", "抜けた箇所を0として、そのまま学習に使う"], "e": "時間とともに連続的に変わる量の短い欠損は、前後の値からの補間が自然。全期間の平均で埋めると季節や時刻による変化が失われ、0で埋めると実際にはない急激な温度変化を作ってしまう。"},
{"c": 7, "q": "ある飲食チェーンが、日ごとの来客数を予測するモデルを作る。データにある「日付」（2025-04-01など）の扱いとして最も適切なものはどれか。", "o": ["曜日や月、祝日かどうかなどの列に分け、周期的な傾向を捉えられるようにする", "日付を20250401のような1つの整数に変換し、そのままの大きさで数値として入力する", "日付は来客数の原因そのものではないので、列ごと学習データから取り除いておく", "日付ごとに1列を作るOne-hotエンコーディングで、すべての日付を別々の列にする"], "e": "来客数は曜日や季節、祝日によって周期的に変わるので、日付からそれらの特徴量を作ると傾向を学習しやすい。20250401のような整数は月末から翌月初めで値が大きく跳ぶなど大小に意味がなく、日付ごとのOne-hotでは予測したい将来の日付が学習時に存在しない列になってしまう。"},
{"c": 7, "q": "アパレルの通販サイトで、服のサイズ（S・M・L・XL）を特徴量としてモデルに入力する。エンコーディングの方法として最も適切なものはどれか。", "o": ["S=1、M=2、L=3、XL=4のように、大小の順序を保つ整数に置き換える", "サイズを文字列のまま、特に変換せずにモデルへ入力する", "各サイズの出現する順番に、ランダムな整数を割り当てて入力する", "サイズの文字数を数え、その文字数を特徴量として入力する"], "e": "S・M・L・XLは大小の順序を持つ順序変数なので、順序を保つ整数に置き換える方法（順序エンコーディング）が使える。順序のない都道府県のようなカテゴリでは、この方法は存在しない大小関係を持ち込むので、One-hotを使う。"},
{"c": 7, "q": "数万種類ある「商品ID」をOne-hotエンコーディングしたところ、列の数が膨大になり、ほとんど出現しないIDも多かった。対処として最も適切なものはどれか。", "o": ["出現の少ないIDを「その他」にまとめたり、商品カテゴリなど上位の分類に置き換えたりする", "商品IDの番号を、そのまま大小の意味を持つ数値の特徴量として入力する", "列の数を減らすため、学習データから出現の少ない商品の行を毎回すべて削除する", "表現力を上げるため、One-hotの列をさらに増やし、商品IDと日付の組み合わせごとに列を作る"], "e": "カテゴリの種類が非常に多い変数は、まれなカテゴリをまとめる、上位の分類に置き換える、埋め込み表現を使う、などで扱う。IDの番号には大小の意味がないので、そのまま数値として入れるのは不適切。"},
{"c": 7, "q": "工作機械のログで、正常が100万件、異常が1,000件ある。学習に時間がかかりすぎ、しかもモデルがほぼ正常としか予測しない。データの扱いとして最も適切なものはどれか。", "o": ["正常のデータを間引いて件数の差を縮めるアンダーサンプリングを行う", "異常のデータを間引いて、正常のデータとの件数の差をさらに広げる", "件数の少ない異常のデータを捨てて、正常のデータだけで分類を学習する", "正常のデータを複製して増やし、学習データの件数をさらに多くする"], "e": "多数派が極端に多い場合、多数派を間引くアンダーサンプリングで、学習時間を減らしつつクラスの偏りを緩和できる。捨てた情報が惜しい場合は、間引き方を変えて複数のモデルを作り組み合わせる方法もある。"},
{"c": 7, "q": "樹脂成形品の外観検査で、不良品の画像が30枚しかないため、同じ画像をそのまま複製して良品と同じ枚数にそろえて学習した。学習データでは不良をほぼすべて見分けたが、新たに発生した不良は見逃しが多かった。原因として最も適切なものはどれか。", "o": ["同じ30枚を繰り返し学習し、その30枚だけに固有の特徴に過剰に適合した", "複製によって良品の画像の枚数が減り、良品の特徴を十分に学べなかった", "複製した画像では画素の値が変わり、元の不良とは別の画像になった", "不良と良品の枚数をそろえたため、モデルが良品だけを予測するようになった"], "e": "単純な複製では新しい情報が増えないため、少ない不良画像そのものを覚え込む過学習が起きやすい。変換を加えて増やすデータ拡張や、実際の不良画像の追加収集で多様性を補う。複製しても良品の枚数や画素の値は変わらず、学習データで不良を見分けている以上、良品だけを予測しているわけでもない。"},
{"c": 7, "q": "公開されている大規模な画像データセットで学習済みのモデルを、自社の検査ラインに導入する。導入前の評価として最も適切なものはどれか。", "o": ["自社の検査ラインで撮影した画像で性能を評価し、目標を満たすかを確かめる", "公開データセットでの精度が高いので、自社の画像では評価せずに導入する", "公開データセットの評価用データを増やして、もう一度同じ条件で評価する", "自社の画像は数が少ないので、評価には使わず学習にだけすべて回す"], "e": "公開データセットと自社の現場では、撮影条件や対象物の見え方が違うことが多く、公開データでの精度は自社での精度を保証しない。運用する環境のデータで評価して判断する。"},
{"c": 7, "q": "食品工場の異物検査AIの学習データを集めている。異物の種類のうち、金属片は数千件あるが、プラスチック片は数件しかない。データ収集の方針として最も適切なものはどれか。", "o": ["種類ごとの件数を確認し、少ないプラスチック片の画像を重点的に集める", "全体の件数は十分なので、種類ごとの件数は確認せずに学習を始める", "件数の多い金属片の画像をさらに集めて、全体の件数を増やしていく", "件数の少ないプラスチック片は、検査の対象から外すと決めてしまう"], "e": "必要なデータ量は全体の件数だけでなく、見分けたいクラスや条件ごとに足りているかで判断する。少ない種類は重点的に集めるか、擬似的な不良を作るなどして補う。検出すべき異物を対象から外すのは本末転倒。"},
{"c": 7, "q": "鋼板の傷の検査で、傷があるかだけでなく、傷の位置と形・面積も求めて等級を付けたい。アノテーションの方法として最も適切なものはどれか。", "o": ["傷の領域を画素単位で塗り分けるアノテーションを付ける", "画像1枚ごとに「傷あり」「傷なし」のラベルだけを付ける", "画像1枚ごとに撮影した日時と作業者の名前だけを記録する", "傷の有無は付けずに、鋼板の製造番号をラベルとして付ける"], "e": "アノテーションの粒度は、モデルに出させたい出力で決める。面積や形まで必要なら画素単位の領域のラベル（セグメンテーション用）が要る。有無だけのラベルは作業が軽い一方、位置や形は学べない。"},
{"c": 7, "q": "製造部門のセンサーデータを、分析のために品質保証部門と共有する。データの管理と共有の方法として適切でないものはどれか。", "o": ["項目の意味や単位は共有相手が推測できるので、説明を付けずにファイルだけ渡す", "各項目の意味・単位・取得条件を記したデータ辞書（メタデータ）を付けて渡す", "誰がどのデータを使えるかを決め、アクセスの権限を必要な範囲に絞る", "データの版と更新日を記録し、分析に使ったデータを後から特定できるようにする"], "e": "項目の意味や単位、取得条件が分からないと、受け手が誤った解釈で分析してしまう。データ辞書などのメタデータを付け、アクセス権と版を管理して共有する。"},
{"c": 7, "q": "クレジットカードの不正検知AIでは、取引が本当に不正だったかが分かるのは数か月後になる。この間の運用の監視として最も適切なものはどれか。", "o": ["正解が届くまでの間は、入力データと予測スコアの分布の変化を監視する", "正解が届くまでは何も確認できないので、監視は数か月後にまとめて始める", "予測スコアを毎日すべて0に置き換えて、正解との照合ができる形にしておく", "正解が遅れるので、不正の判定は学習データの過去の結果で代用して監視する"], "e": "正解（ラベル）がすぐに得られない場合は、精度を直接測れないので、入力の分布や予測スコアの分布の変化をドリフトの兆候として監視し、正解が届いた時点で精度を確かめる。"},
{"c": 7, "q": "動画配信サービスで、推薦モデルが推薦した作品の視聴データを使って、同じモデルを繰り返し再学習した。起こりやすい問題として最も適切なものはどれか。", "o": ["推薦した作品ばかりが視聴されて学習データになり、推薦の偏りが次第に強まる", "推薦した作品が視聴されなくなり、学習データの件数がゼロに近づいてしまう", "再学習のたびに推薦がランダムになり、利用者ごとの好みが反映されなくなる", "視聴データの形式が変わるので、同じモデルでは再学習ができなくなってしまう"], "e": "モデルの出力が次の学習データを作るフィードバックループでは、推薦された作品のデータばかり集まり、他の作品の良さを学べずに偏りが強まる。一部に探索的な推薦を混ぜる、推薦の影響を考慮して評価するなどの対策をとる。"},
{"c": 7, "q": "開発環境では精度が高かった画像分類モデルが、本番システムに組み込むと精度が大きく下がった。調べると、本番では画像の色の並びがRGBではなくBGRのまま入力されていた。この問題の説明として最も適切なものはどれか。", "o": ["学習時と推論時で前処理が食い違い、学習時と違う形のデータを入力していた", "入力と正解の関係が時間とともに変化する、コンセプトドリフトが起きていた", "モデルが学習データに過剰に適合して、本番の画像に汎化しなかった", "本番の画像が少なすぎたため、推論の結果が統計的に安定しなかった"], "e": "学習時と推論時で前処理の実装が違うと、モデルは想定外の形の入力を受けて性能が落ちる。前処理を学習と推論で共通の部品にし、本番の入力を検査する仕組みで防ぐ。データ自体は変わっていないので、ドリフトや過学習ではない。"},
{"c": 7, "q": "ECサイトで、新しい推薦モデルは過去データでのオフライン評価の指標が既存モデルより良かったが、A/Bテストでは購入率が改善しなかった。考えられる原因として最も適切なものはどれか。", "o": ["オフライン評価の指標が、実際に高めたいビジネス上の指標と一致していなかった", "A/Bテストでは2つのモデルを同時に比べるので、既存モデルの方が常に有利な結果になる", "オフライン評価で良かったモデルは、実際の利用者に使わせる必要はない", "A/Bテストの購入率は、推薦モデルの性能とは無関係に決まる指標である"], "e": "過去データでの予測精度などのオフライン指標は、購入率のようなビジネス指標と必ずしも連動しない。過去データは既存モデルの推薦の影響も受けている。最終判断は、目的の指標を直接測るA/Bテストなどで行う。"},
{"c": 7, "q": "本番で使っているAIの判定に誤りがあり、顧客から問い合わせを受けた。後から原因を調べられるよう、運用中に記録しておくものとして最も適切なものはどれか。", "o": ["各判定の入力データ・出力・日時と、そのとき使っていたモデルの版", "モデルの開発に使ったプログラミング言語の名前と、開発者の人数", "判定を行ったサーバーの設置場所と、その建物の住所", "モデルの学習にかかった電気代と、学習を行った曜日"], "e": "どの版のモデルが、どの入力に対して何を出力したかが記録されていれば、誤りの原因（入力の異常、モデルの版の問題など）を後から追跡でき、説明責任を果たせる。"},
{"c": 7, "q": "AIの導入に向けたPoC（概念実証）の進め方として、適切でないものはどれか。", "o": ["PoCの段階で、本番と同じ規模と品質のシステムを最初から完成させる", "検証する範囲を絞り、少ないデータと期間で実現性と効果を確かめる", "PoCを始める前に、次の段階に進むかを決める評価の基準を決めておく", "現場の実際のデータを使い、運用時の条件に近い形で性能を確かめる"], "e": "PoCは、本格的な開発に投資する前に、小さな範囲で実現性と効果を確かめる段階。最初から本番並みのシステムを作ると、うまくいかなかったときの損失が大きくなり、PoCの意味が薄れる。"});

QUESTIONS.push({"c": 8, "q": "あるECサイトで1000人を調べた。広告を見た200人のうち30人、広告を見なかった800人のうち40人が商品を購入した。広告を見た人が商品を購入する条件付き確率 P(購入｜広告を見た) はどれか。", "o": ["0.15", "0.43", "0.03", "0.07"], "e": "条件付き確率は広告を見た200人を分母にして30/200=0.15となる。0.43は購入者70人を分母にしたP(広告を見た｜購入)、0.03は全体を分母にした同時確率、0.07は全体の購入率である。"},
{"c": 8, "q": "公正なサイコロを1回振る。事象A「偶数の目が出る」と独立な事象はどれか。", "o": ["4以下の目が出る", "3以下の目が出る", "6の目が出る", "1の目が出る"], "e": "「4以下」の確率は2/3で、Aとの積事象{2, 4}の確率1/3がP(A)×2/3=1/3と一致するので独立である。「1の目」はAと同時に起こらない排反な事象で、排反と独立は別の概念である。"},
{"c": 8, "q": "事象AとBは独立で、P(A)=0.4、P(B)=0.5 である。AまたはBの少なくとも一方が起こる確率 P(A∪B) はどれか。", "o": ["0.7", "0.9", "0.2", "0.8"], "e": "P(A∪B)=P(A)+P(B)−P(A∩B)で、独立なのでP(A∩B)=0.4×0.5=0.2となり、0.4+0.5−0.2=0.7である。0.9は重なりを引き忘れた値、0.2は両方が起こる確率である。"},
{"c": 8, "q": "不良率20%の製造ラインから製品を100個取り出したとき、不良品の個数は二項分布に従う。不良品の個数の標準偏差はどれか。", "o": ["4", "16", "20", "0.4"], "e": "二項分布の分散はnp(1−p)=100×0.2×0.8=16で、標準偏差はその平方根の4である。16は分散、20は期待値np、0.4は1個あたりの√(p(1−p))の値である。"},
{"c": 8, "q": "ある試験の得点は平均60点、標準偏差8点の正規分布に従う。76点をとった受験者は、上位およそ何%に位置するか。", "o": ["約2.3%", "約16%", "約5%", "約0.1%"], "e": "z=(76−60)/8=2で、標準正規分布でz>2となる確率は約2.3%である。約16%はz>1の場合、約5%は両側の±2σの外側を合わせた割合である。"},
{"c": 8, "q": "ある部品の長さは平均50mm、標準偏差10mmの正規分布に従う。長さが40mm以上70mm以下となる確率に最も近いものはどれか。", "o": ["約82%", "約68%", "約95%", "約48%"], "e": "標準化すると−1≦z≦2で、平均から−1σまでが約34%、+2σまでが約48%なので合計約82%となる。約68%は±1σ、約95%は±2σの範囲、約48%は0≦z≦2だけの値である。"},
{"c": 8, "q": "2変数のデータ x=(1, 2, 3, 4)、y=(2, 4, 5, 7) の共分散（データ数nで割る）はどれか。", "o": ["2.0", "2.67", "8.0", "0.99"], "e": "偏差の積は3.75, 0.25, 0.25, 3.75で和は8、nで割って2.0となる。2.67はn−1で割った不偏共分散、8.0は偏差積の和のまま、0.99は相関係数である。"},
{"c": 8, "q": "変数xとyの共分散が6、xの標準偏差が2、yの標準偏差が5である。xとyの相関係数はどれか。", "o": ["0.6", "0.06", "1.2", "0.3"], "e": "相関係数は共分散を両者の標準偏差の積で割った6/(2×5)=0.6である。0.06は分散4と25で割った値、1.2はyの標準偏差だけで割った値である。"},
{"c": 8, "q": "互いに独立な確率変数X, Yの分散がそれぞれ4と9のとき、X − Y の分散はどれか。", "o": ["13", "−5", "25", "1"], "e": "独立な変数では和でも差でも分散は足し合わされ、V(X−Y)=V(X)+V(Y)=13となる。−5は分散を引き算した誤りで、分散が負になることはない。25や1は標準偏差2と3を足し引きしてから二乗した値である。"},
{"c": 8, "q": "1本のくじで、1000円が当たる確率が1%、100円が当たる確率が10%、それ以外は外れ（0円）である。このくじの賞金の期待値はどれか。", "o": ["20円", "367円", "110円", "550円"], "e": "期待値は1000×0.01+100×0.1=20円である。367円は3通りの賞金を単純平均した値、550円は当たりの2つの賞金の平均で、確率による重み付けをしていない。"},
{"c": 8, "q": "行列 A = [[3, 1], [4, 2]] の行列式はどれか（[[a, b], [c, d]] は1行目が (a, b)、2行目が (c, d) を表す）。", "o": ["2", "10", "−2", "24"], "e": "2×2行列の行列式はad−bc=3×2−1×4=2である。10はad+bcと足した値、−2はbc−adと引く順を逆にした値である。"},
{"c": 8, "q": "行列 A = [[2, 1], [1, 1]] の逆行列はどれか（[[a, b], [c, d]] は1行目が (a, b)、2行目が (c, d) を表す）。", "o": ["[[1, −1], [−1, 2]]", "[[1, 1], [1, 2]]", "[[2, −1], [−1, 1]]", "[[0.5, 1], [1, 1]]"], "e": "行列式は2×1−1×1=1で、逆行列は(1/1)×[[d, −b], [−c, a]]=[[1, −1], [−1, 2]]となる。[[2, −1], [−1, 1]]は対角成分の入れ替えを忘れた値、[[0.5, 1], [1, 1]]は成分ごとの逆数である。"},
{"c": 8, "q": "確率変数Xの期待値が3、分散が4である。X²の期待値 E[X²] はどれか。", "o": ["13", "9", "7", "5"], "e": "分散はV(X)=E[X²]−(E[X])²なので、E[X²]=V(X)+(E[X])²=4+9=13となる。9は期待値の二乗(E[X])²だけ、5は二乗から分散を引いてしまった値である。"},
{"c": 8, "q": "ベクトル a = (2, −1, 3) と b = (1, 5, k) が直交するとき、kの値はどれか。", "o": ["1", "−1", "3", "7/3"], "e": "直交するのは内積が0のときで、2−5+3k=0よりk=1となる。−1は移項で符号を誤った値、7/3は−1×5の符号を落として2+5=3kとした値である。"},
{"c": 8, "q": "20人のクラスAの平均点は70点、30人のクラスBの平均点は80点である。2クラスを合わせた50人の平均点はどれか。", "o": ["76点", "75点", "74点", "3800点"], "e": "全体の合計点は70×20+80×30=3800点で、50人で割ると76点となる。75点は人数を無視して2つの平均を単純に平均した値、74点は人数の重みをクラス間で取り違えた値である。"},
{"c": 8, "q": "関数 f(w₁, w₂) = w₁² + 2w₂² を、点 (1, 1) から学習率0.1の勾配降下法で1回更新する。更新後の点はどれか。", "o": ["(0.8, 0.6)", "(1.2, 1.4)", "(0.8, 0.8)", "(0.9, 0.8)"], "e": "勾配は(2w₁, 4w₂)=(2, 4)なので、(1, 1)−0.1×(2, 4)=(0.8, 0.6)となる。(1.2, 1.4)は勾配の方向に進めた値、(0.8, 0.8)はw₂の偏微分の係数2を落とした値である。"},
{"c": 8, "q": "2つの変数の平均がともに0、分散がそれぞれ4と1で、変数間の相関は0である。点(4, 1)の平均からのマハラノビス距離に最も近いものはどれか。", "o": ["約2.24", "約4.12", "5", "3"], "e": "相関が0のマハラノビス距離は各成分の二乗を分散で割って足した√(16/4+1/1)=√5≈2.24である。約4.12はばらつきを考慮しないユークリッド距離√17、5は平方根をとる前の値である。"},
{"c": 8, "q": "ソフトマックス関数の出力 y=(y₁, y₂, y₃) について、i≠jのとき ∂yᵢ/∂zⱼ = −yᵢyⱼ、i=jのとき ∂yᵢ/∂zᵢ = yᵢ(1 − yᵢ) が成り立つ。y=(0.5, 0.3, 0.2) のとき、∂y₁/∂z₂ はどれか。", "o": ["−0.15", "0.15", "0.21", "0.25"], "e": "i≠jなので−y₁y₂=−0.5×0.3=−0.15となり、z₂を増やすとy₁は減る。0.21はy₂(1−y₂)、0.25はy₁(1−y₁)で、いずれもi=jの式を使った値である。"},
{"c": 8, "q": "確率1/8で起こる事象が起きたと知ったときに得られる情報量（自己情報量、底2の対数）はどれか。", "o": ["3ビット", "8ビット", "0.125ビット", "0.375ビット"], "e": "自己情報量は−log₂(1/8)=3ビットで、まれな事象ほど大きい。0.375ビットはエントロピーの1項分にあたる−(1/8)log₂(1/8)の値である。"},
{"c": 8, "q": "ある製品の平均重量が50gかどうかを検定する。母標準偏差は10gと分かっており、100個の標本の平均は52gだった。両側検定の判断として最も適切なものはどれか。", "o": ["z=2でp値は約0.046となり、有意水準5%では棄却されるが、有意水準1%では棄却されない", "z=2でp値は約0.046となり、有意水準5%でも1%でも帰無仮説は棄却される", "z=0.2でp値は約0.84となり、有意水準5%でも1%でも帰無仮説は棄却されない", "z=2でp値は約0.023となり、有意水準5%でも1%でも帰無仮説は棄却されない"], "e": "標準誤差は10/√100=1なのでz=(52−50)/1=2、両側のp値は約0.046である。z=0.2は標準誤差ではなく母標準偏差で割った誤り、p値0.023は片側の値である。"},
{"c": 8, "q": "ある工場では製品の60%をラインA、40%をラインBで作っており、不良率はAが2%、Bが5%である。工場全体から無作為に1個選んだとき、それが不良品である確率はどれか。", "o": ["0.032", "0.035", "0.070", "0.625"], "e": "全確率の定理より0.6×0.02+0.4×0.05=0.012+0.020=0.032である。0.035は生産比率を無視した不良率の単純平均、0.625は不良品がラインB製である条件付き確率である。"},
{"c": 8, "q": "サイコロを2個振ったとき、1個目の目が偶数であると分かった。このとき2個の目の和が8である確率はどれか。", "o": ["1/6", "5/36", "1/12", "1/3"], "e": "1個目が偶数の18通りのうち、和が8になるのは(2, 6)(4, 4)(6, 2)の3通りで3/18=1/6となる。5/36は条件なしで和が8になる確率、1/12は36通りを分母にした同時確率である。"},
{"c": 8, "q": "3次元空間の2点 A(1, 0, 2) と B(3, 3, 8) のユークリッド距離はどれか。", "o": ["7", "11", "49", "6"], "e": "差は(2, 3, 6)で、√(4+9+36)=√49=7である。11は差の絶対値を足したマンハッタン距離、49は平方根をとる前の値、6は差の最大値である。"},
{"c": 8, "q": "不良率10%の工程から製品を10個取り出す。少なくとも1個が不良品である確率に最も近いものはどれか。", "o": ["0.65", "1.00", "0.35", "0.39"], "e": "余事象を使い1−0.9¹⁰≈0.65となる。1.00は0.1×10と確率を足し合わせた誤り、0.35は1個も不良がない確率、0.39はちょうど1個が不良である確率である。"},
{"c": 8, "q": "区間 [0, 12] 上の連続一様分布に従う確率変数の分散はどれか。", "o": ["12", "36", "48", "3.46"], "e": "区間[a, b]の一様分布の分散は(b−a)²/12=144/12=12である。36は期待値6の二乗、48は(b−a)²/3、3.46は標準偏差√12の値である。"},
{"c": 8, "q": "表が出る確率pが未知のコインで、1回目の実験では10回中7回、2回目の実験では20回中11回表が出た。すべての結果を使ったpの最尤推定値はどれか。", "o": ["0.600", "0.625", "0.700", "0.550"], "e": "独立な試行30回で表が18回なので、尤度を最大にするpは18/30=0.6である。0.625は2つの実験の割合0.7と0.55を試行回数を無視して単純平均した値である。"},
{"c": 8, "q": "z = x² + y²、x = 2t、y = t + 1 のとき、t = 2 における dz/dt はどれか。", "o": ["22", "16", "6", "25"], "e": "連鎖律よりdz/dt=(∂z/∂x)(dx/dt)+(∂z/∂y)(dy/dt)=2x×2+2y×1で、t=2ではx=4, y=3なので16+6=22となる。16はxを経由する項だけ、6はyを経由する項だけを使った値、25はzの値そのものである。"},
{"c": 8, "q": "部品の外観検査で、帰無仮説を「この部品は良品である」として判定する。第1種の過誤にあたる事例として最も適切なものはどれか。", "o": ["良品の部品を不良品と判定して廃棄してしまう", "不良品の部品を良品と判定して出荷してしまう", "良品の部品を正しく良品と判定して出荷する", "不良品の部品を正しく不良品と判定して廃棄する"], "e": "第1種の過誤は帰無仮説が正しいのに棄却することで、ここでは良品を不良と判定する誤りにあたる。不良品を良品として見逃すのは、帰無仮説が誤りなのに棄却しない第2種の過誤である。"},
{"c": 8, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「対立仮説が正しいのに帰無仮説を棄却できない誤りを（ア）の過誤という。その確率をβとすると、1−βを検定の（イ）と呼ぶ。」", "o": ["（ア）第2種 （イ）検出力", "（ア）第1種 （イ）検出力", "（ア）第2種 （イ）有意水準", "（ア）第1種 （イ）信頼係数"], "e": "対立仮説が正しいのに見逃す誤りが第2種の過誤で、正しく棄却できる確率1−βを検出力という。有意水準は第1種の過誤の確率の上限として事前に決める値である。"},
{"c": 8, "q": "顧客データの次の項目のうち、比例尺度にあたるものはどれか。", "o": ["年間の購入金額（円）", "会員ランク（ブロンズ・シルバー・ゴールド）", "郵便番号", "来店した日の気温（摂氏）"], "e": "購入金額は0が「購入なし」を意味し、2倍などの比にも意味がある比例尺度である。会員ランクは順序尺度、郵便番号は名義尺度、摂氏の気温は間隔尺度にあたる。"},
{"c": 8, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「標本から母分散を推定するときは、偏差の二乗和を（ア）で割った不偏分散を用いる。標本の大きさnで割った標本分散は、平均すると母分散を（イ）見積もる。」", "o": ["（ア）n−1 （イ）小さく", "（ア）n−1 （イ）大きく", "（ア）n＋1 （イ）小さく", "（ア）n＋1 （イ）大きく"], "e": "標本平均は標本自身の中心に来るため、標本平均からの偏差の二乗和は母平均からのものより小さくなりがちで、nで割ると母分散を平均的に小さく見積もる。n−1で割った不偏分散は、その期待値が母分散に一致する。"},
{"c": 8, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「箱ひげ図の箱の中の線は（ア）を表し、箱の長さは（イ）を表す。」", "o": ["（ア）中央値 （イ）四分位範囲", "（ア）平均値 （イ）四分位範囲", "（ア）中央値 （イ）標準偏差", "（ア）最頻値 （イ）範囲"], "e": "箱ひげ図の箱は第1四分位数から第3四分位数までで、その長さが四分位範囲、中の線が中央値である。平均値は記号で別に示すことはあるが、箱の中の線ではない。"},
{"c": 8, "q": "ある健康食品を飲んでいる人ほど健康診断の数値が良いという観察データがあった。この食品に効果があるかを確かめる方法として最も適切なものはどれか。", "o": ["参加者を無作為に2群に分け、一方にだけ食品を与えて数値を比べるランダム化比較試験を行う", "食品を飲んでいる人をさらに多く集め、数値との相関係数がより大きくなるか確かめる", "食品を飲んでいる人の中で、飲む量と数値の相関だけを詳しく調べて効果を判断する", "相関係数が0.7以上であれば因果関係があるとみなし、効果があると結論づける"], "e": "観察データでは、健康意識の高さなどの交絡因子が食品の摂取と数値の両方に影響している可能性がある。無作為に割り付けると交絡因子が両群で均等になり、因果効果を推定できる。"},
{"c": 8, "q": "母平均の点推定と区間推定の違いの説明として最も適切なものはどれか。", "o": ["点推定は標本平均のような1つの値で母平均を推定し、区間推定は信頼係数を定めて母平均を含む範囲を推定する", "点推定は母集団全体を調べて母平均を求め、区間推定は標本の一部だけを使って母平均を求める", "点推定は標本の最小値と最大値を答え、区間推定は標本の中央値を答える", "点推定は必ず母平均と一致する値を与え、区間推定は標本の大きさによらず同じ幅の範囲を与える"], "e": "点推定は1つの推定値を、区間推定は「95%信頼区間」のように幅をもった範囲を与える。点推定の値も標本によってばらつき、母平均と一致する保証はない。"},
{"c": 8, "q": "統計的仮説検定のp値についての記述として誤っているものはどれか。", "o": ["有意でなかった場合、帰無仮説が正しいことが示されたといえる", "p値が有意水準より小さいとき、帰無仮説を棄却する", "p値が小さいことは、効果の大きさが実用上重要であることを意味しない", "標本の大きさが大きいほど、同じ大きさの差でもp値は小さくなりやすい"], "e": "帰無仮説を棄却できないのは、帰無仮説に反する十分な証拠が得られなかったというだけで、帰無仮説が正しいと示されたわけではない。大きな標本ではわずかな差でも有意になるので、効果の大きさは別に評価する。"},
{"c": 8, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「独立な2つの事象が両方起こったときの情報量は、それぞれの情報量の（ア）になる。これは情報量を確率の（イ）で定義しているためである。」", "o": ["（ア）和 （イ）対数", "（ア）積 （イ）対数", "（ア）和 （イ）逆数", "（ア）積 （イ）平方根"], "e": "独立な事象の同時確率は積P(A)P(B)で、情報量−log P は対数によって積を和に変えるので、情報量は足し合わされる。逆数で定義すると積のままで加法性は成り立たない。"},
{"c": 8, "q": "二項分布とポアソン分布の関係の説明として最も適切なものはどれか。", "o": ["試行回数nが大きく成功確率pが小さいとき、二項分布は平均npのポアソン分布で近似できる", "試行回数nが小さく成功確率pが0.5に近いとき、二項分布は平均npのポアソン分布と一致する", "ポアソン分布は連続値をとる分布で、二項分布を連続化したものである", "ポアソン分布の分散は平均の2乗に等しく、二項分布の分散はnpに等しい"], "e": "nが大きくpが小さい二項分布は、平均λ=npのポアソン分布で近似できる。ポアソン分布は0, 1, 2, …の個数をとる離散分布で、分散は平均と等しい。"},
{"c": 8, "q": "身長（cm）と体重（kg）の相関係数が0.7だった。身長の単位をメートルに、体重の単位をグラムに変えて計算し直すと、相関係数はどうなるか。", "o": ["0.7のまま変わらない", "身長が1/100、体重が1000倍になるので70に変わる", "身長が1/100になるので0.007に変わる", "単位が異なる量になるので相関係数は計算できない"], "e": "相関係数は共分散を各変数の標準偏差で割った無次元の量で、正の定数倍の単位変換では変わらない。共分散は単位変換の影響を受けるが、標準偏差で割ることで打ち消される。"},
{"c": 8, "q": "分散と標準偏差についての記述として誤っているものはどれか。", "o": ["すべてのデータに10を足すと、分散も10増える", "すべてのデータを2倍にすると、標準偏差も2倍になる", "すべてのデータが同じ値のとき、分散は0になる", "標準偏差は元のデータと同じ単位で表される"], "e": "定数を足すと平均も同じだけずれ、平均からの偏差は変わらないので分散は変わらない。データをa倍すると分散はa²倍、標準偏差は|a|倍になる。"},
{"c": 8, "q": "大規模な会員名簿から満足度を調査したい。「母集団」と「標本」の関係として最も適切な事例はどれか。", "o": ["会員10万人全体が母集団で、そこから無作為に選んで回答を得た1000人が標本である", "回答を得た1000人が母集団で、会員10万人全体がその標本である", "会員10万人全体が標本で、そのうち満足と答えた人の集まりが母集団である", "無作為に選んだ1000人のうち、回答しなかった人の集まりが母集団である"], "e": "調べたい対象全体が母集団、そこから抽出して実際に観測した一部が標本である。標本から計算した統計量を用いて、母集団の平均や割合などを推定する。"});

QUESTIONS.push({"c": 9, "q": "健康管理アプリを運営する会社が、利用者から次の情報を取得しようとしている。個人情報保護法の「要配慮個人情報」に当たり、取得に原則として本人の同意が必要となるものはどれか。", "o": ["健康診断の結果", "本籍地の都道府県", "最終学歴と卒業年", "前年の年収の金額"], "e": "要配慮個人情報には、人種・信条・社会的身分・病歴・犯罪の経歴などのほか、政令で定める健康診断等の結果も含まれる。本籍地・学歴・年収は、法律や政令で要配慮個人情報として列挙されていない（いずれも個人情報には当たり得る）。"},
{"c": 9, "q": "要配慮個人情報や財産的被害のおそれのある情報を含まず、不正の目的によるものでもない次の個人データの漏えいのうち、人数の多さを理由として個人情報保護委員会への報告が義務となるものはどれか。", "o": ["メールの宛先設定の誤りで、1,200人分の氏名とメールアドレスが外部の第三者に送られた", "メールの宛先設定の誤りで、800人分の氏名と住所が外部の第三者に送られた", "営業担当者が、100人分の氏名と電話番号を記した名簿を社外で紛失した", "委託先の担当者が、50人分の氏名と会員番号を記した帳票を誤って廃棄した"], "e": "要配慮個人情報、財産的被害のおそれ、不正の目的によるおそれのいずれにも当たらない場合、漏えい等した本人の数が1,000人を超えると報告義務の対象になる。800人以下などの事態は報告義務の対象外だが、安全管理措置の見直しなどは必要。"},
{"c": 9, "q": "外部からの不正アクセスで、会員の個人データが漏えいしたおそれが判明した。個人情報保護委員会への報告について、次の文の（ア）（イ）に入る語句の組み合わせとして最も適切なものはどれか。\n「事態を知った後、（ア）速報を行い、原則として事態を知った日から（イ）以内に確報を行う」", "o": ["（ア）速やかに （イ）60日", "（ア）速やかに （イ）30日", "（ア）1年以内に （イ）60日", "（ア）72時間以内に （イ）1年"], "e": "漏えい等の報告は、知った後速やかに行う速報（ガイドラインでは概ね3〜5日以内）と、原則30日以内の確報の2段階で、不正アクセスなど不正の目的によるおそれがある事態の確報は60日以内とされる。72時間はGDPRの監督機関への通知期限。"},
{"c": 9, "q": "グループ会社3社が、各社の顧客データを持ち寄ってAIで共同分析し、各社のサービス改善に使いたい。個人情報保護法の「共同利用」として本人の同意なく行う場合に必要な対応として最も適切なものはどれか。", "o": ["共同利用する旨や項目、共同利用者の範囲、利用目的、責任者の名称等を、あらかじめ本人に通知するか容易に知り得る状態に置く", "共同利用するデータの項目と件数を、個人情報保護委員会に事前に届け出て、受理の通知を受けてから共同利用を始める", "グループ会社であれば当然に共同利用が認められるので、特に本人への通知や公表をすることなく、データを持ち寄ってよい", "共同利用の開始から1年以内に、データの項目と共同利用した会社名を自社のWebサイトで公表すれば、事前の手続は要らない"], "e": "共同利用は、所定の事項をあらかじめ本人に通知するか本人が容易に知り得る状態に置くことで、第三者提供に当たらないものとして扱われる。委員会への届出が必要なのはオプトアウトによる第三者提供で、共同利用ではない。グループ会社というだけで当然に認められるわけではない。"},
{"c": 9, "q": "A社がB社を吸収合併し、B社が保有していた顧客の個人データをA社が引き継ぐ。A社がこのデータをAI分析に使う場合の個人情報保護法上の扱いとして最も適切なものはどれか。", "o": ["承継は第三者提供に当たらないが、承継前の利用目的の範囲を超えて使うには本人の同意が必要になる", "合併による承継は第三者提供に当たるため、引き継ぐ前にB社の顧客全員から個別に同意を得なければならない", "合併で引き継いだデータはA社が新たに取得した情報となるので、A社の利用目的に自由に含めて使ってよい", "合併で引き継いだデータは匿名加工情報とみなされるので、個人情報保護法の利用目的の制限は受けない"], "e": "合併その他の事由による事業の承継に伴う提供は、第三者提供に当たらない。ただし承継した事業者は、承継前の利用目的の達成に必要な範囲内で取り扱う必要があり、それを超える場合はあらかじめ本人の同意を得る。"},
{"c": 9, "q": "社員が、業務で扱う顧客の個人データを含む文章を、外部の生成AIサービスに入力して要約させようとしている。個人情報保護委員会が2023年6月に示した注意喚起の内容に照らして最も適切なものはどれか。", "o": ["利用目的の範囲内か確認し、入力データが応答の出力以外（学習など）に使われないかも確認する", "生成AIへの入力は第三者提供にも委託にも当たらないため、個人データを含んでいても利用目的や規約の確認は一切要らない", "要約させる目的であれば、個人データを含む文章をどの生成AIサービスに入力しても、本人の同意を得る必要は一切ない", "個人データを含むプロンプトを入力するには、入力のたびに個人情報保護委員会に届け出て、その受理を待つ必要がある"], "e": "注意喚起は、個人情報を含むプロンプトを入力する場合は特定された利用目的の達成に必要な範囲内であることを十分確認すること、本人の同意なく個人データを入力し、それが応答結果の出力以外の目的で取り扱われる場合は法違反となる可能性があることを示した。"},
{"c": 9, "q": "日本の事業者が、海外に設置されたサーバーで運用されるクラウドサービスに顧客の個人データを保存する。契約で、クラウド事業者は保存された個人データを取り扱わないと定め、適切にアクセス制御も行っている。個人情報保護委員会の考え方として最も適切なものはどれか。", "o": ["「提供」には当たらないが、安全管理措置として、サーバーのある国の制度などの外的環境を把握する", "外国にある第三者への提供に当たるので、保存する前にすべての顧客から外国への提供について個別の同意を得なければならない", "海外のサーバーに保存した時点で個人データではなくなるため、自社の安全管理措置や本人からの開示請求の対象から外れる", "クラウド事業者への委託に当たるので、クラウド事業者が保存された個人データを自由に分析してよいことになる"], "e": "クラウド事業者が個人データを取り扱わないこととなっている場合は「提供」に当たらず、外国にある第三者への提供の規制はかからない。ただし事業者自身が安全管理措置を講じる必要があり、外国で個人データを取り扱う場合はその国の制度を把握すること（外的環境の把握）が求められる。"},
{"c": 9, "q": "会員制サービスの利用者が、事業者の保有する自分の保有個人データの開示を請求し、データをCSVファイルで受け取りたいと求めた。個人情報保護法上の扱いとして最も適切なものはどれか。", "o": ["本人は電磁的記録の提供など開示の方法を指示でき、事業者は原則としてその方法で開示する", "開示は書面の交付に限られるため、電子ファイルでの提供を求められても書面で交付すればよい", "開示請求に応じるかどうかは事業者の任意なので、電子ファイルでの開示を求められても断ってよい", "電磁的記録で開示するには、本人が個人情報保護委員会の許可を得て事業者に提出する必要がある"], "e": "2020年改正（2022年施行）により、本人は電磁的記録の提供を含め開示方法を指示できるようになった。事業者は、その方法による開示が多額の費用を要するなど困難な場合を除き、指示された方法で開示する。"},
{"c": 9, "q": "データ分析会社が、他社から匿名加工情報の提供を受けた。この匿名加工情報を自社が持つ別のデータベースと照合し、元の本人を特定しようとすることについて、個人情報保護法上の扱いとして最も適切なものはどれか。", "o": ["匿名加工情報の受領者は、本人を識別するために他の情報と照合することが禁止されている", "照合によって本人を特定できた場合は、本人に通知すれば個人情報として利用してよい", "提供元の事業者の同意を得れば、照合して本人を特定し、個人データとして利用してよい", "照合は自社内の分析に限られるなら、本人を特定しても個人情報保護法上の問題はない"], "e": "匿名加工情報を取り扱う事業者は、本人を識別するために、加工の方法に関する情報を取得したり、他の情報と照合したりしてはならない（識別行為の禁止）。本人への通知や提供元の同意があっても許されない。"},
{"c": 9, "q": "個人情報保護法の「個人情報」の定義について、次の文の（ア）（イ）に入る語句の組み合わせとして最も適切なものはどれか。\n「（ア）個人に関する情報であって、氏名や生年月日などにより特定の個人を識別できるもの（他の情報と容易に照合でき、それにより特定の個人を識別できるものを含む）、または（イ）が含まれるもの」", "o": ["（ア）生存する （イ）個人識別符号", "（ア）生存する （イ）要配慮個人情報", "（ア）生存しているか死亡しているかを問わず （イ）個人識別符号", "（ア）日本国籍を持つ （イ）個人識別符号"], "e": "個人情報は生存する個人に関する情報で、氏名などで特定の個人を識別できるもの（容易照合性があるものを含む）か、顔認証データやマイナンバーなどの個人識別符号を含むものをいう。死者の情報は原則として対象外で、国籍は問わない。要配慮個人情報は、個人情報のうち取扱いに特に配慮を要するものの区分である。"},
{"c": 9, "q": "社内で個人情報である仮名加工情報を作成し、需要予測AIの学習に使っている。この仮名加工情報について、個人情報保護法上の扱いとして最も適切なものはどれか。", "o": ["本人から開示や利用停止を請求されても、仮名加工情報については開示等の請求への対応義務の規定が適用されない", "本人から開示を請求されたら、仮名加工情報と削除情報を照合して本人を特定し、元の個人情報ごと開示しなければならない", "仮名加工情報の漏えいが起きたら、人数にかかわらず必ず個人情報保護委員会に報告し、本人にも通知しなければならない", "仮名加工情報は作成後も利用目的を変更できないので、需要予測以外の分析に使うには新たに本人の同意が必要になる"], "e": "個人情報である仮名加工情報には、開示・訂正・利用停止等の請求に関する規定や、漏えい等の報告・本人通知の規定が適用されない。利用目的は、変更前と関連性があると認められる範囲を超えて変更することもできる（変更後の目的の公表は必要）。"},
{"c": 9, "q": "ある事業者が、官報に掲載された破産者の氏名と住所を集め、地図上に表示してインターネットで誰でも閲覧できるようにした。利用目的はサイト上にあらかじめ公表している。個人情報保護法上、主に問題となる規定として最も適切なものはどれか。", "o": ["違法・不当な行為を助長・誘発するおそれがある方法による利用を禁じる、不適正な利用の禁止", "個人情報を取得した時点で、利用目的を本人に通知または公表することを求める、利用目的の通知義務", "保有個人データの開示請求に対し、電磁的記録で開示することを求める、開示方法の指示への対応", "外国にある第三者に個人データを提供する際に、本人に情報を提供することを求める、越境移転の規律"], "e": "2020年改正で設けられた不適正利用の禁止（第19条）は、違法または不当な行為を助長し、または誘発するおそれがある方法による個人情報の利用を禁じる。破産者の情報を地図上で公開し、差別などを誘発するおそれがある事例は、個人情報保護委員会のガイドラインでも該当例に挙げられている。"},
{"c": 9, "q": "通販会社が「商品の発送」を利用目的として取得した顧客の住所・購買履歴を、新たにAIで分析し、提携先の旅行会社の広告を配信する目的にも使いたい。個人情報保護法上の対応として最も適切なものはどれか。", "o": ["変更前の目的と関連性があると合理的に認められる範囲を超えるため、あらかじめ本人の同意を得る", "利用目的はいつでも自由に変更できるので、変更後の目的を自社のWebサイトで公表すれば足りる", "社内でのAI分析は利用目的の制限を受けないので、本人への通知や同意なしにそのまま使ってよい", "購買履歴は個人情報に当たらないので、利用目的の特定や変更の手続を考える必要はない"], "e": "利用目的の変更は、変更前の目的と関連性を有すると合理的に認められる範囲に限られ、それを超えて利用する場合は、あらかじめ本人の同意を得る必要がある（第17条2項、第18条1項）。関連性の範囲内の変更なら、変更後の目的を本人に通知または公表すればよい。"},
{"c": 9, "q": "ある会社の人事部は、社員番号と勤怠記録だけのデータをAIによる残業予測に使っている。同じ人事部には社員番号と氏名の対応表があり、担当者は通常の業務で両方にアクセスできる。この勤怠データの個人情報保護法上の扱いとして最も適切なものはどれか。", "o": ["社内の他の情報と容易に照合して特定の個人を識別できるため、個人情報に当たる", "氏名を含まないデータなので、社内に対応表があっても個人情報には当たらない", "社員番号は個人識別符号に当たるので、勤怠データは要配慮個人情報として扱う", "氏名を削除した時点で匿名加工情報になるので、本人の同意なく第三者に提供できる"], "e": "個人情報には、他の情報と容易に照合でき、それによって特定の個人を識別できるもの（容易照合性）も含まれる。社員番号は法令で定める個人識別符号には当たらない。氏名を削除しただけでは匿名加工情報の基準を満たさない。"},
{"c": 9, "q": "EU域内の顧客データを扱う企業（前事業年度の全世界年間売上高3億ユーロ）が、GDPR第83条5項の対象となる違反（処理の基本原則への違反など）をした。この違反に科され得る制裁金の上限額として正しいものはどれか。", "o": ["2,000万ユーロ", "1,200万ユーロ", "600万ユーロ", "1,000万ユーロ"], "e": "第83条5項の上限は「2,000万ユーロ」と「全世界年間売上高の4%」のいずれか高い方。売上高の4%は1,200万ユーロなので、高い方の2,000万ユーロが上限になる。1,000万ユーロ・2%は、管理者の義務違反などを対象とする第83条4項の水準。"},
{"c": 9, "q": "EU域内の利用者を持つ日本のSaaS事業者が、不正アクセスによって利用者の個人データが漏えいしたことに気づいた。自然人の権利に対するリスクが生じないとはいえない場合、GDPR上の監督機関への通知として最も適切なものはどれか。", "o": ["不当に遅滞することなく、可能であれば漏えいに気づいてから72時間以内に通知する", "漏えいの原因と被害の全容を調べ終えてから、気づいた日から30日以内に通知する", "漏えいした人数が1,000人を超える場合に限り、気づいてから60日以内に通知する", "本人への通知を済ませたなら、監督機関への通知は事業年度末の報告でまとめて行う"], "e": "GDPR第33条は、リスクが生じる可能性が低い場合を除き、不当な遅滞なく、可能であれば漏えいに気づいてから72時間以内に監督機関へ通知することを求める。「1,000人を超える」「30日・60日」は日本の個人情報保護法の漏えい等報告で用いられる基準に近く、GDPRの規定ではない。"},
{"c": 9, "q": "EU域内の利用者の行動履歴をAIで網羅的に分析し、その結果に基づいて保険の引受けの可否を自動で決める仕組みを新しく導入する。GDPR上、導入前に行うべき対応として最も適切なものはどれか。", "o": ["高リスクの処理として、データ保護影響評価（DPIA）を実施する", "十分性認定を欧州委員会に申請し、自社のシステムについて認定を受ける", "データポータビリティの権利に基づき、利用者の個人データを他社へ移転しておく", "取得した行動履歴を仮名化すれば個人データでなくなるので、GDPRの手続は要らない"], "e": "第35条は、自動処理（プロファイリングを含む）に基づく体系的・広範な評価で、法的効果や同様の重大な影響を生む決定を行う場合など、高リスクの処理にDPIAを求める。十分性認定は国・地域に対する欧州委員会の決定で、企業が申請するものではない。仮名化したデータも個人データのまま扱われる。"},
{"c": 9, "q": "日本の個人情報保護法の「仮名加工情報」と、GDPRの「仮名化（pseudonymisation）」されたデータの扱いの比較として最も適切なものはどれか。", "o": ["GDPRでは、追加の情報で個人に結び付けられる仮名化データは、なお個人データとして扱われる", "GDPRでは、仮名化したデータは匿名データと同じ扱いになり、規則の適用対象から外れる", "日本の仮名加工情報は、作成すれば本人の同意なく自由に第三者へ提供できる情報とされる", "日本の仮名加工情報は、作成した時点で個人情報に当たらない情報として一律に扱われる"], "e": "GDPR前文26項は、追加情報によって自然人に帰属させ得る仮名化データを識別可能な人の情報とし、個人データとして扱う（匿名情報は対象外）。日本の仮名加工情報も、作成元では通常個人情報に当たり、第三者提供は原則禁止されている。"},
{"c": 9, "q": "EU域内で事業を行う企業が、次のAIシステムを導入しようとしている。EU AI法（規則(EU) 2024/1689）の第5条で禁止されるAIの利用に当たるものはどれか。", "o": ["オフィスのカメラ映像から従業員の感情を推定し、勤務評価の参考にするシステム", "問い合わせに自動で答えるチャットボットで、AIであることを利用者に表示するもの", "工場のカメラ画像から製品のキズを検出し、不良品を自動で取り除く検査システム", "過去の販売実績から翌月の商品の需要を予測し、在庫の発注量を提案するシステム"], "e": "第5条1項(f)は、医療・安全上の理由を除き、職場と教育機関で人の感情を推定するAIの利用を禁止している。AIであることを表示するチャットボットは第50条の透明性義務を守っている例で、外観検査や需要予測は禁止対象ではない。"},
{"c": 9, "q": "人材会社が、応募書類を分析して候補者を絞り込み、評価点を付けるAIをEU域内で提供しようとしている。EU AI法でのこのAIの位置づけとして最も適切なものはどれか。", "o": ["附属書IIIの雇用分野の高リスクAIとして、リスク管理などの要件を満たす必要がある", "人の採否に関わるため第5条の禁止されるAIに当たり、EU域内では提供そのものができない", "最終的な採否は人が決めるので最小リスクのAIに当たり、法的な義務は一切課されない", "汎用目的AIモデルに当たるので、学習データの概要を公表すれば他の義務は課されない"], "e": "附属書III第4号は、応募の分析・選別や候補者の評価に使うAIを雇用分野の高リスクAIとしている。高リスクAIの提供者にはリスク管理、データガバナンス、記録、人による監督などの要件が課される。採用AIは禁止対象ではなく、汎用目的AIモデルの規律とも別枠。"},
{"c": 9, "q": "EU AI法第50条の透明性義務の説明として最も適切なものはどれか。", "o": ["対話するAIはAIであることを知らせ、ディープフェイクを公開する導入者は生成・操作された旨を開示する", "すべてのAIシステムの提供者は、学習に使ったデータセットの全体を公開し、誰でも内容を検証できるようにしなければならない", "AIが生成したコンテンツは、人が編集したかどうかにかかわらず、EU域内での公開そのものが禁止される", "人と直接やり取りするAIは、利用のたびに監督機関へ事前に届け出て、承認を受けてから稼働させなければならない"], "e": "第50条は、チャットボットのように人と直接やり取りするAIの提供者に、AIであることを知らせる義務を課し、ディープフェイクを公開する導入者（deployer）には人工的に生成・操作されたことの開示を求める。学習データ全体の公開や、生成物の公開禁止、利用ごとの事前承認は求めていない。"},
{"c": 9, "q": "前事業年度の全世界年間売上高が10億ユーロの企業が、EU AI法第5条で禁止されたAIの利用をしたとする。第99条に基づく制裁金の上限額として正しいものはどれか。", "o": ["7,000万ユーロ", "3,500万ユーロ", "4,000万ユーロ", "3,000万ユーロ"], "e": "禁止されたAIの利用には「3,500万ユーロ」と「全世界年間売上高の7%」のいずれか高い方が上限となる。売上高の7%は7,000万ユーロで3,500万ユーロより高い。4,000万ユーロはGDPRの4%、3,000万ユーロはAI法のその他の義務違反の3%で計算した値。"},
{"c": 9, "q": "EU AI法（規則(EU) 2024/1689）の規定が適用され始めた順序として最も適切なものはどれか。", "o": ["法の発効 → 禁止されるAIの規定 → 汎用目的AIモデルの規定 → 附属書IIIの高リスクAIの規定", "法の発効 → 汎用目的AIモデルの規定 → 附属書IIIの高リスクAIの規定 → 禁止されるAIの規定", "禁止されるAIの規定 → 法の発効 → 附属書IIIの高リスクAIの規定 → 汎用目的AIモデルの規定", "法の発効 → 附属書IIIの高リスクAIの規定 → 禁止されるAIの規定 → 汎用目的AIモデルの規定"], "e": "2024年8月1日に発効し、禁止規定は2025年2月2日、汎用目的AIモデルの規定は2025年8月2日から適用された。附属書IIIの高リスクAIの規定は、2026年のDigital Omnibus（規則(EU) 2026/1744）で2027年12月2日からの適用に延期された。"},
{"c": 9, "q": "欧州評議会が2024年5月に採択し、同年9月に署名のため開放された「AIと人権、民主主義及び法の支配に関する枠組条約」の説明として最も適切なものはどれか。", "o": ["AIに関する初の法的拘束力のある国際条約で、日本も2025年2月に署名した", "EU加盟国だけが参加でき、AI法の高リスクAIの要件を条約として定めたものである", "法的拘束力のない政治宣言で、署名国にAIの安全性評価の報告を任意で求めるものである", "G7の首脳が合意した行動規範で、高度なAIを開発する組織が自主的に守るものである"], "e": "欧州評議会はEUとは別の国際機関で、この枠組条約は加盟国以外にも開かれた、AIに関する初の法的拘束力のある国際条約とされる。日本は2025年2月11日に署名した。G7首脳が合意した自主的な規範は広島AIプロセスの国際行動規範。"},
{"c": 9, "q": "著作権法第2条1項1号の著作物の定義について、次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。\n「（ア）を（イ）に表現したものであつて、文芸、学術、美術又は音楽の範囲に属するもの」", "o": ["（ア）思想又は感情 （イ）創作的", "（ア）技術的思想 （イ）具体的", "（ア）事実又はデータ （イ）独創的", "（ア）思想又は感情 （イ）新規"], "e": "著作物は「思想又は感情を創作的に表現したもの」と定義され、単なる事実やデータ、表現に至らないアイデアは保護されない。「技術的思想の創作」は特許法の発明の定義に使われる語で、新規性も著作物の要件ではない。"},
{"c": 9, "q": "ある利用者が、人気漫画家の絵柄の特徴（線の太さや色づかいなどの画風）をまねるよう画像生成AIに指示して、オリジナルのキャラクターの画像を作った。生成物には、その漫画家の特定の作品の創作的表現との類似は見られない。文化庁「AIと著作権に関する考え方について」に照らした評価として最も適切なものはどれか。", "o": ["作風や画風はアイデアにとどまり、既存の著作物との類似性がなければ著作権侵害にならない", "画風が似ている以上、その漫画家のすべての作品について類似性があるとされ、著作権侵害になる", "画像生成AIを使った時点で依拠性と類似性が推定されるため、生成物の内容にかかわらず著作権侵害になる", "画風は著作者人格権の同一性保持権で保護されるため、漫画家の同意がなければ生成できない"], "e": "文化庁の考え方では、作風や画風といったアイデア等が類似するにとどまり、既存の著作物の創作的表現との類似性が認められない生成物は著作権侵害とならないと整理されている。侵害には類似性と依拠性の両方が必要。"},
{"c": 9, "q": "AI開発会社が、Webから集めた写真を画像認識モデルの学習のために複製した（第30条の4の範囲内とする）。その後、同じ写真の一部を、自社サイトの「学習データの紹介」ページにそのまま掲載して誰でも見られるようにした。著作権法上の評価として最も適切なものはどれか。", "o": ["学習のための複製は許諾なく行えても、写真をそのまま公開して見せる行為は享受に当たるため、原則として許諾が必要になる", "学習に使った写真は第30条の4によって自由利用が認められるため、その後に自社サイトで公開しても許諾は要らない", "学習のための複製の時点で著作権侵害となるため、公開するかどうかにかかわらず学習そのものが違法になる", "Webで公開されていた写真はすでに公表された著作物なので、誰でも自由に複製・公開してよいことになる"], "e": "第30条の4は、著作物に表現された思想又は感情を自ら享受し又は他人に享受させることを目的としない利用を認める規定。写真をそのまま公開して閲覧させるのは享受目的の利用なので、引用などの他の制限規定に当たらない限り許諾が必要。公表された著作物であることは自由利用の根拠にならない。"},
{"c": 9, "q": "AIの解説記事で、他人が公表した画像生成AIの出力例（著作物とする）を掲載して、その問題点を論評したい。著作権法第32条の「引用」として許諾なく掲載するための考え方として最も適切なものはどれか。", "o": ["公正な慣行に合致し、論評の目的上正当な範囲内で行い、自分の文章と区別して出所を明示する", "記事に広告を載せずに無料で公開するなら、目的や分量にかかわらず引用として掲載してよい", "出所さえ明示すれば、論評がほとんどなく出力例の掲載が記事の中心でも引用として認められる", "画像を少しだけ加工して元の画像と見分けにくくすれば、引用の要件を満たしたことになる"], "e": "第32条は、公正な慣行に合致し、報道・批評・研究その他の引用の目的上正当な範囲内で行われる引用を認め、第48条は出所の明示を求める。自分の文章が主で引用部分が従となる関係や、引用部分を明瞭に区別することも重要とされる。無償かどうかだけで決まるものではない。"},
{"c": 9, "q": "日本の知的財産権の存続期間の組み合わせとして正しいものはどれか。", "o": ["著作権：原則著作者の死後70年　特許権：出願日から20年　意匠権：出願日から25年", "著作権：原則著作者の死後50年　特許権：登録日から20年　意匠権：出願日から20年", "著作権：原則公表から70年　特許権：出願日から25年　意匠権：登録日から15年", "著作権：原則著作者の死後70年　特許権：出願日から10年　意匠権：登録日から10年"], "e": "著作権は原則として著作者の死後70年（2018年に50年から延長）、特許権は出願日から20年、意匠権は2020年施行の改正で出願日から25年となった。商標権は設定登録から10年で、更新により延長できる点が他と異なる。"},
{"c": 9, "q": "あるロボットメーカーが、新製品について次の4つを保護したい。対応する権利の組み合わせとして最も適切なものはどれか。\n①新しい障害物回避の制御方法 ②製品の特徴的な外観のデザイン ③製品名のロゴマーク ④取扱説明書の文章", "o": ["①特許権 ②意匠権 ③商標権 ④著作権", "①意匠権 ②特許権 ③著作権 ④商標権", "①特許権 ②商標権 ③意匠権 ④著作権", "①著作権 ②意匠権 ③商標権 ④特許権"], "e": "技術的思想の創作である制御方法は特許、物品の形状などのデザインは意匠、商品やサービスの目印となるロゴは商標、思想・感情を創作的に表現した文章は著作権で保護される。特許・意匠・商標は出願・登録が必要だが、著作権は創作と同時に発生する（無方式主義）。"},
{"c": 9, "q": "大学の研究者が、新しい画像認識の学習手法を学会で発表した。その後、この手法について特許を取りたいと考えた。日本の特許法上の扱いとして最も適切なものはどれか。", "o": ["公開日から1年以内に新規性喪失の例外の手続をとって出願すれば、新規性を失わなかったものとみなされる", "学会での発表は公開に当たらないため、発表から何年経っていても新規性は失われず、いつでも特許出願できる", "一度でも学会で発表した発明は、どのような手続をとっても新規性がないとされ、特許を受けることはできない", "学会発表の内容は著作権で保護されるので、特許を受けるには発表論文の著作権を放棄する必要がある"], "e": "特許法第30条の新規性喪失の例外により、自らの行為で公開した発明でも、公開日から1年以内に所定の手続をとって出願すれば新規性を失わなかったものとみなされる（2018年改正で6か月から1年に延長）。ただし、その間に他者が同じ発明を先に出願するリスクは残る。"},
{"c": 9, "q": "A社とB社が、それぞれ独自に同じ内容の画像圧縮の発明を完成させた。A社が先に発明を完成させたが、特許出願はB社の方が1か月早かった。日本の特許法上、特許を受けることができるのはどれか。", "o": ["先に出願したB社", "先に発明を完成させたA社", "A社とB社の共有", "どちらも受けることができない"], "e": "日本は先願主義を採用しており、同じ発明について異なる日に出願があった場合は、最先の出願人だけが特許を受けられる（特許法第39条）。同じ日の出願の場合は協議で定め、協議が成立しなければどちらも特許を受けられない。"},
{"c": 9, "q": "食品メーカーが、AIで最適化した発酵条件のノウハウを競合から守りたい。このノウハウは製品を分析しても他社には分からない。特許出願と営業秘密としての管理を比べた説明として最も適切なものはどれか。", "o": ["特許は出願内容が公開される代わりに期間限定の独占権が得られ、営業秘密は公開せず管理を続ける限り期間の制限なく保護され得る", "特許は出願内容が公開されず、営業秘密は不正競争防止法に基づいて登録した時点から20年間だけ保護される", "営業秘密として管理すれば、他社が同じノウハウを独自に開発しても、その利用を差し止めることができる", "特許を取得すると、同時に営業秘密としても保護されるため、出願内容を秘密に保ったまま独占権が得られる"], "e": "特許は発明を公開する代償として出願から20年の独占権を与える。営業秘密は登録制度がなく、秘密管理性・有用性・非公知性を満たす限り保護され得るが、他社が独自に開発した場合には権利を主張できない。製品から読み取れないノウハウは秘匿を選ぶ企業も多い。"},
{"c": 9, "q": "ある会社は、AIの学習用に整備した顧客分析データを、社内の共有フォルダに「社外秘」などの表示をせずに置き、全社員がパスワードなしで閲覧・コピーできる状態にしていた。退職者がこのデータを持ち出した場合、不正競争防止法の営業秘密として保護を受ける上で、最も問題になりやすい要件はどれか。", "o": ["秘密管理性", "有用性", "非公知性", "相当蓄積性"], "e": "営業秘密の要件は秘密管理性・有用性・非公知性の3つで、秘密であることの表示もアクセス制限もない状態では、秘密として管理されていることを従業員が認識できず、秘密管理性が否定されやすい。相当蓄積性は限定提供データの要件。"},
{"c": 9, "q": "データ販売会社が、全国の気象観測値を加工した大量のデータを、ID・パスワードで認証した契約者だけにAPIで有料提供している。データは秘密として管理していない。このデータが不正に取得された場合に、不正競争防止法での保護の根拠として最も適切なものはどれか。", "o": ["ID等で管理し相当量蓄積して特定の者に提供するデータとして、限定提供データに当たり得る", "秘密として管理されていないが、有用な情報なので営業秘密として保護され得る", "著作物に当たるデータなので、不正競争防止法ではなく著作権法だけで保護される", "契約者が多いため公知の情報とみなされ、不正競争防止法による保護はまったく受けられない"], "e": "限定提供データは、業として特定の者に提供する情報として、電磁的方法で相当量蓄積・管理されている技術上または営業上の情報（営業秘密を除く）。秘密管理されていないデータでもID・パスワードなどで管理されていれば対象となり得る。ただし、無償で公衆に利用可能なオープンデータと同一のものは適用除外となる。"},
{"c": 9, "q": "同じ地域で競合する複数の小売チェーンが話し合い、同じ価格設定AIを共同で導入して、互いの販売価格を同じ水準にそろえ、値下げ競争を避けることにした。独占禁止法上、最も問題となる行為類型はどれか。", "o": ["不当な取引制限（カルテル）", "優越的地位の濫用", "私的独占", "不公正な取引方法のうち抱き合わせ販売"], "e": "事業者が他の事業者と共同して対価を決定・維持し、一定の取引分野の競争を実質的に制限することは不当な取引制限（第2条6項）に当たる。価格の決定にAIやアルゴリズムを使っても、共同して価格をそろえる合意があればカルテルとして問題になる。"},
{"c": 9, "q": "スマートフォンのOS、アプリストア、ブラウザ、検索エンジンを提供する指定事業者に対し、他社のアプリストアの提供を妨げることなどを禁止する日本の法律で、2024年6月に成立し、2025年12月に全面施行されたものはどれか。", "o": ["スマートフォンにおいて利用される特定ソフトウェアに係る競争の促進に関する法律", "特定デジタルプラットフォームの透明性及び公正性の向上に関する法律", "人工知能関連技術の研究開発及び活用の推進に関する法律", "特定電子メールの送信の適正化等に関する法律"], "e": "いわゆるスマホソフトウェア競争促進法は、公正取引委員会が指定した大規模な事業者に、禁止事項と遵守事項を定めて競争を促す。特定デジタルプラットフォーム取引透明化法は2021年2月施行で、オンラインモールなどの取引条件の開示などを求める別の法律。"},
{"c": 9, "q": "AIを搭載した家庭用ロボットの欠陥で利用者がけがをし、メーカーが製造物責任法（PL法）に基づく損害賠償を請求された。メーカーが責任を免れるための主張（免責事由）として、同法に定められているものはどれか。", "o": ["引き渡した時点の科学・技術の知見では、欠陥があることを認識できなかったこと", "欠陥の原因となったソフトウェアの不具合は、社内の誰にも過失がなかったこと", "ロボットの販売価格が安く、利用者も一定の危険を承知で購入していたこと", "ロボットの判断はAIが自律的に行ったもので、メーカーは判断に関与していないこと"], "e": "PL法第4条1号の開発危険の抗弁は、引き渡した時の科学・技術の知見では欠陥を認識できなかったことを証明すれば免責されるとする。PL法は過失ではなく欠陥を要件とする責任なので、過失がないことだけでは免責されない。AIの自律的な判断も、製造物の欠陥の評価に含まれる。"},
{"c": 9, "q": "製造物責任法（PL法）に基づく損害賠償請求権の期間の制限について、次の文の（ア）（イ）に入る語の組み合わせとして正しいものはどれか。\n「被害者が損害と賠償義務者を知った時から（ア）（人の生命・身体の侵害の場合は5年間）行使しないとき、または製造業者等が製造物を引き渡した時から（イ）を経過したときは、時効によって消滅する」", "o": ["（ア）3年間 （イ）10年", "（ア）1年間 （イ）5年", "（ア）3年間 （イ）20年", "（ア）5年間 （イ）10年"], "e": "PL法第5条により、知った時から3年間（生命・身体の侵害は5年間）、引き渡した時から10年で請求権は消滅する。身体に蓄積して健康を害する物質による損害など、一定期間を経過してから症状が現れる損害は、損害が生じた時から起算される。"},
{"c": 9, "q": "外観検査AIの開発を請負契約で委託し、納品・検収を終えた。3か月後、契約で定めた仕様を満たしていない不具合が見つかった。民法上の発注者の対応として最も適切なものはどれか。", "o": ["契約不適合責任により、不適合を知って1年以内に通知すれば、修補や代金減額、損害賠償などを求められる", "請負契約は業務の遂行だけを約束する契約なので、仕事の完成について責任を問うことはできない", "検収を終えた後は、どのような不具合があっても受注者に修補や損害賠償を求めることはできない", "不具合の修補を求めるには、受注者に過失があったことを発注者が証明し、裁判所の許可を得る必要がある"], "e": "請負は仕事の完成を約束する契約で、完成物が契約内容に適合しない場合、発注者は追完・代金減額・損害賠償・解除を求められる（民法第559条による売買の規定の準用）。ただし原則として、不適合を知った時から1年以内に請負人へ通知する必要がある（第637条）。業務の遂行だけを約束するのは準委任。"},
{"c": 9, "q": "2020年4月施行の改正民法で明文化された準委任契約の「成果完成型」の説明として最も適切なものはどれか。", "o": ["事務処理の成果に対して報酬を支払うと定める準委任で、仕事の完成義務は負わず、成果の引渡しを要するときは報酬を引渡しと同時に支払う", "受注者が仕事の完成義務を負う準委任で、成果物が仕様を満たさなければ請負と同じ契約不適合責任を負う", "事務処理にかかった時間に応じて報酬を支払う準委任で、成果の有無にかかわらず作業時間分の報酬が発生する", "受注者の成果物の著作権が当然に発注者へ移る準委任で、権利の帰属を契約で定めることはできない"], "e": "成果完成型の準委任（民法第648条の2）は、事務処理の成果に対して報酬を支払う合意をしたもので、成果の引渡しを要するときは報酬は引渡しと同時に支払う。準委任なので仕事の完成義務はなく、善管注意義務を負う点は変わらない。時間に応じて報酬を払うのは履行割合型。"},
{"c": 9, "q": "経済産業省「AI・データの利用に関する契約ガイドライン（AI編）」の探索的段階型の開発で、各段階で結ぶことが想定されている契約の組み合わせとして最も適切なものはどれか。", "o": ["アセスメント：秘密保持契約　PoC：導入検証契約　開発：ソフトウェア開発契約", "アセスメント：ソフトウェア開発契約　PoC：秘密保持契約　開発：導入検証契約", "アセスメント：導入検証契約　PoC：ソフトウェア開発契約　開発：秘密保持契約", "アセスメント：保守運用契約　PoC：秘密保持契約　開発：データ提供契約"], "e": "アセスメント段階ではユーザーのデータをベンダーが確認するため秘密保持契約、PoC段階では導入の可否を検証する導入検証契約、開発段階では学習済みモデルを作るソフトウェア開発契約を結ぶ。段階ごとに契約を分けることで、成果が不確実なAI開発でも次に進むかを判断しやすくする。"},
{"c": 9, "q": "経済産業省「AI・データの利用に関する契約ガイドライン（AI編）」の用語について、次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。\n「学習済みモデルとは、学習用データセットを学習用プログラムに入力して得られた（ア）が組み込まれた（イ）をいう」", "o": ["（ア）学習済みパラメータ （イ）推論プログラム", "（ア）推論プログラム （イ）学習済みパラメータ", "（ア）生データ （イ）学習用プログラム", "（ア）学習用データセット （イ）学習済みパラメータ"], "e": "ガイドラインは、生データを加工した学習用データセットを学習用プログラムに入力して得た学習済みパラメータ（重みなど）が、推論プログラムに組み込まれたものを学習済みモデルと整理する。どの要素の権利や利用条件を誰に認めるかを契約で分けて定めやすくするための整理。"},
{"c": 9, "q": "営業部門が、顧客から秘密保持契約の下で受け取った図面データを、外部の生成AIサービスに入力して要約させようとしている。導入前に確認すべき事項として最も適切なものはどれか。", "o": ["利用規約で入力データの学習利用や秘密保持の扱いを確かめ、顧客との秘密保持契約の範囲内で使えるか確認する", "生成AIの出力には著作権が発生しないので、入力するデータの内容や秘密保持契約の条件を気にする必要はない", "図面データは個人情報ではないので、どの生成AIサービスに入力しても法的な問題は生じない", "入力したデータは生成AIの出力に使われた時点で消えるので、利用規約を確認する必要はない"], "e": "入力データがサービス提供者のもとで学習や保存に使われると、顧客との秘密保持契約違反や、自社の営業秘密の秘密管理性が失われるおそれがある。利用規約やオプトアウト設定を確認し、契約上許された範囲で使えるかを判断する必要がある。"},
{"c": 9, "q": "生成AIを悪用した詐欺など、AIの不適切な利用で国民の権利利益が侵害された事案が起きた。日本のAI推進法（人工知能関連技術の研究開発及び活用の推進に関する法律）の下で、国が行うとされている対応として最も適切なものはどれか。", "o": ["事案を分析して対策を検討し、その結果に基づいて事業者への指導・助言や情報提供を行う", "事案に関わった事業者に対し、同法に基づいて直ちに罰金や課徴金を科し、事業の停止を命じる", "事案の原因となったAIモデルを、同法に基づいて国が強制的に取得し、公開を禁止する", "事案の調査は行わず、被害者と事業者の間の民事上の解決にすべて委ねる"], "e": "AI推進法第16条は、不正な目的または不適切な方法によるAIの研究開発・活用で国民の権利利益の侵害が生じた事案の分析や対策の検討などを国が行い、その結果に基づいて指導・助言・情報の提供その他の必要な措置を講じるとしている。同法自体には罰則は設けられていない。"});
