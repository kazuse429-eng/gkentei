QUESTIONS.push({"c": 2, "q": "根ノードAの子がB・C・D、Bの子がE・F、Cの子がG、Dの子がH・Iである探索木を、左の子を先に調べる幅優先探索で調べたとき、ノードを訪れる順番として最も適切なものはどれか。", "o": ["A→B→C→D→E→F→G→H→I", "A→B→E→F→C→G→D→H→I", "A→D→C→B→I→H→G→F→E", "A→E→F→B→G→C→H→I→D"], "e": "幅優先探索は同じ深さのノードをすべて調べてから次の深さへ進むので、A、B・C・D、E〜Iの順になる。A→B→E→F…の順は、1つの枝を行き止まりまで調べる深さ優先探索の訪問順である。"},
{"c": 2, "q": "根ノードAの子がB・C、Bの子がD・E、Cの子がF・G、Dの子がH・Iである探索木で、ゴールFを探す。左の子を先に調べるとき、Fに到達するまでに訪れるノードの数（AとFを含む）を幅優先探索と深さ優先探索で比べた組み合わせとして最も適切なものはどれか。", "o": ["幅優先探索6個、深さ優先探索8個", "幅優先探索8個、深さ優先探索6個", "幅優先探索6個、深さ優先探索6個", "幅優先探索4個、深さ優先探索8個"], "e": "幅優先探索はA→B→C→D→E→Fで6個、深さ優先探索はA→B→D→H→I→E→C→Fで8個になる。ゴールが浅い位置にあり、先に調べる左の枝が深い場合は、深さ優先探索のほうが多くのノードを訪れる。"},
{"c": 2, "q": "根が自分の手番（MAX）、その子2つが相手の手番（MIN）、さらにその子がそれぞれ2つずつ自分の手番（MAX）で、その下に葉があるゲーム木がある。左のMINの下のMAXノードの葉が（4,7）と（2,6）、右のMINの下のMAXノードの葉が（8,1）と（3,5）のとき、Mini-Max法で根に伝わる評価値はどれか。", "o": ["6", "5", "7", "8"], "e": "最下段のMAXノードはそれぞれ7、6、8、5となり、左のMINは min(7,6)=6、右のMINは min(8,5)=5、根のMAXは max(6,5)=6となる。7や8は途中のMAXノードの値で、相手が選ばせてくれない値である。"},
{"c": 2, "q": "根がMAXで、その子が3つのMINノード、各MINノードに葉が3つずつあるゲーム木を、左から順にαβ法で探索する。左のMINの葉が（5,9,6）、中央のMINの葉が（7,4,8）、右のMINの葉が（3,10,2）のとき、実際に評価する葉の数はどれか。", "o": ["6個", "9個", "7個", "5個"], "e": "左のMINは3つとも評価して5になる。中央は7の次に4が出た時点で5以下が確定し8は刈られ、右は最初の3で5以下が確定して10と2が刈られるので、評価する葉は9−3=6個である。"},
{"c": 2, "q": "αβ法で、各ノードの子を調べる順番を変える場合の説明として最も適切なものはどれか。", "o": ["良い手から先に調べるほど枝刈りが起きやすくなり、評価する局面の数が減る", "子を調べる順番を変えると、根に伝わる評価値そのものが変わってしまう", "悪い手から先に調べるほど枝刈りが起きやすくなり、評価する局面の数が減る", "子を調べる順番は枝刈りの量には影響せず、評価する局面の数は常に一定である"], "e": "αβ法では、先に良い手の評価値が分かるほど他の手を早く打ち切れるため、手の並べ方で枝刈りの量が大きく変わる。一方、根に伝わる評価値は順番によらずMini-Max法と同じになる。"},
{"c": 2, "q": "円盤が4枚のハノイの塔を最小の手数で別の柱へ移すとき、いちばん小さい円盤が動く回数はどれか。", "o": ["8回", "15回", "4回", "7回"], "e": "n枚を最小手数で移すとき、全体の手数は2^n−1回で、最も小さい円盤はそのうち2^(n−1)回動く。4枚なら全体15回のうち8回で、1手おきに最小の円盤が動く。"},
{"c": 2, "q": "あるボードゲームでは、各局面で指せる手が平均30通りある。自分と相手の手を合わせて4手先まですべての変化を調べるとき、探索木の末端（4手目の局面）の数はおよそいくつか。", "o": ["約81万", "約2万7000", "約120", "約2430万"], "e": "分岐数bで深さdまで展開すると末端はb^d個になり、30^4=810,000である。2万7000は3手先、2430万は5手先の数で、深さが増えるごとに指数関数的に増える（組合せ爆発）。"},
{"c": 2, "q": "囲碁AIがモンテカルロ法で次の手を決める。各候補手から終局までランダムに打つプレイアウトを行った結果、手Aは900回中540勝、手Bは500回中330勝、手Cは200回中130勝、手Dは80回中45勝だった。勝率が最も高い手はどれか。", "o": ["手B", "手A", "手C", "手D"], "e": "勝率は手Aが0.60、手Bが0.66、手Cが0.65、手Dが約0.56で、手Bが最も高い。勝った回数が最も多いのは手Aだが、試行回数が違うので回数ではなく勝率で比べる。"},
{"c": 2, "q": "ゲームAIに関する次の出来事を古い順に並べたものとして最も適切なものはどれか。①IBMのWatsonがクイズ番組で歴代チャンピオンに勝利　②Deep Blueがチェスの世界チャンピオンに勝利　③AlphaGoが囲碁のトップ棋士李世ドルに勝利　④将棋プログラムBonanzaが公開される", "o": ["②→④→①→③", "④→②→①→③", "②→①→④→③", "②→④→③→①"], "e": "Deep Blueの勝利は1997年、Bonanzaの公開は2005年、Watsonのクイズ番組での勝利は2011年、AlphaGoの勝利は2016年である。"},
{"c": 2, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「局面の評価関数を作りやすいチェスでは（ア）による深い先読みが有効だったが、評価関数を作りにくい囲碁では（イ）が使われるようになった。」", "o": ["（ア）αβ法　（イ）モンテカルロ木探索", "（ア）モンテカルロ木探索　（イ）αβ法", "（ア）αβ法　（イ）STRIPS", "（ア）幅優先探索　（イ）STRIPS"], "e": "チェスでは評価関数とαβ法による枝刈り探索が強さの源になった。囲碁では局面の評価が難しいため、プレイアウトの勝率で手を評価するモンテカルロ木探索が広まった。STRIPSは行動計画を立てるプランニングの手法である。"},
{"c": 2, "q": "αβ法とMini-Max法を比べた説明として最も適切なものはどれか。", "o": ["αβ法は結果に影響しない枝を刈るので、Mini-Max法と同じ手を選びつつ調べる局面が少なくて済む", "αβ法は評価値を近似して計算するので、Mini-Max法とは異なる手を選ぶことがよくある", "αβ法は相手の手番の読みを省くので、Mini-Max法より速いが相手の最善手を考慮しない", "αβ法はランダムなプレイアウトで評価するので、Mini-Max法と違って評価関数が要らない"], "e": "αβ法はMini-Max法の結果を変えずに、選ばれることのない枝の探索を省く手法である。相手の最善手も考慮し、評価関数も使う。ランダムなプレイアウトで評価するのはモンテカルロ法である。"},
{"c": 2, "q": "1997年にチェスの世界チャンピオンに勝利したDeep Blueの仕組みの説明として最も適切なものはどれか。", "o": ["専用のハードウェアで1秒間に約2億局面を調べる探索と、チェスの専門知識を取り入れた評価関数を組み合わせた", "ルールだけを与えた自己対局の強化学習によって、評価関数をすべてデータから学習した", "過去の名人の棋譜を丸暗記しておき、探索を行わずに同じ局面で指された手をそのまま選んだ", "大量のチェスの解説書を読ませた言語モデルを使い、次の手を文章として生成して決めた"], "e": "Deep Blueはチェス専用チップを並べた計算機で膨大な局面を力任せに探索し、専門家の知識に基づく評価関数で局面を評価した。自己対局の強化学習だけで強くなったのはAlphaZeroなど後のシステムである。"},
{"c": 2, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「STRIPSでロボットの行動『箱を持ち上げる』を記述するとき、『手が空いていて箱のそばにいる』はその行動の（ア）、『箱を手に持っている』はその行動の（イ）に当たる。」", "o": ["（ア）前提条件　（イ）結果", "（ア）結果　（イ）前提条件", "（ア）前提条件　（イ）目標状態", "（ア）初期状態　（イ）前提条件"], "e": "STRIPSでは行動を、実行できる条件である前提条件と、実行後に成り立つ結果の組で記述する。手が空いていることは持ち上げる前に必要な条件で、箱を持っていることは持ち上げた後の状態である。"},
{"c": 2, "q": "SHRDLUとELIZAを比べた説明として最も適切なものはどれか。", "o": ["SHRDLUは積み木の世界に限って物体の状態を理解して操作し、ELIZAは入力の型に合わせて定型の応答を返した", "SHRDLUは入力の型に合わせて定型の応答を返し、ELIZAは積み木の世界に限って物体の状態を理解して操作した", "どちらも大量の対話データから学習したモデルで、SHRDLUは英語、ELIZAは日本語に対応していた", "どちらも医療の専門知識をルールとして持ち、SHRDLUは診断、ELIZAは治療法の提案を行った"], "e": "SHRDLUは限られた積み木の世界の中で英語の指示を解釈し、物体を動かした。ELIZAはキーワードや文の型に合わせて応答を返すだけで、内容を理解してはいなかった。どちらも学習や医療診断のシステムではない。"},
{"c": 2, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「ELIZAの代表的なスクリプト『DOCTOR』は（ア）の応答をまねたもので、開発者の（イ）は、利用者がこのプログラムに感情移入してしまうことに危機感を抱いた。」", "o": ["（ア）来談者中心療法のセラピスト　（イ）ワイゼンバウム", "（ア）感染症の専門医　（イ）ワイゼンバウム", "（ア）来談者中心療法のセラピスト　（イ）ファイゲンバウム", "（ア）感染症の専門医　（イ）ファイゲンバウム"], "e": "DOCTORは相手の発言を問い返すロジャーズ派（来談者中心療法）のセラピストをまねたもので、ワイゼンバウムは人々がELIZAを真剣に受け止めることを憂慮した。感染症の専門知識を持つのはMYCIN、ファイゲンバウムはDENDRALの開発者である。"},
{"c": 2, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「エキスパートシステムは、専門家の知識をルールなどの形で蓄えた（ア）と、それを使って入力された事実から結論を導く（イ）から構成される。」", "o": ["（ア）知識ベース　（イ）推論エンジン", "（ア）推論エンジン　（イ）知識ベース", "（ア）知識ベース　（イ）評価関数", "（ア）コーパス　（イ）推論エンジン"], "e": "エキスパートシステムでは、知識ベースに蓄えたif-thenルールなどを、推論エンジンが適用して結論を導く。評価関数はゲームの局面の良し悪しを表す関数、コーパスは言語処理のために集めた文章データである。"},
{"c": 2, "q": "ある診断システムは、原因として考えられる菌を仮説として立て、それを確かめるのに必要な情報を、患者のデータや医師への質問によって集めていく。MYCINも採用していたこの推論の進め方はどれか。", "o": ["後ろ向き推論", "前向き推論", "幅優先探索", "モンテカルロ法"], "e": "結論（目標）を仮説として立て、それを支える条件をさかのぼって確かめていくのが後ろ向き推論で、MYCINはこの方式をとった。前向き推論は、分かっている事実からルールを順に当てはめて結論を導いていく方式である。"},
{"c": 2, "q": "ある保険会社が、ベテラン査定担当者の判断をif-thenルールにまとめるシステムを作った。担当者自身もうまく言葉にできない判断が多くて聞き取りに時間がかかり、例外のルールを足すたびに既存のルールとの矛盾が生じた。この状況が最もよく表している問題はどれか。", "o": ["知識獲得のボトルネック", "フレーム問題", "シンボルグラウンディング問題", "組合せ爆発"], "e": "専門家の暗黙的な知識を引き出してルール化し、矛盾なく保守することの難しさを知識獲得のボトルネックという。フレーム問題は関係のある事柄だけを選び出す難しさ、組合せ爆発は探索すべき場合の数が急増することである。"},
{"c": 2, "q": "意味ネットワークで「カナリア is-a 鳥」「鳥 is-a 動物」「鳥は翼を持つ」「動物は呼吸をする」が表されている。is-a関係による性質の継承から導けることとして最も適切なものはどれか。", "o": ["カナリアは翼を持ち、呼吸もする", "すべての動物は翼を持つ", "すべての鳥はカナリアである", "カナリアは翼を持つが、呼吸をするとは導けない"], "e": "is-a関係では上位概念の性質が下位概念に継承され、推移的にたどれるので、カナリアは鳥の「翼を持つ」と動物の「呼吸をする」を受け継ぐ。下位の性質が上位に伝わることはなく、関係を逆向きにたどることもできない。"},
{"c": 2, "q": "2011年にクイズ番組で勝利したIBM Watsonの質問応答の仕組みの説明として最も適切なものはどれか。", "o": ["質問の意味を人間のように理解するのではなく、大量の文書から答えの候補を集め、根拠の確からしさで順位付けした", "質問文を論理式に変換し、人手で作った一般常識の知識ベースから定理証明によって唯一の答えを導いた", "番組で過去に出題された問題と答えを丸暗記しておき、同じ問題が出されたときにだけ答えを返した", "大規模言語モデルを使い、質問に対する答えの文章を1語ずつ予測して生成した"], "e": "Watsonは、Wikipediaなどの大量の文書から答えの候補を探し、多くの根拠を照らし合わせてスコアの高いものを答えた。意味を理解していたわけではなく、ライトウェイト・オントロジー的な手法の応用とされる。大規模言語モデルは後の時代の技術である。"},
{"c": 2, "q": "知識を扱うAIシステムに関する次のものを、開発や取り組みが始まった順に並べたものとして最も適切なものはどれか。①Cycプロジェクト　②MYCIN　③IBM Watson（クイズ番組での勝利）　④DENDRAL", "o": ["④→②→①→③", "②→④→①→③", "④→①→②→③", "④→②→③→①"], "e": "DENDRALは1960年代半ば、MYCINは1970年代前半、Cycは1984年に始まり、Watsonのクイズ番組での勝利は2011年である。DENDRALは最初期のエキスパートシステムとされる。"},
{"c": 2, "q": "2010年代後半に、機械翻訳の主流が統計的機械翻訳からニューラル機械翻訳へ移った理由として最も適切なものはどれか。", "o": ["文全体をニューラルネットワークで変換し、文脈に沿った流暢な訳文を出せるようになったから", "対訳データを使わず、言語学者が書いた文法規則だけで高い精度の訳を出せるようになったから", "単語や句ごとの訳語の確率を表にまとめ、確率の高い訳語を順に並べるようになったから", "第五世代コンピュータの並列推論マシンにより、論理式による意味の変換が高速になったから"], "e": "ニューラル機械翻訳は、大量の対訳データからEncoder-Decoderなどのネットワークで文全体の変換を学習し、訳の流暢さが大きく向上した。単語や句の訳語の確率を組み合わせるのは統計的機械翻訳、文法規則だけで訳すのは規則ベースの機械翻訳である。"},
{"c": 2, "q": "機械翻訳の主流となった手法を古い順に並べたものとして最も適切なものはどれか。①ニューラル機械翻訳　②規則（ルール）に基づく機械翻訳　③統計的機械翻訳", "o": ["②→③→①", "③→②→①", "②→①→③", "③→①→②"], "e": "機械翻訳は、人が文法規則や辞書を記述する規則ベースから始まり、対訳コーパスから確率を学ぶ統計的機械翻訳を経て、2016年ごろからニューラル機械翻訳が主流となった。"},
{"c": 2, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「ある工場では、数千個のセンサーが1秒ごとに測定値を送ってくるので、データが発生する（ア）への対応が課題となっている。さらに作業日報の文章や検査画像も合わせて分析したいので、（イ）への対応も求められる。」", "o": ["（ア）Velocity（速度）　（イ）Variety（多様性）", "（ア）Variety（多様性）　（イ）Velocity（速度）", "（ア）Velocity（速度）　（イ）Value（価値）", "（ア）Value（価値）　（イ）Variety（多様性）"], "e": "次々に発生するデータを処理する必要があるのはVelocity、数値・文章・画像など形式の異なるデータを扱う必要があるのはVarietyの側面である。Valueは後から加えられることのある観点で、3つのVには含まれない。"},
{"c": 2, "q": "あるメール事業者が、迷惑メールを判定する機械学習モデルを作るために、「本文中の『無料』の出現回数」「リンクの数」「送信元が連絡先に登録済みか」を担当者が選んで入力データにした。この担当者の作業を表す用語として最も適切なものはどれか。", "o": ["特徴量設計", "表現学習", "知識獲得のボトルネック", "事前学習"], "e": "予測に役立ちそうなデータの特徴を人が考えて選ぶ作業を特徴量設計という。表現学習は特徴量そのものをデータから自動で獲得する手法で、ディープラーニングがその代表である。"},
{"c": 2, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「分類などに役立つデータの（ア）を、人が設計するのではなくデータから自動で獲得する手法を（イ）と呼び、ディープラーニングはその代表である。」", "o": ["（ア）特徴量　（イ）表現学習", "（ア）特徴量　（イ）強化学習", "（ア）正解ラベル　（イ）表現学習", "（ア）正解ラベル　（イ）強化学習"], "e": "表現学習は、データをどう表現するか（特徴量）を学習によって獲得する手法である。強化学習は報酬をもとに行動を学ぶ手法で、特徴量の獲得を指す言葉ではない。正解ラベルは人が与える教師データの答えである。"},
{"c": 2, "q": "次の文の（ア）（イ）に入る値の組み合わせとして最も適切なものはどれか。「2012年のILSVRCで、AlexNetのtop-5誤り率は約（ア）で、2位のチームの約（イ）に大差をつけた。」", "o": ["（ア）15％　（イ）26％", "（ア）26％　（イ）15％", "（ア）5％　（イ）15％", "（ア）15％　（イ）40％"], "e": "AlexNetのtop-5誤り率は約15.3％で、従来型の手法を使った2位の約26.2％を10ポイント以上下回った。この大差がディープラーニングへの注目を一気に高めた。"},
{"c": 2, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「2012年のILSVRCで優勝したAlexNetは（ア）大学のヒントンの研究室から生まれた。ヒントンは2024年、ホップフィールドとともに（イ）を受賞した。」", "o": ["（ア）トロント　（イ）ノーベル物理学賞", "（ア）トロント　（イ）ノーベル化学賞", "（ア）スタンフォード　（イ）ノーベル物理学賞", "（ア）スタンフォード　（イ）ノーベル化学賞"], "e": "AlexNetはトロント大学のクリジェフスキー、サツケバー、ヒントンが開発した。ヒントンとホップフィールドは人工ニューラルネットワークによる機械学習の基礎を築いた功績で2024年のノーベル物理学賞を受賞した。"},
{"c": 2, "q": "積層オートエンコーダや深層信念ネットワークによる層ごとの事前学習が、2010年代にあまり使われなくなった主な理由として最も適切なものはどれか。", "o": ["ReLUや重みの初期化、ドロップアウトなどの工夫とデータ・計算資源の増加で、深いネットワーク全体を直接学習できるようになった", "層ごとの事前学習は大量の正解ラベルを必要とし、ラベル付けの費用が高くなりすぎて使えなくなった", "深いネットワークよりも浅いネットワークの方が、どんな課題でも精度が高くなることが証明された", "オートエンコーダは画像しか扱えず、音声や文章を入力にできないことが分かった"], "e": "活性化関数や初期化、正則化の改良とGPU・ビッグデータにより、事前学習なしで深いネットワークを最初から学習できるようになった。層ごとの事前学習は正解ラベルのいらない教師なし学習であり、画像以外の入力にも使える。"},
{"c": 2, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「ヒントンが2006年に提案した深層信念ネットワークは、（ア）を積み重ねた構造を持ち、（イ）によって1層ずつ事前学習を行う。」", "o": ["（ア）制限付きボルツマンマシン　（イ）教師なし学習", "（ア）制限付きボルツマンマシン　（イ）強化学習", "（ア）決定木　（イ）教師なし学習", "（ア）決定木　（イ）強化学習"], "e": "深層信念ネットワークは制限付きボルツマンマシンを層ごとに重ね、正解ラベルを使わない教師なし学習で1層ずつ事前学習してから全体を調整する。決定木はニューラルネットワークではない別の機械学習手法である。"},
{"c": 2, "q": "家庭用ロボットに「冷蔵庫から牛乳を取ってきて」と頼むと、ドアを開けたら壁の色が変わらないか、床が抜けないかなど、関係のなさそうな可能性まで一つずつ検討し始め、いつまでも動き出せなかった。この状況が最もよく表している問題はどれか。", "o": ["フレーム問題", "シンボルグラウンディング問題", "知識獲得のボトルネック", "トイ・プロブレム"], "e": "無数にある事柄の中から、今の課題に関係のあるものだけを選び出すことの難しさをフレーム問題という。シンボルグラウンディング問題は記号と実世界の意味を結びつける難しさを指す。"},
{"c": 2, "q": "次の文の（ア）（イ）に入る人物の組み合わせとして最も適切なものはどれか。「フレーム問題は1969年に（ア）によって提起され、シンボルグラウンディング問題は1990年に（イ）によって提起された。」", "o": ["（ア）マッカーシーとヘイズ　（イ）ハルナッド", "（ア）マッカーシーとヘイズ　（イ）サール", "（ア）ミンスキーとパパート　（イ）ハルナッド", "（ア）ミンスキーとパパート　（イ）サール"], "e": "フレーム問題はマッカーシーとヘイズの1969年の論文で、シンボルグラウンディング問題はスティーブン・ハルナッドの1990年の論文で提起された。ミンスキーとパパートは『パーセプトロン』、サールは中国語の部屋で知られる。"},
{"c": 2, "q": "ボードゲームAIに関する記述として、適切でないものはどれか。", "o": ["Deep Blueは1997年に、囲碁の世界トップ棋士との対局に勝利した", "Bonanzaは、プロ棋士の棋譜から評価関数のパラメータを機械学習で調整した", "Ponanzaは2017年に、現役の名人との対局に勝利した", "モンテカルロ法は、局面の評価関数を作りにくい囲碁で用いられた"], "e": "Deep Blueが1997年に勝利したのはチェスの世界チャンピオンのカスパロフであり、囲碁ではない。囲碁でトップ棋士に勝ったのは2016年のAlphaGoである。"},
{"c": 2, "q": "探索に関する記述として、適切でないものはどれか。", "o": ["幅優先探索は、深さ優先探索よりも一般に使用するメモリが少なくて済む", "深さ優先探索で最初に見つかった解は、最短の解であるとは限らない", "幅優先探索は、根に近い浅い階層から順にノードを調べていく", "分岐が多い探索木では、調べる局面の数が深さとともに指数関数的に増える"], "e": "幅優先探索は同じ深さのノードをすべて保持しておく必要があるため、一般に深さ優先探索よりメモリを多く使う。その代わり、最初に見つかる解は最短の解になる。"},
{"c": 2, "q": "ディープラーニングの発展に関する記述として、適切でないものはどれか。", "o": ["深層信念ネットワークは、2012年のILSVRCで優勝したモデルである", "AlexNetは、GPUを使って大規模な画像データを学習した", "深層信念ネットワークは、2006年にヒントンらが提案した", "ヒントン、ベンジオ、ルカンは2018年度のチューリング賞を受賞した"], "e": "2012年のILSVRCで優勝したのは畳み込みニューラルネットワークのAlexNetであり、深層信念ネットワークは2006年にヒントンらが提案した別のモデルである。"},
{"c": 2, "q": "言語を扱う技術に関する記述として、適切でないものはどれか。", "o": ["統計的機械翻訳は、言語学者が記述した文法規則だけを使い、対訳データは使わない", "コーパスは、言語の研究や処理に使うために大量の文章を集めて整理したデータである", "統計的自然言語処理は、大量の文章から求めた語や表現の出現確率に基づいて言語を処理する", "ニューラル機械翻訳は、ニューラルネットワークで原文から訳文への変換を学習する"], "e": "統計的機械翻訳は大量の対訳データから翻訳の確率を学習する手法であり、文法規則だけを使うのは規則ベースの機械翻訳である。"},
{"c": 2, "q": "ニューラルネットワークとディープラーニングに関する次の出来事を古い順に並べたものとして最も適切なものはどれか。①ヒントンらによる深層信念ネットワークの提案　②ローゼンブラットによるパーセプトロンの提案　③ILSVRCでのAlexNetの優勝　④ラメルハートらによる誤差逆伝播法の論文の発表", "o": ["②→④→①→③", "④→②→①→③", "②→①→④→③", "②→④→③→①"], "e": "パーセプトロンは1958年、ラメルハートらの誤差逆伝播法の論文は1986年、深層信念ネットワークは2006年、AlexNetの優勝は2012年である。"},
{"c": 2, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「n枚のハノイの塔を柱1から柱3へ移すには、上のn−1枚をまず（ア）へ移し、最も大きい円盤を（イ）へ移してから、n−1枚をその上に移せばよい。」", "o": ["（ア）柱2　（イ）柱3", "（ア）柱3　（イ）柱2", "（ア）柱3　（イ）柱3", "（ア）柱2　（イ）柱2"], "e": "最も大きい円盤を目的の柱3へ動かすには、上のn−1枚を補助の柱2へどけておく必要がある。同じ手順をn−1枚、n−2枚…にも繰り返す再帰的な考え方で、最小手数は2^n−1回になる。"},
{"c": 2, "q": "エキスパートシステムMYCINが、ルールによって導く結論の確からしさを数値で表すために用いた仕組みはどれか。", "o": ["確信度", "p値", "学習率", "割引率"], "e": "MYCINは各ルールや結論に確信度（certainty factor）を付け、不確かな医療知識を扱った。p値は統計的検定、学習率は勾配降下法の更新幅、割引率は強化学習で将来の報酬を割り引く係数である。"},
{"c": 2, "q": "オセロ・チェス・将棋・囲碁を、よく引用されるゲーム木の大きさ（探索空間の大きさ）が小さい順に並べたものとして最も適切なものはどれか。", "o": ["オセロ→チェス→将棋→囲碁", "チェス→オセロ→将棋→囲碁", "オセロ→将棋→チェス→囲碁", "オセロ→チェス→囲碁→将棋"], "e": "よく引用される値はオセロ約10の60乗、チェス約10の120乗、将棋約10の220乗、囲碁約10の360乗である。将棋は取った駒を再び使えるためチェスより大きく、囲碁は盤面が広いため最も大きい。"},
{"c": 2, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「幅優先探索では、これから調べるノードを（ア）で管理し、深さ優先探索では（イ）で管理する。」", "o": ["（ア）キュー（先入れ先出し）　（イ）スタック（後入れ先出し）", "（ア）スタック（後入れ先出し）　（イ）キュー（先入れ先出し）", "（ア）キュー（先入れ先出し）　（イ）キュー（先入れ先出し）", "（ア）スタック（後入れ先出し）　（イ）スタック（後入れ先出し）"], "e": "幅優先探索は先に見つけたノードから順に調べるので先入れ先出しのキューを、深さ優先探索は最後に見つけたノードを先に掘り下げるので後入れ先出しのスタックを使う。"},
{"c": 2, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「統計的機械翻訳では、原文と訳文の単語や句の対応を表す（ア）と、訳文が目的の言語として自然かどうかを表す（イ）を組み合わせ、確率が最も高い訳文を選ぶ。」", "o": ["（ア）翻訳モデル　（イ）言語モデル", "（ア）言語モデル　（イ）翻訳モデル", "（ア）翻訳モデル　（イ）オントロジー", "（ア）意味ネットワーク　（イ）言語モデル"], "e": "統計的機械翻訳は、対訳コーパスから学ぶ翻訳モデルと、目的言語の文章から学ぶ言語モデルを組み合わせる。オントロジーや意味ネットワークは概念の関係を表す知識表現である。"},
{"c": 2, "q": "ある研究室の搬送ロボットは、障害物の位置がすべて分かっている模擬倉庫では最短経路を計画して完璧に動いたが、人や荷物が絶えず動く実際の倉庫ではほとんど役に立たなかった。第1次AIブームの限界と同じ構造を表す用語として最も適切なものはどれか。", "o": ["トイ・プロブレム", "シンボルグラウンディング問題", "知識獲得のボトルネック", "AI効果"], "e": "条件が明確で単純化された問題（トイ・プロブレム）は解けても、現実の複雑な問題には通用しないという限界が第1次AIブームの失速につながった。知識獲得のボトルネックは第2次ブームの課題である。"},
{"c": 2, "q": "1982年に始まった日本の第五世代コンピュータプロジェクトで、並列推論マシンのソフトウェアの基盤とされた言語の種類はどれか。", "o": ["Prologに代表される論理型言語", "COBOLに代表される事務処理向け言語", "FORTRANに代表される科学技術計算向け言語", "HTMLに代表されるマークアップ言語"], "e": "第五世代コンピュータは、論理に基づく推論を並列に高速実行することを目指し、Prologに代表される論理型言語を基盤とした。COBOLやFORTRANは従来型の手続き的な言語、HTMLはWebページの記述言語である。"},
{"c": 2, "q": "かな漢字変換で「きしゃのきしゃがきしゃできしゃした」を、大量の文章に現れる語の並びの頻度をもとに「貴社の記者が汽車で帰社した」と変換する。この仕組みの背景にある考え方として最も適切なものはどれか。", "o": ["統計的自然言語処理", "エキスパートシステム", "ヘビーウェイト・オントロジー", "STRIPSによるプランニング"], "e": "コーパスから求めた語の並びの出現確率によって最もありそうな変換を選ぶのは、統計的自然言語処理の考え方である。ヘビーウェイト・オントロジーは人が概念の関係を厳密に記述する立場、STRIPSは行動計画の手法である。"});

{"c": 3, "q": "3クラス（A・B・C）の分類結果を、行を正解クラス・列を予測クラスとして集計した。A行：(40, 5, 5)、B行：(10, 20, 10)、C行：(2, 3, 5)。正解率と、クラスごとの再現率を単純平均したマクロ平均再現率の組み合わせとして正しいものはどれか。", "o": ["正解率0.65、マクロ平均再現率0.60", "正解率0.60、マクロ平均再現率0.65", "正解率0.65、マクロ平均再現率0.80", "正解率0.80、マクロ平均再現率0.60"], "e": "正解率は対角の合計65を総数100で割って0.65。再現率はAが40/50＝0.8、Bが20/40＝0.5、Cが5/10＝0.5で、単純平均は0.60になる。件数の多いAの成績が良いため、正解率はマクロ平均より高く出ている。"},
{"c": 3, "q": "実測値がすべて10である5件のデータに対し、モデルAの予測は 12, 8, 12, 8, 10、モデルBの予測は 10, 10, 10, 10, 15 だった。MAEとRMSEでの比較として正しいものはどれか。", "o": ["MAEはBの方が小さいが、RMSEはAの方が小さい", "MAEもRMSEもBの方が小さい", "MAEはAの方が小さいが、RMSEはBの方が小さい", "MAEもRMSEもAの方が小さい"], "e": "AはMAE＝8/5＝1.6、RMSE＝√(16/5)≒1.79。BはMAE＝5/5＝1.0、RMSE＝√(25/5)≒2.24。RMSEは誤差を二乗してから平均するため、Bのように1件だけ大きく外れる誤差を強く反映し、順位が入れ替わる。"},
{"c": 3, "q": "決定木のあるノードに、クラスXのデータが6件、クラスYのデータが4件含まれている。このノードのジニ不純度はどれか。", "o": ["0.48", "0.52", "0.24", "0.97"], "e": "ジニ不純度＝1−Σp²＝1−(0.6²＋0.4²)＝1−0.52＝0.48。0.52は二乗和そのもの、0.97は同じ比率での2を底とするエントロピー（約0.971）である。"},
{"c": 3, "q": "正例10件・負例10件のノードを分割する候補が2つある。分割Pは (正8, 負2) と (正2, 負8) に、分割Qは (正10, 負6) と (正0, 負4) に分ける。子ノードのジニ不純度を件数で重み付け平均した値で比べたとき、正しいものはどれか。", "o": ["Pは0.32、Qは0.375で、Pが選ばれる", "Pは0.375、Qは0.32で、Qが選ばれる", "Pは0.32、Qは0.375で、Qが選ばれる", "どちらも0.5で、差はつかない"], "e": "Pは両方の子が1−(0.8²＋0.2²)＝0.32で、加重平均も0.32。Qは (10,6) が1−((5/8)²＋(3/8)²)＝0.46875、(0,4) が0で、(16×0.46875)/20＝0.375。不純度がより小さくなる分割Pが選ばれる。"},
{"c": 3, "q": "正例4件・負例4件のノード（エントロピー1ビット）を、(正3, 負1) と (正1, 負3) の2つの子ノードに分割した。(3,1) のエントロピーを約0.811ビットとするとき、この分割の情報利得に最も近いものはどれか。", "o": ["約0.19ビット", "約0.81ビット", "約0.50ビット", "約0.62ビット"], "e": "子ノードはどちらも約0.811ビットで、件数による加重平均も0.811。情報利得＝1−0.811≒0.19ビット。0.81ビットは分割後の平均エントロピーそのもので、利得ではない。"},
{"c": 3, "q": "1次元のデータ 1, 2, 4, 7, 9, 10 をk-means法で2つに分ける。初期の重心を 1 と 5 としたとき、1回目の割り当てと重心の更新を行った後の2つの重心の組み合わせとして正しいものはどれか。", "o": ["1.5 と 7.5", "2.33 と 8.67", "1 と 7.5", "1.5 と 6.5"], "e": "各点を近い重心に割り当てると、1と2が重心1側、4・7・9・10が重心5側になる（4は5までの距離1の方が近い）。新しい重心はそれぞれ (1＋2)/2＝1.5、(4＋7＋9＋10)/4＝7.5。2.33と8.67は4を重心1側に入れた場合の値。"},
{"c": 3, "q": "状態sで方策は行動a1と行動a2をそれぞれ確率0.5で選ぶ。a1では報酬1を得て状態価値4の状態へ、a2では報酬3を得て状態価値2の状態へ確定的に移る。割引率0.5のとき、ベルマン方程式から求まる状態sの状態価値はどれか。", "o": ["3.5", "5.0", "2.0", "4.5"], "e": "V(s)＝Σπ(a|s)[r＋γV(s')]＝0.5×(1＋0.5×4)＋0.5×(3＋0.5×2)＝0.5×3＋0.5×4＝3.5。5.0は割引をかけずに計算した値、2.0は報酬だけを平均した値。"},
{"c": 3, "q": "3本の腕を合計100回引いた時点で、腕Aは平均報酬0.6・試行50回、腕Bは0.5・10回、腕Cは0.7・40回である。UCB値＝平均報酬＋√(2 ln N / n)（Nは総試行回数、nはその腕の試行回数、ln100≒4.6）で次に選ぶとき、選ばれる腕とそのUCB値の組み合わせとして正しいものはどれか。", "o": ["腕B、約1.46", "腕C、約1.18", "腕A、約1.03", "腕C、約0.70"], "e": "上乗せ分はAが√(9.2/50)≒0.43、Bが√(9.2/10)≒0.96、Cが√(9.2/40)≒0.48で、UCB値はA≒1.03、B≒1.46、C≒1.18。平均報酬だけならCが選ばれるが、試行回数の少ないBの上乗せが大きく、Bが選ばれる。"},
{"c": 3, "q": "5分割交差検証で各分割の正解率が 0.80、0.84、0.82、0.78、0.76 だった。5つの値の平均と、偏差の二乗をデータ数5で割った分散の組み合わせとして正しいものはどれか。", "o": ["平均0.80、分散0.0008", "平均0.80、分散0.0010", "平均0.82、分散0.0008", "平均0.80、分散0.0040"], "e": "平均は4.00/5＝0.80。偏差は0、0.04、0.02、−0.02、−0.04で、二乗和0.0040を5で割ると0.0008（標準偏差は約0.028）。0.0010は4で割った不偏分散、0.0040は二乗和そのもの。"},
{"c": 3, "q": "3本の決定木からなるアンサンブルで、ある入力に対する各木の陽性確率が 0.90、0.40、0.45 だった。各木を閾値0.5で判定して多数決をとる方法と、3本の確率を平均して閾値0.5で判定する方法の結果の組み合わせとして正しいものはどれか。", "o": ["多数決では陰性、確率の平均（約0.58）では陽性", "多数決では陽性、確率の平均（約0.42）では陰性", "多数決でも確率の平均（約0.58）でも陽性", "多数決でも確率の平均（約0.45）でも陰性"], "e": "各木の判定は陽性・陰性・陰性なので多数決は陰性。確率の平均は (0.90＋0.40＋0.45)/3≒0.58 で0.5以上なので陽性になる。確率の平均は、自信の強い木の意見が結果に反映されるため、多数決と判定が分かれることがある。"},
{"c": 3, "q": "8件のデータについて、モデルが出した陽性確率と正解は次のとおり。0.95(陽性)、0.85(陰性)、0.80(陽性)、0.70(陽性)、0.55(陰性)、0.40(陽性)、0.30(陰性)、0.10(陰性)。閾値0.6以上を陽性と判定したときの適合率と再現率の組み合わせとして正しいものはどれか。", "o": ["適合率0.75、再現率0.75", "適合率0.60、再現率0.75", "適合率0.75、再現率1.00", "適合率0.67、再現率0.50"], "e": "閾値0.6以上は0.95・0.85・0.80・0.70の4件で、そのうち陽性は3件なので適合率3/4＝0.75。陽性は全部で4件あり、0.40の陽性を取りこぼすので再現率3/4＝0.75。閾値を0.5にすると0.55の陰性も陽性と判定され、適合率は0.60に下がる。"},
{"c": 3, "q": "陽性3件のスコアが 0.9、0.7、0.4、陰性3件のスコアが 0.8、0.3、0.2 だった。AUCは「陽性と陰性を1件ずつ取り出したとき、陽性のスコアの方が高い確率」に等しい。このデータのAUCに最も近いものはどれか。", "o": ["0.78", "0.67", "0.89", "0.56"], "e": "陽性×陰性の9組のうち陽性が上回るのは、0.9が3組、0.7が2組、0.4が2組の計7組で、AUC＝7/9≒0.78。0.8の陰性が陽性0.7と0.4を上回ることが減点になっている。"},
{"c": 3, "q": "Q(s,a)=1、学習率α=0.1、報酬r=2、割引率γ=0.9 で、次状態s'での行動価値は a1 が 5、a2 が 3 である。ε-greedyで次に実際に選ばれた行動が a2 のとき、SARSAとQ学習それぞれの更新後の Q(s,a) の組み合わせとして正しいものはどれか。", "o": ["SARSA 1.37、Q学習 1.55", "SARSA 1.55、Q学習 1.37", "SARSA 1.37、Q学習 1.37", "SARSA 1.27、Q学習 1.45"], "e": "SARSAは実際に選んだa2の価値を使い 1＋0.1×(2＋0.9×3−1)＝1.37、Q学習は最大のa1の価値を使い 1＋0.1×(2＋0.9×5−1)＝1.55。1.27と1.45は報酬を2ではなく1として計算した値。"},
{"c": 3, "q": "データ数500で2つのモデルを比べる。モデルAは最大対数尤度−120・パラメータ数2、モデルBは最大対数尤度−115・パラメータ数5。AIC（−2lnL＋2k）とBIC（−2lnL＋k ln n、ln500≒6.21）で選ばれるモデルの組み合わせとして正しいものはどれか。", "o": ["AICではB、BICではA", "AICではA、BICではB", "AICでもBICでもA", "AICでもBICでもB"], "e": "AICはA＝244、B＝240でBが小さい。BICはA＝240＋2×6.21≒252.4、B＝230＋5×6.21≒261.1でAが小さい。BICはパラメータ1個あたりの罰則がln n（ここでは約6.2）とAICの2より重く、単純なモデルを選びやすい。"},
{"c": 3, "q": "5クラスの分類を2値分類器の組み合わせで行う。一対他（One-vs-Rest）と一対一（One-vs-One）で必要な2値分類器の数の組み合わせとして正しいものはどれか。", "o": ["一対他5個、一対一10個", "一対他5個、一対一20個", "一対他10個、一対一5個", "一対他4個、一対一10個"], "e": "一対他はクラスごとに1個でK＝5個、一対一はクラスの2つ組ごとに1個でK(K−1)/2＝10個必要になる。20個は組の順序を区別して数えた場合の誤り。"},
{"c": 3, "q": "受信メールの30%が迷惑メールである。単語w1とw2の出現確率は、迷惑メールでそれぞれ0.6と0.5、通常メールで0.2と0.1である。w1とw2を両方含むメールが迷惑メールである確率を、ナイーブベイズで求めた値に最も近いものはどれか。", "o": ["約0.87", "約0.64", "約0.50", "約0.94"], "e": "単語は独立とみなし、迷惑側は0.3×0.6×0.5＝0.09、通常側は0.7×0.2×0.1＝0.014。正規化して0.09/(0.09＋0.014)≒0.87になる。事前確率0.3を掛け忘れると約0.94になる。"},
{"c": 3, "q": "金融機関が、年収・勤続年数・借入残高などの表データから貸し倒れの確率を出し、審査担当者に「どの項目が何倍リスクを高めるか」をオッズ比で説明したい。最も適切な手法はどれか。", "o": ["ロジスティック回帰", "k-means法", "t-SNE", "多次元尺度構成法"], "e": "ロジスティック回帰は確率を出力し、係数を指数変換するとその特徴量が1増えたときのオッズの倍率として解釈できる。k-means法はクラスタリング、t-SNEと多次元尺度構成法は低次元への配置・可視化の手法で、正解ラベル付きの予測には使わない。"},
{"c": 3, "q": "コールセンターに届く問い合わせメールを、「請求」「故障」「解約」「その他」のうちちょうど1つに振り分けるモデルを作る。この課題の種類として最も適切なものはどれか。", "o": ["多クラス分類", "マルチラベル分類", "回帰", "クラスタリング"], "e": "1件に対して3つ以上の候補からちょうど1つのクラスを選ぶので多クラス分類。マルチラベル分類は1件に複数のラベルを同時に付けてよい課題、回帰は連続値の予測、クラスタリングは正解ラベルなしのグループ分けである。"},
{"c": 3, "q": "k近傍法で顧客を分類する。特徴量は「年収（万円、300〜1500程度）」と「年齢（歳、20〜70程度）」の2つである。このまま距離を計算した場合に起きる問題と対策として最も適切なものはどれか。", "o": ["値の幅が大きい年収が距離をほぼ決めてしまうため、標準化してから距離を計算する", "年齢が距離をほぼ決めてしまうため、年齢の列を学習から取り除いてから計算する", "距離の計算はどちらの単位でも変わらないため、kの値だけを大きくして調整する", "分類の結果が毎回ランダムに変わるため、乱数の種を固定してから距離を計算する"], "e": "ユークリッド距離は値の幅が大きい特徴量に支配されるため、年収の差ばかりが効いてしまう。標準化などで尺度をそろえるのが基本。k近傍法の予測は乱数を使わないので、結果が毎回変わるわけではない。"},
{"c": 3, "q": "重回帰分析で、説明変数に「身長（cm）」と「身長（m）」を両方入れたところ、学習のたびに係数の値や符号が大きく変わり解釈できなくなった。この原因として最も適切なものはどれか。", "o": ["説明変数どうしが強く相関している多重共線性", "目的変数が質的な値になっていることによる不適合", "訓練データの件数が変数の数より多すぎること", "割引率が大きすぎて将来の値を重視していること"], "e": "ほぼ同じ情報を持つ変数を同時に入れると多重共線性が起き、係数が不安定になる。片方を除く、正則化を用いるなどで対処する。データ件数が変数より多いのは通常の望ましい状態で、割引率は強化学習の概念。"},
{"c": 3, "q": "決定木を深さの制限なしで学習させたところ、訓練データの正解率は100%だがテストデータでは大きく下がった。この原因と対策の組み合わせとして最も適切なものはどれか。", "o": ["細かすぎる分岐で過学習しているので、木の深さや葉の最小データ数を制限する", "分岐が足りず未学習なので、深さの制限をなくしたまま特徴量を増やしていく", "データの尺度がそろっていないので、特徴量を標準化してから再び学習する", "クラス数が多すぎるので、多クラス分類をやめて回帰問題として学習し直す"], "e": "深さ無制限の決定木は訓練データの個々の点まで分けきって過学習しやすく、深さ制限や剪定で抑える。決定木は特徴量ごとの閾値で分岐するため、標準化しても分割の結果はほとんど変わらない。"},
{"c": 3, "q": "通販サイトの顧客を購買傾向で分けたいが、いくつのグループに分けるべきかは事前に決められない。併合の過程を樹形図で見ながら、分ける数を後から決めたい。最も適切な手法はどれか。", "o": ["ウォード法などの階層的クラスタリング", "クラスタ数を先に与えるk-means法", "ラベル付きデータを使うロジスティック回帰", "行動と報酬で学習するQ学習"], "e": "階層的クラスタリングは併合の過程をデンドログラムに表し、切る高さを変えるだけで後からクラスタ数を選べる。k-means法は実行前にクラスタ数kを与える必要がある。"},
{"c": 3, "q": "同じデータと同じクラスタ数でk-means法を何度か実行したところ、実行ごとに異なるクラスタ分けが得られた。主な原因として最も適切なものはどれか。", "o": ["初期の重心をランダムに選ぶため、異なる局所解に収束することがある", "各データの割り当てを毎回確率的に決めるため、収束しないことがある", "重心を中央値で更新するため、同点のデータの扱いが実行ごとに変わる", "クラスタ数を自動で推定するため、実行ごとに異なるクラスタ数になる"], "e": "k-means法は初期重心に依存し、局所解に落ちる。複数回実行して目的関数が最小のものを選ぶ、初期値を工夫するといった対策がとられる。標準的なk-means法の割り当ては最も近い重心への決定的な割り当てで、クラスタ数は利用者が与える。"},
{"c": 3, "q": "k-means法でクラスタ数kを決めるため、kを1から順に増やしてクラスタ内の二乗誤差の合計を描いたところ、k=4までは急に下がり、それ以降はほとんど下がらなかった。この描き方で目安とするkと手法の組み合わせとして最も適切なものはどれか。", "o": ["エルボー法で k=4 を目安とする", "エルボー法で誤差が最も小さくなるkを選ぶ", "ウォード法で k=1 を目安とする", "ブートストラップ法で k=4 を目安とする"], "e": "エルボー法は、kを増やしても誤差の減り方が急に鈍くなる「ひじ」の位置をkの目安にする。誤差はkを増やすほど必ず下がるので、最小値を選ぶとデータ数と同じkに近づいて意味がない。"},
{"c": 3, "q": "工場のセンサデータ（温度［℃］、圧力［kPa］、振動［mm/s］）に主成分分析をかける前に、各変数を標準化することが多い。その理由として最も適切なものはどれか。", "o": ["分散の大きい変数が単位の違いだけで第1主成分を支配してしまうのを防ぐため", "主成分の数を変数の数より多くして、情報を増やすため", "各主成分どうしに相関を持たせて、解釈しやすくするため", "データに正解ラベルを付けて、教師あり学習として扱うため"], "e": "主成分分析は分散が最大の方向を探すため、単位の取り方で数値が大きい変数ほど重視されてしまう。標準化で尺度をそろえると、単位の影響を除ける。主成分どうしは無相関になるように作られ、数は元の変数の数以下である。"},
{"c": 3, "q": "ネット書店で「この本を買った人はこんな本も買っています」という推薦を、本の内容情報を使わずに、購入履歴の共起だけから作りたい。最も適切な手法はどれか。", "o": ["アイテムベースの協調フィルタリング", "本の説明文を使うコンテンツベースフィルタリング", "書籍の価格を予測する線形回帰", "書籍の表紙画像を並べるt-SNE"], "e": "アイテムベースの協調フィルタリングは、同じ利用者に一緒に購入されやすい商品どうしを類似とみなして推薦する。コンテンツベースフィルタリングは商品の内容の特徴を使うため、「内容情報を使わない」という条件に合わない。"},
{"c": 3, "q": "新聞社が過去10年分、数十万件の記事を持っているが、記事に分類ラベルは付いていない。記事全体でどのような話題がどの程度扱われてきたかを、単語の出現傾向から把握したい。最も適切な手法はどれか。", "o": ["潜在的ディリクレ配分法（LDA）", "サポートベクターマシン", "ベクトル自己回帰モデル", "ε-greedy方策"], "e": "LDAはラベルなしの文書集合から、文書ごとのトピックの混合比と、トピックごとの単語分布を推定するトピックモデルである。サポートベクターマシンは正解ラベルが必要な分類手法、ε-greedyは強化学習の行動選択の方策。"},
{"c": 3, "q": "ある店舗の月次売上の予測を、他の変数は使わず、その店舗自身の過去数か月の売上だけから行いたい。最も適切なモデルはどれか。", "o": ["自己回帰（AR）モデル", "ベクトル自己回帰（VAR）モデル", "k-means法", "主成分分析"], "e": "ARモデルは1つの時系列の現在値を自分自身の過去の値の線形結合で表す。VARモデルは互いに影響し合う複数の時系列を同時に扱うモデルで、1系列だけの予測には必要ない。"},
{"c": 3, "q": "ウェブ広告で4種類のバナー案がある。どれが最もクリックされやすいかは不明だが、テスト期間を別に設けず、配信しながらクリックされやすい案に配信を寄せていきたい。この課題の定式化として最も適切なものはどれか。", "o": ["多腕バンディット問題", "主成分分析による次元削減", "デンドログラムによる階層的な分類", "マルチラベル分類"], "e": "各バナーを腕とみなし、探索（情報の少ない案も配信する）と活用（良さそうな案に寄せる）を両立させる多腕バンディット問題として扱える。ε-greedyやUCBなどの方策が使われる。"},
{"c": 3, "q": "健康診断の一次検査で、病気の人をなるべく見逃さず二次検査に回したい。陽性と判定した人のうち一部が健康でも、二次検査で除外できる。このとき最も重視すべき評価指標はどれか。", "o": ["再現率", "適合率", "特異度", "正解率"], "e": "再現率は実際の陽性のうち陽性と判定できた割合で、見逃し（偽陰性）の少なさを表す。適合率は陽性判定の当たりの割合、特異度は陰性を陰性と判定できた割合で、見逃しを直接は表さない。"},
{"c": 3, "q": "社内の迷惑メールフィルタで、迷惑メールと判定されたメールは自動で削除される。重要な取引先のメールが誤って消されることを最も避けたい。このとき最も重視すべき評価指標はどれか。", "o": ["迷惑メールを陽性としたときの適合率", "迷惑メールを陽性としたときの再現率", "迷惑メールを陽性としたときの偽陰性率", "陽性・陰性を合わせた全体の件数"], "e": "迷惑メールと判定したもののうち本当に迷惑メールである割合（適合率）が高ければ、正常なメールを誤って消す偽陽性が少ない。再現率は迷惑メールをどれだけ取りこぼさないかを表す指標である。"},
{"c": 3, "q": "中古車価格の予測モデルを比較する。データには入力ミスによる極端な価格が少し含まれており、それらに評価が引きずられないようにしたい。最も適切な評価指標はどれか。", "o": ["平均絶対誤差（MAE）", "平均二乗誤差（MSE）", "二乗平均平方根誤差（RMSE）", "適合率（Precision）"], "e": "MAEは誤差の絶対値の平均で、誤差を二乗するMSEやRMSEより大きな誤差の影響を受けにくい。適合率は分類の指標で、回帰の評価には使わない。"},
{"c": 3, "q": "不良品が全体の2%しかないデータで5分割交差検証を行ったところ、分割によって検証側の不良品の件数が大きくばらつき、評価が安定しなかった。最も適切な対策はどれか。", "o": ["各分割のクラスの比率が全体と同じになるよう層化して分割する", "分割数を2に減らし、1回あたりの検証データを多くする", "データをシャッフルせず、記録された順のまま分割する", "不良品のデータを検証側だけに集めて分割する"], "e": "層化k分割交差検証は、各分割のクラス比率を元のデータとそろえるため、少数クラスの件数のばらつきを抑えられる。不良品を検証側だけに集めると、学習側で不良品を学べなくなる。"},
{"c": 3, "q": "希少疾患の症例データが30件しかない。できるだけ多くのデータを学習に使いつつ、全件を一度ずつ評価に使って性能を見積もりたい。最も適切な検証方法はどれか。", "o": ["1件ずつ検証に回す一個抜き交差検証（LOOCV）", "7割で学習し3割で検証するホールドアウト法", "全30件で学習し同じ30件で評価する方法", "30件を学習に使わず評価だけに使う方法"], "e": "一個抜き交差検証は、1件を検証、残り29件を学習とする評価を30回繰り返すので、少ないデータを最大限学習に使える。学習と同じデータで評価すると過学習を見抜けない。"},
{"c": 3, "q": "2種類のセンサー値で良品と不良品を分類したい。散布図を描くと、不良品は中央に集まり、良品がその周りを円状に取り囲んでいて、線形SVMではうまく分けられなかった。対処として最も適切なものはどれか。", "o": ["RBFカーネルなどのカーネル法を使い、曲線の境界で分けられるようにする", "特徴量を標準化して尺度をそろえ、同じ線形SVMで学習し直す", "k-means法で2つのクラスタに分け、クラスタ番号をそのまま予測結果とする", "線形回帰で良品を1、不良品を0として予測し、0.5を境に分ける"], "e": "円状に取り囲む配置は直線（超平面）では分けられないが、カーネル法で高次元に写したのと同じ効果を得れば非線形の境界で分けられる。標準化は尺度をそろえるだけで配置の形は変わらず、k-meansは正解ラベルを使わないうえ円状の構造を分けにくく、線形回帰を0.5で区切っても境界は直線になる。"},
{"c": 3, "q": "病院のX線画像で分類モデルを作る。1人の患者から複数枚の画像があるが、画像単位でランダムに訓練用とテスト用へ分けたところ、テストの成績が実運用より大幅に高く出た。最も適切な対策はどれか。", "o": ["同じ患者の画像が訓練とテストの両方に入らないよう、患者単位で分割する", "テスト画像の枚数を増やすため、訓練画像をテスト側にも複製する", "患者の年齢順に並べ替えてから、画像単位でランダムに分割する", "訓練の回数を増やし、テストの成績がさらに上がるまで学習する"], "e": "同じ患者の似た画像が両側に入ると、モデルは患者固有の特徴を覚えるだけでテストに正解でき、評価が過大になる（データリーケージの一種）。患者などのグループ単位で分割するのが適切。"},
{"c": 3, "q": "訓練データの量を増やしながら訓練誤差と検証誤差を描いた学習曲線で、訓練誤差は低いまま、検証誤差は大きいがデータを増やすほど下がり続けていた。次に取る手として最も適切なものはどれか。", "o": ["データを増やすと汎化性能の改善が見込めるので、データの追加を検討する", "未学習の状態なので、正則化を強めてモデルをより単純にする", "検証誤差はこれ以上下がらないので、データの追加は打ち切る", "訓練誤差が低いのでモデルは完成しており、検証は不要になる"], "e": "訓練誤差と検証誤差の差が大きいのはバリアンスが大きい（過学習気味の）状態で、データ量とともに検証誤差が下がり続けているなら、データの追加が有効と考えられる。正則化を強めて単純にするのは未学習ではなく過学習への対策。"},
{"c": 3, "q": "次の3つの課題と、それに主に使われる学習の枠組みの組み合わせとして最も適切なものはどれか。（1）過去の入居率と正解の家賃から新しい物件の家賃を予測する（2）会員を行動の似た集団に分ける（3）ロボットが転ばずに歩けたら得点が入る仕組みで歩き方を身につける", "o": ["（1）教師あり （2）教師なし （3）強化学習", "（1）教師なし （2）教師あり （3）強化学習", "（1）教師あり （2）強化学習 （3）教師なし", "（1）強化学習 （2）教師なし （3）教師あり"], "e": "正解の家賃がある予測は教師あり学習（回帰）、ラベルなしのグループ分けは教師なし学習（クラスタリング）、試行錯誤で報酬を最大化する行動を身につけるのは強化学習にあたる。"},
{"c": 3, "q": "線形回帰モデルをテストデータで評価したところ、決定係数 R² が −0.2 になった。この結果の解釈として最も適切なものはどれか。", "o": ["常に目的変数の平均値を予測するよりも、予測が悪いことを示す", "予測と実測の相関が負で、予測値を反転すればR²が0.2になる", "決定係数は0から1の値なので、計算ミスとして扱うしかない", "説明変数の20%が目的変数と負の相関を持つことを示す"], "e": "R²＝1−（残差の二乗和）/（平均からの偏差の二乗和）なので、平均値を予測し続けるより残差が大きいと負になる。テストデータや制約のないモデルでは負になり得るので、計算ミスとは限らない。"},
{"c": 3, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「勾配ブースティングでは、それまでのモデルの予測と正解との（ア）を新しい決定木で学習し、少しずつ加えていく。1本ごとの寄与を小さくする（イ）を小さくすると、多くの木が必要になるが過学習しにくくなる。」", "o": ["（ア）残差 （イ）学習率", "（ア）重心 （イ）学習率", "（ア）残差 （イ）割引率", "（ア）重心 （イ）割引率"], "e": "勾配ブースティングは、損失の勾配（二乗誤差なら残差）を次の弱学習器に学習させて足し合わせる。学習率（縮小率）を小さくすると1本ごとの修正が控えめになる。割引率は強化学習、重心はk-means法の用語。"},
{"c": 3, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「SARSAは、学習中に実際に従っている方策で次の行動を選び、その価値で更新するので（ア）の手法である。Q学習は、実際の行動とは無関係に次状態の最大の行動価値で更新するので（イ）の手法である。」", "o": ["（ア）方策オン型 （イ）方策オフ型", "（ア）方策オフ型 （イ）方策オン型", "（ア）モデルベース （イ）方策オン型", "（ア）方策オン型 （イ）モデルベース"], "e": "行動に使う方策と更新に使う方策が同じSARSAは方策オン型、更新では貪欲方策を使い行動方策と切り離しているQ学習は方策オフ型である。どちらも環境のモデルを学習しないモデルフリーの手法。"},
{"c": 3, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「強化学習で、各状態でどの行動をとるかを定める規則を（ア）という。ある状態から（ア）に従って行動したときに得られる収益の期待値を（イ）という。」", "o": ["（ア）方策 （イ）状態価値", "（ア）報酬 （イ）状態価値", "（ア）方策 （イ）割引率", "（ア）報酬 （イ）方策"], "e": "方策は状態から行動（またはその確率）を決める規則、状態価値はその状態から方策に従ったときの収益の期待値である。報酬は1ステップごとに環境から得る値、割引率は将来の報酬を割り引く係数。"},
{"c": 3, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「売上金額（円）を予測するモデルで、MSEの単位は（ア）になるが、その平方根をとったRMSEは（イ）になり、予測誤差の大きさとして解釈しやすい。」", "o": ["（ア）円の二乗 （イ）円", "（ア）円 （イ）円の二乗", "（ア）円の二乗 （イ）単位なしの比率", "（ア）単位なしの比率 （イ）円"], "e": "MSEは誤差を二乗して平均するので単位も二乗になり、平方根をとったRMSEは目的変数と同じ単位に戻る。単位のない比率で表されるのは決定係数などである。"},
{"c": 3, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「k近傍法でkを1のように小さくすると、訓練データの個々の点に敏感になり（ア）が大きくなりやすい。逆にkをデータ数に近いほど大きくすると、どこでも同じような予測になり（イ）が大きくなりやすい。」", "o": ["（ア）バリアンス （イ）バイアス", "（ア）バイアス （イ）バリアンス", "（ア）バイアス （イ）ノイズ", "（ア）ノイズ （イ）バリアンス"], "e": "kが小さいと境界が複雑で訓練データの違いに大きく左右される（高バリアンス）。kが大きいと境界が単純になりすぎて真の傾向を捉えにくい（高バイアス）。ノイズはデータ自体のばらつきでkの選び方では減らせない。"},
{"c": 3, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「モデルの候補や正則化の強さは（ア）データでの成績を見て選ぶ。最後に選んだモデルの汎化性能は、それまで一度も使っていない（イ）データで1回だけ評価する。」", "o": ["（ア）検証 （イ）テスト", "（ア）テスト （イ）検証", "（ア）訓練 （イ）検証", "（ア）テスト （イ）訓練"], "e": "ハイパーパラメータの調整には検証データを使う。テストデータで調整を繰り返すと、テストデータに合わせ込むことになり汎化性能を過大評価する。"},
{"c": 3, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「3クラスの分類で、クラスごとに適合率を求めて単純に平均するのが（ア）平均で、少数クラスの成績も同じ重みで反映される。全クラスのTPとFPを合算してから適合率を求めるのが（イ）平均で、件数の多いクラスの影響が大きい。」", "o": ["（ア）マクロ （イ）マイクロ", "（ア）マイクロ （イ）マクロ", "（ア）マクロ （イ）移動", "（ア）移動 （イ）マイクロ"], "e": "マクロ平均はクラスごとの指標の単純平均で、不均衡データで少数クラスの成績を見るのに向く。マイクロ平均は全体を合算して計算するため、多数クラスの成績に引っ張られる。移動平均は時系列の平滑化の手法。"},
{"c": 3, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「リッジ回帰やラッソ回帰で正則化の強さλを大きくしすぎると、係数が小さく抑えられすぎて（ア）に近づく。逆にλを0に近づけると、正則化のない回帰に近づき（イ）が起きやすくなる。」", "o": ["（ア）未学習 （イ）過学習", "（ア）過学習 （イ）未学習", "（ア）過学習 （イ）多重共線性の解消", "（ア）未学習 （イ）次元の削減"], "e": "λが大きいほど係数への罰則が強まり、モデルが単純になりすぎて未学習（高バイアス）に近づく。λを小さくすると罰則が弱まり、訓練データに合わせ込みすぎる過学習が起きやすい。"},
{"c": 3, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「ランダムフォレストでは、各決定木を（ア）で作った訓練データで学習する。この抽出に一度も選ばれなかったデータは（イ）データと呼ばれ、追加の検証データを用意しなくても汎化性能の見積もりに使える。」", "o": ["（ア）復元抽出 （イ）OOB（Out-of-Bag）", "（ア）非復元抽出 （イ）OOB（Out-of-Bag）", "（ア）復元抽出 （イ）ホールドアウト", "（ア）層化抽出 （イ）テスト"], "e": "ブートストラップ（復元抽出）では、元と同じ件数を抽出しても約37%のデータが選ばれずに残る。これがOOBデータで、各木にとって未使用のデータとして評価に使える。"},
{"c": 3, "q": "バギングとブースティングの比較として最も適切なものはどれか。", "o": ["バギングは主にバリアンスを、ブースティングは主にバイアスを減らす効果が大きい", "バギングは主にバイアスを、ブースティングは主にバリアンスを減らす効果が大きい", "バギングもブースティングも、学習器を前から順に1つずつしか学習できない", "バギングもブースティングも、学習器を1つにまとめずに最良のものだけ使う"], "e": "バギングは独立に学習した学習器の平均でばらつき（バリアンス）を抑え、ブースティングは前の誤りを補う学習器を足してバイアスを下げる。バギングは並列に学習でき、どちらも複数の学習器の結果をまとめて使う。"},
{"c": 3, "q": "線形回帰とロジスティック回帰の比較として最も適切なものはどれか。", "o": ["線形回帰は線形結合をそのまま出力し、ロジスティック回帰はそれをシグモイド関数で0〜1の確率に変換する", "線形回帰は線形結合をシグモイド関数で0〜1の確率に変換し、ロジスティック回帰はそれをそのまま出力する", "線形回帰もロジスティック回帰も、最小二乗法の正規方程式によって係数が一度の計算で厳密に求まる", "線形回帰もロジスティック回帰も、カーネル関数で入力を高次元に写してから係数を求める手法である"], "e": "線形回帰は連続値を予測する回帰手法で、ロジスティック回帰は線形結合をシグモイド関数に通して確率を出す分類手法である。ロジスティック回帰の係数は尤度の最大化を反復計算で解き、正規方程式のような閉じた解はない。カーネル関数で高次元に写すのはカーネル法（SVMなど）の考え方。"},
{"c": 3, "q": "主成分分析（PCA）とt-SNEの比較として最も適切なものはどれか。", "o": ["PCAは線形変換で新しいデータも同じ軸へ写せるが、t-SNEは非線形で局所的な近さを重視する", "PCAは非線形で局所的な近さを重視するが、t-SNEは線形変換で新しいデータも同じ軸へ写せる", "PCAもt-SNEも、正解ラベルを使って各クラスが離れるように軸を選ぶ", "PCAもt-SNEも、得られた軸は元の変数の重みつき和として解釈できる"], "e": "PCAは分散最大の方向への線形射影で、得た変換行列を新しいデータにも適用できる。t-SNEは近いデータが近くに並ぶよう配置する非線形の可視化手法で、軸に意味はなく、クラスタ間の距離も解釈しにくい。"},
{"c": 3, "q": "k近傍法とロジスティック回帰の、学習時と予測時の計算の比較として最も適切なものはどれか。", "o": ["k近傍法は学習時はデータを保存するだけで、予測時に全訓練データとの距離を計算する", "k近傍法は学習時に重みを最適化し、予測時は重みと入力の積を計算するだけでよい", "ロジスティック回帰は学習時はデータを保存するだけで、予測時に全データとの距離を計算する", "ロジスティック回帰もk近傍法も、予測時には訓練データを参照せずに済む"], "e": "k近傍法は怠惰学習とも呼ばれ、事前にモデルを作らず、予測のたびに訓練データとの距離を計算するため予測が重くなりやすい。ロジスティック回帰は学習で重みを求めておき、予測は重みと入力の計算だけで済む。"},
{"c": 3, "q": "リッジ回帰（L2正則化）とラッソ回帰（L1正則化）の比較として最も適切なものはどれか。", "o": ["リッジは係数を全体に小さくするがちょうど0にはなりにくく、ラッソは一部の係数をちょうど0にしやすい", "リッジは一部の係数をちょうど0にしやすく、ラッソは係数を全体に小さくするが0にはなりにくい", "リッジは係数の絶対値の和を、ラッソは係数の二乗和を罰則として損失に加える", "リッジとラッソはどちらも、正則化の強さを大きくすると係数が大きくなる"], "e": "L2の罰則（係数の二乗和）は係数を滑らかに縮めるが0にはしにくく、L1の罰則（絶対値の和）は一部の係数を0にして特徴量選択の働きをする。正則化を強めると係数は小さくなる。"},
{"c": 3, "q": "多腕バンディット問題と、一般的な強化学習（マルコフ決定過程）の違いとして最も適切なものはどれか。", "o": ["バンディット問題では行動が次の状態を変えず、一般的な強化学習では行動によって状態が移り変わる", "バンディット問題では報酬が得られず、一般的な強化学習では毎回報酬が得られる", "バンディット問題では探索が不要で、一般的な強化学習では探索と活用の両立が必要になる", "バンディット問題では正解ラベルを使い、一般的な強化学習では正解ラベルを使わない"], "e": "バンディット問題は状態の遷移がなく、どの腕を引くかの報酬だけを扱う単純な設定である。一般的な強化学習では行動が次の状態に影響するため、将来の報酬まで考えて行動を選ぶ必要がある。探索と活用のトレードオフは両方にある。"},
{"c": 3, "q": "状態価値関数 V(s) と行動価値関数 Q(s, a) の関係として最も適切なものはどれか。", "o": ["V(s)は、状態sで方策が各行動を選ぶ確率でQ(s, a)を重み付けして平均したものに等しい", "Q(s, a)は、状態sで全ての行動のV(s)を足し合わせたものに等しい", "V(s)は、状態sで行動aをとった直後の報酬だけを表し、Q(s, a)は将来の報酬を表す", "V(s)とQ(s, a)は同じ量で、状態の数か行動の数かで呼び方が変わるだけである"], "e": "V(s)＝Σ_a π(a|s)Q(s, a) の関係があり、行動価値を方策の確率で平均すると状態価値になる。どちらも将来の報酬まで含んだ収益の期待値で、行動を指定するかどうかが違う。"},
{"c": 3, "q": "協調フィルタリングとコンテンツベースフィルタリングを、まだ誰も購入していない新商品の推薦で比べた説明として最も適切なものはどれか。", "o": ["コンテンツベースは商品の属性から似た商品を探せるので、購入履歴のない新商品も推薦できる", "協調フィルタリングは他の利用者の購入履歴を使うので、履歴のない新商品ほど推薦しやすい", "コンテンツベースは他の利用者の購入履歴だけを使うので、新商品は推薦できない", "どちらの方式も商品の属性だけを使うので、新商品かどうかで違いは生じない"], "e": "協調フィルタリングは利用者と商品の評価や購入の履歴に頼るため、履歴のない新商品はコールドスタート問題で推薦しにくい。コンテンツベースは商品のジャンルや説明などの特徴を使うので、新商品にも適用できる。"},
{"c": 3, "q": "「分類」と「クラスタリング」の違いとして最も適切なものはどれか。", "o": ["分類は正解ラベルのある訓練データから所属クラスを予測し、クラスタリングはラベルなしでデータを似たもの同士にまとめる", "分類はラベルなしでデータをまとめ、クラスタリングは正解ラベルのある訓練データから所属クラスを予測する", "分類は連続値を予測し、クラスタリングは離散値を予測するという出力の違いだけである", "分類とクラスタリングは同じ手法の別名で、使われる分野によって呼び方が異なる"], "e": "分類は教師あり学習で、あらかじめ決まったクラスとその正解例から学習する。クラスタリングは教師なし学習で、どのようなグループがあるかもデータから見つける。連続値の予測は回帰である。"},
{"c": 3, "q": "Q学習の1ステップの処理を正しい順に並べたものはどれか。（a）ε-greedyなどで行動を選んで実行する（b）現在の状態を観測する（c）報酬と次の状態を受け取る（d）Q(s, a)を更新する", "o": ["（b）→（a）→（c）→（d）", "（a）→（b）→（d）→（c）", "（b）→（d）→（a）→（c）", "（c）→（b）→（a）→（d）"], "e": "状態を観測して行動を選び、実行した結果として報酬と次の状態を受け取ってから、それらを使ってQ(s, a)を更新する。報酬と次状態が分からないうちは更新式の目標値が計算できない。"},
{"c": 3, "q": "方策勾配法のREINFORCEで学習が不安定になりやすい原因と、その対策の組み合わせとして最も適切なものはどれか。", "o": ["エピソードごとの収益のばらつきで勾配の推定の分散が大きいので、ベースラインを引いて分散を下げる", "方策が決定的で探索が起きないので、割引率を0にして直後の報酬だけで学習する", "収益を推定値で置き換えるので偏りが大きいので、エピソードをさらに短く区切って学習する", "行動価値の最大値で更新するので過大評価が起きるので、行動の数を1つに減らす"], "e": "REINFORCEは実際の収益で勾配を推定するため偏りはないが分散が大きい。収益からベースライン（状態価値の推定など）を引くと期待値を変えずに分散を減らせ、これを価値関数で行う発展がActor-Criticである。"},
{"c": 3, "q": "ε-greedy方策で、学習の初めはεを大きくし、学習が進むにつれてεを小さくしていくことが多い。その理由として最も適切なものはどれか。", "o": ["初めは行動価値の推定が不確かなので広く探索し、推定が固まるにつれて活用を増やすため", "初めは報酬が得られないので、推定価値が最大の行動だけを選んで早く収束させるため", "εを小さくすると割引率も小さくなり、遠い将来の報酬を無視できるようになるため", "εを大きくし続けると学習率が0になり、行動価値が更新されなくなるため"], "e": "εはランダムに行動する確率で、推定が当てにならない序盤は探索を多くし、推定が安定した後は最良と推定される行動を多く選んで報酬を稼ぐ。εは割引率や学習率とは別のハイパーパラメータである。"},
{"c": 3, "q": "終わりのない継続タスクの強化学習で、割引率γを1ではなく1未満（例：0.99）に設定する理由として最も適切なものはどれか。", "o": ["γ=1だと無限に続く報酬の和が発散することがあり、1未満なら収益が有限の値に収まるため", "γ=1だと直後の報酬しか考慮されず、長期的な行動が学習できなくなるため", "γ=1だと方策がランダムになり、行動価値関数が定義できなくなるため", "γ=1だと学習率も1に固定され、更新のたびに値が振動するため"], "e": "毎ステップ正の報酬が入る継続タスクでγ=1とすると収益が無限大になり得る。γ＜1なら例えば毎回報酬1でも収益は1/(1−γ)に収束する。直後の報酬しか考えないのはγを0に近づけた場合。"},
{"c": 3, "q": "ある継続タスクで、エージェントは毎ステップ報酬2を受け取り続ける。割引率γ=0.8のとき、現在時刻からの割引収益（無限和）はどれか。", "o": ["10", "2.5", "8", "無限大に発散する"], "e": "割引収益は 2＋2×0.8＋2×0.8²＋… の等比級数で、2/(1−0.8)＝10 に収束する。2.5は2/0.8と割り算を取り違えた値で、γ＜1なので発散はしない。"},
{"c": 3, "q": "教師あり学習でモデルを作って評価する作業を、正しい順に並べたものはどれか。（a）訓練データだけで前処理の統計量を求め、学習する（b）データを訓練・検証・テストに分ける（c）テストデータで最終評価を1回行う（d）検証データの成績でハイパーパラメータを選ぶ", "o": ["（b）→（a）→（d）→（c）", "（a）→（b）→（d）→（c）", "（b）→（a）→（c）→（d）", "（a）→（d）→（b）→（c）"], "e": "先に分割してから、訓練データだけで前処理と学習を行うことでリーケージを防ぐ。ハイパーパラメータは検証データで選び、テストデータは最後の評価だけに使う。前処理を分割前に行うとテスト側の情報が漏れる。"},
{"c": 3, "q": "交差検証に関する記述として適切でないものはどれか。", "o": ["k分割交差検証では、各分割の検証データを学習にも使うため評価が甘くなる", "k分割交差検証では、全データがちょうど1回ずつ検証に使われる", "分割数kを大きくすると、1回あたりの学習データが増え、学習の回数も増える", "時系列データでは、未来のデータで学習して過去を検証しないよう分割を工夫する"], "e": "k分割交差検証では、各回で検証に使う1分割はその回の学習から外されるので、同じデータを学習と検証に同時に使うことはない。他の記述はいずれも交差検証の性質や注意点として正しい。"},
{"c": 3, "q": "2値分類の評価指標に関する記述として適切でないものはどれか。", "o": ["特異度は、陽性と判定したもののうち実際に陽性だったものの割合である", "再現率は、実際の陽性のうち陽性と判定できたものの割合である", "偽陽性率は、1から特異度を引いた値に等しい", "F値は、適合率と再現率の調和平均である"], "e": "陽性と判定したもののうち実際に陽性だった割合は適合率。特異度は実際の陰性のうち陰性と判定できた割合で、TN/(TN＋FP)である。そのため偽陽性率＝1−特異度が成り立つ。"},
{"c": 3, "q": "クラスタリングや次元削減の手法に関する記述として適切でないものはどれか。", "o": ["主成分分析では、第1主成分と第2主成分が強い正の相関を持つように軸を選ぶ", "ウォード法は、併合による群内の平方和の増加が最小のクラスタどうしを併合する", "多次元尺度構成法は、対象間の距離関係をなるべく保つように低次元に配置する", "k-means法は、各点と所属クラスタの重心との距離の二乗和を小さくするよう反復する"], "e": "主成分分析の各主成分は互いに直交し、主成分得点どうしは無相関になるように作られる。他の記述はウォード法、多次元尺度構成法、k-means法の説明として正しい。"},
{"c": 3, "q": "強化学習に関する記述として適切でないものはどれか。", "o": ["Q学習では、環境の状態遷移確率をあらかじめ正確に与えなければ学習できない", "エージェントは試行錯誤で得られる報酬をもとに、収益が大きくなる方策を学習する", "行動の良し悪しが、しばらく後の報酬によって初めて分かる場合がある", "ε-greedy方策は、確率εでランダムに行動を選ぶことで探索を行う"], "e": "Q学習は、環境のモデル（状態遷移確率や報酬関数）を知らなくても、実際に行動して得た報酬と次状態から行動価値を更新できるモデルフリーの手法である。報酬が遅れて得られることや、ε-greedyによる探索は強化学習の説明として正しい。"},
{"c": 3, "q": "アンサンブル学習に関する記述として適切でないものはどれか。", "o": ["ランダムフォレストでは、全ての決定木が同じ訓練データと同じ特徴量で学習する", "ランダムフォレストでは、分岐ごとに一部の特徴量だけを候補にして木どうしの相関を下げる", "ブースティングでは、前の学習器が苦手としたデータを次の学習器が重点的に学習する", "バギングでは、復元抽出で作った複数の訓練データで学習器を並列に学習できる"], "e": "ランダムフォレストは、木ごとにブートストラップ標本を使い、分岐ごとに特徴量を無作為に絞ることで多様な木を作る。全ての木が同じデータ・同じ特徴量で学習すると、ほぼ同じ木になりアンサンブルの効果が失われる。"},
{"c": 3, "q": "回帰モデルの評価に関する記述として適切でないものはどれか。", "o": ["MAEは誤差を二乗してから平均するため、大きな誤差を特に強く罰する", "RMSEはMSEの平方根で、目的変数と同じ単位になる", "決定係数は1に近いほど、目的変数のばらつきをよく説明していることを示す", "MSEもMAEも、値が小さいほど予測が実測に近いことを示す"], "e": "MAEは誤差の絶対値の平均で、大きな誤差を二乗して強く罰するのはMSEやRMSEである。他の記述はRMSE、決定係数、MSEとMAEの性質として正しい。"});

{"c": 4, "q": "単純パーセプトロンの学習規則 w ← w + η(t − y)x を考える。重み w=(0.2, −0.4)、バイアス0.1、学習率η=0.1、入力 x=(1, 2)、正解 t=1 で、出力yは w・x+バイアス が0を超えれば1、それ以外は0とする。この1回の更新後の重みはどれか。", "o": ["(0.3, −0.2)", "(0.1, −0.6)", "(1.2, 1.6)", "(0.3, −0.3)"], "e": "w・x+バイアス=0.2−0.8+0.1=−0.5なので出力は0で、t−y=1となり、w+0.1×(1, 2)=(0.3, −0.2)となる。(0.1, −0.6)は符号を逆にした値、(1.2, 1.6)は学習率を掛け忘れた値である。"},
{"c": 4, "q": "早期終了を「検証損失がそれまでの最小値を下回らないエポックが3回続いたら打ち切り、最小値を記録したエポックの重みを採用する」と設定した。エポック1〜8の検証損失が順に 0.50, 0.42, 0.38, 0.40, 0.39, 0.41, 0.37, 0.36 となる場合の結果はどれか。", "o": ["エポック6で打ち切り、エポック3の重みを採用する", "エポック4で打ち切り、エポック3の重みを採用する", "エポック8まで学習し、エポック8の重みを採用する", "エポック6で打ち切り、エポック6の重みを採用する"], "e": "最小値0.38はエポック3で、エポック4〜6はいずれも0.38を下回らないので3回目のエポック6で打ち切り、エポック3の重みに戻す。エポック8まで続くのは直前のエポックとだけ比べた場合で、エポック5の0.39を改善とみなす誤りである。"},
{"c": 4, "q": "回帰を行うネットワークで、損失を L = (1/2)Σ(yᵢ − tᵢ)² と定義する。予測 y=(2, 4, 6)、正解 t=(3, 4, 8) のとき、損失Lの値はどれか。", "o": ["2.5", "5.0", "1.67", "0.83"], "e": "誤差の二乗は1, 0, 4で和は5、係数1/2を掛けて2.5となる。5.0は1/2を掛け忘れた値、1.67はデータ数で割った平均二乗誤差の値である。"},
{"c": 4, "q": "損失E(w)にL2正則化項 (λ/2)w² を加えて勾配降下法で学習する。w=2、∂E/∂w=1、λ=0.5、学習率0.1のとき、1回の更新後のwはどれか。", "o": ["1.8", "1.9", "1.7", "2.0"], "e": "正則化項の勾配はλw=1なので、全体の勾配は1+1=2、更新後は2−0.1×2=1.8となる。1.9は正則化項を無視した値、1.7は正則化項の勾配を2λwと誤った値である。"},
{"c": 4, "q": "重みが (0.5, −1, 2) のモデルに、係数λ=0.1のL1正則化を適用する。損失に加わる罰則項の値はどれか。", "o": ["0.35", "0.15", "0.525", "3.5"], "e": "L1の罰則項はλ×(|0.5|+|−1|+|2|)=0.1×3.5=0.35である。0.15は絶対値を取らずに足した値、0.525は二乗和を用いたL2正則化の値、3.5はλを掛け忘れた値。"},
{"c": 4, "q": "ドロップアウト率（ユニットを無効化する確率）0.2で学習したネットワークがある。学習時には出力の補正を行わない実装の場合、推論時に各ユニットの出力へ掛ける値はどれか。", "o": ["0.8", "0.2", "1.25", "5.0"], "e": "学習時は平均して80%のユニットしか働かないので、推論時は全ユニットの出力に残存率0.8を掛けて期待値を合わせる。1.25は学習時に残ったユニットを1/0.8倍する逆ドロップアウト（inverted dropout）で用いる値である。"},
{"c": 4, "q": "損失関数 L(w) = w² を勾配降下法で最小化する。初期値 w=3、学習率0.1で2回更新した後のwはどれか。", "o": ["1.92", "2.40", "2.43", "1.80"], "e": "勾配は2wなので1回の更新でw←w−0.1×2w=0.8wとなり、2回で3×0.8²=1.92となる。2.40は1回分、2.43は勾配をwと誤った値、1.80は最初の勾配6を2回使い回した値である。"},
{"c": 4, "q": "損失関数 L(w) = w² に学習率ηの勾配降下法を適用すると、更新は w ← (1 − 2η)w となる。次の学習率のうち、wが0に収束せず発散するものはどれか。", "o": ["η = 1.2", "η = 0.9", "η = 0.4", "η = 0.1"], "e": "|1−2η|<1、つまり0<η<1なら収束し、η=1.2では係数が−1.4となり符号を変えながら大きくなる。η=0.9は係数−0.8で振動しながらも収束する。"},
{"c": 4, "q": "Adamでは1次モーメント m ← β₁m + (1 − β₁)g を計算し、初期値0による偏りを m̂ = m / (1 − β₁ᵗ) で補正する。β₁=0.9、m の初期値0、最初のステップ（t=1）の勾配 g=2 のとき、補正後の m̂ はどれか。", "o": ["2", "0.2", "1.8", "20"], "e": "m=0.1×2=0.2で、1−0.9¹=0.1で割ると2になり、初期の過小評価が補正される。0.2は補正前の値、1.8はβ₁とその補数を取り違えた値、20は補正を2回掛けた値である。"},
{"c": 4, "q": "AdaGradは h ← h + g² を累積し、w ← w − η·g/√h で更新する。h の初期値0、学習率η=0.1で、1回目の勾配が3、2回目の勾配が4だった。2回目の更新量（wの減少量）はどれか。", "o": ["0.08", "0.40", "0.10", "0.016"], "e": "2回目の時点でh=9+16=25なので、更新量は0.1×4/√25=0.08となる。0.40は勾配をそのまま使った通常のSGDの値、0.10は2回目の勾配の二乗だけで割った値、0.016は√を取り忘れた値。"},
{"c": 4, "q": "コサイン減衰の学習率スケジュール ηₜ = η_min + (1/2)(η_max − η_min)(1 + cos(πt/T)) を用いる。η_max=0.1、η_min=0、全ステップ数T=300のとき、t=100での学習率はどれか。", "o": ["0.075", "0.025", "0.067", "0.050"], "e": "cos(π/3)=0.5なので0.5×0.1×1.5=0.075となる。0.025は(1−cos)としてしまった値、0.067は線形に減衰させた場合の値、0.050は中間点t=150での値である。"},
{"c": 4, "q": "入力側のユニット数（fan-in）が200の全結合層の重みを、ReLU向けのHeの初期値（正規分布）で初期化する。重みの標準偏差はどれか。", "o": ["0.1", "0.071", "0.01", "0.005"], "e": "Heの初期値は分散2/n、標準偏差√(2/200)=0.1である。0.071は分散1/nとするXavierの初期値（fan-inのみの形）の標準偏差、0.01は分散そのものの値。"},
{"c": 4, "q": "ソフトマックス関数と交差エントロピー誤差を組み合わせると、ロジットzに関する損失の勾配は ∂L/∂z = y − t と簡単になる。出力 y=(0.2, 0.5, 0.3)、正解 t=(0, 1, 0) のとき、この勾配はどれか。", "o": ["(0.2, −0.5, 0.3)", "(−0.2, 0.5, −0.3)", "(0, −0.5, 0)", "(0.2, 0.5, 0.3)"], "e": "y−tを成分ごとに計算すると(0.2, −0.5, 0.3)となり、正解クラスのロジットを上げ他を下げる向きの更新になる。(−0.2, 0.5, −0.3)は符号が逆のt−y、(0, −0.5, 0)は正解クラス以外の勾配を0とした誤りである。"},
{"c": 4, "q": "入力 x=(1, 2) を受け取る2層のネットワークがある。隠れ層は h = ReLU(Wx + b)、W=[[1, −1], [0.5, 1]]、b=(0, −1)。出力は y = v・h + c、v=(2, −1)、c=0.5 である（[[a, b], [c, d]] は1行目が (a, b)）。出力yはどれか。", "o": ["−1.0", "−3.0", "−2.0", "−1.5"], "e": "Wx+b=(−1, 1.5)で、ReLUによりh=(0, 1.5)、y=2×0−1.5+0.5=−1.0となる。−3.0はReLUを適用し忘れた値、−2.0は隠れ層のバイアスを足し忘れた値、−1.5は出力のバイアスcを足し忘れた値である。"},
{"c": 4, "q": "ムーアの法則に従い、集積回路のトランジスタ数が2年ごとに2倍になると仮定する。10年後のトランジスタ数は現在の何倍になるか。", "o": ["32倍", "10倍", "20倍", "1024倍"], "e": "10年で倍増が5回起こるので2⁵=32倍になる。10倍は倍増回数を足し合わせた誤り、1024倍は毎年倍増するとした2¹⁰の値である。"},
{"c": 4, "q": "画像分類モデルを学習したところ、訓練データの損失はエポックごとに下がり続けたが、検証データの損失は20エポック目以降に上昇に転じた。この状況の解釈と対策として最も適切なものはどれか。", "o": ["過学習が起きており、早期終了やドロップアウト、データ拡張で汎化性能の改善を図る", "未学習が起きており、層やユニットを増やしてモデルの表現力を高める必要がある", "学習率が小さすぎるので、学習率を大きくして訓練損失をさらに速く下げる", "検証データが少なすぎて信頼できないので、検証データの損失は無視して訓練をそのまま続ける"], "e": "訓練損失が下がる一方で検証損失が上がるのは、訓練データに過剰に適合した過学習の典型である。未学習なら訓練損失自体が高いままになる。"},
{"c": 4, "q": "ある画像分類モデルを学習させたところ、損失は振動せずに滑らかに下がっているが、下がり方が極端に遅く、50エポック後も初期値からわずかしか減っていなかった。勾配の消失は起きていない。最初に検討すべき対策として最も適切なものはどれか。", "o": ["学習率が小さすぎる可能性が高いので、学習率を適切な範囲まで大きくして試す", "学習率が大きすぎる可能性が高いので、学習率をさらに小さくして慎重に更新する", "過学習の可能性が高いので、ドロップアウト率を上げて学習を強く抑え込む", "データが多すぎる可能性が高いので、訓練データを減らして1エポックを短くする"], "e": "損失が振動せず一定の向きに下がり続けるのに進みが遅いのは、1回の更新幅が小さすぎるときの典型的な症状で、学習率を上げるか学習率の探索を行う。学習率が大きすぎる場合は損失が振動したり発散したりしやすく、ドロップアウトの強化は過学習への対策である。"},
{"c": 4, "q": "ニューラルネットワークの学習中、数百イテレーション目で損失が突然NaNになった。原因の調べ方と対策として最も適切なものはどれか。", "o": ["学習率が大きすぎて値が発散した可能性や、log(0)などの計算を疑い、学習率を下げ勾配クリッピングを入れる", "モデルの表現力が不足している可能性が高いので、層を増やしてパラメータ数を大きくする", "過学習の兆候なので、ドロップアウト率を上げ、正則化係数を大きくして学習を続ける", "訓練データが多すぎる可能性が高いので、データの件数を減らしてエポック数を増やす"], "e": "損失のNaNは、大きすぎる学習率による重みの発散や、確率0に対する対数計算など数値の問題で起こることが多い。表現力不足や過学習ではNaNにはならない。"},
{"c": 4, "q": "学習中の損失を記録したところ、下がったり大きく跳ね上がったりを繰り返し、全体としてなかなか下がらなかった。最も考えられる原因はどれか。", "o": ["学習率が大きすぎ、最小値の周りを行き過ぎて往復している", "学習率が小さすぎ、1回の更新でほとんどパラメータが動かない", "エポック数が多すぎ、訓練データに過剰に適合し始めている", "重みの初期値が小さすぎ、出力がすべて同じ値になっている"], "e": "学習率が大きすぎると更新が谷を飛び越えて損失が振動・発散する。学習率が小さすぎる場合は損失が滑らかに、しかし非常にゆっくりと下がる。"},
{"c": 4, "q": "活性化関数にReLUを用いた深いネットワークを大きな学習率で学習したところ、隠れ層の多くのユニットがどの入力に対しても0しか出力しなくなり、学習が進まなくなった。対策として最も適切なものはどれか。", "o": ["負の入力にも小さな傾きを持つLeaky ReLUなどに替え、学習率を下げる", "活性化関数をステップ関数に替え、出力を0と1にはっきり分ける", "隠れ層のユニットをさらに増やし、学習率はそのまま大きく保つ", "重みをすべて0で初期化し直し、同じ条件で学習をやり直す"], "e": "入力が常に負になったReLUユニットは勾配が0で二度と更新されない（dying ReLU）。負の側にも勾配があるLeaky ReLUなどが有効で、ステップ関数は勾配がほぼ0で逆伝播に使えない。"},
{"c": 4, "q": "深い全結合ネットワークの学習中、ときどき勾配のノルムが通常の数百倍になり、その直後に損失が大きく跳ね上がることがあった。この症状に直接効く対策として最も適切なものはどれか。", "o": ["勾配のノルムが閾値を超えたら縮める勾配クリッピングを導入する", "ドロップアウト率を上げて、学習時に無効化するユニットを増やす", "早期終了を導入して、検証損失が悪化した時点で学習を打ち切る", "L1正則化を加えて、不要な重みをちょうど0にしておく"], "e": "急に巨大な勾配が出る勾配爆発には、更新前に勾配の大きさを抑える勾配クリッピングが直接効く。ドロップアウトや早期終了、L1正則化は過学習への対策である。"},
{"c": 4, "q": "1枚の料理写真に「肉」「野菜」「辛い」など複数のタグを同時に付けるモデルを作る。出力層と損失関数の組み合わせとして最も適切なものはどれか。", "o": ["各タグの出力にシグモイド関数を使い、タグごとの二値交差エントロピーの和を損失とする", "全タグの出力にソフトマックス関数を使い、多クラスの交差エントロピーを損失とする", "各タグの出力に恒等関数を使い、タグの有無との平均二乗誤差を損失とする", "各タグの出力にReLU関数を使い、Triplet Lossでタグ同士の距離を学習する"], "e": "複数のラベルが同時に正になりうるマルチラベル分類では、タグごとに独立したシグモイドと二値交差エントロピーを使う。ソフトマックスは確率の和が1になるため、1つだけを選ぶ多クラス分類向けである。"},
{"c": 4, "q": "社員証代わりの顔認証システムで、新入社員が加わるたびにモデル全体を学習し直すことは避けたい。この要件に最も適した学習の考え方はどれか。", "o": ["同一人物の顔は近く別人は遠くなる埋め込みをTriplet Lossなどで学習し、登録顔との距離で照合する", "社員数と同じ数の出力を持つ分類器をソフトマックスで学習し、入社のたびに出力数を増やす", "顔画像から年齢を予測する回帰モデルを平均二乗誤差で学習し、予測年齢の差で本人を判定する", "顔画像を再構成するネットワークを学習し、再構成誤差の大きさだけで本人かどうかを判定する"], "e": "距離学習で汎用的な埋め込み空間を学習しておけば、新しい人物は登録画像の埋め込みを保存するだけで照合できる。人数分の出力を持つ分類器では、人が増えるたびに再学習が必要になる。"},
{"c": 4, "q": "1回の学習に半日かかるモデルで、学習率・重み減衰・ドロップアウト率など5つのハイパーパラメータを調整したい。試行回数を少なく抑えたい場合に最も適した探索方法はどれか。", "o": ["過去の試行結果から有望な組み合わせを推定して次を選ぶベイズ最適化", "各ハイパーパラメータに5段階の候補を置き、すべての組み合わせを試すグリッドサーチ", "各ハイパーパラメータを1つずつ固定せずに変え、毎回無作為に選ぶランダムサーチを数千回行う", "ハイパーパラメータを学習データで勾配降下法によって最適化し、検証データを使わない方法"], "e": "1回の評価が高価なときは、結果を活用して次の候補を賢く選ぶベイズ最適化が向く。5段階×5個のグリッドは3125通りとなり、半日ずつでは現実的でない。"},
{"c": 4, "q": "数千個の特徴量をもつ回帰問題で、互いに強く相関した特徴量のグループが多数ある。不要な特徴量の重みを0にしつつ、相関した特徴量のうち1つだけが恣意的に選ばれる不安定さも和らげたい。最も適切な正則化はどれか。", "o": ["L1とL2の罰則を組み合わせるElastic Net", "L2正則化だけを用いて重みを全体に小さく保つRidge回帰", "L1正則化だけを用いて重みを0にするLasso回帰", "正則化を使わず早期終了だけで学習を止める方法"], "e": "L1は重みを0にして特徴選択を行えるが、相関した特徴量のうち1つだけを選びがちである。L2を加えたElastic Netは、相関した特徴量をまとめて残す傾向を持つ。"},
{"c": 4, "q": "大規模なTransformerを学習させたところ、学習開始直後の数百ステップで損失が不安定になり、発散することがあった。学習率スケジュールの見直しとして最も適切なものはどれか。", "o": ["学習の最初は小さな学習率から始め、徐々に目標値まで上げるウォームアップを入れる", "学習の最初に最も大きな学習率を与え、その後も一定のまま下げずに学習を続ける", "学習率を毎ステップ無作為に変え、発散しにくい値に偶然当たるのを待つ", "学習率を0に固定したまま最初の数百ステップを進め、その後に通常の値へ戻す"], "e": "学習初期はAdamの統計量なども不安定で、大きな学習率では発散しやすいため、ウォームアップで徐々に学習率を上げる。学習率0では重みが全く更新されず、準備の効果はない。"},
{"c": 4, "q": "DeepMindのChinchillaの研究（2022年）で示された、計算予算が決まっているときの大規模言語モデルの考え方として最も適切なものはどれか。", "o": ["パラメータ数と学習トークン数を同程度の比率で増やすのが効率的で、当時の多くのモデルは学習データが不足していた", "計算予算はすべてパラメータ数の増加に使い、学習トークン数は固定するのが最も効率的である", "パラメータ数を減らして学習トークン数だけを増やし続ければ、モデルの規模に関係なく性能は上がり続ける", "計算予算を増やしても一定の規模を超えると損失は下がらなくなり、スケーリング則は成り立たない"], "e": "Chinchilla（700億パラメータ）は、より大きなGopher（2800億パラメータ）と同じ計算量で、約1.4兆トークンと多くのデータを学習して上回った。パラメータ数とデータ量はバランスよく増やすべきだと示された。"},
{"c": 4, "q": "画像分類で、モデルのパラメータ数を少しずつ増やしながらテスト誤差を測ったところ、いったん下がった誤差が訓練データをちょうど記憶できる規模の付近で上がり、さらに大きくすると再び下がった。この現象を何と呼ぶか。", "o": ["二重降下（Double Descent）", "勾配消失（Vanishing Gradient）", "ノーフリーランチ定理", "プラトー（Plateau）"], "e": "訓練データを補間できる境界付近でテスト誤差が悪化し、さらに過剰パラメータ化すると再び改善する現象が二重降下である。プラトーは学習の途中で損失が停滞する平坦な領域を指す。"},
{"c": 4, "q": "あるチームが「どんなデータセットでも常に最高精度を出す学習アルゴリズムを1つ決め、社内で統一して使う」という方針を立てた。この方針に対する指摘として最も適切なものはどれか。", "o": ["ノーフリーランチ定理によれば、あらゆる問題で平均的に優れた万能のアルゴリズムはなく、問題ごとの比較が必要である", "万能近似定理によれば、隠れ層が1層のネットワークがあらゆる問題で常に最高精度になるので、それに統一すべきである", "スケーリング則によれば、最も大きなモデルを選べばどのデータでも必ず最高精度になるので、方針は妥当である", "二重降下によれば、パラメータ数を増やすと必ず精度が下がるので、最も小さなモデルに統一すべきである"], "e": "ノーフリーランチ定理は、すべての問題で平均すると特定のアルゴリズムが優れることはないと示す。万能近似定理は表現能力の存在を述べるだけで、学習で最高精度になることは保証しない。"},
{"c": 4, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「単純パーセプトロンは（ア）な問題しか解けないが、入力層と出力層の間に（イ）を加えた多層パーセプトロンは、XORのような問題も表現できる。」", "o": ["（ア）線形分離可能 （イ）隠れ層", "（ア）線形分離不可能 （イ）隠れ層", "（ア）線形分離可能 （イ）プーリング層", "（ア）非線形 （イ）正規化層"], "e": "単純パーセプトロンの決定境界は直線（超平面）なので、線形分離可能な問題しか解けない。非線形な活性化を持つ隠れ層を加えると、XORのような線形分離不可能な問題も表現できる。"},
{"c": 4, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「L2正則化は重みを0に近づけるが、重みが（ア）になることは少ない。また確率的勾配降下法では、更新のたびに重みが一定の割合で縮むことから（イ）とも呼ばれる。」", "o": ["（ア）ちょうど0 （イ）重み減衰", "（ア）ちょうど0 （イ）早期終了", "（ア）負の値 （イ）重み減衰", "（ア）負の値 （イ）ドロップアウト"], "e": "L2の罰則は0付近で勾配が小さくなるため、重みはちょうど0にはなりにくく、スパース化するのはL1である。SGDではL2正則化が重みを毎回一定比率で縮める重み減衰と等価になる。"},
{"c": 4, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「GPUを画像処理以外の数値計算に用いることを（ア）という。NVIDIAはGPU上で汎用計算を行うための開発環境として（イ）を提供しており、ディープラーニングの普及を後押しした。」", "o": ["（ア）GPGPU （イ）CUDA", "（ア）GPGPU （イ）TPU", "（ア）TPU （イ）CUDA", "（ア）FPGA （イ）CUDA"], "e": "GPGPUはGPUの汎用計算への利用を指し、NVIDIAのCUDAはその代表的な開発環境である。TPUはGoogleが開発したテンソル計算用の専用プロセッサである。"},
{"c": 4, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「気温を予測する回帰問題では、出力層に恒等関数を用いて損失に（ア）を使うことが多い。一方、合格か不合格かを予測する二値分類では、出力層に（イ）を用いて二値交差エントロピーを損失とすることが多い。」", "o": ["（ア）平均二乗誤差 （イ）シグモイド関数", "（ア）交差エントロピー （イ）シグモイド関数", "（ア）平均二乗誤差 （イ）恒等関数", "（ア）交差エントロピー （イ）ReLU関数"], "e": "連続値の回帰では恒等関数と平均二乗誤差、二値分類では出力を0〜1の確率にするシグモイド関数と二値交差エントロピーの組み合わせが基本である。"},
{"c": 4, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「パラメータ数の多いニューラルネットワークの損失関数では、勾配が0になる点の多くは局所最適解ではなく（ア）だと考えられている。（ア）の付近で学習が停滞したとき、過去の更新方向を引き継ぐ（イ）は、そこを抜け出す助けになる。」", "o": ["（ア）鞍点 （イ）モーメンタム", "（ア）大域最適解 （イ）モーメンタム", "（ア）鞍点 （イ）早期終了", "（ア）大域最適解 （イ）重みの初期化"], "e": "高次元では、すべての方向で極小となる点より、一部の方向では極大となる鞍点の方がはるかに多いと考えられている。モーメンタムは慣性によって勾配の小さい領域を通り抜けやすくする。"},
{"c": 4, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「訓練データ全体を1回使い切ることを1（ア）と呼び、ミニバッチ1つ分の勾配でパラメータを1回更新することを1（イ）と呼ぶ。」", "o": ["（ア）エポック （イ）イテレーション", "（ア）イテレーション （イ）エポック", "（ア）エポック （イ）バッチサイズ", "（ア）バッチサイズ （イ）イテレーション"], "e": "エポックは訓練データを一巡する単位、イテレーションはパラメータ更新1回の単位である。バッチサイズは1回の更新に使うデータの件数を指す。"},
{"c": 4, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「万能近似定理によれば、隠れ層が（ア）でも十分なユニットがあれば任意の連続関数を近似できる。しかし実際には、層を（イ）方が、同じ関数を少ないパラメータで効率よく表現できる場合が多い。」", "o": ["（ア）1層 （イ）深くした", "（ア）1層 （イ）浅くした", "（ア）0層 （イ）深くした", "（ア）0層 （イ）浅くした"], "e": "万能近似定理は隠れ層1層で十分な表現力があることを示すが、必要なユニット数が膨大になりうる。層を深くすると特徴を階層的に組み合わせられ、少ないパラメータで表現できる場合が多い。"},
{"c": 4, "q": "活性化関数のシグモイド関数とtanhを比べたとき、tanhの利点として最も適切なものはどれか。", "o": ["出力が0を中心に正負に分布するため、次の層の重みの更新が偏りにくい", "出力が0以上に限られるため、確率としてそのまま解釈できる", "導関数の値がどの入力でも1なので、勾配消失がまったく起こらない", "計算に指数関数を使わないため、ReLUよりも高速に計算できる"], "e": "tanhの出力は−1〜1で0を中心とするため、出力が常に正になるシグモイドより次の層の重みの勾配の符号がそろいにくく、学習が効率化しやすい。tanhも入力が大きいと導関数が0に近づき、勾配消失は起こる。"},
{"c": 4, "q": "ReLUとGELUの違いの説明として最も適切なものはどれか。", "o": ["ReLUは0で折れ曲がるが、GELUは滑らかな曲線で、負の小さな入力に対してもわずかに負の値を出力する", "ReLUは負の入力で負の値を出力するが、GELUは負の入力に対して常にちょうど0を出力する", "ReLUは出力が0から1に収まるが、GELUは出力が−1から1に収まる", "ReLUは学習するパラメータを持つが、GELUは学習するパラメータを持たない"], "e": "GELUはx・Φ(x)で表される滑らかな関数で、負の小さな入力ではわずかに負の値をとる。ReLUは負の入力で0、正の入力でそのまま出力し、上限はなく、学習パラメータも持たない。"},
{"c": 4, "q": "ドロップアウトとL2正則化の違いの説明として最も適切なものはどれか。", "o": ["ドロップアウトは学習時にユニットを無作為に無効化し、L2正則化は損失に重みの二乗和の罰則を加える", "ドロップアウトは損失に重みの絶対値の和を加え、L2正則化は学習時にユニットを無作為に無効化する", "ドロップアウトは推論時にもユニットを無作為に無効化し、L2正則化は推論時にのみ重みを縮める", "ドロップアウトは未学習への対策で、L2正則化は学習を速めるための手法である"], "e": "ドロップアウトはネットワーク構造に確率的な変化を与え、L2正則化は損失関数に罰則項を加えることで、いずれも過学習を抑える。重みの絶対値の和を加えるのはL1正則化である。"},
{"c": 4, "q": "ハイパーパラメータ探索の手法を、計算機を多数並べて同時に試行する観点で比べた説明として最も適切なものはどれか。", "o": ["グリッドサーチやランダムサーチは試行が互いに独立で並列化しやすいが、ベイズ最適化は前の結果を使うため逐次的になりやすい", "ベイズ最適化は試行が互いに独立で並列化しやすいが、グリッドサーチやランダムサーチは前の結果を使うため逐次的になる", "3つの手法はどれも前の試行結果を使って次の候補を決めるため、並列に実行することはできない", "3つの手法はどれも候補の順番が決まっているので、並列化のしやすさに違いはない"], "e": "グリッドサーチとランダムサーチは候補を事前に決められ、同時に実行しやすい。ベイズ最適化はそれまでの結果から次の候補を選ぶため、試行回数は少なくて済むが本来は逐次的である。"},
{"c": 4, "q": "出力層にシグモイド関数を使う二値分類で、損失関数に平均二乗誤差より交差エントロピーが好まれる理由として最も適切なものはどれか。", "o": ["平均二乗誤差ではシグモイドの飽和で予測が大きく外れても勾配が小さくなるが、交差エントロピーでは誤差に比例した勾配が得られる", "交差エントロピーは値が常に0以上1以下に収まるが、平均二乗誤差は値に上限がないため学習が発散しやすくなる", "交差エントロピーを使うと出力層のパラメータ数が減るため、平均二乗誤差より学習時間が大幅に短くなる", "平均二乗誤差は分類問題では計算できないが、交差エントロピーはどちらの問題でも計算できる"], "e": "シグモイド＋平均二乗誤差では勾配にシグモイドの導関数が掛かり、大きく外れた予測ほど勾配が消えやすい。シグモイド＋交差エントロピーではロジットに関する勾配がy−tとなり、外れるほど大きく修正される。"},
{"c": 4, "q": "分類モデルの学習で、正解分布pに対して予測分布qの交差エントロピーH(p, q)を最小化することと、KLダイバージェンスD_KL(p‖q)を最小化することの関係として最も適切なものはどれか。", "o": ["pのエントロピーH(p)は学習で変わらない定数なので、両者の最小化はqについて同じ解を与える", "KLダイバージェンスは負の値もとりうるため、交差エントロピーを最小化したときとは逆向きの解になる", "交差エントロピーはp=qのとき最大になり、KLダイバージェンスはp=qのとき最小になる", "KLダイバージェンスはpとqを入れ替えても値が同じなので、qの側だけで計算できる"], "e": "H(p, q)=H(p)+D_KL(p‖q)で、H(p)はモデルに依存しないため、交差エントロピーの最小化はKLダイバージェンスの最小化と同じになる。KLダイバージェンスは常に0以上で、pとqについて非対称である。"},
{"c": 4, "q": "単純パーセプトロンとロジスティック回帰を比べた説明として最も適切なものはどれか。", "o": ["パーセプトロンはステップ関数で0か1を出力し、ロジスティック回帰はシグモイド関数で正例の確率を出力する", "パーセプトロンはシグモイド関数で確率を出力し、ロジスティック回帰はステップ関数で0か1を出力する", "パーセプトロンは非線形な決定境界を学習でき、ロジスティック回帰は直線の境界しか学習できない", "パーセプトロンは回帰問題に使い、ロジスティック回帰は名前の通り回帰問題にしか使えない"], "e": "どちらも入力の重み付き和を使う線形の分類器だが、パーセプトロンはステップ関数で0/1を出力し、ロジスティック回帰はシグモイド関数で確率を出力する。ロジスティック回帰は名前に反して分類の手法である。"},
{"c": 4, "q": "マカロックとピッツの形式ニューロンと、ローゼンブラットのパーセプトロンの違いとして最も適切なものはどれか。", "o": ["形式ニューロンは重みを人が与える数理モデルで、パーセプトロンは重みをデータから学習する規則を備えている", "形式ニューロンは重みをデータから学習する規則を備え、パーセプトロンは重みを人が与えるだけの数理モデルである", "形式ニューロンは多層構造を持ち、パーセプトロンは入力と出力の2層だけで構成される", "形式ニューロンは連続値を出力し、パーセプトロンは誤差逆伝播法で学習する"], "e": "1943年の形式ニューロンは神経細胞を閾値素子として表した数理モデルで、重みを学習する仕組みはない。パーセプトロンは誤り訂正型の学習規則で重みを調整する点が新しかった。"},
{"c": 4, "q": "勾配 g=(12, 5) に上限6.5のクリッピングを行う。各成分を ±6.5 に切り詰める「値によるクリッピング」と、ノルムが6.5になるよう縮める「ノルムによるクリッピング」を比べた説明として最も適切なものはどれか。", "o": ["値によるクリッピングは(6.5, 5)となって勾配の向きが変わるが、ノルムによるクリッピングは(6, 2.5)となって向きが保たれる", "値によるクリッピングは(6, 2.5)となって向きが保たれるが、ノルムによるクリッピングは(6.5, 5)となって向きが変わる", "どちらのクリッピングでも(6, 2.5)となり、勾配の向きと大きさは2つの方法でまったく同じ結果になる", "どちらのクリッピングでも(6.5, 5)となり、勾配の向きは2つの方法とも元の勾配から変わってしまう"], "e": "値によるクリッピングは6.5を超える第1成分だけを切り詰めて(6.5, 5)となり、成分の比が変わるので向きがずれる。ノルムによるクリッピングはノルム13を6.5に縮める0.5倍で(6, 2.5)となり、向きが保たれる。"},
{"c": 4, "q": "活性化関数の出力の範囲に関する記述として適切でないものはどれか。", "o": ["ソフトマックス関数の出力は、各要素が−1〜1で合計が0になる", "シグモイド関数の出力は、0より大きく1より小さい範囲に収まる", "tanhの出力は、−1より大きく1より小さい範囲に収まる", "ReLUの出力は、入力が負のとき0で、正のときは入力と同じ値になる"], "e": "ソフトマックス関数の出力は各要素が0〜1の値をとり、合計すると1になるので、確率として解釈できる。シグモイドは0〜1、tanhは−1〜1の範囲に出力が収まり、ReLUは負の入力を0にして正の入力はそのまま出力する。"},
{"c": 4, "q": "深いネットワークで勾配消失を緩和する方法として適切でないものはどれか。", "o": ["隠れ層の活性化関数をすべてシグモイド関数に統一する", "隠れ層の活性化関数にReLUやその派生の関数を用いる", "活性化関数に合わせてHeやXavierの初期値を用いる", "層を飛ばして勾配を伝えるスキップ結合を導入する"], "e": "シグモイド関数の導関数は最大0.25で、層を重ねると勾配が指数的に小さくなるため、勾配消失をむしろ招く。ReLU、適切な初期化、スキップ結合はいずれも勾配消失の緩和策である。"},
{"c": 4, "q": "ディープラーニングの計算に使われるハードウェアについての記述として誤っているものはどれか。", "o": ["TPUはNVIDIAが開発したGPUの製品名で、ゲーム用の画像描画のために設計された", "GPUは多数の演算コアを持ち、行列演算のような同じ種類の計算の並列処理が得意である", "CPUは少数の高性能なコアを持ち、分岐の多い複雑な処理を順に実行するのが得意である", "学習に必要な計算量が増えるにつれ、専用のアクセラレータを並べた大規模な計算環境が使われるようになった"], "e": "TPUはGoogleがニューラルネットワークのテンソル計算向けに開発した専用プロセッサで、NVIDIAのGPUではない。GPUとCPUの特徴の説明は正しい。"},
{"c": 4, "q": "ミニバッチ学習のバッチサイズについての記述として適切でないものはどれか。", "o": ["バッチサイズを大きくするほど、1エポックあたりのパラメータ更新回数も多くなる", "バッチサイズを大きくすると、勾配の推定のばらつき（ノイズ）は小さくなる", "バッチサイズを大きくすると、1回の更新で必要なメモリ量は増える", "バッチサイズを1にすると、1件ずつ更新する確率的勾配降下法になる"], "e": "1エポックあたりの更新回数はデータ数÷バッチサイズなので、バッチサイズを大きくすると更新回数は少なくなる。大きなバッチほど勾配の推定は安定するがメモリを多く使う。"},
{"c": 4, "q": "ニューラルネットワークのミニバッチ学習で、1回のイテレーションで行う処理の順序として最も適切なものはどれか。", "o": ["順伝播 → 損失の計算 → 誤差逆伝播による勾配の計算 → パラメータの更新", "誤差逆伝播による勾配の計算 → 順伝播 → 損失の計算 → パラメータの更新", "順伝播 → パラメータの更新 → 損失の計算 → 誤差逆伝播による勾配の計算", "損失の計算 → 順伝播 → パラメータの更新 → 誤差逆伝播による勾配の計算"], "e": "まず入力を順伝播させて出力を得て損失を計算し、その損失から誤差逆伝播で勾配を求め、最後に最適化手法でパラメータを更新する。勾配は損失が決まってからでないと計算できない。"},
{"c": 4, "q": "勾配降下法の改良として提案された最適化手法を、提案された順に古いものから並べたものとして最も適切なものはどれか。", "o": ["モーメンタム → AdaGrad → Adam → AdaBound", "AdaGrad → モーメンタム → AdaBound → Adam", "Adam → AdaGrad → モーメンタム → AdaBound", "モーメンタム → Adam → AdaBound → AdaGrad"], "e": "モーメンタムは1960年代、AdaGradは2011年、AdamはRMSpropとモーメンタムを組み合わせて2014年、AdaBoundはAdamの学習率に上下限を設ける改良として2019年に提案された。"},
{"c": 4, "q": "ニューラルネットワーク研究の出来事を古い順に並べたものとして最も適切なものはどれか。", "o": ["形式ニューロンの提案 → パーセプトロンの提案 → ミンスキーらによる限界の指摘 → 誤差逆伝播法の普及", "パーセプトロンの提案 → 形式ニューロンの提案 → 誤差逆伝播法の普及 → ミンスキーらによる限界の指摘", "形式ニューロンの提案 → ミンスキーらによる限界の指摘 → パーセプトロンの提案 → 誤差逆伝播法の普及", "誤差逆伝播法の普及 → 形式ニューロンの提案 → パーセプトロンの提案 → ミンスキーらによる限界の指摘"], "e": "形式ニューロン（1943年）、パーセプトロン（1958年）、ミンスキーとパパートの『パーセプトロン』（1969年）、ラメルハートらによる誤差逆伝播法の普及（1986年）の順である。"},
{"c": 4, "q": "多層パーセプトロンで、出力を0か1にするステップ関数に代えてシグモイド関数などが使われるようになった理由として最も適切なものはどれか。", "o": ["ステップ関数は微分がほぼ至る所で0になり、誤差逆伝播法で勾配を伝えられないから", "ステップ関数は出力が連続値になるため、分類の結果として解釈できないから", "ステップ関数は計算に指数関数が必要で、計算量が非常に大きいから", "ステップ関数を使うと出力層のユニット数を増やせないため、多クラス分類ができないから"], "e": "ステップ関数は0以外で傾きが0、0では微分できないため、勾配に基づく誤差逆伝播法が使えない。微分可能なシグモイド関数に替えることで多層ネットワークの学習が可能になった。"},
{"c": 4, "q": "シグモイド関数を用いたネットワークで、重みの初期値を非常に大きな値にしたところ、学習がほとんど進まなかった。その因果関係の説明として最も適切なものはどれか。", "o": ["各ユニットへの入力の絶対値が大きくなって出力が0か1付近に張り付き、導関数がほぼ0になって勾配が消える", "各ユニットへの入力が0付近に集まって出力がすべて0.5になり、導関数が最大値の1になって勾配が爆発する", "重みが大きいとドロップアウトが働かなくなり、訓練データへの過学習が急速に進む", "重みが大きいと学習率が自動的に0に設定され、パラメータの更新が行われなくなる"], "e": "重みが大きいと入力の絶対値が大きくなり、シグモイドが飽和して導関数がほぼ0になるため勾配消失が起こる。シグモイドの導関数の最大値は0.25で、1にはならない。"});

QUESTIONS.push({"c": 5, "q": "64×64の入力に対して、①3×3畳み込み（ストライド1、パディング1）→②2×2最大値プーリング（ストライド2）→③5×5畳み込み（ストライド1、パディングなし）→④2×2最大値プーリング（ストライド2）の順に処理した。④の出力の縦横の大きさはどれか。", "o": ["14×14", "16×16", "13×13", "12×12"], "e": "①は64×64のまま、②で32×32、③で(32−5)/1+1=28、④で14×14になる。13×13は①のパディングを忘れて62から計算した場合、16×16は③で縮まないとした場合の値。"},
{"c": 5, "q": "13×13の特徴マップに、3×3の最大値プーリングをストライド2、パディングなしで適用した（窓が重なり合うプーリング）。出力の縦横の大きさはどれか。", "o": ["6×6", "5×5", "7×7", "4×4"], "e": "出力サイズは(13−3)/2+1=6。窓の大きさ3がストライド2より大きいため、隣り合う窓が1画素ずつ重なる。7×7は(13+1)/2のように窓の大きさを無視した見積もり。"},
{"c": 5, "q": "入力の次元が10、隠れ状態の次元が20のLSTM層（各ゲートと候補値の計算にバイアスを1つずつ持つ）のパラメータ数はどれか。", "o": ["2,480", "2,400", "1,860", "620"], "e": "LSTMは忘却・入力・出力ゲートと候補値の4つの計算を持ち、それぞれ重み20×(10+20)=600とバイアス20で620。4倍して2,480になる。2,400はバイアスを数えない場合、1,860は計算が3つのGRUと同じ数え方、620は1つ分だけの値。"},

{"c": 5, "q": "モデルの次元d_model=1024、ヘッド数16のMulti-Head Attentionで、各ヘッドのQueryの次元を d_model/ヘッド数 とする。各ヘッドのQueryの次元と、全ヘッドの出力を連結した直後の次元の組み合わせとして正しいものはどれか。", "o": ["各ヘッド 64、連結後 1024", "各ヘッド 1024、連結後 16384", "各ヘッド 64、連結後 64", "各ヘッド 16、連結後 1024"], "e": "各ヘッドは1024/16=64次元で注意を計算し、16ヘッドの出力を連結すると64×16=1024次元に戻る。その後、出力用の線形変換でd_modelの表現に変換される。16はヘッド数そのもので、次元ではない。"},
{"c": 5, "q": "Scaled Dot-Product Attentionで、Query q=(1, 1, 0, 0)、Key k1=(2, 0, 0, 0)、k2=(0, 0, 2, 2)、対応するValueがv1=10、v2=0（スカラー）とする。d_k=4として、出力（Valueの重み付き和）に最も近い値はどれか。", "o": ["7.3", "8.8", "5.0", "10.0"], "e": "内積はq·k1=2、q·k2=0で、√4=2で割ると1と0。softmaxの重みはe/(e+1)≈0.731と0.269なので、出力は0.731×10≈7.3。8.8は√d_kで割らずにe²/(e²+1)で計算した場合、5.0は重みを均等にした場合の値。"},
{"c": 5, "q": "バッチ正規化で、あるチャネルのミニバッチ内の値が 2, 4, 6, 8 だった。スケールγ=2、シフトβ=1とし、ε は無視するとき、値8に対する出力に最も近いものはどれか（分散はミニバッチの値の個数で割って求める）。", "o": ["3.68", "3.32", "7.00", "2.20"], "e": "平均5、分散((−3)²+(−1)²+1²+3²)/4=5なので、正規化後は(8−5)/√5≈1.342、出力は2×1.342+1≈3.68。3.32は個数−1で割った分散を使った場合、7.00は分散で割らない場合、2.20は標準偏差でなく分散で割った場合の値。"},
{"c": 5, "q": "64チャネルの特徴マップに適用するバッチ正規化層で、誤差逆伝播によって学習されるパラメータの数はどれか。", "o": ["128", "256", "64", "4,096"], "e": "学習されるのはチャネルごとのスケールγとシフトβで、64×2=128個。推論用の移動平均と移動分散もチャネルごとに持つが、これは学習中の統計から更新される値で、勾配で学習されるパラメータではない（合わせると256）。"},
{"c": 5, "q": "3×3畳み込み（ストライド1）→2×2最大値プーリング（ストライド2）→3×3畳み込み（ストライド1）の順に重ねた。最後の畳み込みの出力1画素が、入力画像上で見ている範囲（受容野）はどれか。", "o": ["8×8", "7×7", "6×6", "10×10"], "e": "最初の畳み込みで3、プーリングで3+1=4になる。プーリング後は1画素が入力の2画素分ずれるので、次の3×3畳み込みで4+2×2=8となる。6×6はプーリングのストライドの影響を無視して足し合わせた場合、7×7はプーリングを3×3畳み込みと同じに数えた場合の値。"},
{"c": 5, "q": "256チャネルの特徴マップを、1×1畳み込み（バイアスあり）で64チャネルに減らした。この層のパラメータ数はどれか。", "o": ["16,448", "16,384", "147,520", "320"], "e": "重みは256×64=16,384、バイアスが64で合計16,448。16,384はバイアスを数えない場合、147,520は3×3畳み込みで計算した場合（256×9×64+64）の値で、1×1畳み込みを使うとこれを約9分の1にできる。"},
{"c": 5, "q": "長さ5の系列にTransformerのデコーダのマスク付きSelf-Attentionを適用する。5×5の注意スコアのうち、マスクされずに使われる（参照が許される）要素の数はどれか。", "o": ["15", "10", "20", "25"], "e": "各位置は自分自身とそれより前の位置だけを参照できるので、1+2+3+4+5=15要素（対角を含む下三角）が使われる。10は自分自身を含めない場合、25はマスクをしない場合の数。"},
{"c": 5, "q": "32×32の「猫」の画像に、「犬」の画像から切り出した16×16の領域を貼り付けるCutMixを行った。作られた画像に付けるラベルとして正しいものはどれか。", "o": ["猫 0.75、犬 0.25", "猫 0.5、犬 0.5", "猫 0.25、犬 0.75", "猫 1.0、犬 0.0"], "e": "CutMixでは貼り付けた領域の面積の割合でラベルを混ぜる。16×16は32×32の4分の1なので、犬0.25・猫0.75。辺の長さの比（0.5）で混ぜるのは誤り。"},
{"c": 5, "q": "7×7×512の特徴マップを1000クラスの全結合層につなぐ。平坦化（Flatten）してつなぐ代わりにGlobal Average Poolingを挟むと、全結合層の重み（バイアスを除く）はおよそ何分の1になるか。", "o": ["49分の1", "7分の1", "512分の1", "1000分の1"], "e": "平坦化では7×7×512=25,088次元で重みは25,088×1000、GAPでは512次元で512×1000となり、比は7×7=49。GAPは各チャネルの空間方向の平均をとるので、空間の画素数の分だけ入力次元が減る。"},
{"c": 5, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「畳み込みの出力の縦横を入力と同じ大きさに保つパディングを（ア）パディングと呼び、3×3のフィルタでストライド1のときは上下左右に（イ）画素ずつ補う。」", "o": ["（ア）same （イ）1", "（ア）valid （イ）1", "（ア）same （イ）3", "（ア）valid （イ）0"], "e": "出力サイズを保つのがsameパディングで、k×kのフィルタ（kは奇数）なら(k−1)/2画素補う。3×3では1画素。validはパディングしない方式で、出力は入力より小さくなる。"},
{"c": 5, "q": "特徴マップの縦横を半分にする方法として、ストライド2の畳み込みと2×2の最大値プーリング（ストライド2）を比べた記述のうち、最も適切なものはどれか。", "o": ["畳み込みは縮小の仕方を重みとして学習でき、最大値プーリングは学習パラメータを持たない", "最大値プーリングは縮小の仕方を重みとして学習でき、畳み込みは学習パラメータを持たない", "どちらも学習パラメータを持たず、違いは計算の速さだけである", "どちらも出力のチャネル数を入力の半分に減らす働きを持つ"], "e": "ストライド付き畳み込みは重みを持つので、縮小しながら何を残すかを学習できる。最大値プーリングは窓内の最大値を取るだけの固定の操作で、パラメータは持たない。どちらもチャネル数を半分にする働きはない。"},
{"c": 5, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「畳み込み層では、入力の物体が平行移動すると特徴マップ上の反応も同じだけ平行移動する。この性質を（ア）という。一方、最大値プーリングを重ねると、小さな位置ずれに対して出力が変わりにくくなる。この性質を（イ）という。」", "o": ["（ア）平行移動同変性 （イ）平行移動不変性", "（ア）平行移動不変性 （イ）平行移動同変性", "（ア）重み共有 （イ）スパース結合", "（ア）スパース結合 （イ）平行移動同変性"], "e": "入力をずらすと出力も同じだけずれるのが同変性、入力をずらしても出力が変わらないのが不変性。畳み込みは同じフィルタを全位置で使うため同変で、プーリングは窓内の小さなずれを吸収して不変性に近づける。重み共有とスパース結合は畳み込みの構造上の特徴で、この性質の名前ではない。"},
{"c": 5, "q": "スマートフォン上でリアルタイムに動かす画像分類モデルで、3×3畳み込み層の計算量を大きく減らしたい。層の構造の変更として最も適切なものはどれか。", "o": ["チャネルごとの3×3畳み込みと、チャネルを混ぜる1×1畳み込みに分ける", "3×3のフィルタを、範囲の広い7×7のフィルタにすべて置き換える", "出力チャネル数を2倍に増やし、1層あたりの表現力を高めて層の数は保つ", "パディングを増やして、出力の縦横が入力より大きくなるようにする"], "e": "Depthwise Separable Convolutionは、空間方向の畳み込みをチャネルごとに行い、チャネル方向の混合を1×1畳み込みで行うことで、計算量とパラメータ数を大きく減らす。7×7への置き換えやチャネル数の倍増、出力の拡大はいずれも計算量を増やす。"},
{"c": 5, "q": "画素ごとにクラスを判定するセグメンテーションで、特徴マップの解像度を落とさずに、1つの画素の判定に使う周囲の範囲を広げたい。最も適切な手法はどれか。", "o": ["フィルタの要素の間隔を広げたDilated Convolutionを使う", "最大値プーリングの層を増やして、特徴マップの縦横を小さくしていく", "3×3畳み込みを、すべて1×1畳み込みに置き換える", "畳み込みのストライドを2にして層の数を減らす"], "e": "Dilated Convolutionは、パラメータ数と特徴マップの解像度を保ったまま受容野を広げられる。プーリングやストライド2は受容野を広げるが解像度が下がる。1×1畳み込みは空間方向の受容野を広げない。"},
{"c": 5, "q": "転置畳み込みで特徴マップを拡大して画像を生成したところ、出力に格子状の模様（チェッカーボード状のアーティファクト）が現れた。原因として最も適切なものはどれか。", "o": ["カーネルサイズがストライドで割り切れず、出力の画素ごとに重なる回数が不均一になった", "活性化関数にReLUを使ったため、負の値がすべて0になった", "入力と出力でチャネル数が異なり、情報の一部が失われた", "パディングを0にしたため、出力が入力より小さくなった"], "e": "転置畳み込みでは入力の各画素がカーネルの形で出力に書き込まれるため、カーネルサイズがストライドで割り切れないと、書き込みが重なる画素と重ならない画素が規則的に並び、格子状の模様になる。対策として、拡大（リサイズ）してから通常の畳み込みを行う方法などがある。"},
{"c": 5, "q": "バッチ正規化の、学習時と推論時の動作の違いとして最も適切なものはどれか。", "o": ["学習時はミニバッチの平均と分散を使い、推論時は学習中に蓄積した移動平均を使う", "学習時は移動平均を使い、推論時は入力されたデータだけから平均と分散を毎回求める", "学習時にだけ正規化を行い、推論時は正規化層を取り除いて何も変換しない", "学習時も推論時も、その時点のミニバッチの平均と分散だけを使って正規化する"], "e": "推論時は1件ずつ入力されることもあり、ミニバッチの統計に頼れないため、学習中に計算しておいた平均と分散の移動平均で正規化する。学習時と推論時でモードを切り替え忘れると、推論結果がおかしくなる原因になる。"},
{"c": 5, "q": "高解像度の3次元医用画像を扱うため、GPUメモリの都合でバッチサイズを2にしか設定できず、バッチ正規化を使うと学習が不安定になった。正規化手法の変更として最も適切なものはどれか。", "o": ["サンプルごとにチャネルをグループに分けて正規化するグループ正規化に替える", "バッチ正規化のまま、ミニバッチの2件だけで平均と分散を求め続ける", "正規化層をすべて取り除き、代わりに最大値プーリング層を各ブロックに増やす", "バッチ正規化の後にドロップアウトを入れ、ドロップアウト率を上げる"], "e": "バッチ正規化はミニバッチの統計に依存するので、バッチサイズが小さいと平均と分散の推定がぶれて不安定になる。グループ正規化はサンプルごとに計算するためバッチサイズに影響されず、小さなバッチで学習する場面のために提案された。"},
{"c": 5, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「グループ正規化で、グループの数を1にすると（ア）と同じ計算になり、グループの数をチャネル数と同じにすると（イ）と同じ計算になる。」", "o": ["（ア）レイヤー正規化 （イ）インスタンス正規化", "（ア）インスタンス正規化 （イ）レイヤー正規化", "（ア）バッチ正規化 （イ）レイヤー正規化", "（ア）レイヤー正規化 （イ）バッチ正規化"], "e": "グループが1つなら、1サンプルの全チャネルをまとめて正規化するレイヤー正規化になる。各チャネルが1グループなら、1サンプルの1チャネルごとに正規化するインスタンス正規化になる。バッチ正規化は複数サンプルにまたがる統計を使う点で、どちらとも異なる。"},
{"c": 5, "q": "撮影機器によって入力画像の縦横の大きさがまちまちだが、畳み込み層の後に同じ全結合の分類層をつなぎたい。畳み込み層と分類層の間に入れる処理として最も適切なものはどれか。", "o": ["Global Average Poolingで、各チャネルを1つの値にまとめる", "特徴マップをそのまま平坦化（Flatten）して1列に並べる", "2×2の最大値プーリングを1回だけ入れて縦横を半分にする", "転置畳み込みで特徴マップを一定の倍率で拡大する"], "e": "Global Average Poolingは縦横の大きさに関係なく、各チャネルを平均して1つの値にするので、出力はチャネル数の長さに固定される。平坦化や2×2プーリング、転置畳み込みでは、出力の長さが入力の大きさによって変わってしまう。"},
{"c": 5, "q": "最大値プーリングと平均値プーリングを比べた記述として最も適切なものはどれか。", "o": ["最大値は窓内の最も強い反応を残し、平均値は窓内の反応をならして残す", "最大値は窓内の反応をならして残し、平均値は最も強い反応だけを残す", "最大値は窓ごとに学習パラメータを持つが、平均値は学習パラメータを持たない", "最大値は出力のチャネル数を減らし、平均値は縦横の大きさを減らす"], "e": "最大値プーリングは特徴が窓内のどこかに強く現れたかを残し、平均値プーリングは窓全体の反応の平均を残す。どちらも学習パラメータを持たず、縦横の大きさを減らしてチャネル数は変えない。"},
{"c": 5, "q": "残差ブロックで、入力xが64チャネル、層F(x)の出力が128チャネルになり、y=F(x)+xの足し算ができない。この問題への対処として最も適切なものはどれか。", "o": ["ショートカット側に1×1畳み込みを入れて、xを128チャネルに変換してから足す", "ショートカットを外し、F(x)の出力だけを次の層にそのまま渡すように作り替える", "F(x)の出力に最大値プーリングを入れて、縦横の大きさを半分にする", "学習率を下げて、F(x)の出力のチャネル数が自然に64になるのを待つ"], "e": "チャネル数（や縦横の大きさ）が変わるブロックでは、ショートカット側に1×1畳み込みなどの射影を入れて形をそろえてから足す。ショートカットを外すとスキップ結合の効果が失われ、プーリングでは縦横が変わるだけでチャネル数はそろわない。"},
{"c": 5, "q": "スキップ結合を持たない普通のCNNを20層から56層に深くしたところ、テストデータだけでなく訓練データでの誤差まで大きくなった。この現象の説明として最も適切なものはどれか。", "o": ["層が深くなって最適化が難しくなり、浅いモデル以上の解に到達できなかった", "モデルが訓練データに過剰に適合し、汎化性能が下がる過学習が起きた", "層を増やしたことでパラメータが少なくなり、表現力が不足した", "訓練データの量が増えすぎて、学習が1エポックで終わらなかった"], "e": "深いモデルは浅いモデルを含む表現力を持つので、訓練誤差まで悪化するのは過学習ではなく最適化の難しさ（劣化問題）による。過学習なら訓練誤差は小さくなる。ResNetはスキップ結合でこの問題を緩和した。"},
{"c": 5, "q": "スキップ結合（y=F(x)+x）に関する記述として、誤っているものはどれか。", "o": ["入力をそのまま足す経路を加えると、層のパラメータ数が大きく増える", "足し算の経路を通じて、勾配が浅い層まで直接伝わりやすくなる", "F(x)を0に近づけるだけで、恒等写像を簡単に表現できる", "TransformerのAttention層やフィードフォワード層の周りでも使われている"], "e": "入力をそのまま足すだけのスキップ結合は、形がそろっていれば学習パラメータを持たないので、パラメータ数はほとんど増えない。勾配の伝わりやすさ、恒等写像の表しやすさ、Transformerでの利用は正しい記述。"},
{"c": 5, "q": "単純なRNNで、系列が長くなるほど前の時刻への勾配が極端に小さくなったり大きくなったりしやすい理由として最も適切なものはどれか。", "o": ["時刻をさかのぼるたびに同じ重み行列と活性化関数の微分が繰り返し掛けられるため", "時刻ごとに異なる重みを使うので、系列が長いほどパラメータが増えるため", "系列の各要素を並列に処理するので、時刻どうしの前後関係の情報が失われるため", "出力層にソフトマックス関数を使うと、系列が長いほど確率が0に近づくため"], "e": "BPTTでは時刻をさかのぼるごとに同じ重み行列（と活性化関数の微分）が掛け算されるので、その大きさが1より小さいと指数的に消え、大きいと指数的に爆発する。RNNは全時刻で重みを共有しており、処理は時刻順に逐次行う。"},
{"c": 5, "q": "1万ステップの長さのセンサー時系列でRNNを学習したところ、誤差逆伝播のためにすべての時刻の中間値を保持するとGPUメモリが足りなくなった。学習方法の工夫として最も適切なものはどれか。", "o": ["系列を一定の長さで区切り、その範囲だけで逆伝播を打ち切るTruncated BPTTを使う", "デコーダに前の時刻の正解データを入力する教師強制（Teacher Forcing）を使う", "系列を前向きと後ろ向きの両方から読む双方向RNNに置き換えて学習する", "各時刻の入力に、何番目の時刻かを表す位置エンコーディングを加える"], "e": "Truncated BPTTは、隠れ状態は次の区間に引き継ぎつつ、勾配の計算は一定の長さでさかのぼるのをやめる方法で、メモリと計算量を抑えられる。教師強制はデコーダの学習法、双方向RNNは両方向の文脈を使う構造で、どちらもメモリの問題は解決しない。"},
{"c": 5, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「LSTMでは、（ア）ゲートが新しい情報をセルにどれだけ書き込むかを決め、（イ）ゲートがセルの内容をどれだけ隠れ状態として外に出すかを決める。」", "o": ["（ア）入力 （イ）出力", "（ア）忘却 （イ）出力", "（ア）入力 （イ）更新", "（ア）リセット （イ）忘却"], "e": "LSTMは、書き込み量を決める入力ゲート、保持量を決める忘却ゲート、出力量を決める出力ゲートを持つ。更新ゲートとリセットゲートはGRUのゲートで、LSTMのゲートではない。"},
{"c": 5, "q": "LSTMとGRUを比べた記述として最も適切なものはどれか。", "o": ["GRUはセル状態を持たずに隠れ状態だけで情報を運び、同じ隠れ次元ならパラメータがLSTMより少ない", "GRUはLSTMのゲートに更新ゲートを加えたもので、同じ隠れ次元ならパラメータがLSTMより多い", "LSTMはゲートを持たずに隠れ状態を更新し、GRUだけが勾配消失を抑える仕組みを持つ", "GRUは時刻ごとに異なる重みを使うため、系列の長さに応じてパラメータが増えていく"], "e": "GRUはLSTMのセル状態と隠れ状態を1つにまとめ、ゲートも更新・リセットの2つにした簡略版で、同じ隠れ次元ならパラメータは約4分の3になる。LSTMもゲートで勾配消失を抑える。どちらも全時刻で重みを共有する。"},
{"c": 5, "q": "Attentionを使わない初期のEncoder-Decoderモデルで、入力文が長くなるほど翻訳の精度が落ちた理由として最も適切なものはどれか。", "o": ["入力文全体の情報を、エンコーダの最後の固定長のベクトル1つに押し込めていたため", "デコーダが入力文の各単語の隠れ状態を毎時刻すべて参照していたため", "エンコーダが入力文の単語を並列に処理し、語順の情報を失っていたため", "デコーダの出力にソフトマックス関数を使っておらず、単語の確率が正しく求まらなかったため"], "e": "初期のモデルでは、どれほど長い入力でも固定長の文脈ベクトル1つに要約していたため、長文では情報が収まりきらなかった。Attentionは、デコーダが時刻ごとにエンコーダの全時刻の隠れ状態を重み付きで参照できるようにして、この問題を緩和した。"},
{"c": 5, "q": "教師強制（Teacher Forcing）で学習した系列生成モデルに起こりやすい問題として最も適切なものはどれか。", "o": ["推論時は自分の予測を次の入力にするため、一度誤ると学習時に見なかった入力が続き、誤りが連鎖しやすい", "学習時に正解データを入力しないため、学習の初期に誤った予測が次々と入力され、収束しにくい", "デコーダが入力文を後ろから読むことになり、語順が逆になった文を生成しやすくなる", "正解データを入力するぶんパラメータが倍増し、推論時のメモリが足りなくなりやすい"], "e": "教師強制は学習を安定・高速にするが、学習時は常に正解を入力し推論時は自分の予測を入力するという違いがあり、推論時に誤りが連鎖しやすい（exposure bias）。学習初期の不安定さは、教師強制を使わない場合に起こる問題。"},
{"c": 5, "q": "次の文の（ア）（イ）（ウ）に入る語の組み合わせとして最も適切なものはどれか。「Attentionでは、（ア）と各（イ）の類似度をもとに重みを求め、その重みで（ウ）の重み付き和をとって出力とする。」", "o": ["（ア）Query （イ）Key （ウ）Value", "（ア）Key （イ）Value （ウ）Query", "（ア）Value （イ）Query （ウ）Key", "（ア）Query （イ）Value （ウ）Key"], "e": "探したい内容を表すQueryと、各要素の見出しにあたるKeyの内積などで類似度を求め、softmaxで重みにする。その重みで、各要素の中身にあたるValueを足し合わせる。"},
{"c": 5, "q": "2017年の論文で提案された元のTransformerのエンコーダ1層の中で、処理が行われる順序として最も適切なものはどれか。", "o": ["Multi-Head Self-Attention → 残差接続と正規化 → 位置ごとのFFN → 残差接続と正規化", "位置ごとのFFN → 残差接続と正規化 → Multi-Head Self-Attention → 残差接続と正規化", "残差接続と正規化 → 位置エンコーディング → Multi-Head Self-Attention → 位置ごとのFFN", "Multi-Head Self-Attention → 位置ごとのFFN → 位置エンコーディング → 残差接続と正規化"], "e": "元のTransformerのエンコーダ層は、Self-Attentionの副層とフィードフォワード（FFN）の副層からなり、それぞれの後に残差接続とレイヤー正規化を置く。位置エンコーディングは各層ではなく、最初の入力埋め込みに加える。"},
{"c": 5, "q": "元のTransformerのデコーダ1層に含まれる3つの副層を、処理される順に並べたものとして最も適切なものはどれか。", "o": ["マスク付きSelf-Attention → Source-Target Attention → 位置ごとのFFN", "Source-Target Attention → マスク付きSelf-Attention → 位置ごとのFFN", "位置ごとのFFN → マスク付きSelf-Attention → Source-Target Attention", "マスク付きSelf-Attention → 位置ごとのFFN → Source-Target Attention"], "e": "デコーダ層では、まず出力済みの系列内でマスク付きSelf-Attentionを行い、次にそれをQueryとしてエンコーダの出力を参照するSource-Target Attentionを行い、最後にFFNを通す。各副層の後には残差接続とレイヤー正規化が入る。"},
{"c": 5, "q": "Transformerを提案した論文「Attention Is All You Need」が発表された年はどれか。", "o": ["2017年", "2014年", "2012年", "2020年"], "e": "「Attention Is All You Need」はGoogleの研究者らによって2017年に発表された。2014年はRNNによるseq2seqや、Encoder-DecoderへのAttentionの導入が提案された時期で、2012年はAlexNetがILSVRCで優勝した年。"},
{"c": 5, "q": "元のTransformerで使われた位置エンコーディングの作り方として最も適切なものはどれか。", "o": ["波長の異なる正弦・余弦関数で位置ごとのベクトルを作り、単語の埋め込みに足し合わせる", "各単語が文中に何回出現したかを数え、その回数を単語の埋め込みに掛け合わせる", "RNNで系列を先頭から読み、その隠れ状態を位置の情報として単語の埋め込みに使う", "位置の番号を0か1の列で表すone-hotベクトルにし、Attentionの重みから引き算する"], "e": "元の論文では、次元ごとに周波数の異なるsin・cosの値で位置を表し、入力の単語埋め込みに加算した。位置ごとのベクトルを学習で求める方式もあるが、出現回数やRNN、one-hotの引き算で位置を表すことはしない。"},
{"c": 5, "q": "系列の中で遠く離れた2つの単語の関係を捉えるとき、RNNとSelf-Attentionを比べた記述として最も適切なものはどれか。", "o": ["RNNは間の時刻の数だけ処理を経由するが、Self-Attentionは1回の計算で直接結び付けられる", "RNNは1回の計算で直接結び付けられるが、Self-Attentionは間の単語の数だけ処理を経由する", "どちらも間の時刻の数だけ処理を経由するため、離れた単語の関係は捉えられない", "どちらも1回の計算で直接結び付けるため、系列が長くても計算量はまったく増えない"], "e": "RNNでは情報が時刻を1つずつ伝わるので、離れた単語の間には長い経路ができ、勾配も弱まりやすい。Self-Attentionは全ての位置の組み合わせを1回で計算するので経路が短い。その代わり、計算量は系列長の2乗に比例して増える。"},
{"c": 5, "q": "Scaled Dot-Product Attentionで、あるQueryに対してsoftmaxで求めた各Keyへの重みの性質として正しいものはどれか。", "o": ["どれも0以上で、そのQueryについての合計が1になる", "正負の値をとり、そのQueryについての合計が0になる", "どれも0か1のどちらかで、1になるKeyはちょうど1つである", "どれも1以上で、値の大きさはKeyの次元数に比例する"], "e": "softmaxの出力は0以上で合計が1になるので、Attentionの出力はValueの凸結合（加重平均）になる。0か1のどちらかになるのは、最大のものだけを選ぶhardな選択の場合で、softmaxによる重みではない。"},
{"c": 5, "q": "監視カメラの画像からノイズを取り除きたい。きれいな画像にわざとノイズを加えたものを入力し、元のきれいな画像を出力するようにオートエンコーダを学習させた。この手法はどれか。", "o": ["デノイジングオートエンコーダ", "積層オートエンコーダ", "変分オートエンコーダ", "スパースオートエンコーダ"], "e": "デノイジングオートエンコーダは、ノイズを加えた入力から元のデータを復元するように学習し、ノイズ除去や頑健な特徴の獲得に使う。積層オートエンコーダは層を重ねて1層ずつ学習するもの、変分オートエンコーダは潜在変数を確率分布として扱う生成モデル、スパースオートエンコーダは中間層の活性を疎にする制約を加えるもの。"},
{"c": 5, "q": "オートエンコーダの中間層（潜在表現）の次元を、入力の次元より小さくする理由として最も適切なものはどれか。", "o": ["入力をそのまま写すだけの解を防ぎ、データの本質的な特徴を圧縮して学ばせるため", "中間層の次元を小さくすると、再構成誤差が必ず0になり学習が不要になるため", "入力より小さな中間層は、データにラベルがある場合にしか使えないため", "中間層を小さくすると、出力の次元が入力の次元より大きくなるため"], "e": "中間層を入力と同じかそれ以上の次元にし、他の制約も課さないと、入力をそのまま出力へ写すだけの解を学んでしまう恐れがある。次元を絞ることで、復元に必要な情報だけを残した圧縮表現を学ばせる。オートエンコーダはラベルなしで学習できる。"},
{"c": 5, "q": "次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。「VAEの損失関数は、入力と出力のずれを表す（ア）と、エンコーダが出力する潜在変数の分布を（イ）に近づけるためのKLダイバージェンスの項からなる。」", "o": ["（ア）再構成誤差 （イ）標準正規分布", "（ア）再構成誤差 （イ）一様分布", "（ア）敵対的損失 （イ）標準正規分布", "（ア）敵対的損失 （イ）ベルヌーイ分布"], "e": "VAEは、再構成誤差と、潜在変数の分布と事前分布（通常は標準正規分布）とのKLダイバージェンスの和を最小化する。KL項によって潜在空間がなめらかに整い、そこからサンプリングして生成できる。敵対的損失はGANで用いる損失。"},
{"c": 5, "q": "オートエンコーダと主成分分析（PCA）の関係の説明として最も適切なものはどれか。", "o": ["活性化関数のない線形のオートエンコーダを二乗誤差で学習すると、PCAと同じ部分空間が得られる", "PCAは非線形な圧縮ができるが、オートエンコーダは線形な圧縮しかできない", "オートエンコーダはラベル付きデータが必要だが、PCAはラベルなしで次元を削減できる", "PCAとオートエンコーダは、どちらも次元を増やして特徴を強調する手法である"], "e": "線形のオートエンコーダを二乗誤差で学習すると、主成分が張る部分空間と同じ空間に射影することが知られている。非線形の活性化関数を使えば、PCAではできない非線形な圧縮ができる。どちらもラベルなしで次元を減らす手法。"},
{"c": 5, "q": "学習済みのVAEで、画像Aと画像Bをエンコードして得た潜在変数の中間点をデコーダに入力した。得られる出力として最も適切なものはどれか。", "o": ["AとBの特徴が混ざった、両者の中間的な画像", "AとBの画素値を半分ずつ平均した、重ね写しの画像", "潜在空間の外なので、意味のないノイズだけの画像", "エンコーダに入力したAとまったく同じ画像"], "e": "VAEはKL項によって潜在空間が連続的に整えられるので、潜在変数を補間してデコードすると、形や特徴がなめらかに変化した中間的な画像が得られる。画素を平均した重ね写しとは異なり、潜在空間で混ぜる点が特徴。"},
{"c": 5, "q": "ある工場では、時間帯や天候によって検査台の照明の明るさが変わる。この変化に強い外観検査モデルを学習させるためのデータ拡張として最も適切なものはどれか。", "o": ["明るさやコントラストをランダムに変える色調変換", "画像の一部を0で塗りつぶすCutout", "2枚の画像を比率で重ね合わせるMixup", "文中の単語を同じ意味の別の語に置き換える同義語置換"], "e": "運用時に起こる変化（ここでは照明の明るさ）を学習時に擬似的に作り出すのが、データ拡張の基本的な考え方。明るさ・コントラストの変換がそれに当たる。Cutoutは隠れ、Mixupはクラス間の滑らかさを狙う手法で、同義語置換はテキスト向け。"},
{"c": 5, "q": "Cutoutと比べたときのRandom Erasingの特徴として最も適切なものはどれか。", "o": ["消す領域の大きさと縦横比もランダムに決め、ランダムな値で塗りつぶす", "消す領域を固定の大きさの正方形とし、その領域を0で塗りつぶす", "消した領域に別の画像の切り抜きを貼り、ラベルもその面積の比率で混ぜる", "画像全体を別の画像と一定の比率で重ね、ラベルもその比率で混ぜる"], "e": "Random Erasingは、矩形の大きさや縦横比、塗りつぶす値をランダムに選ぶ。固定の大きさの正方形を消すのはCutoutの基本的な形。別の画像を貼ってラベルを混ぜるのはCutMix、全体を重ねるのはMixup。"},
{"c": 5, "q": "画像分類で、データを学習用と検証用に分ける作業とデータ拡張を行う順序として最も適切なものはどれか。", "o": ["先に学習用と検証用に分け、学習用データにだけデータ拡張を行う", "先に全データを拡張し、拡張後のデータを学習用と検証用に分ける", "先に検証用データを拡張して件数を増やし、その後で学習用と分ける", "学習用と検証用に分けたあと、検証用データにだけデータ拡張を行う"], "e": "拡張してから分けると、同じ元画像から作った画像が学習用と検証用の両方に入り、検証の性能が実際より高く見える。分割を先に行い、拡張は学習用データに対して行う。"},
{"c": 5, "q": "商品レビューの感情分析（肯定・否定の判定）の学習データを、同義語置換で増やす。注意すべき点として最も適切なものはどれか。", "o": ["置き換えた語によって文の意味や肯定・否定が変わっていないか確かめる", "置き換えは名詞だけに限り、形容詞や動詞は置き換えてはならないと決めておく", "置き換え後の文には、元の文と逆のラベルを付け直して学習させる", "置き換えると必ず文が長くなるので、文の長さの上限を広げておく"], "e": "同義語置換は元の文と同じラベルを付けて使うことが前提なので、辞書の語が文脈に合わずに意味や感情の向きが変わると、誤ったラベルのデータが増える。品詞を一律に禁止する決まりはなく、逆のラベルを付けるのは誤り。"},
{"c": 5, "q": "利用者がスマートフォンで入力する問い合わせ文を分類するモデルを作る。誤字や打ち間違いのある文にも強くしたい。データ拡張として最も適切なものはどれか。", "o": ["文字をランダムに削除・挿入・入れ替えするノイズ付加", "文を別の言語にいったん訳してから元の言語に戻す逆翻訳による言い換え", "画像の明るさやコントラストを変える色調変換", "2つの文のラベルを平均して付け直すラベルの平滑化"], "e": "運用時の入力に含まれる誤字や脱字を再現するには、文字単位の削除・挿入・入れ替えなどのノイズ付加が合う。逆翻訳は表現の言い換えを増やす手法で、誤字は含まれにくい。色調変換は画像向け。"},
{"c": 5, "q": "ベルトコンベア上の部品を撮影する検査で、部品が画像内のどこに写るかが毎回少しずつずれる。この変化に強くするデータ拡張として最も適切なものはどれか。", "o": ["画像をランダムな位置で切り抜いたり、少し平行移動したりする", "画像の明るさやコントラストを、撮影ごとにランダムに変える", "画像にガウスノイズを加えて、画質を落とす", "画像を拡大してから、元の大きさに縮小して戻す"], "e": "写る位置のずれには、ランダムな切り抜き（クロップ）や平行移動で位置の異なる画像を作るのが合う。明るさの変換は照明の変化、ノイズ付加はセンサーのノイズへの対策で、位置のずれには対応しない。"},
{"c": 5, "q": "プーリング層に関する記述として、誤っているものはどれか。", "o": ["Global Average Poolingは、各チャネルの平均に掛ける学習可能な重みを持つ", "最大値プーリングは、窓内の小さな位置のずれに対して出力を変わりにくくする", "平均値プーリングは、窓内の値の平均をとるので、出力が入力よりなめらかになる", "プーリングは通常、チャネルごとに独立に行い、チャネル数を変えない"], "e": "Global Average Poolingは各チャネルの空間方向の平均をとるだけで、学習パラメータを持たない。全結合層を置き換えることで、パラメータ数を減らし過学習を抑える効果がある。他の記述は正しい。"},
{"c": 5, "q": "1×1畳み込みに関する記述として、誤っているものはどれか。", "o": ["1×1畳み込みを重ねるほど、空間方向の受容野が広がっていく", "各画素の位置で、チャネル方向の値に全結合層と同じ計算をしている", "縦横の大きさを保ったまま、チャネル数を減らしたり増やしたりできる", "活性化関数と組み合わせると、チャネル方向の非線形な変換を加えられる"], "e": "1×1畳み込みは各画素を1点ずつ見るので、何層重ねても空間方向の受容野は広がらない。各位置でのチャネル方向の全結合と同じ計算で、チャネル数の調整や非線形性の追加に使う。"},
{"c": 5, "q": "32×32の画像の画素を、全画像で共通のある規則で並べ替えて（シャッフルして）から学習させる。並べ替えによる性能の低下が最も小さいと考えられるモデルはどれか。", "o": ["画像を平坦化して入力する全結合層だけのモデル", "3×3の畳み込み層を重ねたモデル", "畳み込みと最大値プーリングを重ねたモデル", "Dilated Convolutionを重ねたモデル"], "e": "全結合層は入力の並び順に意味を仮定しないので、全画像で同じ規則の並べ替えなら同じように学習できる。畳み込み層は近くの画素どうしが関係するという前提で局所的な窓を見るため、隣り合う画素がばらばらになると性能が大きく落ちる。"},
{"c": 5, "q": "商品レビューの文章を1語ずつRNNに入力し、文章全体が肯定か否定かを判定したい。RNNの出力の使い方として最も適切なものはどれか。", "o": ["最後の時刻の隠れ状態を分類層に入力して、文章に1つのラベルを出す", "各時刻の隠れ状態に1つずつラベルを出し、単語ごとに肯定か否定かを出力する", "最初の時刻の隠れ状態だけを分類層に入力し、残りの時刻の出力は捨てる", "デコーダを付けて、入力と同じ長さの別の文章を生成させてから判定する"], "e": "系列全体に1つのラベルを付ける多対一の問題では、系列を最後まで読んだ時点の隠れ状態（や全時刻の隠れ状態をまとめたもの）を分類層に入力する。単語ごとにラベルを出すのは品詞付与のような多対多の問題。最初の時刻だけでは文章の大部分を読んでいない。"});
