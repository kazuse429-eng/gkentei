<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{-webkit-text-size-adjust:100%;background:var(--bg);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="G検定演習">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10171d" media="(prefers-color-scheme: dark)">
<title>G検定 演習問題集</title>
</head>
<body>
<style>
/* レイアウト: 1問ずつ解く単一カラム。ホーム＝モード選択＋分野別の正答率、結果＝分野別の内訳と解き直し */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --fg:#15202a; --muted:#5a6874; --line:#d6dee4;
  --accent:#1d5d8a; --accent-soft:#e3eef6; --accent-fg:#ffffff;
  --ok:#1c7a4c; --ok-soft:#e2f3ea; --ng:#b2352e; --ng-soft:#fae6e4;
  --font-body:"BIZ UDPGothic","Yu Gothic UI","Hiragino Sans","Meiryo",system-ui,sans-serif;
  --font-num:"BIZ UDGothic","Consolas","Menlo",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10171d; --surface:#18222a; --fg:#e4ebf0; --muted:#95a4b0; --line:#2c3a45;
  --accent:#6aaede; --accent-soft:#1b3346; --accent-fg:#0b1620;
  --ok:#5cc58f; --ok-soft:#173226; --ng:#ee7f76; --ng-soft:#3a1d1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171d; --surface:#18222a; --fg:#e4ebf0; --muted:#95a4b0; --line:#2c3a45;
  --accent:#6aaede; --accent-soft:#1b3346; --accent-fg:#0b1620;
  --ok:#5cc58f; --ok-soft:#173226; --ng:#ee7f76; --ng-soft:#3a1d1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.75;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
h1,h2,h3{text-wrap:balance;line-height:1.35;margin:0}
h1{font-size:1.6rem;letter-spacing:.02em}
h2{font-size:1.15rem}
.muted{color:var(--muted)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.label{font-size:.75rem;letter-spacing:.08em;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 18px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:grid;gap:20px}

/* ヘッダー */
.head{display:grid;gap:4px;padding-bottom:18px;border-bottom:2px solid var(--fg)}
.head .meta{font-size:.85rem}

/* ホーム */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.mode{display:grid;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:16px}
.mode:hover:not(:disabled){border-color:var(--accent)}
.mode strong{font-size:1.05rem}
.mode .n{font-family:var(--font-num);font-size:1.5rem;color:var(--accent)}
.mode:disabled{opacity:.5;cursor:default}
.cats{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.cat{display:grid;grid-template-columns:auto 1fr 110px 56px;gap:10px;align-items:center;padding:6px 8px;border-radius:6px}
.cat:hover{background:var(--accent-soft)}
.cat input{width:18px;height:18px;accent-color:var(--accent)}
.cat .name{min-width:0}
.cat .name small{color:var(--muted);margin-left:6px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.cat .pct{text-align:right;font-size:.85rem}
.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.note{font-size:.85rem;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}

/* 出題 */
.qtop{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.chip{display:inline-block;font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--fg)}
.qtext{font-size:1.1rem;font-weight:700;line-height:1.8;white-space:pre-line}
.opt span:last-child,.exp div,.review strong,.review .ans{white-space:pre-line}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--font-num);display:grid;place-items:center;width:28px;height:28px;border-radius:6px;border:1px solid var(--line);font-size:.9rem}
.opt span:last-child{min-width:0}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .k{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.verdict{font-weight:700;font-size:1.05rem}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:6px}
.pace{font-size:.85rem}
.pace.slow{color:var(--ng)}
.keys{font-size:.8rem;color:var(--muted)}

/* 結果 */
.score{display:flex;flex-wrap:wrap;gap:28px;align-items:baseline}
.score .big{font-family:var(--font-num);font-size:3rem;line-height:1;color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:400;color:var(--muted);font-size:.8rem;letter-spacing:.05em}
td.r,th.r{text-align:right}
.tablebox{overflow-x:auto}
.review{display:grid;gap:12px}
.review article{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ng);border-radius:8px;padding:12px 14px;display:grid;gap:6px}
.review .ans{font-size:.9rem}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.9rem}
@media (max-width:520px){
  .cat{grid-template-columns:auto 1fr 56px}
  .cat .bar{display:none}
  .score .big{font-size:2.4rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="head">
    <div class="label">JDLA ジェネラリスト検定 ／ シラバス2024準拠（2026年試験対応）</div>
    <h1>G検定 演習問題集</h1>
    <div class="meta muted" id="meta">全<span class="num" id="total"></span>問・10分野。選択肢の並びは毎回入れ替わります。成績はこのPCのブラウザに保存されます。</div>
  </header>

  <main id="app" class="stack" style="margin-top:24px"></main>
</div>

<script>
// G検定 演習問題データ（シラバス2024準拠 / 2026年試験対応）
// c: 分野番号(1-10)  q: 問題文  o: 選択肢（先頭が正解。表示時にシャッフル）  e: 解説
const CATS = [
  "", "人工知能とは", "人工知能をめぐる動向", "機械学習の概要", "ディープラーニングの概要",
  "ディープラーニングの要素技術", "ディープラーニングの応用例", "AIの社会実装に向けて",
  "AIに必要な数理・統計知識", "AIに関する法律と契約", "AI倫理・AIガバナンス"
];
const QUESTIONS = [
// ---- 1 人工知能とは ----
{c:1,q:"1956年のダートマス会議の提案書で、「人工知能（Artificial Intelligence）」という言葉を初めて用いた人物は誰か。",
 o:["ジョン・マッカーシー","アラン・チューリング","ジェフリー・ヒントン","ヤン・ルカン"],
 e:"ダートマス会議の開催を提案したジョン・マッカーシーが、提案書の中で初めて「Artificial Intelligence」という語を用いた。チューリングは1950年に「チューリングテスト」を提案した人物。"},
{c:1,q:"「AI効果」の説明として最も適切なものはどれか。",
 o:["AIで実現された機能の仕組みが分かると、人々がそれを「知能ではなく単なる自動化だ」とみなすようになる現象",
    "AIを業務に導入すると、どの業種でも生産性が一定の割合で向上するという経験則",
    "人間がAIの出力を過度に信頼してしまい、明らかな誤りが含まれていても気づかずに見逃してしまう傾向",
    "学習データの量を増やせば増やすほど、AIの性能が上限なく向上し続けるという現象"],
 e:"AI効果は、実現された技術が「当たり前」になると知能と認められなくなる現象。AIの定義が研究者の間でも定まらない理由の一つとされる。AIの出力を過信して誤りを見逃す傾向は自動化バイアスの説明。"},
{c:1,q:"「強いAI」と「弱いAI」という区別を提唱した哲学者は誰か。",
 o:["ジョン・サール","レイ・カーツワイル","ヒューバート・ドレイファス","ニック・ボストロム"],
 e:"ジョン・サールは1980年、「中国語の部屋」の思考実験とともに強いAI（本物の心を持つ）と弱いAI（心があるかのように振る舞う道具）を区別した。"},
{c:1,q:"2045年に人工知能が人間の知能を超え、技術的特異点（シンギュラリティ）に到達すると予測したことで知られる人物は誰か。",
 o:["レイ・カーツワイル","ヨシュア・ベンジオ","スチュアート・ラッセル","ヤン・ルカン"],
 e:"レイ・カーツワイルが著書『The Singularity Is Near』（2005年）で2045年のシンギュラリティ到来を予測した。"},
{c:1,q:"エアコンの温度調整や洗濯機の水量調整のように、あらかじめ決められた単純な振る舞いをする製品は、AIのレベル分類でどれに当たるか。",
 o:["レベル1：単純な制御プログラム","レベル2：古典的な人工知能","レベル3：機械学習を取り入れた人工知能","レベル4：ディープラーニングを取り入れた人工知能"],
 e:"レベル1は制御工学の範囲の単純なプログラム。レベル2は探索・推論や知識を使い多彩な振る舞いをするもの、レベル3はデータから規則を学習するもの、レベル4は特徴量自体を学習するもの。"},
// ---- 2 人工知能をめぐる動向 ----
{c:2,q:"第1次AIブーム（1950年代後半〜1960年代）の中心となった技術はどれか。",
 o:["探索・推論","エキスパートシステムによる知識表現","ディープラーニング","大規模言語モデル"],
 e:"第1次ブームは探索・推論、第2次ブームは知識表現（エキスパートシステム）、第3次ブームは機械学習・ディープラーニングが中心。"},
{c:2,q:"第1次AIブームが終わった主な理由として最も適切なものはどれか。",
 o:["迷路やパズルなどのトイ・プロブレムは解けても、現実の複雑な問題は解けなかったため",
    "専門家の知識をルールとして記述・管理する作業が膨大になり、知識ベースの構築が行き詰まったため",
    "多層ニューラルネットワークの勾配消失問題が解決できず、深い層の学習が進まなかったため",
    "個人情報保護の法規制が強化され、学習に必要なデータが集められなくなったため"],
 e:"第1次ブームでは、ルールとゴールが明確なトイ・プロブレムしか解けないことが明らかになり、冬の時代を迎えた。専門家の知識のルール化が行き詰まったのは第2次ブーム終焉の理由（知識獲得のボトルネック）。"},
{c:2,q:"1970年代にスタンフォード大学で開発されたエキスパートシステム「MYCIN」の用途として適切なものはどれか。",
 o:["血液中のバクテリアの感染症を診断し、抗生物質を推奨する","未知の有機化合物の質量分析結果から分子構造を特定する","精神療法士のように振る舞い、利用者とテキストで対話する","チェスの盤面を探索し、世界チャンピオンと対戦して勝利する"],
 e:"MYCINは約500のルールで感染症診断を行った。有機化合物の特定はDENDRAL、対話はELIZA、チェスはDeep Blue。"},
{c:2,q:"1966年にジョセフ・ワイゼンバウムが開発した対話プログラム「ELIZA（イライザ）」の特徴として最も適切なものはどれか。",
 o:["入力文のパターンに応じて定型的に応答するだけだが、利用者が知性を感じることがあった",
    "大規模なテキストコーパスで学習したニューラルネットワークを用いて、文脈に応じた応答を生成していた",
    "医療の専門知識を数百のルールとして持ち、患者の症状を入力すると診断結果を返していた",
    "音声を認識して応答する最初のスマートスピーカーだった"],
 e:"ELIZAは単純なパターンマッチングで精神療法士を演じた。仕組みが単純でも人が知性や共感を感じてしまう現象は「イライザ効果」と呼ばれる。"},
{c:2,q:"第2次AIブームで課題となった「知識獲得のボトルネック」の説明として最も適切なものはどれか。",
 o:["専門家の暗黙的な知識を引き出し、ルールとして記述・管理するのが非常に困難だった",
    "計算機のメモリが小さく、探索木のすべての節点を展開して最適解を求めることができなかった",
    "学習データに正解ラベルを付ける作業が追いつかず、機械学習モデルを学習できなかった",
    "インターネットの通信速度が遅く、知識を共有できなかった"],
 e:"エキスパートシステムでは、専門家から知識を聞き取りルール化する作業が膨大で、知識同士の矛盾の管理も難しかった。"},
{c:2,q:"意味ネットワークにおける「is-a」の関係の説明として適切なものはどれか。",
 o:["上位概念と下位概念の関係で、上位の属性が下位に継承される","全体と部分の関係を表す","ある物とその属性値の関係を表し、概念どうしの上下関係は表さない","出来事の原因と結果の関係を表し、時間的な前後関係も同時に示す"],
 e:"「哺乳類 is-a 動物」のように上位・下位概念を表し、推移律が成り立つ。全体と部分の関係は「part-of」。"},
{c:2,q:"1984年にダグラス・レナートが開始した、人間の一般常識をすべてコンピュータに入力しようとするプロジェクトはどれか。",
 o:["Cycプロジェクト","ワトソンプロジェクト","第五世代コンピュータプロジェクト","東ロボくんプロジェクト"],
 e:"Cycプロジェクトは一般常識の知識ベース構築を目指し、現在も続いている。常識の記述がいかに膨大かを示す例として知られる。"},
{c:2,q:"「フレーム問題」の説明として最も適切なものはどれか。",
 o:["今の課題に関係のある事柄だけを選び出すことが、実は非常に難しいという問題",
    "記号とそれが指し示す実世界の対象・意味とを、機械が自力で結びつけられないという問題",
    "モデルが学習データに過剰に適合し、未知のデータに対する予測精度が下がってしまう問題",
    "画像の枠（フレーム）の外にはみ出した物体を、画像認識モデルが正しく認識できない問題"],
 e:"フレーム問題はマッカーシーとヘイズが提起した。記号と実世界の対象を結びつけられない問題はシンボルグラウンディング問題、学習データへの過剰適合は過学習。"},
{c:2,q:"「シンボルグラウンディング問題」を提唱した人物と、その内容の組み合わせとして適切なものはどれか。",
 o:["スティーブン・ハルナッド：記号と、それが意味する実世界の対象を結びつける難しさ",
    "スティーブン・ハルナッド：無数の知識の中から、今の課題に関係のある知識だけを選び出す難しさ",
    "ジョン・マッカーシー：記号と、それが意味する実世界の対象を結びつける難しさ",
    "ジョン・サール：記号と、それが意味する実世界の対象を結びつける難しさ"],
 e:"シンボルグラウンディング問題を提唱したのはハルナッド（1990年）。例えば「シマウマ＝シマ＋ウマ」と記号で知っていても、実物のシマウマを見て結びつけられるかという問題である。関係のある知識だけを選び出す難しさはマッカーシーとヘイズが提起したフレーム問題、サールは「中国語の部屋」で強いAIを批判した人物。"},
{c:2,q:"2012年の画像認識コンテストILSVRCで、従来手法に大差をつけて優勝し、第3次AIブームのきっかけとなったモデルはどれか。",
 o:["AlexNet","ResNet","VGGNet","GoogLeNet"],
 e:"トロント大学のヒントンらのチームによるAlexNetが誤り率を約10ポイント下げて優勝した。VGGNetとGoogLeNetは2014年、ResNetは2015年の上位モデル。"},
// ---- 3 機械学習の概要 ----
{c:3,q:"次のうち、教師なし学習に分類される手法はどれか。",
 o:["k-means法","ロジスティック回帰","サポートベクターマシン","ランダムフォレスト"],
 e:"k-means法は正解ラベルを使わずにデータをk個のクラスタに分ける教師なし学習。他の3つは教師あり学習。"},
{c:3,q:"ロジスティック回帰の説明として最も適切なものはどれか。",
 o:["名前に「回帰」とつくが、シグモイド関数で2値分類の確率を出力する分類手法",
    "連続値を予測する回帰手法であり、出力が0〜1の範囲に収まらないため分類問題には使えない",
    "複数の決定木を独立に学習し、それらの予測を多数決でまとめるアンサンブル手法である",
    "データを距離の近いもの同士のグループに分ける手法である"],
 e:"ロジスティック回帰は線形結合をシグモイド関数に通し0〜1の確率を出力する。多クラスではソフトマックス関数を用いる。"},
{c:3,q:"ランダムフォレストの説明として最も適切なものはどれか。",
 o:["データと特徴量をランダムに選んで多数の決定木を作り、予測を多数決や平均でまとめる",
    "前の決定木が誤った予測を重点的に学習するよう、決定木を1本ずつ順番に追加していく",
    "1本の深い決定木を作ってから、汎化性能を高めるために不要な枝を刈り込む",
    "クラス間のマージンが最大となる境界線（超平面）を求める"],

{"c": 1, "q": "2014年に英国王立協会で行われたテストで、審査員の33％に人間だと判断させ「チューリングテストに合格した」と主催者が発表したチャットボットはどれか。", "o": ["ユージーン・グーストマン", "ELIZA", "PARRY", "シャオアイス（Xiaoice）"], "e": "ユージーン・グーストマンは13歳の少年という設定のプログラムで、設定を利用して知識不足をごまかしたとの批判も多い。PARRYは1970年代の妄想型統合失調症患者を模した対話プログラム、シャオアイスはマイクロソフトが中国で公開したチャットボット。"},

{"c": 1, "q": "ジョン・サールの「中国語の部屋」の思考実験が主張しようとしたことはどれか。", "o": ["規則どおりに記号を操作して適切に応答できても、意味を理解しているとは言えない", "十分な量の規則を与えさえすれば、機械も人間と同じように言語の意味を理解できる", "機械が知的かどうかは、外から見た会話の振る舞いだけで判定すべきである", "言語の理解には、文法の規則よりも大量の例文から得られる統計が重要である"], "e": "部屋の中の人は中国語が分からないまま、手引書に従って正しい返答を返せる。サールはこれをもって、チューリングテストに合格しても理解しているとは限らず、強いAIは実現できないと論じた。「外から見た会話の振る舞いだけで判定すべき」はチューリングテストの立場。"},
{"c": 1, "q": "サールの区別による「強いAI」の説明として最も適切なものはどれか。", "o": ["適切にプログラムされたコンピュータは、人間と同じ意味で心を持ち理解しているとする立場", "人間の知的な作業の一部を代行する便利な道具としてAIを捉える立場", "特定のタスクで人間の専門家を上回る性能を示すAIのこと", "物理的な身体を持ち、人間より大きな力を発揮できるAIロボットのこと"], "e": "強いAIは本物の心を持つとする立場、弱いAIは心があるかのように振る舞う道具とする立場。「特定のタスクで人間の専門家を上回る」は特化型AIの説明で、性能の高さと強い・弱いの区別は別の軸である。"},

{"c": 1, "q": "レイ・カーツワイルがシンギュラリティ到来の根拠とした、技術の進歩が指数関数的に加速していくという考え方はどれか。", "o": ["収穫加速の法則", "収穫逓減の法則", "ムーアの法則の限界", "ノーフリーランチ定理"], "e": "収穫加速の法則は、進歩した技術が次の技術の開発を速めるため進歩が指数関数的になるという考え。収穫逓減は投入を増やしても増分が小さくなるという逆の考え方。"},
{"c": 1, "q": "1965年に、人間を超える「超知能機械」が自らより優れた機械を設計することで「知能爆発」が起こり、それが人類最後の発明になると論じた数学者は誰か。", "o": ["アーヴィング・ジョン・グッド", "ヴァーナー・ヴィンジ", "ジョン・フォン・ノイマン", "クロード・シャノン"], "e": "I.J.グッドの論文「最初の超知能機械に関する考察」は、今日のシンギュラリティ論の源流とされる。ヴィンジは1993年に「技術的特異点」を論じたSF作家・数学者。"},

QUESTIONS.push({"c": 2, "q": "探索木における幅優先探索の特徴として最も適切なものはどれか。", "o": ["浅い階層から順に調べるので最短の解が見つかるが、途中のノードを保持するためメモリを多く使う", "1つの枝を行き止まりまで調べてから戻るため、メモリは少なくて済むが最短の解が得られるとは限らない", "ランダムに選んだ手を終局まで打ち続け、その勝率で次の手を決める", "相手が自分に最も不利な手を選ぶと仮定し、評価値が最大になる手を選ぶ"], "e": "幅優先探索は浅い階層から順に展開するので最短解が得られるが、メモリ消費が大きい。1つの枝を行き止まりまで調べるのは深さ優先探索、ランダムに終局まで打つのはモンテカルロ法、相手が最も不利な手を選ぶと仮定するのはMini-Max法の説明。"},
{"c": 2, "q": "迷路の探索で、メモリの使用量をできるだけ抑えたい一方、最短経路である必要はない場合に向いている探索方法はどれか。", "o": ["深さ優先探索", "幅優先探索", "Mini-Max法", "αβ法"], "e": "深さ優先探索は今たどっている経路だけを覚えておけばよいのでメモリが少なくて済むが、最初に見つかる解が最短とは限らない。Mini-Max法とαβ法は対戦ゲームの探索手法。"},
{"c": 2, "q": "根ノードAの子がB・C、Bの子がD・E、Cの子がFである探索木を、左の子を先にたどる深さ優先探索で調べたとき、ノードを訪れる順番はどれか。", "o": ["A→B→D→E→C→F", "A→B→C→D→E→F", "A→C→F→B→D→E", "A→D→E→B→F→C"], "e": "深さ優先ではAからBへ進み、Bの子D・Eを調べ終えてからCとその子Fへ移る。A→B→C→D→E→Fは浅い順に調べる幅優先探索の順番。"},
{"c": 2, "q": "ハノイの塔で円盤が5枚のとき、すべての円盤を別の柱へ移すのに必要な最小の移動回数はどれか。", "o": ["31回", "25回", "32回", "63回"], "e": "円盤n枚の最小手数は2^n−1で、n=5では31回。63回は6枚のときの手数。探索木で解けるトイ・プロブレムの代表例。"},
{"c": 2, "q": "1971年にスタンフォード研究所で開発されたプランニングの手法「STRIPS」の説明として最も適切なものはどれか。", "o": ["行動を「前提条件」「行動」「結果」の組で記述し、目標状態に至る行動の計画を作る", "利用者と英語で対話しながら、画面上の積み木の世界を操作する", "専門家から聞き取った知識をif-thenルールで記述し、病気を診断する", "一般常識をすべて記述した知識ベースを構築し、推論に利用する"], "e": "STRIPSはロボットShakeyの行動計画にも使われた。英語で積み木の世界を操作するのはSHRDLU、if-thenルールで病気を診断するのはMYCINなどのエキスパートシステム、一般常識を記述した知識ベースはCycプロジェクトの説明。"},
{"c": 2, "q": "テリー・ウィノグラードが開発した、英語で指示すると仮想的な「積み木の世界」で物体を動かすシステムはどれか。", "o": ["SHRDLU", "STRIPS", "DENDRAL", "ELIZA"], "e": "SHRDLUはウィノグラードがMITで1968〜1970年に開発し、限られた世界での自然言語理解を実現した。STRIPSは行動計画の手法、DENDRALは化合物を特定するエキスパートシステム、ELIZAは対話プログラム。"},
{"c": 2, "q": "対戦ゲームの探索で用いられるMini-Max法の考え方として最も適切なものはどれか。", "o": ["自分の手番では評価値が最大の手を、相手の手番では最小の手を選ぶと仮定して探索する", "評価値が高そうな手から順に調べ、制限時間が来た時点で最も評価の良い手を選ぶ", "局面の評価をせず、ランダムに終局まで打つ試行を繰り返して手を決める", "過去の対局記録で最も多く指された手を、局面を評価せずにそのまま次の手として選ぶ"], "e": "Mini-Max法は相手も最善を尽くすと仮定し、自分はMax、相手はMinを交互に取って評価値を根まで伝える。ランダムに終局まで打つ試行を繰り返すのはモンテカルロ法（プレイアウト）の説明。"},
{"c": 2, "q": "根が自分の手番（MAX）、その下の2つのノードが相手の手番（MIN）のゲーム木がある。左のMINノードの葉の評価値が3と5、右のMINノードの葉の評価値が2と9のとき、Mini-Max法で根に伝わる評価値はどれか。", "o": ["3", "2", "5", "9"], "e": "左のMINノードは min(3,5)=3、右は min(2,9)=2。根はMAXなので max(3,2)=3 となる。"},
{"c": 2, "q": "根がMAX、その下の2つのノードがMINのゲーム木（左のMINの葉：3,5、右のMINの葉：2,9）を左から順にαβ法で探索したとき、評価しなくてよい（枝刈りされる）葉はどれか。", "o": ["右のMINノードの評価値9の葉", "左のMINノードの評価値5の葉", "右のMINノードの評価値2の葉", "枝刈りされる葉はない"], "e": "左で根の暫定値が3と決まった後、右のMINノードで2が出た時点で右は2以下になり3を超えないことが確定するため、9の葉は調べなくてよい。"},
{"c": 2, "q": "囲碁のように局面の良し悪しを評価する関数を作るのが難しいゲームで使われた「モンテカルロ法」の説明として最も適切なものはどれか。", "o": ["終局までランダムに手を打つプレイアウトを多数行い、その勝率で手の良さを評価する", "専門家が手作業で作った評価関数を使い、すべての手を一定の深さまで調べて評価する", "相手の手番の探索を省略し、自分の手だけを深く読む", "過去のプロの棋譜から同じ局面を検索し、そこで最も多く打たれた手をそのまま選ぶ"], "e": "モンテカルロ法は評価関数の代わりにランダムな試行の統計を使う。これにより囲碁AIの強さは大きく向上した。"},
{"c": 2, "q": "1997年にチェスの世界チャンピオン、ガルリ・カスパロフに勝利したIBMのコンピュータはどれか。", "o": ["Deep Blue", "Watson", "AlphaZero", "Stockfish"], "e": "Deep Blueは専用ハードウェアによる高速な探索（力任せの探索）でカスパロフに勝った。WatsonはIBMのクイズ番組向け質問応答システム、AlphaZeroはDeepMindのAI。"},
{"c": 2, "q": "2005年に保木邦仁が公開した将棋プログラム「Bonanza」の特徴として最も適切なものはどれか。", "o": ["プロ棋士の棋譜から評価関数のパラメータを機械学習で自動調整した", "ディープラーニングと自己対局による強化学習だけで強くなった", "将棋のルール以外の知識を一切使わず、ランダムな対局のみで学習した", "開発者が手作業で数千項目の評価関数を調整し、機械学習は使わなかった"], "e": "Bonanzaはプロの指し手と同じ手を選ぶように評価関数を自動調整する手法（ボナンザメソッド）で、将棋ソフトの強さを大きく伸ばした。ディープラーニングと自己対局による強化学習はAlphaZeroなど後の世代の手法。"},
{"c": 2, "q": "2017年の第2期電王戦で、当時の佐藤天彦名人に2連勝した将棋プログラムはどれか。", "o": ["Ponanza", "Bonanza", "AlphaGo", "Deep Blue"], "e": "Ponanzaは現役の名人に公の場で勝利し、将棋ソフトがトップ棋士を上回ったことを示した。AlphaGoは囲碁、Deep Blueはチェスのプログラム。"},
{"c": 2, "q": "1960年代にスタンフォード大学で開発が始まった、質量分析のデータから未知の有機化合物を特定するエキスパートシステムと、その開発の中心人物の組み合わせとして適切なものはどれか。", "o": ["DENDRAL：エドワード・ファイゲンバウム", "MYCIN：エドワード・ファイゲンバウム", "DENDRAL：ジョセフ・ワイゼンバウム", "DENDRAL：テリー・ウィノグラード"], "e": "DENDRALはファイゲンバウムらが開発した初期のエキスパートシステム。MYCINは感染症診断のシステムで、ワイゼンバウムはELIZA、ウィノグラードはSHRDLUの開発者である。"},
{"c": 2, "q": "エキスパートシステムMYCINの診断性能に関する記述として最も適切なものはどれか。", "o": ["正答率は約65％で、感染症の専門医（約80％）には及ばないが専門外の医師より良かった", "正答率は約95％に達し、感染症の専門医を大きく上回ったため、各地の病院で広く実用化された", "正答率は約30％で、専門外の医師にも及ばず、実用には程遠い水準にとどまった", "正答率は専門医と同じ約80％に達し、そのまま米国の病院で広く臨床に使われた"], "e": "MYCINは約65％の正答率で専門外の医師を上回ったが、専門医には及ばなかった。責任の所在などの問題もあり、臨床で実用化はされなかった。"},
{"c": 2, "q": "意味ネットワークで「part-of」の関係で表すのが最も適切なものはどれか。", "o": ["タイヤと自動車", "犬と哺乳類", "東京と首都", "赤とリンゴの色"], "e": "part-ofは部分と全体の関係で、タイヤは自動車の一部である。犬と哺乳類は上位・下位概念のis-a関係、東京と首都は「東京は首都である」という事例の関係、赤とリンゴの色は属性とその値の関係。"},
{"c": 2, "q": "トム・グルーバーによる「オントロジー」の定義として最も適切なものはどれか。", "o": ["概念化の明示的な仕様", "大量の文書を集めて整理した言語資料", "専門家の知識をif-thenで記した規則集", "問題の状態と操作を木の形で表した図"], "e": "オントロジーは概念とその関係を明示的に記述し、知識を共有・再利用するための仕様。大量の文書を集めた言語資料はコーパス、if-thenの規則集はエキスパートシステムのルール、状態と操作を木で表した図は探索木。"},

{"c": 3, "q": "k近傍法で未知のデータを分類する。訓練データを未知データに近い順に並べると、ラベルは A, B, B, A, A, B, … であった。k=3 と k=5 の多数決による分類結果の組み合わせとして正しいものはどれか。", "o": ["k=3ではB、k=5ではA", "k=3ではA、k=5ではA", "k=3ではB、k=5ではB", "k=3ではA、k=5ではB"], "e": "k=3では近い3点A,B,BのうちBが2票でB、k=5では近い5点A,B,B,A,AのうちAが3票でAとなる。k近傍法ではkの選び方によって結果が変わることがある。"},
{"c": 3, "q": "ナイーブベイズ分類器の「ナイーブ（単純）」が指している仮定として最も適切なものはどれか。", "o": ["クラスが決まったもとで、各特徴量は互いに独立であるとみなすこと", "すべてのクラスの事前確率は等しく、データの偏りは無いとみなすこと", "特徴量と目的変数の関係は、一次式で表せる線形の関係だとみなすこと", "訓練データに含まれる外れ値やラベルの誤りは、一切無いとみなすこと"], "e": "ナイーブベイズはクラスが与えられたときの特徴量の条件付き独立を仮定し、尤度を特徴量ごとの確率の積で計算する。事前確率は訓練データのクラス比率から推定するのが普通で、等しいとは仮定しない。"},
{"c": 3, "q": "自己回帰モデル AR(2) の説明として最も適切なものはどれか。", "o": ["現在の値を、直前2時点の自分自身の値の線形結合と誤差項で表す", "現在の値を、2つの異なる時系列の同じ時点の値の積で表す", "時系列を2つのクラスタに分け、それぞれのクラスタに平均値を当てはめて予測する", "過去の値を使わず、時刻tの2次式だけで現在の値を表す"], "e": "AR(p)モデルは時系列の現在値を、自身の過去p時点の値の線形結合と誤差項で表す。AR(2)なら直前2時点を使う。複数の時系列を互いの過去の値で説明するのはベクトル自己回帰（VAR）モデルである。"},
{"c": 3, "q": "ベクトル自己回帰（VAR）モデルの適用例として最も適切なものはどれか。", "o": ["金利・為替・株価指数など互いに影響し合う複数の時系列を、各系列の過去の値から同時に予測する", "1つの商品の日次売上だけを対象にして、その商品自身の過去の売上だけから翌日の売上を予測する", "顧客の年齢と年収から、その顧客が商品を購入するかどうかを確率として予測する", "時系列データを使わずに、文書集合から単語の出現傾向をもとに話題を抽出する"], "e": "VARモデルは複数の時系列を同時に扱い、各変数を自分と他の変数の過去の値で説明するため、相互に影響する経済指標などの分析に用いられる。1系列だけを自身の過去で説明するのは通常の自己回帰（AR）モデルである。"},
{"c": 3, "q": "ロジスティック回帰で、特徴量と重みの線形結合 z がちょうど 0 になったとき、シグモイド関数が出力する確率はどれか。", "o": ["0.5", "0", "1", "約0.73"], "e": "シグモイド関数 1/(1+e^(-z)) は z=0 で 1/(1+1)=0.5 となり、閾値0.5で判定する場合はちょうど境界上になる。約0.73は z=1 のときの値である。"},
{"c": 3, "q": "2値分類器を組み合わせて多クラス分類を行う「一対他（One-vs-Rest）」の説明として最も適切なものはどれか。", "o": ["クラスごとに「そのクラスか否か」を判別する分類器を作り、スコアが最大のクラスを採用する", "すべてのクラスの組み合わせごとに2クラスを判別する分類器を作り、勝った回数が最も多いクラスを採用する", "全クラスのデータを区別せずに1つの回帰モデルで学習し、出力値を四捨五入してクラス番号とみなす", "正解ラベルを使わずにデータをクラス数と同じ個数のクラスタに分け、各クラスタをそのままクラスとみなす"], "e": "一対他（One-vs-Rest）はクラス数と同じ数の2値分類器を作り、最も高いスコアを出したクラスを予測とする。すべてのクラスの組ごとに分類器を作って投票するのは一対一（One-vs-One）である。"},
{"c": 3, "q": "k-means法のアルゴリズムの説明として最も適切なものはどれか。", "o": ["各データを最も近い重心のクラスタに割り当て、クラスタごとの重心を計算し直すことを収束まで繰り返す", "各データを1つのクラスタとして始め、最も近い2つのクラスタを順に併合して1つになるまで繰り返す", "データの分散が最大になる方向を順に求め、その方向を新しい座標軸としてデータを射影し直す", "高次元での近さを確率で表し、低次元でもその確率分布が近くなるようにデータの配置を調整する"], "e": "k-meansは重心への割り当てと重心の再計算を交互に繰り返す非階層的クラスタリングである。1つずつ併合していくのは階層的クラスタリング、分散最大の方向を求めるのは主成分分析、確率で近さを表すのはt-SNEである。"},
{"c": 3, "q": "k-means法の反復で、あるクラスタに割り当てられた点が (1, 2)、(3, 4)、(5, 0) の3点だった。このクラスタの新しい重心はどれか。", "o": ["(3, 2)", "(3, 3)", "(2, 2)", "(4, 2)"], "e": "重心は各座標の平均で、x=(1+3+5)/3=3、y=(2+4+0)/3=2 より (3, 2) となる。k-meansではこの重心の再計算と、各点を最も近い重心に割り当て直す操作を交互に行う。"},
{"c": 3, "q": "階層的クラスタリングにおけるウォード法の説明として最も適切なものはどれか。", "o": ["併合したときにクラスタ内の偏差平方和の増加が最も小さくなるクラスタどうしを併合する", "2つのクラスタに属する点のうち、最も近い点どうしの距離が最小のクラスタを併合する", "2つのクラスタに属する点のうち、最も遠い点どうしの距離が最小のクラスタを併合する", "あらかじめ決めたk個の重心に各点を割り当て、重心の位置を更新しながら分割する"], "e": "ウォード法は併合による群内平方和の増加量を基準にするため、大きさのそろったまとまりのよいクラスタができやすい。最も近い点どうしで測るのは最短距離法、最も遠い点どうしで測るのは最長距離法、重心を更新するのはk-meansである。"},
{"c": 3, "q": "デンドログラム（樹形図）の説明として最も適切なものはどれか。", "o": ["階層的クラスタリングの併合の過程を木の形で表した図で、切る高さでクラスタ数を選べる", "決定木の分岐規則を根から葉まで描いた図で、葉までたどると予測されるクラスや値が分かる", "強化学習で状態と行動の組み合わせを木の形に展開したもので、各枝に報酬が書き込まれている", "主成分ごとの寄与率を大きい順に並べた図で、どこまでの主成分を使うかを決めるのに使う"], "e": "デンドログラムは階層的クラスタリングの結果を表す樹形図で、縦軸の高さが併合時の距離を示し、ある高さで水平に切るとクラスタが決まる。寄与率を並べた図はスクリープロット、分岐規則の図は決定木そのものである。"},
{"c": 3, "q": "特異値分解（SVD）の説明として最も適切なものはどれか。", "o": ["行列を2つの直交行列と特異値の対角行列の積に分解する手法で、次元削減や推薦に使われる", "正方行列だけを対象に、行列を下三角行列と上三角行列の積に分けて連立方程式を効率よく解く手法", "データ点どうしの距離の表だけを入力とし、その距離関係を保つように低次元の座標を求める手法", "文書と単語の出現回数から、各文書に含まれる話題の割合を確率的な生成過程として推定する手法"], "e": "SVDは行列AをUΣV^Tに分解し、大きい特異値だけを残すことで低ランク近似ができる。主成分分析の計算や、ユーザー×商品の評価行列を分解する推薦に使われる。三角行列への分解はLU分解、距離関係を保つのは多次元尺度構成法である。"},
{"c": 3, "q": "主成分分析で得られた4つの主成分の固有値（分散）が 4、3、2、1 だった。第2主成分までの累積寄与率はどれか。", "o": ["70%", "40%", "30%", "90%"], "e": "寄与率は各主成分の固有値を固有値の合計で割ったもので、合計は10である。第1主成分の寄与率は40%、第2主成分は30%で、累積寄与率は (4+3)/10=70% となる。"},
{"c": 3, "q": "多次元尺度構成法（MDS）の説明として最も適切なものはどれか。", "o": ["対象どうしの距離（非類似度）の関係をなるべく保つように、対象を低次元空間に配置する", "対象どうしの距離をもとに、最も近い対象から順にまとめて階層的なクラスタの木構造を作る", "正解ラベルを使って、クラス間の分離が最大になる方向へデータを射影し、分類に役立てる", "時系列データの各時点の値を、過去の複数時点の値の線形結合で表して将来を予測する"], "e": "MDSは距離行列（非類似度の表）を入力とし、その距離関係をなるべく再現する低次元の座標を求める次元削減・可視化手法である。ラベルを使ってクラスの分離が最大になる方向へ射影するのは線形判別分析である。"},
{"c": 3, "q": "t-SNEの説明として最も適切なものはどれか。", "o": ["高次元で近いデータが低次元でも近くに並ぶよう配置する非線形の手法で、主に2〜3次元での可視化に使われる", "データの分散が最大となる方向へ線形に射影する手法で、得られた軸は元の変数の重み付き和として解釈できる", "各データを最も近い重心に割り当てる手法で、クラスタ数を指定するとデータをその数のグループに分割する", "文書中の単語の共起から話題を推定する手法で、各文書を複数の話題の混ざり合いとして表現する"], "e": "t-SNEは高次元と低次元での点どうしの近さを確率分布で表し、両者が近くなるように配置する非線形次元削減で、局所的なまとまりの可視化に向く。線形に射影するのは主成分分析である。"},
{"c": 3, "q": "協調フィルタリングによる推薦で問題になる「コールドスタート問題」の説明として最も適切なものはどれか。", "o": ["利用履歴がまだない新規ユーザーや新商品には、推薦の手がかりとなる評価データが無く推薦しにくい", "サービスの開始直後はサーバーの処理能力が不足し、推薦結果を返すまでに長い時間がかかる", "学習済みの推薦モデルを長期間更新しないと、ユーザーの好みの変化に追いつけなくなる", "人気のある商品ばかりが推薦され続け、利用者の興味の幅がしだいに狭まってしまう"], "e": "協調フィルタリングは他のユーザーの評価履歴との類似に頼るため、履歴の無い新規ユーザーや新商品を扱いにくい。商品の内容の特徴を使うコンテンツベースフィルタリングと組み合わせるなどして対処する。"},
{"c": 3, "q": "コンテンツベースフィルタリングによる推薦の例として最も適切なものはどれか。", "o": ["利用者が過去に読んだ記事と同じジャンルやキーワードを持つ記事を、記事の内容の特徴から推薦する", "利用者と購買履歴が似ている他の利用者が買った商品を、まだ買っていない商品の中から推薦する", "全利用者の閲覧数を集計し、その日に最も多く閲覧された記事を誰に対しても同じ順に推薦する", "利用者を購買金額でいくつかの層に分け、層ごとに担当者が選んだ商品を手作業で推薦する"], "e": "コンテンツベースフィルタリングはアイテム自体の属性（ジャンル、キーワードなど）と利用者の過去の好みの類似に基づいて推薦する。似た利用者の行動を使うのは協調フィルタリングである。"},
{"c": 3, "q": "トピックモデルの一つである潜在的ディリクレ配分法（LDA）の説明として最も適切なものはどれか。", "o": ["各文書は複数のトピックの混合で、各トピックは単語の出現確率の分布であるとみなして話題を推定する", "各文書を正解ラベル付きで学習し、新しい文書が属するカテゴリを1つだけ判定する教師あり分類器", "文書を単語の出現順に読み込み、次に現れる単語を直前の数単語から予測する言語モデル", "文書どうしの類似度を計算し、最も似た2文書を順に併合して文書の階層構造を作る手法"], "e": "LDAは教師なしのトピックモデルで、文書ごとのトピックの割合とトピックごとの単語分布を推定する。1文書が複数トピックを持てる点が特徴である。同じ略称の線形判別分析（LDA）とは別の手法である。"},
{"c": 3, "q": "製造ラインの異常検知が教師なし学習の枠組みで行われることが多い理由として最も適切なものはどれか。", "o": ["異常品はめったに発生せず種類も多様で集めにくいため、正常品の傾向を学習して外れたものを異常とみなす", "正常品と異常品の両方に正解ラベルを付けて学習すると、付けない場合より精度が下がるのが一般的なため", "教師なし学習では学習が不要なため、学習用のデータを1件も集めずにすぐ運用を始められるため", "異常品は正常品より数が多いため、多数派の異常品をそのまま学習すれば見分けられるため"], "e": "異常データは少なく、未知の種類の異常も起こりうるため、正常データの分布を学習して、そこからの外れ具合で異常を判定する方法がよく使われる。異常のラベル付きデータが十分あれば教師ありで学習することもできる。"},
{"c": 3, "q": "半教師あり学習が特に有効な状況として最も適切なものはどれか。", "o": ["数万枚の医用画像のうち、診断ラベルが付いているのは数百枚だけで、残りも活用したい", "すべての画像に専門医の診断ラベルが付いており、そのラベルを高い精度で予測するモデルを作りたい", "ラベルの付いたデータは1枚も無く、画像を似たものどうしのグループに分けたい", "画像を使わずに、ロボットが試行錯誤で報酬を最大にする動き方を身につけたい"], "e": "半教師あり学習は少量のラベル付きデータと大量のラベルなしデータを組み合わせて学習する。全データにラベルがあれば教師あり学習、ラベルが無くグループ分けするなら教師なし学習、報酬による試行錯誤は強化学習である。"},
{"c": 3, "q": "強化学習において、エージェントが行動した結果として環境から与えられ、その行動の良し悪しを表す数値を何と呼ぶか。", "o": ["報酬", "状態", "方策", "価値関数"], "e": "報酬は行動の直後に環境から与えられるスカラー値である。状態は環境の様子、方策は状態から行動を決める規則、価値関数は将来にわたって得られる報酬の合計（収益）の期待値を表す。"},
{"c": 3, "q": "マルコフ決定過程における「マルコフ性」の説明として最も適切なものはどれか。", "o": ["次の状態と報酬の確率は、現在の状態と行動だけで決まり、それ以前の履歴には依存しない", "次の状態と報酬の確率は、エピソードの開始から現在までのすべての履歴によって決まる", "どの状態でどの行動をとっても、得られる報酬の期待値はすべて同じ値になる", "エージェントの行動とは無関係に、状態は一定の時間間隔で決まった順番に移り変わる"], "e": "マルコフ性とは、未来の状態が現在の状態（と行動）だけに依存し、過去の経緯に依存しない性質である。これにより価値関数をベルマン方程式で再帰的に表せる。"},
{"c": 3, "q": "あるエピソードで、時刻 t から順に報酬 2、0、4 が得られて終了した。割引率 γ=0.5 のとき、時刻 t からの割引収益はどれか。", "o": ["3", "6", "4", "2.5"], "e": "割引収益は 2 + 0.5×0 + 0.5^2×4 = 2 + 0 + 1 = 3 である。割り引かずに足すと6になる。先の報酬ほど割引率の累乗で小さく評価される。"},
{"c": 3, "q": "強化学習で割引率 γ を 0 に近づけたときの説明として最も適切なものはどれか。", "o": ["直後の報酬ばかりが重視され、遠い将来の報酬をほとんど考慮しない行動を学習しやすくなる", "遠い将来の報酬ほど大きく評価され、目先の報酬を犠牲にした長期的な行動を学習しやすくなる", "ランダムな行動を選ぶ確率が下がり、現時点で最良と推定される行動ばかりを選ぶようになる", "1回の更新で価値の推定値を動かす幅が小さくなり、学習がゆっくりと安定して進むようになる"], "e": "割引率は将来の報酬をどれだけ重視するかを決め、0に近いほど近視眼的、1に近いほど長期的な報酬を重視する。ランダムな行動の確率はε-greedyのε、更新幅は学習率αの役割である。"},
{"c": 3, "q": "行動価値関数 Q(s, a) の説明として最も適切なものはどれか。", "o": ["状態sで行動aをとり、その後は方策に従って行動したときに得られる収益の期待値", "状態sから方策に従って行動したときに得られる収益の期待値で、最初の行動は問わない", "状態sで行動aをとった直後に、環境から一度だけ受け取る報酬の値", "状態sで行動aを選ぶ確率を表す関数で、すべての行動について足すと1になる"], "e": "行動価値関数は状態と行動の組の価値を表す。最初の行動を問わず状態だけの価値を表すのは状態価値関数V(s)、行動を選ぶ確率を表すのは方策π(a|s)である。"},
{"c": 3, "q": "Q学習で、Q(s,a)=2、学習率α=0.5、得られた報酬r=1、割引率γ=0.9、次状態での最大の行動価値 max Q(s',a')=4 のとき、更新後の Q(s,a) はどれか。", "o": ["3.3", "4.6", "1.5", "2.3"], "e": "更新式 Q ← Q + α(r + γ max Q(s',a') − Q) より、2 + 0.5×(1 + 0.9×4 − 2) = 2 + 0.5×2.6 = 3.3 となる。4.6は目標値 r+γmaxQ そのもの、1.5は将来の価値を無視した場合の値である。"},
{"c": 3, "q": "Q学習とSARSAの違いとして最も適切なものはどれか。", "o": ["Q学習は次状態で最大の行動価値を使って更新し、SARSAは次に実際に選んだ行動の行動価値を使って更新する", "Q学習は次に実際に選んだ行動の行動価値を使って更新し、SARSAは次状態で最大の行動価値を使って更新する", "Q学習は方策をパラメータで直接表して勾配で更新し、SARSAは状態価値だけを表形式で更新する", "Q学習はエピソードが終わるまで更新を待ち、SARSAは報酬を受け取る前に行動価値を更新する"], "e": "Q学習は行動に使う方策とは別に貪欲な行動の価値で更新する方策オフ型、SARSAは実際にとる次の行動（s,a,r,s',a'）で更新する方策オン型である。どちらも1ステップごとに更新するTD学習の手法である。"},
{"c": 3, "q": "方策勾配法の特徴として最も適切なものはどれか。", "o": ["方策をパラメータで直接表し、期待収益が大きくなる方向へ勾配を使って更新するため、連続的な行動にも適用しやすい", "すべての状態と行動の組の価値を表に記録して、最大の価値をもつ行動を選ぶため、連続的な行動にもそのまま適用できる", "環境の状態遷移確率と報酬関数をすべて既知として、動的計画法で最適な価値を厳密に計算する", "報酬を使わずに、正解の行動が付いたデータから状態と行動の対応を教師あり学習で覚える"], "e": "方策勾配法は方策πθを直接最適化するため、行動が連続値のロボット制御などにも使いやすい。価値を表で持って最大の行動を選ぶのはQ学習などの価値ベースの手法で、連続行動には離散化などが必要になる。"},
{"c": 3, "q": "方策勾配法の一つであるREINFORCEの説明として最も適切なものはどれか。", "o": ["エピソードを最後まで実行して得た実際の収益を使い、その収益が大きくなるよう方策のパラメータを更新する", "1ステップごとに次状態の最大の行動価値を使って行動価値を更新し、方策は価値から間接的に決める", "方策を担うネットワークと価値を推定するネットワークを分け、価値の推定を使って方策を毎ステップ更新する", "複数の腕の平均報酬に試行回数に応じた上乗せを加え、その値が最大の腕を選び続ける"], "e": "REINFORCEはモンテカルロ法で得た収益を用いて方策勾配を推定するため、推定のばらつき（分散）が大きくなりやすい。方策と価値の2つを分けるのはActor-Critic、次状態の最大の価値で更新するのはQ学習である。"},
{"c": 3, "q": "行動を選ぶ方策の部分と、その行動や状態の良さを評価する価値関数の部分を組み合わせて学習する強化学習の手法はどれか。", "o": ["Actor-Critic", "k-means", "ε-greedy", "モンテカルロ木探索（MCTS）"], "e": "Actor-CriticではActor（方策）が行動を選び、Critic（価値関数）がその評価を返して方策の更新に使う。ε-greedyは探索と活用を切り替える行動選択の規則、モンテカルロ木探索はゲーム木の探索手法である。"},
{"c": 3, "q": "行動が4種類ある環境でε-greedy方策（ε=0.2）を用いる。確率εでは4つの行動（最良の行動も含む）から等確率に選び、それ以外は推定価値が最大の行動を選ぶ。推定価値が最大の行動が選ばれる確率はどれか。", "o": ["0.85", "0.80", "0.95", "0.75"], "e": "活用で選ばれる確率0.8に、探索で偶然選ばれる確率 0.2×1/4=0.05 を加えて 0.85 となる。εの部分でも最良の行動が選ばれうることを見落とすと0.80と誤りやすい。"},
{"c": 3, "q": "多腕バンディット問題で用いられるUCB（Upper Confidence Bound）方策の説明として最も適切なものはどれか。", "o": ["各腕の平均報酬に、試行回数が少ない腕ほど大きい上乗せを加え、合計が最大の腕を選ぶ", "一定の確率で完全にランダムな腕を選び、それ以外の場合はこれまでの平均報酬が最大の腕を選ぶ", "これまでに最も多く選ばれた腕を、報酬の大きさにかかわらず選び続ける", "すべての腕を同じ回数ずつ順番に選び、最後に一度だけ平均報酬が最大の腕を決める"], "e": "UCBは推定値の不確かさを信頼区間の上限として加え、まだあまり試していない腕を優先的に試す。一定確率でランダムに選ぶのはε-greedyである。"},
{"c": 3, "q": "強化学習の適用例として最も適切なものはどれか。", "o": ["倉庫のロボットが、荷物を早く運べると得点が上がる仕組みのもとで試行錯誤して動き方を改善する", "過去の顧客データと各顧客が解約したかどうかの記録から、翌月に解約しそうな顧客を事前に予測する", "ラベルの無いニュース記事を、使われている単語の傾向が似たものどうしのグループに分ける", "多数の商品写真と商品名の組から、新しい写真に写った商品の名前を判定する"], "e": "強化学習は正解データではなく、行動の結果として得られる報酬を手がかりに試行錯誤で行動を学ぶ。解約予測や商品名の判定は教師あり学習、記事のグループ分けは教師なし学習（クラスタリング）の例である。"},
{"c": 3, "q": "マルコフ決定過程（MDP）を定める要素として適切でないものはどれか。", "o": ["入力と正解ラベルを組にした訓練データの集合", "エージェントがとりうる状態の集合", "状態と行動から次の状態が決まる遷移確率", "状態と行動に応じて与えられる報酬の関数"], "e": "MDPは状態集合、行動集合、状態遷移確率、報酬関数（と割引率）で定義される。入力と正解ラベルの組は教師あり学習のデータであり、MDPの構成要素ではない。"},
{"c": 3, "q": "ホールドアウト法とk分割交差検証を比べた説明として最も適切なものはどれか。", "o": ["ホールドアウト法は1回の分割で済み計算が軽いが、どのデータが検証側に入るかで評価がばらつきやすい", "ホールドアウト法は各データを一度ずつ検証に回して平均するため、k分割交差検証より評価が安定する", "k分割交差検証は1回の学習で済むため、ホールドアウト法より計算時間が短くなる", "k分割交差検証は訓練データと検証データを同じにして評価するため、データが少なくても偏らない"], "e": "ホールドアウト法はデータを一度だけ学習用と検証用に分けるため手軽だが、分け方の偶然に評価が左右されやすい。k分割交差検証はk回学習して平均するので計算は増えるが、限られたデータでも安定した評価が得られる。"},
{"c": 3, "q": "1,000件のデータで5分割交差検証を行う。学習の回数と、1回あたりの学習に使うデータ件数の組み合わせとして正しいものはどれか。", "o": ["学習5回、各回800件", "学習5回、各回200件", "学習1回、800件", "学習4回、各回800件"], "e": "データを200件ずつ5つに分け、1つを検証、残り4つ（800件）を学習に使う操作を検証用を入れ替えて5回行う。200件は各回の検証データの件数である。"},
{"c": 3, "q": "1年分の日次売上データで翌日の売上を予測するモデルを評価する。検証の方法として最も適切なものはどれか。", "o": ["前半の期間で学習し、それより後の期間で検証するように、時間の順序を保ってデータを分割する", "日付を無視してデータをランダムに並べ替え、通常のk分割交差検証で学習と検証を行う", "学習に使った期間と同じ期間のデータで予測精度を測り、その値をそのまま本番の性能とみなす", "後半の期間で学習し、それより前の期間を予測させて精度を測ることで、過去の再現性を確かめる"], "e": "時系列データをランダムに分割すると、未来の情報で過去を予測する形になり評価が楽観的になる（リーケージ）。学習期間より後の期間で検証する、時間順の分割を用いるのが適切である。"},
{"c": 3, "q": "200件のテストデータに対する2値分類の結果が TP=30、FP=20、FN=10、TN=140 だった。適合率と再現率の組み合わせとして正しいものはどれか。", "o": ["適合率0.60、再現率0.75", "適合率0.75、再現率0.60", "適合率0.60、再現率0.85", "適合率0.85、再現率0.75"], "e": "適合率は TP/(TP+FP)=30/50=0.60、再現率は TP/(TP+FN)=30/40=0.75 である。0.85は正解率 (TP+TN)/全体=170/200 の値である。"},
{"c": 3, "q": "2値分類の結果が TP=45、FN=5、FP=30、TN=120 だった。特異度はどれか。", "o": ["0.80", "0.90", "0.60", "0.83"], "e": "特異度は実際に陰性のもののうち陰性と正しく判定した割合で、TN/(TN+FP)=120/150=0.80 である。0.90は再現率 45/50、0.60は適合率 45/75、0.83は正解率 165/200 に近い値である。"},
{"c": 3, "q": "1,000件のうち陽性が10件しかないデータで、すべてを陰性と予測するモデルの正解率と再現率の組み合わせとして正しいものはどれか。", "o": ["正解率99%、再現率0%", "正解率99%、再現率99%", "正解率1%、再現率100%", "正解率50%、再現率0%"], "e": "陰性990件をすべて当てるので正解率は990/1000=99%だが、陽性10件は1件も検出できないので再現率は0%である。不均衡データでは正解率だけでなく再現率やF値、PR曲線などで評価する必要がある。"},
{"c": 3, "q": "予測確率が閾値以上なら陽性と判定する分類モデルで、閾値を0.5から0.9に上げたときに一般に起きる変化として最も適切なものはどれか。", "o": ["陽性判定が慎重になり、適合率は上がりやすく、再現率は下がりやすい", "陽性判定が増えるため、適合率は下がりやすく、再現率は上がりやすい", "陽性判定の件数は変わらず、適合率と再現率もどちらも変わらない", "モデルの重みが更新され直し、適合率と再現率がどちらも上がりやすくなる"], "e": "閾値を上げると確信の高いものだけを陽性とするため誤検出（FP）が減って適合率が上がりやすい一方、見逃し（FN）が増えて再現率は下がりやすい。適合率と再現率はこのようにトレードオフの関係にある。"},
{"c": 3, "q": "PR曲線（Precision-Recall曲線）の説明として最も適切なものはどれか。", "o": ["閾値を変えながら再現率と適合率の組を描いたもので、陽性が極端に少ないデータでは性能差がROC曲線より見えやすい", "閾値を変えながら偽陽性率と真陽性率の組を描いたもので、曲線の下側の面積が0.5ならランダムな予測と同程度の性能になる", "学習に使うデータ量を変えながら訓練誤差と検証誤差を描いたもので、過学習か未学習かを見分けるのに使う", "主成分の番号を横軸に固有値を縦軸にとって描いたもので、採用する主成分の数を決めるのに使う"], "e": "PR曲線は横軸に再現率、縦軸に適合率をとる。陰性が大多数の不均衡データでは偽陽性率が小さく出てROC曲線の差が見えにくいため、PR曲線やその面積（AP）がよく使われる。偽陽性率と真陽性率を描くのはROC曲線、データ量を変えて誤差を描くのは学習曲線である。"},
{"c": 3, "q": "実測値が 3, 5, 2, 6、予測値が 2, 5, 4, 3 だった。平均絶対誤差（MAE）と二乗平均平方根誤差（RMSE）の組み合わせとして正しいものはどれか。", "o": ["MAE=1.5、RMSE≒1.87", "MAE=1.5、RMSE=3.5", "MAE=0.5、RMSE≒1.87", "MAE=3.5、RMSE=1.5"], "e": "誤差は 1, 0, −2, 3 で、MAE=(1+0+2+3)/4=1.5、MSE=(1+0+4+9)/4=3.5、RMSE=√3.5≒1.87 となる。3.5はRMSEではなくMSEの値、0.5は符号付き誤差の平均である。"},
{"c": 3, "q": "実測値が 2, 4, 6, 8、予測値が 3, 4, 5, 8 だった。決定係数 R^2 はどれか。", "o": ["0.90", "0.10", "0.80", "0.95"], "e": "実測値の平均は5で、全変動は 9+1+1+9=20、残差平方和は 1+0+1+0=2 なので、R^2=1−2/20=0.90 となる。0.10は残差平方和と全変動の比そのものである。"},
{"c": 3, "q": "訓練データに対する誤差もテストデータに対する誤差もどちらも大きく、両者の差は小さかった。この状態の説明として最も適切なものはどれか。", "o": ["モデルの表現力が足りずバイアスが大きい未学習の状態で、より複雑なモデルや特徴量の追加を検討する", "モデルが訓練データに適合しすぎてバリアンスが大きい過学習の状態で、正則化の強化を検討する", "テストデータの情報が学習に混入しているデータリーケージの状態で、データの分割をやり直す", "モデルは十分に学習できている理想的な状態で、これ以上改善の余地は無いと判断できる"], "e": "訓練誤差自体が大きいのは、モデルがデータの傾向を捉えきれていない未学習（高バイアス）の状態である。過学習では訓練誤差は小さいのにテスト誤差が大きく、両者の差が開く。"},
{"c": 3, "q": "汎化誤差をバイアス、バリアンス、ノイズに分解したとき、モデルをどのように工夫しても減らせない成分はどれか。", "o": ["データに含まれるノイズによる誤差", "モデルの仮定が単純すぎることによるバイアス", "訓練データの違いで予測が変わることによるバリアンス", "バイアスとバリアンスを掛け合わせた交差項"], "e": "二乗誤差の期待値は「バイアスの2乗＋バリアンス＋ノイズ」に分解でき、観測に含まれるノイズはモデルでは取り除けない削減不能な誤差である。バイアスとバリアンスはモデルの複雑さを調整することでトレードオフの関係になる。"},
{"c": 3, "q": "機械学習のモデル選択における「オッカムの剃刀」の考え方として最も適切なものはどれか。", "o": ["同じ程度にデータを説明できるなら、より単純なモデルを選ぶのが望ましい", "データを説明できるなら、パラメータが多く複雑なモデルほど望ましい", "訓練データでの誤差が最も小さいモデルを、複雑さにかかわらず選ぶのが望ましい", "どのモデルも平均すれば性能は同じなので、モデルは無作為に選べばよい"], "e": "オッカムの剃刀は「必要以上に仮定を増やすべきでない」という原則で、機械学習では同程度の性能なら単純なモデルを選ぶ指針になる。AICやBIC、正則化もモデルの複雑さに罰則を課す点でこの考え方に沿っている。"},
{"c": 3, "q": "モデルAは最大対数尤度 −100・パラメータ数3、モデルBは最大対数尤度 −98・パラメータ数6だった。AIC（= −2×最大対数尤度 + 2×パラメータ数）で選ばれるモデルとその値の組み合わせとして正しいものはどれか。", "o": ["モデルA（AIC=206）", "モデルB（AIC=208）", "モデルB（AIC=196）", "モデルA（AIC=200）"], "e": "AICはモデルAが 200+6=206、モデルBが 196+12=208 で、値の小さいモデルAが選ばれる。Bは尤度がやや高いが、パラメータ数の増加による罰則のほうが大きい。196や200は罰則項を加え忘れた値である。"},
{"c": 3, "q": "AICとBICの比較として最も適切なものはどれか。", "o": ["BICは罰則項にデータ数の対数を含むため、データ数が多いとAICより単純なモデルを選びやすい", "BICは罰則項を含まずに最大尤度だけで比べるため、AICよりもパラメータの多い複雑なモデルを選びやすい", "AICは値が大きいモデルほど良いとされ、BICは値が小さいモデルほど良いとされる", "AICは分類モデルだけ、BICは回帰モデルだけに使える指標として区別されている"], "e": "AICの罰則は2k、BICの罰則は k·ln(n) で、nが8程度以上ならBICの罰則のほうが重くなり、パラメータの少ないモデルが選ばれやすい。どちらも値が小さいほど良いモデルとされる。"});

QUESTIONS.push({"c": 4, "q": "2入力の単純パーセプトロンで、重み w1=0.5, w2=0.5、バイアス b=−0.7 とし、w1x1+w2x2+b が0を超えたら1、そうでなければ0を出力する。入力x1, x2が0または1のとき、このパーセプトロンが実現する論理演算はどれか。", "o": ["AND", "OR", "NAND", "XOR"], "e": "(1,1)のときだけ0.5+0.5−0.7=0.3>0で1を出力し、(1,0)(0,1)は−0.2、(0,0)は−0.7で0となるのでANDである。ORならバイアスが−0.3程度で(1,0)も1になり、XORは単純パーセプトロンでは実現できない。"},
{"c": 4, "q": "万能近似定理（普遍性定理）の内容として最も適切なものはどれか。", "o": ["十分な数のユニットを持つ隠れ層が1層あれば、ニューラルネットワークは任意の連続関数を任意の精度で近似できる", "隠れ層を十分に深くすれば、勾配降下法は必ず大域最適解に到達し、学習が有限回の更新で終わることが保証される", "どのような学習アルゴリズムも、あらゆる問題の平均では他のアルゴリズムより性能が高くなることはないと示される", "モデルのパラメータ数・データ量・計算量を増やすと、損失がべき乗則に従ってなめらかに減少していくと示される"], "e": "万能近似定理は、非線形の活性化関数を持つ隠れ層1層のネットワークでも十分なユニット数があれば連続関数を任意精度で近似できるという表現力の定理である。学習で実際にその重みを見つけられることは保証しない。「どの学習アルゴリズムも平均では他より高性能にならない」はノーフリーランチ定理、「損失がべき乗則に従って減少する」はスケーリング則の説明。"},
{"c": 4, "q": "ディープラーニングの学習でCPUよりGPUが多く用いられる理由として最も適切なものはどれか。", "o": ["単純な演算を行うコアを多数持ち、行列演算のような同じ計算の大量並列処理が得意だから", "少数の高性能コアで条件分岐の多い複雑な逐次処理を高速に行うことが得意だから", "記憶容量が主記憶より大きく、学習データ全体を常に1度に載せて処理できるから", "浮動小数点演算を使わずに整数演算だけで学習でき、計算誤差が生じないから"], "e": "GPUは画像処理用に多数の演算コアを持ち、ニューラルネットワークの中心である行列演算を並列に処理できる。条件分岐の多い逐次処理が得意なのはCPUの特徴である。"},
{"c": 4, "q": "Googleがニューラルネットワークの演算（テンソル計算）に特化して開発したプロセッサはどれか。", "o": ["TPU", "FPGA", "GPGPU", "ASIMO"], "e": "TPU（Tensor Processing Unit）はGoogleが開発した機械学習向けの専用プロセッサである。GPGPUはGPUを画像処理以外の汎用計算に使う技術のこと、FPGAは回路を後から書き換えられる汎用の集積回路、ASIMOはホンダのロボット。"},
{"c": 4, "q": "GPGPUの説明として最も適切なものはどれか。", "o": ["本来は画像処理用であるGPUを、画像処理以外の汎用的な数値計算に利用すること", "Googleが機械学習のテンソル演算専用に設計した、クラウドで提供されるプロセッサ", "複数台のCPUサーバをネットワークで結び、1台の大きな計算機として扱う仕組み", "スマートフォンなどの端末側でAIの推論を行うための、低消費電力の専用チップ"], "e": "GPGPU（General-Purpose computing on GPU）はGPUを汎用計算に使うことで、NVIDIAのCUDAなどの開発環境が普及を後押しした。「Googleがテンソル演算専用に設計したプロセッサ」はTPU、「端末側で推論を行う低消費電力の専用チップ」はエッジAI向けのNPUなどの説明である。"},
{"c": 4, "q": "ムーアの法則の内容として最も適切なものはどれか。", "o": ["集積回路上のトランジスタ数がおよそ18か月〜2年ごとに倍増するという経験則", "モデルの規模を大きくすると性能がべき乗則に従って改善するという経験則", "AIで実現された機能は、仕組みが分かると知能とはみなされなくなるという経験則", "計算機の処理速度がおよそ10年ごとに半減し、性能向上が止まるという経験則"], "e": "ムーアの法則はインテルの共同創業者ゴードン・ムーアが提唱した、半導体の集積度が指数的に増えるという経験則である。「規模を大きくすると性能がべき乗則に従って改善する」はスケーリング則、「仕組みが分かると知能とはみなされなくなる」はAI効果の説明。"},
{"c": 4, "q": "活性化関数tanh（双曲線正接関数）の性質として最も適切なものはどれか。", "o": ["出力は−1から1の範囲をとり、導関数の最大値は1である", "出力は0から1の範囲をとり、導関数の最大値は0.25である", "出力は0以上の値をとり、入力が正のとき導関数は常に1である", "出力は−1か1の2値のみをとり、原点以外では導関数が0である"], "e": "tanhは原点対称で出力範囲は(−1,1)、導関数1−tanh²(x)はx=0で最大値1となるため、シグモイドより勾配消失が起こりにくい。「出力0〜1・導関数の最大値0.25」はシグモイド、「出力0以上・正の入力で導関数1」はReLUの性質である。"},
{"c": 4, "q": "Leaky ReLUの説明として最も適切なものはどれか。", "o": ["入力が負のときも0ではなく小さな傾き（例: 0.01）の値を出力し、勾配が0になるのを防ぐ", "入力が負のときの傾きを固定値とせず、学習によって最適な値を求めるパラメータとして扱う", "入力にシグモイド関数の値を掛けた x・σ(βx) を出力し、負の領域でもなめらかに変化する", "入力の大きさに関係なく出力を−1から1の範囲に押し込み、原点付近で傾きが最大になる"], "e": "Leaky ReLUは負の領域に固定の小さな傾きを持たせ、ReLUで出力が常に0となりユニットが学習しなくなる問題（dying ReLU）を緩和する。負の傾きを学習で求めるのはPReLU、x・σ(βx)を出力するのはSwish、出力を−1から1に押し込むのはtanhの説明である。"},
{"c": 4, "q": "負の入力に対する傾きを固定値ではなく、学習によって決まるパラメータとして扱う活性化関数はどれか。", "o": ["PReLU（Parametric ReLU）", "Leaky ReLU", "GELU", "ステップ関数"], "e": "PReLUは負の領域の傾きaを誤差逆伝播で学習する。Leaky ReLUはこの傾きを0.01などの固定値とする。GELUは入力に標準正規分布の累積分布関数を掛けたなめらかな関数。"},
{"c": 4, "q": "BERTやGPTなどTransformer系のモデルで広く用いられ、入力xに標準正規分布の累積分布関数Φ(x)を掛けた形で表される活性化関数はどれか。", "o": ["GELU", "Swish", "ソフトマックス関数", "PReLU"], "e": "GELU（Gaussian Error Linear Unit）はx・Φ(x)で定義され、ReLUに似つつ原点付近でなめらかに変化する。Swishはx・σ(βx)とシグモイドを用いる点が異なる。"},
{"c": 4, "q": "活性化関数Swishの定義として正しいものはどれか（σはシグモイド関数、βは定数または学習パラメータ）。", "o": ["f(x) = x・σ(βx)", "f(x) = max(0, x)", "f(x) = σ(x)・(1 − σ(x))", "f(x) = max(0.01x, x)"], "e": "SwishはGoogleの研究で自動探索により見つかった関数で、x・σ(βx)と表される。max(0,x)はReLU、σ(x)(1−σ(x))はシグモイドの導関数、max(0.01x,x)はLeaky ReLUである。"},
{"c": 4, "q": "3クラス分類の出力層に入る値（ロジット）が (1, 2, 3) のとき、ソフトマックス関数を通した3番目のクラスの出力に最も近いものはどれか。", "o": ["0.67", "0.50", "0.33", "0.95"], "e": "e³/(e¹+e²+e³)≈20.09/30.19≈0.67となる。0.50は指数を取らずに3/(1+2+3)とした値、0.33は3クラスで均等に割った値である。"},
{"c": 4, "q": "住宅価格のような連続値を予測する回帰問題のニューラルネットワークで、出力層の活性化関数として一般的なものはどれか。", "o": ["恒等関数", "ソフトマックス関数", "シグモイド関数", "ステップ関数"], "e": "回帰では出力の範囲を制限しない恒等関数を使い、損失には平均二乗誤差を組み合わせることが多い。ソフトマックスは多クラス分類、シグモイドは二値分類の出力に用いる。"},
{"c": 4, "q": "二値分類で、正解ラベルが0のデータに対してモデルが「正例である確率」を0.9と出力した。このデータの二値交差エントロピー損失（自然対数）に最も近いものはどれか。", "o": ["2.30", "0.11", "0.81", "0.01"], "e": "正解が0なので損失は −log(1−0.9) = −log 0.1 ≈ 2.30 となり、自信を持って間違えると損失が大きくなる。0.11は正解を1と取り違えた −log 0.9、0.81は二乗誤差 (0.9−0)² の値である。"},
{"c": 4, "q": "3クラス分類で正解がクラス2（one-hot表現で (0, 1, 0)）のデータに対し、モデルの出力が (0.2, 0.5, 0.3) だった。交差エントロピー損失（自然対数）に最も近いものはどれか。", "o": ["0.69", "0.50", "1.20", "0.38"], "e": "one-hotの正解では、正解クラスの予測確率だけが効き −log 0.5 ≈ 0.69 となる。0.50は確率そのもの、1.20は−log 0.3で別のクラスの確率を使った値である。"},
{"c": 4, "q": "距離学習で用いられるContrastive Lossの説明として最も適切なものはどれか。", "o": ["2つのデータのペアを入力し、同じクラスなら埋め込みの距離を小さく、異なるクラスなら一定のマージン以上に離すように学習する", "基準・同じクラス・異なるクラスの3つ組を入力し、基準と同じクラスの距離が異なるクラスの距離よりマージン分小さくなるように学習する", "2つの確率分布の差を、一方の分布を基準にした対数の比の期待値として測り、生成モデルの潜在変数の分布を事前分布に近づける", "モデルの予測値と正解値の差を二乗して平均し、大きく外れた予測ほど強く罰するように連続値の出力を学習する"], "e": "Contrastive Lossはペア単位で、同類は近づけ異類はマージンまで遠ざける損失である。3つ組を使うのはTriplet Loss、「2つの確率分布の差を対数の比の期待値で測る」はKLダイバージェンス、「予測値と正解値の差を二乗して平均する」は平均二乗誤差の説明。"},
{"c": 4, "q": "Triplet Loss L = max(0, d(a,p) − d(a,n) + m) において、アンカーaと正例pの距離が0.5、アンカーと負例nの距離が0.8、マージンmが0.5のとき、損失の値はどれか。", "o": ["0.2", "0", "0.8", "1.8"], "e": "0.5−0.8+0.5=0.2で、0より大きいのでそのまま損失になる。負例が正例より遠くてもマージン分離れていないため損失が残る。0はマージンを引いて負になったとみなした場合、0.8はd(a,p)とd(a,n)を入れ替えた場合、1.8はd(a,n)を足した場合の値。"},
{"c": 4, "q": "ニューラルネットワークの学習で、人が学習の前に設定する「ハイパーパラメータ」に当たるものとして最も適切なものはどれか。", "o": ["学習率", "各層の重み", "各層のバイアス", "バッチ正規化のスケールγ"], "e": "学習率やバッチサイズ、層の数などは学習の前に人が決めるハイパーパラメータである。重みやバイアス、バッチ正規化のスケールγは、誤差逆伝播によってデータから学習されるパラメータである。"},
{"c": 4, "q": "L1正則化とL2正則化の罰則項を組み合わせて用いる手法はどれか。", "o": ["Elastic Net", "Ridge回帰", "Lasso回帰", "ドロップアウト"], "e": "Elastic NetはL1とL2の罰則を重み付きで足し合わせ、スパース性と安定性を両立させる。Ridge回帰はL2のみ、Lasso回帰はL1のみを用いる。"},
{"c": 4, "q": "早期終了（Early Stopping）の説明として最も適切なものはどれか。", "o": ["検証データの誤差が改善しなくなった時点で学習を打ち切り、過学習を防ぐ", "訓練データの誤差が0になった時点で学習を打ち切り、計算時間を節約する", "学習の初期だけ学習率を小さく抑え、徐々に本来の値まで上げてから学習する", "勾配のノルムがしきい値を超えたら学習を止め、パラメータの発散を防ぐ"], "e": "早期終了は検証誤差を監視し、悪化に転じたら（一定回数改善しなければ）止める正則化の一種である。「初期だけ学習率を小さく抑えて徐々に上げる」は学習率のウォームアップ、「勾配のノルムがしきい値を超えたら止める」は勾配クリッピングに近い発想だが、クリッピングは学習を止めずに勾配を縮める。"},
{"c": 4, "q": "勾配ベクトル g=(6, 8) に対し、ノルムの上限を5とするノルムによる勾配クリッピングを適用した後の勾配はどれか。", "o": ["(3, 4)", "(0.6, 0.8)", "(6, 8)", "(1.5, 2)"], "e": "‖g‖=√(36+64)=10が上限5を超えるので、g×5/10で向きを保ったまま大きさを5にし(3, 4)となる。(0.6, 0.8)は大きさ1への正規化、(6, 8)は上限以下とみなして何もしない場合の値。"},
{"c": 4, "q": "シグモイド関数を活性化関数とする深いネットワークで勾配消失が起こりやすい理由を考える。シグモイド関数の導関数の最大値は0.25なので、5層分の導関数を掛け合わせた値は最大でもどれくらいになるか。", "o": ["約0.001", "約0.25", "約1.25", "約0.05"], "e": "0.25⁵≈0.00098で、層を通るたびに勾配が小さくなり入力側の層がほとんど更新されない。約1.25は掛けずに足した値、約0.05は0.25÷5としたものである。ReLUは正の領域で導関数が1なのでこの問題が起こりにくい。"},
{"c": 4, "q": "多層のネットワークで、最終的な誤差に対して各層の各パラメータがどれだけ寄与したのかを決めることが難しいという問題を何と呼ぶか。", "o": ["信用割当問題", "フレーム問題", "シンボルグラウンディング問題", "勾配爆発問題"], "e": "信用割当問題（credit assignment problem）は、結果の責任を各パラメータに割り振る問題で、誤差逆伝播法はこれを連鎖律で効率的に解く。フレーム問題とシンボルグラウンディング問題は知識表現に関わる別の難問である。"},
{"c": 4, "q": "入力x=2に対し、h=ReLU(w1・x)、y=w2・h、損失L=(y−t)²/2 と計算する。w1=3、w2=0.5、正解t=1のとき、連鎖律で求めた ∂L/∂w1 の値はどれか。", "o": ["2", "1", "4", "6"], "e": "h=6、y=3なので∂L/∂y=y−t=2。∂L/∂w1=∂L/∂y × w2 × ReLU'(6) × x = 2×0.5×1×2 = 2 となる。最後に入力xを掛け忘れると1になる。"},
{"c": 4, "q": "確率的勾配降下法（SGD）とバッチ勾配降下法の比較として最も適切なものはどれか。", "o": ["SGDは1件または少数のデータで勾配を求めて頻繁に更新し、勾配のばらつきによって浅い局所解から抜け出しやすい", "SGDは全データの勾配を毎回正確に求めて更新するため、1回の更新にかかる計算量がバッチ勾配降下法より大きい", "バッチ勾配降下法はデータを1件ずつ逐次に処理するので、新しいデータが次々と届くオンライン学習に向いている", "バッチ勾配降下法は勾配にランダムな雑音を加えるので、SGDよりも鞍点や局所最適解に留まりにくくなっている"], "e": "SGDは一部のデータで勾配を近似するため1回の更新が軽く、そのばらつきが局所解から抜け出す助けになる。全データで勾配を求めるのはバッチ勾配降下法で、オンライン学習に向くのはSGDの方である。"},
{"c": 4, "q": "訓練データ10,000件、バッチサイズ100でミニバッチ学習を5エポック行うとき、パラメータの更新回数（イテレーション数）の合計はどれか。", "o": ["500回", "100回", "50回", "50,000回"], "e": "1エポックあたり10,000÷100=100回更新し、5エポックで500回となる。100回は1エポック分だけ、50,000回はデータ件数にエポック数を掛けた値（バッチサイズ1の場合）である。"},
{"c": 4, "q": "損失関数の局所最適解と大域最適解の説明として最も適切なものはどれか。", "o": ["局所最適解は周囲より損失が小さいが全体で最小とは限らない点で、大域最適解は全体で損失が最小となる点である", "局所最適解はある方向には極小で別の方向には極大となる点で、大域最適解は全方向で極小となる点のことである", "局所最適解は勾配がほぼ0の平らな領域が長く続く状態で、大域最適解は勾配が最大となる急な斜面の底の点である", "局所最適解は訓練データで損失が最小となる点で、大域最適解はテストデータで損失が最小となる点のことである"], "e": "勾配降下法は周囲より低い点で止まるため、その点が全体の最小（大域最適解）とは限らない。「ある方向には極小で別の方向には極大となる点」は鞍点、「勾配がほぼ0の平らな領域が長く続く状態」はプラトーの説明に近い。"},
{"c": 4, "q": "ある方向から見ると極小値だが、別の方向から見ると極大値となっており、勾配が0になるため学習が停滞しやすい点を何と呼ぶか。", "o": ["鞍点", "大域最適解", "変曲点", "プラトー"], "e": "鞍点は馬の鞍のような形の点で、高次元の損失関数では局所最適解より頻繁に現れるとされる。プラトーは勾配が小さい平らな領域が続き、学習が停滞する状態のことである。"},
{"c": 4, "q": "学習の途中で損失がほとんど減らない期間が長く続き、しばらくして再び急に減り始めることがある。この停滞の原因となる、勾配がほぼ0の平坦な領域を何と呼ぶか。", "o": ["プラトー", "鞍点", "局所最適解", "勾配爆発"], "e": "プラトーは勾配がほぼ0の平らな領域で、そこを抜けるまで学習が進まない。鞍点は勾配0の「点」、局所最適解は周囲より低い点で、どちらも平坦な領域そのものを指す語ではない。"},
{"c": 4, "q": "モーメンタムを用いた更新 v ← αv − ηg、w ← w + v を考える。現在 w=1.0、v=0.5、α=0.9、学習率η=0.1、勾配g=1のとき、更新後のwはどれか。", "o": ["1.35", "0.90", "1.55", "1.45"], "e": "v=0.9×0.5−0.1×1=0.35、w=1.0+0.35=1.35となる。0.90は慣性を使わない通常の勾配降下法、1.55は勾配の符号を逆にした場合、1.45は勾配の項を忘れた場合の値。"},
{"c": 4, "q": "Nesterovの加速勾配法（NAG）が通常のモーメンタムと異なる点として最も適切なものはどれか。", "o": ["慣性で進む先の位置をまず見越し、その位置での勾配を使って更新量を決める", "過去の勾配の二乗和をパラメータごとに蓄積し、その分だけ学習率を小さくする", "勾配の一次と二次の移動平均を両方使い、初期のバイアスを補正して更新する", "学習率の上限と下限を徐々に狭め、最終的にはSGDと同じ振る舞いに近づける"], "e": "NAGは現在の速度で進んだ先を先読みして勾配を評価するため、行き過ぎを抑えやすい。「過去の勾配の二乗和を蓄積して学習率を小さくする」はAdaGrad、「一次と二次の移動平均を使いバイアスを補正する」はAdam、「学習率の上限と下限を徐々に狭める」はAdaBoundの説明である。"},
{"c": 4, "q": "AdaGradの問題点として最も適切なものはどれか。", "o": ["過去の勾配の二乗和を蓄積し続けるため、学習が進むと学習率が小さくなりすぎて更新がほぼ止まる", "すべてのパラメータに同じ学習率を使うため、更新頻度の低いパラメータがなかなか学習されない", "勾配の向きだけを使って大きさを無視するため、損失の急な谷では振動して収束しにくくなる", "学習率の上限と下限を設けるため、学習の終盤にはSGDと同じ速度でしか収束しなくなる"], "e": "AdaGradは勾配の二乗和で学習率を割るため、パラメータごとに適応的だが、単調に小さくなり続ける。これを指数移動平均で解決したのがRMSpropである。「全パラメータに同じ学習率を使い更新頻度の低いパラメータが学習されにくい」は、むしろAdaGradが解決した通常のSGDの問題。"},
{"c": 4, "q": "RMSpropの説明として最も適切なものはどれか。", "o": ["勾配の二乗の指数移動平均を用いて学習率を調整し、古い勾配の影響を徐々に忘れる", "勾配の二乗をすべて足し合わせて学習率を割り、更新が進むほど単調に学習率を下げる", "学習率の代わりに過去の更新量の移動平均を使い、学習率の設定そのものを不要にする", "現在の速度で進んだ先の勾配を先に計算し、それを使って慣性の方向を修正していく"], "e": "RMSpropはAdaGradの累積和を指数移動平均に置き換え、学習率が0に近づきすぎる問題を緩和した。「勾配の二乗をすべて足し合わせて学習率を割る」はAdaGrad、「過去の更新量の移動平均を使い学習率を不要にする」はAdaDelta、「進んだ先の勾配を先に計算する」はNesterovの加速勾配法の説明である。"},
{"c": 4, "q": "AdaGradの学習率低下の問題を改善した手法のうち、過去の更新量の移動平均を用いることで、学習率というハイパーパラメータを設定しなくてもよいようにした最適化手法はどれか。", "o": ["AdaDelta", "RMSprop", "Adam", "AMSBound"], "e": "AdaDeltaは更新量と勾配の二乗の移動平均の比を用い、単位（次元）を合わせることで学習率を不要にした。RMSpropとAdamでは学習率を設定する必要がある。"},
{"c": 4, "q": "AdaBoundやAMSBoundの特徴として最も適切なものはどれか。", "o": ["学習率に上限と下限を設けて学習の進行とともに範囲を狭め、序盤はAdamのように、終盤はSGDのように振る舞う", "勾配の二乗和を蓄積してパラメータごとに学習率を下げ、出現頻度の低い特徴の重みを大きく更新しやすくする", "学習の開始直後だけ学習率をごく小さな値から線形に上げていき、Transformerの学習を安定させるために用いる", "慣性で進む先を見越して勾配を評価し、谷を行き過ぎる前にブレーキをかけることで振動を抑えて収束を速める"], "e": "AdaBound（Adam由来）とAMSBound（AMSGrad由来）は学習率をクリップする範囲を徐々に狭め、Adamの速い収束とSGDの汎化性能の両立を狙う。「勾配の二乗和を蓄積して学習率を下げる」はAdaGrad、「開始直後だけ学習率を小さな値から上げる」はウォームアップ、「慣性で進む先を見越して勾配を評価する」はNesterovの説明。"},
{"c": 4, "q": "学習率のウォームアップの説明として最も適切なものはどれか。", "o": ["学習の初期に学習率を小さな値から徐々に上げ、初期の不安定な更新を防ぐ", "学習の終盤に学習率を大きく上げ、局所最適解から強制的に抜け出させる", "学習前に小さなデータで数エポック学習し、最適な学習率を自動で決める", "学習前にGPUで空の計算を実行し、計算速度を安定させてから学習を始める"], "e": "ウォームアップは初期のパラメータが不安定な段階で大きな学習率を使うことによる発散を防ぐ手法で、Transformerの学習などで広く用いられる。その後はコサイン減衰などのスケジューリングと組み合わせることが多い。"},
{"c": 4, "q": "初期学習率0.1から、10エポックごとに学習率を半分にするステップ減衰のスケジュールで学習する。エポック0から数えてエポック25の時点の学習率はどれか。", "o": ["0.025", "0.0125", "0.05", "0.075"], "e": "エポック10で0.05、エポック20で0.025になり、次の半減はエポック30なのでエポック25は0.025である。0.0125は25÷10を切り上げて3回半減した値、0.05は1回しか半減しなかった場合。"},
{"c": 4, "q": "Xavier（Glorot）の初期値が主に想定している活性化関数はどれか。", "o": ["シグモイド関数やtanhのような、原点付近で線形に近い左右対称な関数", "ReLUのような、負の入力をすべて0にする区分線形の関数", "ステップ関数のような、微分がほぼ全域で0となる不連続な関数", "ソフトマックス関数のような、出力の合計が1になる正規化の関数"], "e": "Xavierの初期値は前層のノード数nに対して分散1/n程度で重みを初期化し、シグモイドやtanhで各層の出力の分散を保つ。ReLUでは出力の半分が0になるため、分散を2/nとするHeの初期値が適する。"},
{"c": 4, "q": "ニューラルネットワークの重みをすべて同じ値（例えば0）で初期化すると起こる問題として最も適切なものはどれか。", "o": ["同じ層のユニットがすべて同じ出力と同じ勾配を持ち、更新しても区別がつかないままになる", "出力がすべて正の値となり、誤差逆伝播で勾配が指数的に大きくなって学習が発散してしまう", "損失関数の値を計算できなくなり、学習の最初の順伝播でプログラムがエラーで停止してしまう", "学習は通常どおり進むが、最終的な重みが疎になり推論時の計算量が大きく増えてしまう"], "e": "重みが同一だと対称性が崩れず、ユニットを何個並べても1個分の表現力しか持たない。そのため乱数で初期化し、XavierやHeの方法でその分散を調整する。"},
{"c": 4, "q": "ハイパーパラメータ探索でランダムサーチがグリッドサーチより有利になりやすい理由として最も適切なものはどれか。", "o": ["性能に効くハイパーパラメータが一部だけの場合、同じ試行回数でもその軸についてより多くの異なる値を試せるから", "過去の試行結果から性能の良さそうな領域を確率モデルで予測し、次に試す値を選んで効率よく探索できるから", "すべての値の組み合わせを漏れなく試すので、指定した候補の中で最良の組み合わせを確実に見つけられるから", "探索の途中で性能の悪い試行を打ち切り、残った計算資源を有望な試行に集中させる仕組みを持っているから"], "e": "グリッドサーチでは重要な軸の値が格子の数しか試されないが、ランダムサーチでは試行ごとに異なる値になる。「確率モデルで良さそうな領域を予測する」はベイズ最適化、「すべての組み合わせを漏れなく試す」はグリッドサーチの説明、「性能の悪い試行を途中で打ち切る」はHyperbandなどの早期打ち切り型の手法である。"},
{"c": 4, "q": "ベイズ最適化によるハイパーパラメータ探索の説明として最も適切なものはどれか。", "o": ["これまでの試行結果から目的関数をガウス過程などで近似し、改善が期待できる点を選んで次に試す", "候補となる値をあらかじめ格子状に並べ、そのすべての組み合わせを順番に試して最良を選ぶ", "各ハイパーパラメータを決めた範囲から一様に乱数で選び、決めた回数だけ独立に試行を繰り返す", "ハイパーパラメータも誤差逆伝播法で微分し、重みと同時に勾配降下法で最適化していく"], "e": "ベイズ最適化は代理モデルと獲得関数を使い、過去の結果を活かして次の候補を選ぶため、1回の試行が重い深層学習で試行回数を減らせる。「格子状に並べた全組み合わせを順番に試す」はグリッドサーチ、「範囲から一様に乱数で選んで独立に試行する」はランダムサーチである。"},
{"c": 4, "q": "ノーフリーランチ定理が示す内容として最も適切なものはどれか。", "o": ["あらゆる問題に対して平均的に他より優れた汎用の最適化・学習アルゴリズムは存在しない", "学習データを増やしても、ある量を超えるとモデルの性能はそれ以上まったく改善しない", "無料で公開されたデータセットで学習したモデルは、商用で利用することが認められない", "十分なユニット数を持つ隠れ層1層のネットワークで、任意の連続関数を近似できる"], "e": "ノーフリーランチ定理は、ある問題で優れた手法は別の問題では劣り、全問題で平均すると差がなくなることを示す。問題に合った手法の選択が必要となる根拠とされる。「隠れ層1層で任意の連続関数を近似できる」は万能近似定理の説明。"},
{"c": 4, "q": "入力784次元、隠れ層100ユニット、出力10ユニットの全結合の多層パーセプトロンがある。各ユニットにバイアスがあるとき、学習するパラメータの総数はどれか。", "o": ["79,510", "79,400", "78,400", "89,400"], "e": "入力→隠れ層は784×100+100=78,500、隠れ層→出力は100×10+10=1,010で合計79,510となる。79,400はバイアスを数え忘れた値、78,400は入力→隠れ層の重みだけの値である。"});

QUESTIONS.push({"c": 5, "q": "224×224の入力に、7×7のフィルタをストライド2、パディング3で畳み込んだ。出力の縦横の大きさはどれか。", "o": ["112×112", "109×109", "110×110", "224×224"], "e": "出力サイズは(224+2×3−7)÷2+1=112.5の小数点以下を切り捨てて112になる。パディングを入れ忘れると109、ストライドを1とみなすと224になる。"},
{"c": 5, "q": "入出力とも64チャネルの5×5畳み込み1層（バイアスなし）を、受容野が同じになる入出力とも64チャネルの3×3畳み込み2層（バイアスなし）に置き換えた。パラメータ数はいくつ減るか。", "o": ["28,672", "65,536", "448", "102,400"], "e": "5×5の1層は5×5×64×64=102,400、3×3の2層は3×3×64×64×2=73,728なので、差は28,672になる。65,536は3×3を1層分しか数えなかった値で、VGGはこのように小さなフィルタを重ねて少ないパラメータで同じ受容野を得た。"},
{"c": 5, "q": "784次元の入力を128ユニットの全結合層（バイアスあり）につないだ。この層のパラメータ数はどれか。", "o": ["100,480", "100,352", "912", "6,272"], "e": "重み784×128=100,352にバイアス128を足して100,480になる。全結合層は入力と出力のすべての組に重みを持つため、パラメータ数が大きくなりやすい。"},
{"c": 5, "q": "入力32チャネル、出力64チャネルの3×3畳み込みを、Depthwise Separable Convolution（深さ方向の3×3畳み込み＋1×1の点方向畳み込み、バイアスなし）に置き換えた。パラメータ数はどれか。", "o": ["2,336", "18,432", "2,048", "4,672"], "e": "深さ方向畳み込みが3×3×32=288、点方向畳み込みが32×64=2,048で合計2,336になる。通常の3×3畳み込みでは3×3×32×64=18,432であり、約8分の1に減る。"},
{"c": 5, "q": "3×3の畳み込み（ストライド1）を3層重ねたとき、3層目の出力の1画素が入力画像上で見ている範囲（受容野）はどれか。", "o": ["7×7", "9×9", "5×5", "27×27"], "e": "ストライド1の3×3畳み込みを1層重ねるごとに受容野は2ずつ広がり、3→5→7となる。VGGはこの性質を使い、大きなフィルタを小さなフィルタの積み重ねで置き換えた。"},
{"c": 5, "q": "3×3のフィルタで、Dilated（Atrous）Convolutionの拡張率（dilation rate）を2にした。1回の畳み込みがカバーする範囲はどれか。", "o": ["5×5", "6×6", "3×3", "9×9"], "e": "要素の間に1つずつ隙間をあけるので、有効サイズは3+(3−1)×(2−1)=5になる。パラメータ数は3×3のまま、広い範囲を見られる。"},
{"c": 5, "q": "TransformerのSelf-Attentionで、入力系列の長さを1,000トークンから4,000トークンに増やした。注意スコア行列の要素数はおよそ何倍になるか。", "o": ["16倍", "4倍", "8倍", "64倍"], "e": "注意スコア行列は系列長n×nの大きさなので、計算量とメモリは系列長の2乗に比例する。4倍の長さなら4²=16倍になり、長文処理のボトルネックになる。64倍は3乗に比例すると誤解した値である。"},
{"c": 5, "q": "4×4の特徴マップに、4×4のフィルタでストライド2、パディング1の転置畳み込みを行った。出力の縦横の大きさはどれか。", "o": ["8×8", "2×2", "6×6", "10×10"], "e": "転置畳み込みの出力サイズは(入力−1)×ストライド−2×パディング+フィルタ=(4−1)×2−2+4=8になる。2×2は通常の畳み込みを行ったときの値である。"},
{"c": 5, "q": "畳み込み層でストライドを1から2に変えたときの変化として最も適切なものはどれか。", "o": ["出力特徴マップの縦横がおよそ半分になる", "フィルタのパラメータ数がおよそ2倍になる", "出力チャネル数がおよそ半分になる", "受容野を変えずに特徴マップが2倍になる"], "e": "ストライドはフィルタを動かす間隔で、2にすると1つおきに計算するため出力の縦横がほぼ半分になる。パラメータ数や出力チャネル数はストライドでは変わらない。"},
{"c": 5, "q": "1×1畳み込みの主な用途として最も適切なものはどれか。", "o": ["空間サイズを保ったままチャネル数を増減する", "チャネル数を保ったまま特徴マップの縦横を半分に縮小する", "隣接画素のエッジを検出する", "受容野を一度に大きく広げる"], "e": "1×1畳み込みは各画素位置でチャネル方向だけを線形結合するため、チャネル数の圧縮や拡張に使われる。GoogLeNetのInceptionモジュールでは計算量削減に用いられた。"},
{"c": 5, "q": "RGBのカラー画像を入力とする最初の畳み込み層で、出力チャネル数を32にした。この層に関する記述として最も適切なものはどれか。", "o": ["各フィルタは深さ3を持ち、フィルタは32個ある", "各フィルタは深さ32を持ち、フィルタは3個ある", "各フィルタは深さ1を持ち、フィルタは96個ある", "各フィルタは深さ1を持ち、フィルタは32個ある"], "e": "通常の畳み込みでは1つのフィルタが入力の全チャネル（RGBなら3）をまとめて見るため深さは3になり、フィルタの個数が出力チャネル数（特徴マップの枚数）になる。"},
{"c": 5, "q": "畳み込み層が同じ入力サイズの全結合層よりパラメータ数を大幅に少なくできる理由として最も適切なものはどれか。", "o": ["局所的な領域だけを見て、同じ重みを位置をずらして共有するから", "重みを0か1の2値に制限し、掛け算を足し算に置き換えて計算するから", "逆伝播で勾配を計算せずに重みを決めるから", "入力画素のうち一部だけをランダムに選ぶから"], "e": "畳み込みは局所結合と重み共有により、画像のどこに同じ模様が現れても同じフィルタで検出できる。これがパラメータ削減と平行移動への頑健さにつながる。"},
{"c": 5, "q": "転置畳み込み（Transposed Convolution）の用途として最も適切なものはどれか。", "o": ["特徴マップを拡大して高い解像度に戻す", "特徴マップのチャネル数を1つにまとめる", "特徴マップの値を平均0・分散1にそろえる", "特徴マップから最大値だけを取り出す"], "e": "転置畳み込みは学習可能なアップサンプリングで、セグメンテーションや画像生成のデコーダで使われる。重なり方によっては格子状の模様（チェッカーボードアーティファクト）が出ることがある。"},
{"c": 5, "q": "フィルタの要素の間に間隔をあけて畳み込み、パラメータ数を増やさずに受容野を広げる手法はどれか。", "o": ["Dilated Convolution", "Depthwise Convolution", "Transposed Convolution", "Pointwise Convolution"], "e": "Dilated（Atrous）Convolutionは拡張率に応じてフィルタを間引いて適用する。DeepLabなど解像度を保ちたいセグメンテーションで使われる。Depthwiseはチャネルごとに別々に畳み込む手法である。"},
{"c": 5, "q": "バッチ正規化（Batch Normalization）の説明として最も適切なものはどれか。", "o": ["ミニバッチ内で各チャネルの平均と分散を求めて正規化する", "1つのサンプル内で全チャネルの平均と分散を求めて正規化する", "1つのサンプルの各チャネルごとに平均と分散を求めて正規化する", "入力画像の画素値を0〜255から0〜1に割り算で変換する"], "e": "バッチ正規化はミニバッチ方向の統計量で各特徴を正規化し、学習の安定化と高速化に役立つ。推論時は学習中に蓄えた移動平均の統計量を使う。サンプル内の全チャネルで正規化するのはレイヤー正規化である。"},
{"c": 5, "q": "LSTMの入力ゲート・忘却ゲート・出力ゲートの値の計算に、シグモイド関数が使われる理由として最も適切なものはどれか。", "o": ["出力が0〜1の範囲になり、情報を通す割合として扱えるから", "出力が−1〜1の範囲になり、情報の符号を反転できるから", "出力に上限がなく、情報を何倍にも増幅して伝えられるから", "出力の合計が1になり、どれか1つのゲートだけを開けるから"], "e": "ゲートの値は0（通さない）〜1（すべて通す）の割合として、セルへの書き込みや保持・出力の量を調整する。−1〜1の値をとるのはtanhで、LSTMでは候補値の計算などに使われる。上限がないのはReLU、合計が1になるのはソフトマックスの性質である。"},
{"c": 5, "q": "インスタンス正規化（Instance Normalization）がよく用いられる用途として最も適切なものはどれか。", "o": ["画像のスタイル変換", "時系列の需要予測", "テキストの感情分析", "表形式データの回帰"], "e": "インスタンス正規化は1枚の画像の各チャネルごとに正規化し、画像ごとのコントラストなどの違いを取り除く。そのためスタイル変換で効果が大きいことが知られている。"},
{"c": 5, "q": "グループ正規化（Group Normalization）の説明として最も適切なものはどれか。", "o": ["チャネルをいくつかのグループに分け、サンプルごとにグループ内で正規化する", "ミニバッチをいくつかのグループに分け、グループ間の平均の差を学習する", "層をいくつかのグループに分け、グループごとに学習率を変えて調整する", "データセットをいくつかのグループに分け、グループごとに別のモデルを学習する"], "e": "グループ正規化はバッチ方向の統計量を使わないため、物体検出のように大きな画像でバッチサイズを小さくせざるを得ない場合にも性能が落ちにくい。グループ数を1にするとレイヤー正規化、チャネル数と同じにするとインスタンス正規化に相当する。"},
{"c": 5, "q": "7×7×512の特徴マップにGlobal Average Poolingを適用したときの出力として最も適切なものはどれか。", "o": ["512次元のベクトル", "49次元のベクトル", "25,088次元のベクトル", "1×1×49の特徴マップ"], "e": "Global Average Poolingはチャネルごとに特徴マップ全体の平均を取るので、出力はチャネル数と同じ512個の値になる。平坦化すると7×7×512=25,088次元になり、全結合層のパラメータが大きく膨らむ。"},
{"c": 5, "q": "次の4×4の特徴マップ（上の行から順に、1行目：1, 3, 2, 0／2行目：4, 2, 1, 5／3行目：0, 1, 3, 2／4行目：2, 6, 1, 4）に、2×2の最大値プーリングをストライド2で適用した。出力として正しいものはどれか。", "o": ["1行目：4, 5／2行目：6, 4", "1行目：2.5, 2／2行目：2.25, 2.5", "1行目：1, 0／2行目：0, 1", "1行目：4, 5／2行目：6, 3"], "e": "特徴マップを重ならない2×2の4区画に分け、各区画の最大値を取ると、左上4・右上5・左下6・右下4になる。2.5, 2, 2.25, 2.5は各区画の平均を取った平均値プーリングの結果、1, 0, 0, 1は最小値を取った結果である。"},
{"c": 5, "q": "スキップ結合を持つ残差ブロックの出力をy=F(x)+xと書くとき、層F(x)が学習する対象として最も適切なものはどれか。", "o": ["入力xからの差分（残差）", "入力xそのものの複製", "入力xの確率分布の平均と分散", "入力xと無関係なランダムな雑音"], "e": "残差ブロックでは恒等写像xをそのまま足すため、層は出力と入力の差分だけを学べばよい。恒等写像に近い変換が学びやすくなり、勾配も加算の経路を通って前の層へ届きやすい。"},
{"c": 5, "q": "RNNの学習で用いられるBPTT（Backpropagation Through Time）の説明として最も適切なものはどれか。", "o": ["時間方向に展開したネットワークに誤差逆伝播法を適用する", "時刻ごとに独立したネットワークを別々に学習する", "未来の時刻から過去へ入力データの順序を反転させて学習する", "隠れ状態を使わずに各時刻の出力だけで重みを更新する"], "e": "BPTTはRNNを時刻の数だけ展開した深いネットワークとみなし、誤差を時間をさかのぼって伝える。系列が長いほど勾配が何度も掛け合わされ、勾配消失や勾配爆発が起きやすい。"},
{"c": 5, "q": "LSTMの忘却ゲートの役割として最も適切なものはどれか。", "o": ["セルに保持している過去の情報をどれだけ残すかを決める", "新しい入力をセルにどれだけ書き込むかを決める", "セルの情報を隠れ状態としてどれだけ出力するかを決める", "誤差逆伝播のときに勾配をどれだけ切り捨てるかを決める"], "e": "忘却ゲートは前時刻のセル状態に0〜1の値を掛け、不要になった情報を消す。書き込み量を決めるのは入力ゲート、出力量を決めるのは出力ゲートである。"},
{"c": 5, "q": "LSTMがシンプルなRNNより長期の依存関係を学習しやすい理由として最も適切なものはどれか。", "o": ["ゲートで制御されるセル状態が、情報と勾配を加算中心の経路で運ぶから", "隠れ状態の次元を時刻ごとに増やして記憶容量を拡大するから", "入力系列を逆順にしてから処理し、直近の情報を強調するから", "重みを時刻ごとに別々に持ち、各時刻を独立に学習するから"], "e": "LSTMのセル状態はゲートの値を掛けたうえで加算で更新されるため、長い時間をまたいでも勾配が消えにくい。LSTMもRNNと同じく時刻間で重みを共有している。"},
{"c": 5, "q": "双方向RNN（Bidirectional RNN）が適さない用途として最も適切なものはどれか。", "o": ["音声を受け取りながら逐次すぐに文字起こしを返す処理", "文章全体を読み込み終えてから行う各単語の品詞のタグ付け", "入力済みの文の各単語に対する固有表現の抽出", "録音済みの音声ファイルに対する一括の音声認識"], "e": "双方向RNNは過去から未来と未来から過去の両方向の情報を使うため、系列の最後まで入力が揃っている必要がある。入力を受け取りながら即座に出力するリアルタイム処理には向かない。"},
{"c": 5, "q": "Encoder-Decoderモデルの説明として最も適切なものはどれか。", "o": ["入力系列をエンコーダで表現に変換し、デコーダがそれをもとに出力系列を生成する", "エンコーダが画像の真偽を判定し、デコーダが偽物の画像を作って互いに競う", "エンコーダとデコーダが同じ入力を別々に分類し、多数決で結果を決める", "エンコーダが報酬を予測し、デコーダがその報酬を最大化する行動を選ぶ"], "e": "Encoder-Decoderは入力と出力の長さが異なる機械翻訳などに使われる構造で、RNN同士でもTransformerでも構成できる。画像の真偽判定と生成を競わせるのはGANの説明である。"},
{"c": 5, "q": "系列を生成するデコーダの学習で、前の時刻の出力としてモデル自身の予測ではなく正解データを入力する手法はどれか。", "o": ["教師強制（Teacher Forcing）", "早期終了（Early Stopping）", "勾配クリッピング（Gradient Clipping）", "ラベル平滑化（Label Smoothing）"], "e": "教師強制は学習を安定させ速めるが、推論時は自分の予測を入力するため学習時との条件の違い（exposure bias）が生じる。勾配クリッピングは勾配爆発を抑える手法である。"},
{"c": 5, "q": "機械翻訳のEncoder-DecoderモデルでSource-Target Attentionを用いるとき、Query・Key・Valueの取り出し元として最も適切なものはどれか。", "o": ["Queryはデコーダ側、KeyとValueはエンコーダ側から取る", "Queryはエンコーダ側、KeyとValueはデコーダ側から取る", "Query・Key・Valueのすべてをデコーダ側から取る", "Query・Key・Valueのすべてをエンコーダ側から取る"], "e": "Source-Target Attentionでは、出力を生成しているデコーダの状態がQueryとなり、入力文のどの部分に注目するかをエンコーダ側のKeyとValueから決める。すべて同じ系列から取るのはSelf-Attentionである。"},
{"c": 5, "q": "Self-Attentionの説明として最も適切なものはどれか。", "o": ["同じ系列の中の各要素どうしの関連度を計算し、重み付き和で表現を更新する", "直前の時刻の隠れ状態だけを参照して、次の要素の表現を更新する", "入力系列を固定長の区間に分け、区間ごとの最大値で表現を作る", "別の系列から取り出した要素だけを参照して、自分の系列の表現を更新する"], "e": "Self-AttentionはQuery・Key・Valueをすべて同じ系列から作り、文中の離れた単語どうしの関係も一度に捉える。別の系列を参照するのはSource-Target Attentionである。"},
{"c": 5, "q": "Scaled Dot-Product AttentionでQueryとKeyの内積を√d_k（d_kはKeyの次元数）で割る理由として最も適切なものはどれか。", "o": ["次元が大きいと内積が大きくなり、ソフトマックスの勾配が小さくなるのを防ぐため", "Keyの次元数を減らして、注意の計算量を系列長の1乗に抑えるため", "内積を確率として解釈できるように、合計を1にそろえるため", "QueryとKeyの順序を入れ替えても結果が変わらないようにするため"], "e": "次元が大きいと内積の値のばらつきが大きくなり、ソフトマックスの出力が極端に偏って勾配がほとんど流れなくなる。合計を1にするのはソフトマックス自体の働きである。"},
{"c": 5, "q": "Multi-Head Attentionの利点として最も適切なものはどれか。", "o": ["複数の異なる部分空間で注意を計算し、多様な関係を同時に捉えられる", "同じ注意を複数回繰り返し、計算結果の誤差を平均で打ち消せる", "ヘッドの数だけ系列を分割し、計算量を系列長に比例させられる", "ヘッドごとに異なる言語を担当させ、多言語を同時に翻訳処理できる"], "e": "Multi-Head AttentionはQuery・Key・Valueをヘッドごとに別の線形変換で射影し、並列に注意を計算して結合する。構文的な関係や意味的な関係など、異なる観点の関連を別々のヘッドが捉えられる。"},
{"c": 5, "q": "Transformerのデコーダで用いられるマスク付きSelf-Attention（Masked Self-Attention）の目的として最も適切なものはどれか。", "o": ["学習時に、各位置がまだ生成していない後ろの位置を参照しないようにする", "学習時に、入力の一部の単語を隠して、その単語を当てさせる", "推論時に、注意の重みが小さい位置を削って計算量を減らす", "推論時に、パディング部分の単語をランダムな単語で置き換える"], "e": "自己回帰的に次の単語を予測するデコーダでは、正解の未来の単語が見えてしまわないよう、後ろの位置への注意を遮断する。単語を隠して当てさせるのはBERTの事前学習（Masked Language Model）である。"},
{"c": 5, "q": "オートエンコーダの学習で最小化する量として最も適切なものはどれか。", "o": ["入力と、それを圧縮してから復元した出力との差（再構成誤差）", "入力と、それに付けられた正解ラベルとの差（分類誤差）", "生成データと本物データを見分ける識別器が出力する判定の正解率", "エージェントが環境から得る累積報酬の符号を反転した値"], "e": "オートエンコーダは正解ラベルを使わず、入力自身を教師として復元できるよう学習する。中間層を入力より小さくすることで、データの特徴を表す低次元の表現が得られる。"},
{"c": 5, "q": "入力を復元するように学習したオートエンコーダから、エンコーダの部分だけを取り出して使う用途として最も適切なものはどれか。", "o": ["入力を低次元の潜在表現に変換し、次元削減や特徴量として使う", "潜在表現から元の入力を組み立て直し、欠けた部分を補った画像を得る", "正解ラベルを使わずに、入力画像のクラス名を直接出力させて分類する", "入力と同じ次元のベクトルを出力し、学習データをそのまま記憶させる"], "e": "エンコーダは入力を低次元の潜在表現に圧縮する部分なので、単独で次元削減や特徴抽出に使える。潜在表現から入力を組み立て直すのはデコーダの役割で、エンコーダだけではクラス名は出力されない。"},

{"c": 5, "q": "画像の一部の正方形領域を0などで塗りつぶして隠すデータ拡張手法はどれか。", "o": ["Cutout", "Mixup", "RandAugment", "CutMix"], "e": "Cutoutは入力画像のランダムな位置を固定サイズの正方形で隠し、物体の一部が見えなくても認識できるようにする。Random Erasingも似た手法で、大きさや縦横比をランダムにし、ランダムな値で埋める。"},

{"c": 5, "q": "テキストのデータ拡張で、文をいったん別の言語に翻訳し、それを元の言語に翻訳し直して言い換え文を作る手法はどれか。", "o": ["逆翻訳（Back Translation）", "同義語置換（Synonym Replacement）", "ランダム削除（Random Deletion）", "ランダム挿入（Random Insertion）"], "e": "逆翻訳は意味を保ったまま語順や表現が異なる文を作れる。同義語置換は文中の単語を類義語に置き換える手法で、文の構造はほとんど変わらない。"},
