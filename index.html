QUESTIONS.push({"c": 10, "q": "ある企業がAI採用選考ツールの書類選考の結果を集計したところ、男性は応募200人中60人、女性は応募90人中18人が通過していた。米国の雇用選考手続統一ガイドラインの「5分の4ルール」で見たとき、女性の選考率は男性の選考率の何倍で、どう判断されるか。", "o": ["約0.67倍で、0.8未満のため不利な影響の兆候とみなされる", "約0.67倍で、0.5を上回るため不利な影響の兆候はないとみなされる", "約0.30倍で、0.8を下回るため不利な影響の兆候とみなされる", "約1.50倍で、1を上回るため女性の方が有利に扱われているとみなされる"], "e": "選考率は男性60/200=0.30、女性18/90=0.20で、比は0.20/0.30≒0.67。最も高いグループの選考率の5分の4（80%）を下回ると、一般に不利な影響の証拠とみなされる。0.30は男性の選考率そのもの、1.50は比を逆にした値。"},
{"c": 10, "q": "病気の診断支援AIで、実際に陽性の患者を陽性と判定できた割合を属性ごとに調べた。グループAは陽性患者50人中40人、グループBは陽性患者40人中24人を陽性と判定していた。公平性の基準「機会均等（Equal Opportunity）」の観点で見た、両グループの真陽性率の差として正しいものはどれか。", "o": ["0.20", "0.10", "0.16", "0.40"], "e": "機会均等は、本当に陽性の人を陽性と判定できる割合（真陽性率）をグループ間でそろえることを求める。Aは40/50=0.80、Bは24/40=0.60で、差は0.20。偽陽性率まで等しくすることを求めるのは均等化オッズ（Equalized Odds）。"},
{"c": 10, "q": "ある病院が研究用に、氏名を削除した患者データを作った。準識別子（年代・性別・居住市）の組み合わせごとの人数は、（30代・男性・A市）3人、（30代・女性・A市）2人、（40代・男性・B市）4人、（40代・女性・B市）5人である。このデータセットは何-匿名性を満たすか。", "o": ["2-匿名性", "3-匿名性", "4-匿名性", "5-匿名性"], "e": "k-匿名性は、準識別子の値が同じレコードが必ずk件以上存在する状態で、最も小さいグループの人数がkになる。最小は（30代・女性・A市）の2人なので2-匿名性。k-匿名性だけでは、グループ内の病名がすべて同じ場合などに属性を推知される弱点がある。"},
{"c": 10, "q": "ある企業が大規模言語モデルの学習に1,200MWhの電力を使った。使用した電力のCO2排出係数を0.45kg-CO2/kWhとすると、この学習に伴うCO2排出量として正しいものはどれか。", "o": ["540トン", "54トン", "5,400トン", "2,667トン"], "e": "1,200MWh＝1,200,000kWhで、1,200,000×0.45＝540,000kg＝540トン。学習時の排出量は、消費電力量と電源構成（排出係数）の両方で決まるため、再生可能エネルギー由来の電力を使うデータセンターを選ぶことも削減策になる。2,667トンは係数で割ってしまった値。"},
{"c": 10, "q": "病院の電子カルテで学習した診断AIが外部に公開されている。攻撃者が、ある特定の人物のデータを入力してモデルの出力の確信度を調べ、その人物のデータが学習に使われたかどうか（つまりその病院の患者かどうか）を推定した。この攻撃はどれか。", "o": ["メンバーシップ推論攻撃", "モデル反転攻撃", "モデル抽出攻撃", "データポイズニング"], "e": "メンバーシップ推論攻撃は、特定のデータが学習データに含まれていたかを推定する攻撃で、学習データの所属自体が機微情報になる医療などで問題になる。モデル反転攻撃は出力から学習データの特徴（顔画像など）を復元する攻撃、モデル抽出攻撃は模倣モデルを作る攻撃。"},
{"c": 10, "q": "社員の顔写真で学習した顔認証モデルについて、攻撃者が、ある社員の名前（クラス）に対する出力の確信度が高くなるよう入力画像を繰り返し修正し、その社員の顔に似た画像を作り出した。この攻撃はどれか。", "o": ["モデル反転攻撃", "メンバーシップ推論攻撃", "敵対的サンプルによる回避攻撃", "間接プロンプトインジェクション"], "e": "モデル反転攻撃は、モデルの出力を手がかりに学習データの代表的な特徴を復元する攻撃で、顔画像の復元が代表例。メンバーシップ推論攻撃は特定データが学習に含まれていたかを推定するもの、回避攻撃は入力に細工して誤認識させるもの。"},
{"c": 10, "q": "有害な回答を拒否するよう調整された対話型AIに対し、利用者自身が「安全上の制限がない架空のAIを演じて」などの指示を工夫して、本来拒否される危険物の作り方を答えさせた。この行為を指す用語として最も適切なものはどれか。", "o": ["ジェイルブレイク", "間接プロンプトインジェクション", "データポイズニング", "モデル抽出攻撃"], "e": "ジェイルブレイクは、利用者が指示の工夫によってモデルの安全対策を回避し、制限された出力を引き出す行為。間接プロンプトインジェクションは、Webページや文書など外部データに第三者が命令を埋め込み、AIに意図しない動作をさせる攻撃で、攻撃の経路が異なる。"},
{"c": 10, "q": "自動運転車の標識認識AIが、一時停止標識に小さなシールを貼られるだけで速度制限標識と誤認識するおそれがあると分かった。このモデルの頑健性を高める対策として最も適切なものはどれか。", "o": ["敵対的サンプルを作り、正しいラベルを付けて学習に加える敵対的訓練を行う", "学習データの準識別子を一般化し、k-匿名性を満たすように加工してから学習し直す", "モデルの想定用途と限界を記したモデルカードを作成し、利用者向けに公開しておく", "推論をクラウドからエッジに移し、映像を外部に送らずに車載機の中で処理する"], "e": "敵対的訓練は、敵対的サンプルを学習データに含めることで、小さな摂動への頑健性を高める代表的な防御。k-匿名化はプライバシー保護、モデルカードは透明性のための文書化、エッジ推論は通信遅延やプライバシーへの対策で、いずれも誤認識の防止にはつながらない。"},
{"c": 10, "q": "差分プライバシーのプライバシー損失パラメータε（イプシロン）に関する説明として最も適切なものはどれか。", "o": ["εを小さくするほど加えるノイズが大きくなり、プライバシー保護は強まるが、出力の有用性は下がりやすい", "εを小さくするほど加えるノイズが小さくなり、プライバシー保護と有用性の両方が同時に高まる", "εを大きくするほど加えるノイズが大きくなり、プライバシー保護は強まるが、計算量は減りやすい", "εはデータの件数を表す値で、件数が多いほどεは大きくなり、ノイズを加える必要がなくなる"], "e": "εは、ある個人のデータの有無で出力の分布がどれだけ変わり得るかの上限を表し、小さいほど保護が強い。そのぶん大きなノイズが必要になり、統計やモデルの精度（有用性）との間にトレードオフが生じる。"},
{"c": 10, "q": "複数の病院が連合学習で画像診断モデルを共同開発することになった。患者の画像は各病院の外に出さないが、なお残るプライバシー上の懸念と、それへの対策の組み合わせとして最も適切なものはどれか。", "o": ["送信する更新情報から学習データが推測されるおそれがあり、差分プライバシーや安全な集約を併用する", "各病院の画像がサーバーに集約されて漏えいするおそれがあり、集約した画像にk-匿名化を施してから学習する", "モデルの更新情報は数値なので推測のおそれはなく、懸念は通信の遅延だけであるため、エッジ推論に切り替える", "各病院のデータ量がそろわないと学習できないおそれがあり、少ない病院の画像を他院にコピーして件数を合わせる"], "e": "連合学習では生データを共有しないが、共有する勾配やパラメータの更新から元データが推測される研究例があり、差分プライバシーのノイズ付加や、個々の更新を見せずに合計だけを求める安全な集約（秘密計算）が併用される。連合学習では画像をサーバーに集約しない。"},
{"c": 10, "q": "推薦アルゴリズムが利用者の過去の閲覧に合わせて表示する情報を選ぶため、利用者が自分の好む情報や意見にしか触れなくなり、自分が見ていない情報があることにも気づきにくくなる状態を「フィルターバブル」と名付けた人物はどれか。", "o": ["イーライ・パリサー", "キャス・サンスティーン", "アン・カブキアン", "ティム・バーナーズ＝リー"], "e": "イーライ・パリサーが2011年の著書でフィルターバブルという言葉を広めた。アルゴリズムによる情報の選別に注目する点で、似た意見の人同士のつながりの中で意見が反響・増幅するエコーチェンバーとは焦点が異なる。アン・カブキアンはプライバシー・バイ・デザインの提唱者。"},
{"c": 10, "q": "2019年に日本政府が決定した「人間中心のAI社会原則」の7つのAI社会原則について、次の列挙の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。\n「（ア）の原則、教育・リテラシーの原則、プライバシー確保の原則、セキュリティ確保の原則、（イ）の原則、公平性、説明責任及び透明性の原則、イノベーションの原則」", "o": ["（ア）人間中心 （イ）公正競争確保", "（ア）人間の尊厳 （イ）公正競争確保", "（ア）人間中心 （イ）雇用維持", "（ア）持続可能性 （イ）国際協調"], "e": "7原則は、人間中心・教育リテラシー・プライバシー確保・セキュリティ確保・公正競争確保・公平性説明責任及び透明性・イノベーションの各原則。「人間の尊厳」は原則の上位にある3つの基本理念（人間の尊厳・多様性と包摂性・持続性）の1つで、7原則の名称ではない。"},
{"c": 10, "q": "旅行会社が、他社が開発した大規模言語モデルのAPIを使って旅程相談チャットを作り、自社サイトで一般の消費者向けに公開した。総務省・経済産業省「AI事業者ガイドライン」の主体の区分で、この旅行会社に当たるものとして最も適切なものはどれか。", "o": ["AI提供者", "AI開発者", "業務外利用者", "データ提供者"], "e": "AIシステムをアプリケーションや製品、ビジネスプロセスなどに組み込んだサービスとして利用者に提供する事業者はAI提供者に当たる。モデルを開発した他社がAI開発者で、チャットを使う一般消費者は業務外利用者（ガイドラインの対象外）。"},
{"c": 10, "q": "総務省・経済産業省「AI事業者ガイドライン」が示すアジャイル・ガバナンスのサイクルの順序として最も適切なものはどれか。", "o": ["環境・リスク分析 → ゴール設定 → システムデザイン → 運用 → 評価", "ゴール設定 → 運用 → 環境・リスク分析 → システムデザイン → 評価", "システムデザイン → 運用 → 評価 → ゴール設定 → 環境・リスク分析", "環境・リスク分析 → システムデザイン → ゴール設定 → 評価 → 運用"], "e": "ガイドラインは「環境・リスク分析」「ゴール設定」「システムデザイン」「運用」「評価」のサイクルを、マルチステークホルダーで継続的かつ高速に回すことを求める。評価の後は外部環境の変化を踏まえて再び環境・リスク分析を行い、必要に応じてゴールを見直す。"},
{"c": 10, "q": "総務省・経済産業省「AI事業者ガイドライン」の共通の指針について、次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。\n「AIの入出力等のログを記録・保存するなどの『検証可能性の確保』は（ア）の項目に、データの出所や意思決定の経緯を追えるようにする『トレーサビリティの向上』は（イ）の項目に挙げられている」", "o": ["（ア）透明性 （イ）アカウンタビリティ", "（ア）アカウンタビリティ （イ）透明性", "（ア）安全性 （イ）セキュリティ確保", "（ア）公平性 （イ）プライバシー保護"], "e": "共通の指針10項目のうち、透明性の下に「検証可能性の確保」、アカウンタビリティの下に「トレーサビリティの向上」が置かれている。安全性・セキュリティ確保・公平性・プライバシー保護も共通の指針の項目だが、これらの取組を含む項目ではない。"},
{"c": 10, "q": "AIをテーマとする首脳級の国際会議（AIサミット）の開催順として最も適切なものはどれか。", "o": ["英国ブレッチリー・パーク → 韓国ソウル → フランス・パリ → インド・ニューデリー", "韓国ソウル → 英国ブレッチリー・パーク → インド・ニューデリー → フランス・パリ", "フランス・パリ → 英国ブレッチリー・パーク → 韓国ソウル → インド・ニューデリー", "英国ブレッチリー・パーク → フランス・パリ → インド・ニューデリー → 韓国ソウル"], "e": "AI安全性サミット（2023年11月、英国）、AIソウル・サミット（2024年5月）、AIアクション・サミット（2025年2月、パリ）、AIインパクト・サミット（2026年2月、ニューデリー）の順に開かれた。第1回のブレッチリー・パークではフロンティアAIのリスクに関するブレッチリー宣言が採択された。"},
{"c": 10, "q": "2023年12月にG7で合意された広島AIプロセス包括的政策枠組みについて、次の文の（ア）（イ）に入る語の組み合わせとして最も適切なものはどれか。\n「（ア）はすべてのAI関係者を対象とし、（イ）は高度なAIシステムを開発する組織を対象に、リスクの特定・軽減などの具体的な行動を示している」", "o": ["（ア）広島プロセス国際指針 （イ）広島プロセス国際行動規範", "（ア）広島プロセス国際行動規範 （イ）広島プロセス国際指針", "（ア）OECD AI原則 （イ）ブレッチリー宣言", "（ア）人間中心のAI社会原則 （イ）AI事業者ガイドライン"], "e": "包括的政策枠組みには、全AI関係者向けの国際指針と、高度なAIシステムを開発する組織向けの国際行動規範が含まれる。OECD AI原則は2019年のOECDの原則、ブレッチリー宣言は2023年のAI安全性サミットの成果、人間中心のAI社会原則とAI事業者ガイドラインは日本国内の文書。"},
{"c": 10, "q": "米国国立標準技術研究所（NIST）が2023年1月に公表したAIリスクマネジメントフレームワーク（AI RMF 1.0）の中核（Core）は4つの機能からなる。GOVERN（統治）以外の3つの組み合わせとして正しいものはどれか。", "o": ["MAP・MEASURE・MANAGE", "PLAN・BUILD・MONITOR", "ASSESS・MITIGATE・REPORT", "DESIGN・TEST・DEPLOY"], "e": "AI RMFの中核は、組織全体でリスク管理の文化や体制をつくるGOVERN、状況を把握してリスクを特定するMAP、リスクを分析・評価するMEASURE、優先順位を付けて対処するMANAGEの4機能からなる。任意に使えるフレームワークで、法的義務を課すものではない。"},
{"c": 10, "q": "組織がAIを責任をもって開発・提供・利用するための方針や体制、リスク評価などの要求事項を定め、第三者認証にも用いられる2023年12月発行の国際規格はどれか。", "o": ["ISO/IEC 42001", "ISO/IEC 27001", "ISO 9001", "ISO 14001"], "e": "ISO/IEC 42001はAIマネジメントシステムの国際規格で、AIに特化した初のマネジメントシステム規格とされる。ISO/IEC 27001は情報セキュリティ、ISO 9001は品質、ISO 14001は環境のマネジメントシステム規格。"},
{"c": 10, "q": "欧州委員会が設置した専門家グループが2019年4月に公表した「信頼できるAIのための倫理ガイドライン（Ethics Guidelines for Trustworthy AI）」の説明として最も適切なものはどれか。", "o": ["AI HLEGがまとめ、人間の主体性と監督、透明性、説明責任など7つの要件を示した", "欧州議会と理事会が採択した規則で、違反した企業に売上高に応じた制裁金を科す仕組みを定めた", "欧州評議会が採択した条約で、署名した国にAIによる人権侵害への救済手段の整備を義務づけた", "欧州の標準化団体が策定した技術規格で、AIシステムの精度を測る試験方法だけを定めた"], "e": "AI HLEGのガイドラインは、信頼できるAIは適法・倫理的・頑健であるべきとし、人間の主体性と監督、技術的な頑健性と安全性、プライバシーとデータガバナンス、透明性、多様性・無差別・公平性、社会・環境の幸福、説明責任の7要件を挙げた。法的拘束力はなく、制裁金を定めたのはEU AI法。"},
{"c": 10, "q": "2018年に発表された研究「Gender Shades」は、市販の顔画像による性別分類AIの精度を、肌の色と性別の組み合わせごとに比べた。この研究が明らかにした傾向として最も適切なものはどれか。", "o": ["肌の色の濃い女性で誤り率が最も高く、肌の色の薄い男性で最も低かった", "肌の色の薄い男性で誤り率が最も高く、肌の色の濃い女性で最も低かった", "肌の色や性別による差はほとんどなく、どの組み合わせも誤り率は1%未満だった", "性別による差は大きかったが、肌の色による差は見られなかった"], "e": "ジョイ・ブオラムウィニとティムニット・ゲブルの研究で、肌の色の濃い女性では誤り率が最大34.7%に達した一方、肌の色の薄い男性では最大0.8%だった。学習・評価データの偏りが特定の集団での性能低下につながることを示した代表例。"},
{"c": 10, "q": "2016年に米国の報道機関ProPublicaが、刑事司法で使われる再犯リスク予測ツールCOMPASを分析した。その記事で指摘された問題として最も適切なものはどれか。", "o": ["実際には再犯しなかった被告のうち、黒人が高リスクと誤って判定される割合が白人のほぼ2倍だった", "黒人と白人で予測の誤りの傾向に差はなかったが、判定の理由が裁判官に説明されていなかった", "予測に人種を直接入力していたため、裁判所がツールの使用を違法と判断して禁止した", "白人の被告の方が高リスクと誤って判定されやすく、黒人の被告は低リスクと判定されやすかった"], "e": "記事「Machine Bias」は、再犯しなかった被告が高リスクと判定される割合（偽陽性率）が黒人で白人のほぼ2倍だったと指摘した。開発元はスコアごとの再犯率はグループ間で同程度（較正されている）と反論し、グループ間で基礎となる再犯率が異なると複数の公平性指標を同時に満たせないことが議論された。"},
{"c": 10, "q": "2016年3月、SNS上で利用者との会話から学習するよう作られたMicrosoftのチャットボットが、一部の利用者に差別的・攻撃的な発言を教え込まれ、公開から1日ほどで停止された。このチャットボットはどれか。", "o": ["Tay", "ELIZA", "Watson", "Siri"], "e": "Tayは公開後24時間以内に、一部の利用者による組織的な働きかけで不適切な発言をするようになり、停止された。利用者の入力から学習するAIでは、悪意ある入力が学習を汚染するリスクへの対策が必要であることを示した事例。ELIZAは1960年代の対話プログラム、WatsonはIBMのシステム。"},
{"c": 10, "q": "融資審査AIで否決された申込者に対し、「年収があと50万円高く、他社からの借入れが1件少なければ承認されていた」のように、どの入力がどう変われば結果が変わったかを示す説明の方法はどれか。", "o": ["反実仮想説明（Counterfactual Explanation）", "Permutation Importance", "差分プライバシー", "モデルカード"], "e": "反実仮想説明は、判定結果を変えるために必要な入力の最小限の変化を示す方法で、本人が次に何をすればよいかを理解しやすい。Permutation Importanceはモデル全体で各特徴量の重要度を測る方法で、個別の申込者への説明ではない。モデルカードはモデルの用途や限界を記した文書。"},
{"c": 10, "q": "採用選考AIの学習済みモデルを作り直さずに、グループごとに合格の判定に使う閾値を調整して、グループ間の真陽性率の差を小さくした。公平性を確保するための対策の段階として、この方法が当たるものはどれか。", "o": ["後処理（post-processing）", "前処理（pre-processing）", "学習中の処理（in-processing）", "データ収集の段階でのサンプリング"], "e": "学習済みモデルの出力や判定の閾値を調整する方法は後処理に当たる。前処理はデータの重み付けや変換で学習前の偏りを減らす方法、学習中の処理は公平性の制約を損失関数に加えるなど、学習アルゴリズム自体を変える方法。"},
{"c": 10, "q": "保険金の支払審査で、AIの判定を担当者が確認してから確定する運用にした。ところが半年後には、担当者がAIの判定をほぼそのまま承認するようになり、明らかな誤判定も見逃されていた。この現象を指す用語として最も適切なものはどれか。", "o": ["自動化バイアス", "サンプリングバイアス", "生存者バイアス", "データドリフト"], "e": "自動化バイアスは、人が自動化システムの出力を過信し、自分の判断や確認を怠ってしまう傾向で、Human-in-the-loopを形だけのものにする。対策として、確認手順の明確化、判断根拠の提示、担当者の教育などがある。サンプリングバイアスと生存者バイアスはデータの偏り、データドリフトは入力データの分布の変化。"},
{"c": 10, "q": "工場の搬送ロボット群はAIが自律的に経路を決めて動くが、管理者は稼働状況を常に監視し、異常があればすぐに介入・停止できるようにしている。人の関与の形として、この運用を指す用語として最も適切なものはどれか。", "o": ["Human-on-the-loop", "Human-in-the-loop", "Human-out-of-the-loop", "Human-centered design"], "e": "Human-on-the-loopは、システムが自律的に判断・実行し、人は監視して必要なときに介入する形。Human-in-the-loopは判断ごとに人が確認・承認する形、Human-out-of-the-loopは人が関与せず完全に自動で動く形。"},
{"c": 10, "q": "ある研究機関が画像分類モデルを公開するにあたり、想定している用途と想定外の用途、評価に使ったデータ、性別や年齢層ごとの性能の差、既知の限界などをまとめた文書を添付した。このような文書を何と呼ぶか。", "o": ["モデルカード", "データシート（Datasheets for Datasets）", "プライバシーポリシー", "ソフトウェア部品表（SBOM）"], "e": "モデルカードは2019年にミッチェルらが提案した、学習済みモデルの用途・評価結果・属性ごとの性能・限界などを記す文書。データシートはデータセットの作成目的や収集方法などを記す文書で、対象がデータセットである点が異なる。SBOMはソフトウェアの構成部品の一覧。"},

// ---------- 成績の保存（ブラウザごと。使えない環境でも動く） ----------
const STORE_KEY = "gkentei100.v1";
let stats = {};           // {qIndex: {n:回答数, ok:正解数, last:直近正誤(1/0)}}
function loadStats(){ try{ stats = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ stats = {}; } }
function saveStats(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(stats)); }catch(e){} }
loadStats();

const PACE = 100*60/145;  // 本番(オンライン)100分・約145問 → 1問あたり約41秒
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const qno = i => "Q" + String(i+1).padStart(3,"0");
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const fmtTime = s => Math.floor(s/60) + "分" + String(Math.floor(s%60)).padStart(2,"0") + "秒";

function catStats(c){
  const idx = QUESTIONS.map((q,i)=>q.c===c?i:-1).filter(i=>i>=0);
  let n=0, ok=0, tried=0;
  idx.forEach(i=>{ const s=stats[i]; if(s){ tried++; n+=s.n; ok+=s.ok; } });
  return {total:idx.length, tried, rate: n? ok/n : null};
}
const unseenList = () => QUESTIONS.map((q,i)=>i).filter(i => !stats[i]);
// 模擬試験: 本番と同じ約145問を、分野の問題数の比率で抽出
function mockOrder(){
  const N = Math.min(145, QUESTIONS.length), out = [];
  const groups = CATS.map((_,c)=>shuffle(QUESTIONS.map((q,i)=>i).filter(i=>QUESTIONS[i].c===c)));
  groups.forEach(g => out.push(...g.slice(0, Math.floor(g.length*N/QUESTIONS.length))));
  const rest = shuffle(groups.flat().filter(i=>!out.includes(i)));
  return shuffle(out.concat(rest.slice(0, N-out.length)));
}
const wrongList = () => QUESTIONS.map((q,i)=>i).filter(i => stats[i] && stats[i].last===0);

// ---------- ホーム ----------
let selectedCats = new Set(CATS.map((_,i)=>i).filter(i=>i>0));
let confirmReset = false;

function renderHome(){
  const wrong = wrongList(), unseen = unseenList();
  const answered = Object.keys(stats).length;
  const pool = QUESTIONS.map((q,i)=>i).filter(i=>selectedCats.has(QUESTIONS[i].c));
  app.innerHTML = `
    <section class="stack">
      <div class="modes">

        <button class="mode" id="m-mock"><span class="label">本番形式 100分</span><strong>模擬試験</strong><span class="n">${Math.min(145,QUESTIONS.length)}<small class="muted">問</small></span></button>
        <button class="mode" id="m-rand"><span class="label">ランダム出題</span><strong>ミニテスト</strong><span class="n">20<small class="muted">問</small></span></button>
        <button class="mode" id="m-wrong" ${wrong.length?"":"disabled"}><span class="label">直近で間違えた問題</span><strong>解き直し</strong><span class="n">${wrong.length}<small class="muted">問</small></span></button>
        <button class="mode" id="m-unseen" ${unseen.length?"":"disabled"}><span class="label">まだ解いていない問題</span><strong>未解答から20問</strong><span class="n">${unseen.length}<small class="muted">問残り</small></span></button>
      </div>
    </section>
    <section class="stack">
      <div class="tools">
        <h2>分野を選んで解く</h2>
        <div class="row">
          <button class="btn" id="sel-all">すべて選択</button>
          <button class="btn" id="sel-none">解除</button>
        </div>
      </div>
      <div class="cats">
        ${CATS.map((name,c)=>{ if(!c) return "";
          const s = catStats(c);
          const pct = s.rate===null ? "—" : Math.round(s.rate*100)+"%";
          return `<label class="cat">
            <input type="checkbox" id="cat-${c}" data-c="${c}" ${selectedCats.has(c)?"checked":""}>

          </label>`; }).join("")}
      </div>
      <div class="tools">
        <span class="muted">選択中 <span class="num">${pool.length}</span> 問 ／ 右端は累計の正答率</span>
        <button class="btn primary" id="m-cats" ${pool.length?"":"disabled"}>選んだ分野を解く</button>
      </div>
    </section>
    <section class="stack">
      <p class="note">本番（2026年〜オンライン試験）は100分・約145問、1問あたり約41秒です。出題中の経過時間がこのペースを超えると赤で表示します。</p>
      <div class="confirm">
        <span class="muted">解答済み <span class="num">${answered}</span> / ${QUESTIONS.length} 問</span>
        ${confirmReset
          ? `<span>成績をすべて消去しますか？</span><button class="btn" id="reset-yes">消去する</button><button class="btn" id="reset-no">やめる</button>`
          : `<button class="btn" id="reset" ${answered?"":"disabled"}>成績をリセット</button>`}
      </div>
    </section>`;
  document.getElementById("m-all").onclick = () => startQuiz(QUESTIONS.map((q,i)=>i), "全問");
  document.getElementById("m-rand").onclick = () => startQuiz(shuffle(QUESTIONS.map((q,i)=>i)).slice(0,20), "ミニテスト20問");
  document.getElementById("m-mock").onclick = () => startQuiz(mockOrder(), "模擬試験", 100*60);
  document.getElementById("m-unseen").onclick = () => startQuiz(shuffle(unseenList()).slice(0,20), "未解答から20問");

  document.getElementById("sel-all").onclick = () => { selectedCats = new Set(CATS.map((_,i)=>i).filter(i=>i>0)); renderHome(); };
  document.getElementById("sel-none").onclick = () => { selectedCats.clear(); renderHome(); };
  app.querySelectorAll(".cat input").forEach(el => el.onchange = () => {
    const c = +el.dataset.c; el.checked ? selectedCats.add(c) : selectedCats.delete(c); renderHome();

  });

  const y = document.getElementById("reset-yes"); if(y) y.onclick = () => { stats = {}; saveStats(); confirmReset = false; renderHome(); };
  const n = document.getElementById("reset-no"); if(n) n.onclick = () => { confirmReset = false; renderHome(); };
}

// ---------- 出題 ----------
let quiz = null;  // {order, pos, title, answers:[{i, ok}], opts, picked, t0, qStart, timer}

function startQuiz(order, title, limit){
  if(!order.length) return;
  quiz = {order, pos:0, title, limit:limit||0, answers:[], picked:null, t0:Date.now()};
  renderQuestion();
}

function renderQuestion(){
  const i = quiz.order[quiz.pos], q = QUESTIONS[i];
  quiz.opts = shuffle(q.o.map((text,k)=>({text, correct:k===0})));
  quiz.picked = null; quiz.qStart = Date.now();
  const s = stats[i];
  app.innerHTML = `
    <div class="stack">
      <div class="qtop">
        <span class="muted">${esc(quiz.title)}　<span class="num">${quiz.pos+1} / ${quiz.order.length}</span></span>
        <span class="pace num" id="pace">0秒</span>
      </div>
      <div class="progress"><i style="width:${quiz.pos/quiz.order.length*100}%"></i></div>
      <div class="row"><span class="chip">${q.c}. ${esc(CATS[q.c])}</span><span class="muted num" style="font-size:.85rem">${qno(i)}${s?`　過去 ${s.ok}/${s.n} 正解`:""}</span></div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="opts">
        ${quiz.opts.map((o,k)=>`<button class="opt" id="opt-${k}" data-k="${k}"><span class="k">${"ABCD"[k]}</span><span>${esc(o.text)}</span></button>`).join("")}
      </div>
      <div id="after" hidden></div>
      <div class="row" style="justify-content:space-between">
        <button class="btn" id="quit">中断してホームへ</button>
        <span class="keys">キー操作：1〜4 または A〜D で解答、Enter で次へ</span>
      </div>
    </div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
  document.getElementById("quit").onclick = () => { stopTimer(); quiz.answers.length ? renderResult() : (quiz=null, renderHome()); };
  stopTimer();
  quiz.timer = setInterval(tick, 500); tick();
  window.scrollTo(0,0);
}

function tick(){
  const el = document.getElementById("pace"); if(!el || !quiz) return;
  const sec = (Date.now()-quiz.qStart)/1000;
  if(quiz.limit){
    const used = (Date.now()-quiz.t0)/1000, left = quiz.limit - used;
    const behind = used > PACE*(quiz.pos+1);   // 1問41秒ペースより遅れている
    el.textContent = left > 0 ? "残り " + fmtTime(left) : "時間切れ（" + fmtTime(-left) + "超過）";
    el.classList.toggle("slow", left <= 0 || behind);
  } else {
    el.textContent = Math.floor(sec) + "秒（目安41秒）";
    el.classList.toggle("slow", sec > PACE);
  }
}
function stopTimer(){ if(quiz && quiz.timer){ clearInterval(quiz.timer); quiz.timer=null; } }

function answer(k){
  if(quiz.picked!==null) return;
  if(!quiz.limit) stopTimer();
  quiz.picked = k;
  const i = quiz.order[quiz.pos], q = QUESTIONS[i];
  const ok = quiz.opts[k].correct;
  quiz.answers.push({i, ok});
  const s = stats[i] || {n:0, ok:0, last:0};
  s.n++; if(ok) s.ok++; s.last = ok?1:0; stats[i] = s; saveStats();

  app.querySelectorAll(".opt").forEach((b,j) => {
    b.disabled = true;
    if(quiz.opts[j].correct) b.classList.add("right");
    else if(j===k) b.classList.add("wrong");
  });
  const last = quiz.pos === quiz.order.length-1;
  const after = document.getElementById("after");
  const correctKey = "ABCD"[quiz.opts.findIndex(o=>o.correct)];
  after.innerHTML = `
    <div class="exp">
      <div class="verdict ${ok?"ok":"ng"}">${ok?"正解":"不正解　正解は "+correctKey}</div>
      <div>${esc(q.e)}</div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:14px">
      <button class="btn primary" id="next">${last?"結果を見る":"次の問題へ"}</button>
    </div>`;
  after.hidden = false;
  const next = document.getElementById("next");
  next.onclick = () => { if(last){ renderResult(); } else { quiz.pos++; renderQuestion(); } };
  next.focus();
}

document.addEventListener("keydown", e => {
  if(!quiz || !document.getElementById("opt-0")) return;
  if(e.ctrlKey || e.altKey || e.metaKey) return;
  const map = {"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3};
  const k = map[e.key.toLowerCase()];
  if(k!==undefined && quiz.picked===null){ e.preventDefault(); answer(k); }
});

// ---------- 結果 ----------
function renderResult(){
  stopTimer();
  const ans = quiz.answers, okN = ans.filter(a=>a.ok).length;
  const sec = (Date.now()-quiz.t0)/1000;
  const byCat = {};
  ans.forEach(a => { const c = QUESTIONS[a.i].c; byCat[c] = byCat[c] || {n:0, ok:0}; byCat[c].n++; if(a.ok) byCat[c].ok++; });
  const wrong = ans.filter(a=>!a.ok);
  app.innerHTML = `
    <section class="stack">
      <h2>${esc(quiz.title)} の結果</h2>
      <div class="score">
        <div><div class="label">正答率</div><div class="big">${Math.round(okN/ans.length*100)}<small>%</small></div></div>
        <div><div class="label">正解数</div><div class="num" style="font-size:1.4rem">${okN} / ${ans.length}</div></div>
        <div><div class="label">所要時間</div><div class="num" style="font-size:1.4rem">${fmtTime(sec)}</div><div class="muted" style="font-size:.8rem">1問平均 ${Math.round(sec/ans.length)}秒</div></div>
      </div>
      ${ans.length < quiz.order.length ? `<p class="note">途中で中断しました（${quiz.order.length}問中 ${ans.length}問を解答）。</p>` : ""}
      <div class="tablebox"><table>
        <thead><tr><th>分野</th><th class="r">正解</th><th class="r">正答率</th></tr></thead>
        <tbody>${Object.keys(byCat).map(Number).sort((a,b)=>a-b).map(c=>{ const b=byCat[c];
          return `<tr><td>${c}. ${esc(CATS[c])}</td><td class="r num">${b.ok}/${b.n}</td><td class="r num">${Math.round(b.ok/b.n*100)}%</td></tr>`; }).join("")}</tbody>
      </table></div>
      <div class="row">
        <button class="btn primary" id="retry" ${wrong.length?"":"disabled"}>間違えた${wrong.length}問を解き直す</button>
        <button class="btn" id="home">ホームへ</button>
      </div>
    </section>
    ${wrong.length ? `<section class="stack">
      <h2>間違えた問題</h2>
      <div class="review">${wrong.map(a=>{ const q=QUESTIONS[a.i];
        return `<article><span class="muted num" style="font-size:.8rem">${qno(a.i)}　${q.c}. ${esc(CATS[q.c])}</span>
          <strong>${esc(q.q)}</strong>
          <div class="ans"><span style="color:var(--ok);font-weight:700">正解：</span>${esc(q.o[0])}</div>
          <div class="muted" style="font-size:.9rem">${esc(q.e)}</div></article>`; }).join("")}</div>
    </section>` : ""}`;
  document.getElementById("retry").onclick = () => startQuiz(shuffle(wrong.map(a=>a.i)), "解き直し");
  document.getElementById("home").onclick = () => { quiz=null; renderHome(); };
  window.scrollTo(0,0);
}

document.getElementById("total").textContent = QUESTIONS.length;
renderHome();
</script>
<script>if('serviceWorker' in navigator && location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(function(){});}</script>
</body>
</html>
